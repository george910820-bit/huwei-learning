<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>圖卡賓果</title>
<!--
  圖卡賓果（增強遊戲，單檔可離線）
  ─ 3×3 圖片賓果板，找一樣的圖卡放上去，填滿（或連線）就 Bingo！
  ─ 程式分段：1 圖片 → 2 設定與儲存 → 3 語音音效 → 4 開局 → 5 作答與提示 → 6 畫面 → 7 提示紀錄與帳號 → 8 老師專區 → 9 事件與啟動
  ─ 學習紀錄存在瀏覽器（localStorage），學生、測試帳號分開存。
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{
  --color-bg:#f5ead8;--color-text:#201e1d;--color-accent:#c67139;
  --color-neutral-100:#f9f4ed;--color-neutral-200:#eee7db;--color-neutral-300:#dcd3c4;--color-neutral-400:#c0b6a5;--color-neutral-500:#a19786;--color-neutral-600:#82796a;--color-neutral-700:#645c50;--color-neutral-800:#474238;
  --color-accent-100:#fff2eb;--color-accent-200:#ffe1d0;--color-accent-300:#ffc6a5;--color-accent-400:#f6a06b;--color-accent-500:#d67f48;--color-accent-600:#b2622d;--color-accent-700:#8c491a;
  --color-accent-2-100:#f0fae1;--color-accent-2-200:#e1eecc;--color-accent-2-300:#ccdbb2;--color-accent-2-400:#aebf92;--color-accent-2-500:#8fa073;--color-accent-2-600:#728157;--color-accent-2-700:#56633f;--color-accent-2-800:#3d472b;--color-accent-2-900:#272e1b;
  --font-heading:"Caprasimo",system-ui,sans-serif;--font-body:"Figtree",system-ui,sans-serif;
  --shadow-sm:0 1px 2px rgba(46,43,37,.14);--shadow-md:0 3px 10px rgba(46,43,37,.16);--shadow-lg:0 12px 32px rgba(46,43,37,.22);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-heading);font-weight:400;margin:0}
.hd{font-family:var(--font-heading)}
.row{display:flex;align-items:center}
/* 遊戲舞台（固定尺寸，依螢幕縮放；直式、橫式兩種排法） */
.gameWrap{height:100vh;height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none}
.stage{flex:none;position:relative;transform-origin:center center}
.abs{position:absolute}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.roundBtn{border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md)}
.dot{width:26px;height:26px;border-radius:50%;border:3px solid var(--color-accent-2-500)}
.timebar{width:220px;height:22px;border-radius:999px;background:var(--color-neutral-200);overflow:hidden;border:3px solid var(--color-accent-2-500)}
.timebar div{height:100%;background:var(--color-accent-2-400);transition:width 1s linear}
/* 賓果板 */
.board{background:#f4dc5a;border-radius:28px;padding:14px;box-shadow:var(--shadow-md);border:5px solid #d9b92e;display:grid;gap:10px}
.cell{position:relative;border-radius:18px;background:#fff;border:4px solid #e3cf6a;display:flex;align-items:center;justify-content:center;transition:border-color .2s,box-shadow .2s}
.cell img{width:78%;height:78%;object-fit:contain;pointer-events:none}
.cell.done{background:var(--color-accent-2-100);border-color:var(--color-accent-2-500)}
.cell.done img{opacity:.95}
.cell .ok{position:absolute;right:-8px;top:-8px;width:40px;height:40px;border-radius:50%;background:var(--color-accent-2-600);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.cell.line{border-color:var(--color-accent)!important;box-shadow:0 0 0 6px var(--color-accent-300)}
.cell.hover{border-color:var(--color-accent)!important;box-shadow:0 0 0 8px var(--color-accent-200)}
/* 圖卡 */
.deal{border-radius:28px;background:var(--color-neutral-100);border:3px dashed var(--color-neutral-300)}
.card{position:absolute;border-radius:16px;background:#fff8c9;border:4px solid #e2c63d;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;touch-action:none}
.card img{width:80%;height:80%;object-fit:contain;pointer-events:none}
.card.gone{visibility:hidden}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);filter:drop-shadow(0 10px 12px rgba(46,43,37,.3))}
.flyer{position:fixed;z-index:70;pointer-events:none;transition:left .45s ease,top .45s ease,width .45s ease,height .45s ease}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(198,113,57,0)}50%{box-shadow:0 0 0 12px rgba(198,113,57,.55)}}
.blink{animation:blink .8s ease-in-out 4;border-color:var(--color-accent)!important}
@keyframes shake{0%,100%{translate:0}15%{translate:-12px}30%{translate:12px}45%{translate:-9px}60%{translate:9px}75%{translate:-5px}90%{translate:5px}}
.shake{animation:shake .5s}
/* Bingo */
.bingo{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:rgba(245,234,216,.6);pointer-events:none}
.bingo .word{font-family:var(--font-heading);font-size:min(22vw,180px);line-height:1;color:var(--color-accent);text-shadow:0 6px 0 var(--color-accent-700),0 14px 24px rgba(46,43,37,.25);animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
.bingo button{pointer-events:auto}
.nextBtn{min-width:200px;height:88px;padding:0 32px;border-radius:999px;border:0;background:var(--color-accent-2-600);color:#fff;font-size:30px;font-weight:700;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;justify-content:center}
/* 提示紀錄、帳號 */
.side{display:flex;flex-direction:column;gap:8px;align-items:stretch;justify-content:flex-end}
.pill{min-height:40px;padding:0 12px;border-radius:999px;border:2px solid var(--color-neutral-300);background:var(--color-bg);color:var(--color-text);font-size:15px;font-weight:700}
.on{background:var(--color-accent)!important;border-color:var(--color-accent-700)!important;color:#fff!important}
.ppCard{position:fixed;right:10px;bottom:10px;z-index:65;width:min(368px,calc(100vw - 20px));padding:12px 14px 14px;border-radius:24px;background:var(--color-neutral-100);box-shadow:var(--shadow-lg);border:2px solid var(--color-neutral-300);display:flex;flex-direction:column;gap:10px;touch-action:manipulation}
.ppAmts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ppAmt{min-height:58px;border-radius:18px;border:2px solid var(--color-neutral-300);background:var(--color-bg);color:var(--color-text);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ppAmt b{font-family:var(--font-heading);font-weight:400;font-size:22px;line-height:1.1}
.ppAmt span{font-size:13px;font-weight:700}
.testBadge{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:60;pointer-events:none;padding:6px 16px;border-radius:999px;background:var(--color-accent-2-200);color:var(--color-accent-2-900);font-size:14px;font-weight:700}
/* 結束畫面 */
.endWrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center}
/* 老師專區 */
.teacher{min-height:100vh;padding:28px 16px;display:flex;justify-content:center}
.tWrap{width:100%;max-width:880px;display:flex;flex-direction:column;gap:20px}
.tcard{background:var(--color-neutral-100);border-radius:28px;padding:20px 22px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-sm)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 16px;border-radius:999px;border:2px solid var(--color-neutral-300);background:transparent;color:var(--color-text);font-size:15px;font-weight:600}
.chip.on{border-color:var(--color-accent)!important}
.gtitle{font-weight:700;font-size:16px;margin-bottom:8px}
.note{font-size:13px;color:var(--color-neutral-700);margin-top:6px}
.stat{background:var(--color-bg);border-radius:20px;padding:12px 16px;flex:1;min-width:120px}
.stat b{display:block;font-family:var(--font-heading);font-weight:400;font-size:28px}
.scrollX{overflow-x:auto}
.table{min-width:640px;display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:1fr .7fr .8fr 1.1fr .7fr .6fr .9fr 1.4fr;gap:8px;padding:9px 4px;font-size:14px;border-bottom:1px solid var(--color-neutral-200)}
.tr.th{font-size:13px;font-weight:700;color:var(--color-neutral-700);border-bottom:2px solid var(--color-neutral-300)}
.btn{min-height:48px;padding:0 22px;border-radius:999px;border:0;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>

/* 飛過去的動畫 */
function fly(fromSel, toSel, picId, done) {
  const a = document.querySelector(fromSel), b = document.querySelector(toSel);
  if (!a || !b) { done(); return; }
  const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'card flyer';
  f.innerHTML = `<img src="${PIC[picId].src}" alt="">`;
  Object.assign(f.style, { left: ra.left + 'px', top: ra.top + 'px', width: ra.width + 'px', height: ra.height + 'px' });
  document.body.appendChild(f);
  a.classList.add('gone');
  requestAnimationFrame(() => requestAnimationFrame(() => Object.assign(f.style, { left: rb.left + 'px', top: rb.top + 'px', width: rb.width + 'px', height: rb.height + 'px' })));
  later(() => { f.remove(); done(); }, 480);

    { name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="' + NS + '/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' + sheets.map((s, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') + '</Types>' },
    { name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="' + NS + '/package/2006/relationships"><Relationship Id="rId1" Type="' + NS + '/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="' + NS + '/spreadsheetml/2006/main" xmlns:r="' + NS + '/officeDocument/2006/relationships"><sheets>' + sheets.map((s, i) => '<sheet name="' + xe(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') + '</sheets></workbook>' },
    { name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="' + NS + '/package/2006/relationships">' + sheets.map((s, i) => '<Relationship Id="rId' + (i + 1) + '" Type="' + NS + '/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') + '<Relationship Id="rId' + (n + 1) + '" Type="' + NS + '/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
    { name: 'xl/styles.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="' + NS + '/spreadsheetml/2006/main"><fonts count="2"><font><sz val="12"/><name val="Calibri"/></font><font><b/><sz val="12"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>' },
    ...sheets.map((s, i) => ({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: sheetXml(s.rows, s.widths) }))
  ];
  return zipBlob(files, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
function exportXlsx() {
  const recs = S.records, days = [...new Set(recs.map(r => dKey(r.t)))].sort();
  const sum = days.map(d => {
    const a = recs.filter(r => dKey(r.t) === d), w = a.filter(r => r.win);
    const av = f => w.length ? Math.round(w.reduce((s, r) => s + f(r), 0) / w.length * 10) / 10 : '';
    return [d, w.length, a.length - w.length, av(r => r.ms / 1000), av(r => r.errors), w.filter(r => lvlOf(r) === 0).length, w.filter(r => r.demo).length];
  });
  const sheets = [
    { name: '每日摘要', widths: [12, 10, 10, 14, 12, 12, 12], rows: [['日期', '完成板數', '未完成', '平均用時(秒)', '平均點錯', '獨立完成', '看示範'], ...sum] },
    { name: '每板明細', widths: [12, 8, 8, 10, 10, 10, 10, 10, 8, 8, 12, 12, 26], rows: [
      ['日期', '時間', '板子', '圖卡出現', '操作', '過關條件', '圖片主題', '用時(秒)', '點錯', '完成', '獨立程度', '老師提示量', '老師提示方式'],
      ...recs.map(r => { const d = new Date(r.t); return [dKey(r.t), p2(d.getHours()) + ':' + p2(d.getMinutes()), r.size + '×' + r.size, r.deal === 'one' ? '一次一張' : '全部散開', r.op === 'tap' ? '點一下' : '拖曳', r.goal === 'line' ? '連一條線' : '填滿', r.theme === 'mix' ? '混合' : THEMES[r.theme], Math.round(r.ms / 1000), r.errors, r.win ? '是' : '否', r.win ? LVL[lvlOf(r)] : '', r.pl == null ? '' : r.pl + ' ' + PP_AM[r.pl][0], (r.pm || []).map(k => PP_MN[k]).join('、')]; })] }
  ];
  const fname = '圖卡賓果_紀錄' + (S.testMode ? '_測試' : '') + '_' + dKey(Date.now()).replace(/-/g, '') + '.xlsx';
  try {
    const url = URL.createObjectURL(xlsxBlob(sheets)), a = document.createElement('a');
    a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    S.exportNote = '已下載：' + fname;
  } catch (e) { S.exportNote = '匯出失敗，請換用 Chrome 或 Edge 再試一次。'; }
  render();
}

/* ═════════════ 9. 事件與啟動 ═════════════ */
const app = document.getElementById('app');
function render() {
  app.innerHTML = S.view === 'game' ? gameHTML() : S.view === 'end' ? endHTML() : teacherHTML();
}
const parseV = v => v === 'true' ? true : v === 'false' ? false : /^-?\d+$/.test(v) ? +v : v;
function setPP(patch) {
  S.records = S.records.map(r => r.t === S.ppT ? { ...r, ...patch } : r); saveRecords();
  const rec = S.records.find(r => r.t === S.ppT);
  if (rec) save('tj.pp.last', { pl: rec.pl, pm: rec.pm || [] });
  render();
}
function setUser(test) {
  if (test === S.testMode) return;
  S.testMode = test; lsSet(LS_R + '.who', test ? 'test' : 'student');
  S.records = load(recKey(), []); S.confirmClear = false; S.ppT = null;
  if (S.view === 'game') startSession(); else render();
}
const ACT = {
  cell: a => tapCell(+a),
  card: a => tapCard(+a),
  again: () => { if (S.g && !S.g.bingo) speak(promptText(true)); },
  hint: () => onHintBtn(),
  next: () => nextAfterBingo(),
  restart: () => startSession(),
  start: () => startSession(),
  who: a => setUser(a === '1'),
  ppToggle: () => { ppOn = !ppOn; lsSet('tj.pp.on', ppOn ? '1' : '0'); render(); },
  musicToggle: () => { if (S.settings.music === 'off') { setS({ music: S.settings.lastMusic || 'walk' }); musicStart(); } else { setS({ lastMusic: S.settings.music, music: 'off' }); musicStop(); } },
  ppAmt: a => setPP({ pl: +a }),
  ppMeth: k => { const rec = S.records.find(r => r.t === S.ppT), pm = (rec && rec.pm) || []; setPP({ pm: pm.includes(k) ? pm.filter(x => x !== k) : [...pm, k] }); },
  ppSame: () => { const l = load('tj.pp.last', null); if (l) setPP({ pl: l.pl, pm: l.pm || [] }); },
  ppClose: () => { S.ppT = null; render(); },
  set: (a, el) => setS({ [el.dataset.k]: parseV(el.dataset.v) }),
  export: () => exportXlsx(),
  clear: () => {
    if (!S.confirmClear) { S.confirmClear = true; render(); setTimeout(() => { S.confirmClear = false; if (S.view === 'teacher') render(); }, 3000); return; }
    S.records = []; try { localStorage.removeItem(recKey()); } catch (e) {} S.confirmClear = false; render();
  }
};
document.addEventListener('click', e => { if (drag) return; const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el.dataset.arg, el, e); });
let gearT = null;
document.addEventListener('pointerdown', e => {
  if (AC && AC.state === 'suspended') AC.resume();
  if (e.target.closest('[data-gear]')) gearT = setTimeout(() => { clearTimers(); if (S.sess) S.sess.over = true; S.view = 'teacher'; S.ppT = null; musicStop(); render(); window.scrollTo(0, 0); }, 1000);
  if (S.view === 'game') {
    armIdle(); musicStart();
    const el = e.target.closest('[data-card],[data-cur]');
    if (el && S.g && S.g.op === 'drag') dragStart(e, el);
  }
});
document.addEventListener('pointermove', dragMove);
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, e => { clearTimeout(gearT); dragEnd(e); }));
let lastLand = innerWidth / innerHeight > 1.05;
window.addEventListener('resize', () => {
  const land = innerWidth / innerHeight > 1.05;
  if (S.view === 'game') { if (land !== lastLand) render(); else { const st = document.getElementById('stage'); if (st) st.style.transform = `scale(${scaleOf(layout())})`; } }
  lastLand = land;
});
if (window.speechSynthesis) speechSynthesis.getVoices();
startSession();
</script>
