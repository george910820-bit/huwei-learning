<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>椰子四格表｜在挫折中成長</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3FAFD; --ink:#2B3440; --muted:#6B7785; --line:#D5E3EC; --sea:#2F7FB5; --sand:#F6E7C8;
    --c-k:#E2574C; --c-h:#2F7FB5; --c-r:#3E8E4A;
    --c-k-l:#FDE4E1; --c-h-l:#E1EEF8; --c-r-l:#E3F3E5;
    --title:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    --body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  body{min-height:100vh;display:flex;flex-direction:column}
  button{font-family:inherit;color:inherit}
  [hidden]{display:none!important}
  header{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#fff;border-bottom:2px solid var(--line)}
  header h1{font-family:var(--title);font-weight:400;font-size:26px;margin:0}
  .who{font-family:var(--title);font-size:22px;color:#fff;border-radius:999px;padding:3px 16px}
  .hb{margin-left:auto;display:flex;gap:8px}
  .tbtn{font-size:16px;padding:7px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer}
  main{flex:1;padding:12px 16px 18px;max-width:1240px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .task{font-family:var(--title);font-size:23px;line-height:1.5;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .task b{font-weight:400;padding:0 3px;border-radius:6px}
  .spk{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .spk.on{background:#E1EEF8;border-color:var(--sea)}
  body.notts .spk{opacity:.25;pointer-events:none}

  /* 開始畫面 */
  .start{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:20px;text-align:center}
  .start .big{font-family:var(--title);font-size:46px}
  .start .sub{font-size:20px;color:var(--muted)}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:22px;width:min(900px,100%)}
  .role{background:#fff;border:4px solid var(--line);border-radius:26px;padding:26px 18px;cursor:pointer;text-align:center}
  .role .e{font-size:62px}
  .role .n{font-family:var(--title);font-size:38px;margin:6px 0}
  .role .d{font-size:19px;color:var(--muted);line-height:1.6}

  /* 四格表 */
  table.grid{width:100%;border-collapse:separate;border-spacing:8px;table-layout:fixed}
  .grid th{font-family:var(--title);font-weight:400;font-size:24px;color:#fff;border-radius:12px;padding:8px}
  .grid th.w{background:#7A8A99;width:13%}
  .grid th.k{background:var(--c-k)} .grid th.h{background:var(--c-h)} .grid th.r{background:var(--c-r)}
  .grid td{vertical-align:top;border-radius:16px;height:178px;padding:8px;background:#fff;border:3px dashed var(--line)}
  .grid td.wcell{border:none;background:var(--sand);text-align:center;vertical-align:middle;font-family:var(--title);font-size:30px}
  .grid td.wcell .e{font-size:54px;display:block}
  .grid td.drop.over{border-color:var(--sea);background:#EEF6FC}
  .grid td.k.act{border:4px solid var(--c-k);background:var(--c-k-l)}
  .grid td.h.act{border:4px solid var(--c-h);background:var(--c-h-l)}
  .grid td.r.act{border:4px solid var(--c-r);background:var(--c-r-l)}
  .grid td.pick{cursor:pointer}
  .cnt{font-size:15px;color:var(--muted);margin-bottom:6px}

  /* 字卡 */
  .tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:120px;background:#E8F2F8;border-radius:18px;padding:12px}
  .card{background:#fff;border:3px solid #C9D8E2;border-radius:16px;padding:12px 10px 12px 16px;font-family:var(--title);font-size:23px;line-height:1.45;width:270px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 rgba(0,0,0,.12);cursor:grab;touch-action:none}
  .card .tx{flex:1}
  .card.sel{border-color:var(--sea);box-shadow:0 0 0 5px rgba(47,127,181,.3)}
  .grid td .card{width:100%;font-size:21px;box-shadow:none}
  .card.drag{position:fixed;z-index:50;pointer-events:none;box-shadow:0 12px 24px rgba(0,0,0,.25);transform:rotate(-2deg)}
  .card.ghost{opacity:.3}
  .say{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 18px;font-family:var(--title);font-size:24px;line-height:1.9}
  .say .bl{display:inline-block;min-width:110px;border-bottom:3px solid #9FB3C2;margin:0 4px}

  /* 關鍵詞 */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--title);font-size:24px;color:#fff;border-radius:10px;padding:3px 12px}
  .chip.k{background:var(--c-k)} .chip.h{background:var(--c-h)} .chip.r{background:var(--c-r)}
  .passage{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 18px;font-family:var(--title);font-size:28px;line-height:2.05}
  .gridB td{height:130px}
  .passage .ph{display:flex;justify-content:space-between;align-items:center;font-size:18px;color:var(--muted);font-family:var(--body);margin-bottom:2px}
  .tok{display:inline-block;line-height:1.35;margin:4px 1px;padding:2px 3px;border-radius:8px;cursor:pointer;border-bottom:3px dotted #BFD0DC}
  .tok.k{background:var(--c-k);color:#fff;border-bottom-color:transparent}
  .tok.h{background:var(--c-h);color:#fff;border-bottom-color:transparent}
  .tok.r{background:var(--c-r);color:#fff;border-bottom-color:transparent}
  .pu{color:#8A97A3}
  .tip{font-size:19px;color:var(--muted);min-height:26px}
  .checks{display:flex;flex-direction:column;gap:6px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 16px}
  .checks h3{font-family:var(--title);font-weight:400;font-size:22px;margin:0}
  .ck{display:flex;align-items:center;gap:10px;font-size:21px;cursor:pointer}
  .ck .bx{width:30px;height:30px;border-radius:8px;border:3px solid #9FB3C2;display:grid;place-items:center;font-size:22px;color:#fff;flex:none}
  .ck.on .bx{background:var(--c-r);border-color:var(--c-r)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .two{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;align-items:start}

  .done{font-family:var(--title);font-size:28px;padding:8px 34px;border-radius:999px;border:none;background:#E07A3B;color:#fff;box-shadow:0 5px 0 #A9541F;cursor:pointer}
  .done:disabled{opacity:.45}
  .locked .card,.locked .tok,.locked td.pick,.locked .ck{pointer-events:none}
  .banner{font-family:var(--title);font-size:26px;color:var(--c-r);background:var(--c-r-l);border-radius:16px;padding:10px 18px;text-align:center}
  @media (max-width:820px){.roles,.two{grid-template-columns:1fr}.card{width:230px;font-size:21px}.passage{font-size:26px}}
</style>
</head>
<body class="notts">
<header>
  <h1>🥥 椰子四格表</h1>
  <span class="who" id="who" hidden></span>
  <div class="hb"><button class="tbtn" id="reset" hidden>重新作答</button><button class="tbtn" id="back" hidden>換人</button></div>
</header>
<main id="app"></main>
<script>
const $ = (s, el=document) => el.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ===== 學生名單（教學演示） ===== */
const ROLES = {
  A:{name:'吃炮', color:'#E07A3B', e:'🃏', d:'把字卡拖到<br>對的格子裡'},
  B:{name:'林哲',     color:'#2F7FB5', e:'🔍', d:'在課文裡點選<br>關鍵詞'},
};
const COLS = [['k','遇到的困難'],['h','怎麼做'],['r','結果']];

/* ===== 課文（康軒五上第九課第三段，講椰子的句子） ===== */
const PASSAGE = '沙灘上|椰子樹|掉落的|椰子|，|常|被|潮水|帶進海裡|，|漂流|的|過程|可能|長達數月|，|還好|靠著|厚厚的外皮|保護|，|種子|即使|泡在|海水|也|不會腐爛|。|只要|被|海浪|沖上了沙灘|，|就可以|生根發芽|。'.split('|');
const PASSAGE_TEXT = PASSAGE.join('');
/* ===== 字卡（3張正確、1張干擾） ===== */
const CARDS = [
  {id:'k', t:'被潮水帶進海裡，漂流的過程可能長達數月。'},
  {id:'h', t:'靠著厚厚的外皮保護，種子即使泡在海水也不會腐爛。'},
  {id:'r', t:'被海浪沖上了沙灘，就可以生根發芽。'},
  {id:'x', t:'秋冬時節落葉，將能量存起來。'},
];

/* ===== 存檔：重新整理也不會不見 ===== */
const KEY = 'coconut4grid.v1';
let S = {role:null, A:{place:{}, order:null, done:false}, B:{pick:{k:[],h:[],r:[]}, checks:[false,false,false], done:false}};
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
/* 掃 QR code 開啟（網址帶 ?who=A 或 ?who=B）時，直接進到該學生的作答畫面 */
{ const w = new URLSearchParams(location.search).get('who'); if(w && ROLES[w]){ S.role = w; save(); } }

/* ===== 朗讀 ===== */
let voice = null;
if('speechSynthesis' in window){
  const pick = () => { const vs = speechSynthesis.getVoices();
    voice = vs.find(v=>/zh[-_]TW/i.test(v.lang)) || vs.find(v=>/zh[-_](HK|Hant)/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null;
    document.body.classList.toggle('notts', !voice); };
  pick(); speechSynthesis.onvoiceschanged = pick;
}
function speak(text, btn){
  if(!voice) return; speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'')); u.voice = voice; u.lang = voice.lang; u.rate = .85;
  document.querySelectorAll('.spk.on').forEach(b=>b.classList.remove('on')); if(btn) btn.classList.add('on');
  u.onend = u.onerror = () => btn && btn.classList.remove('on'); speechSynthesis.speak(u);
}
const spk = t => `<button class="spk" data-say="${esc(t)}">🔊</button>`;
document.addEventListener('click', e => { const b = e.target.closest('.spk'); if(!b) return; e.stopPropagation(); speak(b.dataset.say, b); }, true);

/* ===== 頁首按鈕（老師用） ===== */
function confirmBtn(btn, label, fn){
  btn.onclick = () => { if(btn.dataset.sure){ delete btn.dataset.sure; btn.textContent = label; fn(); return; }
    btn.dataset.sure = '1'; btn.textContent = '再按一次確定'; setTimeout(()=>{ if(btn.dataset.sure){ delete btn.dataset.sure; btn.textContent = label; } }, 3000); };
}
confirmBtn($('#reset'), '重新作答', () => {
  if(S.role==='A') S.A = {place:{}, order:null, done:false}; else S.B = {pick:{k:[],h:[],r:[]}, checks:[false,false,false], done:false};
  save(); render();
});
confirmBtn($('#back'), '換人', () => { S.role = null; save(); render(); });

function render(){
  const r = S.role ? ROLES[S.role] : null;
  $('#who').hidden = !r; $('#reset').hidden = !r; $('#back').hidden = !r;
  if(r){ $('#who').textContent = r.name; $('#who').style.background = r.color; }
  if(!S.role) return start();
  S.role === 'A' ? viewA() : viewB();
}

/* ===== 開始畫面 ===== */
function start(){
  app.innerHTML = `<div class="start">
    <div class="big">🥥 椰子遇到挫折了！</div>
    <div class="sub">請老師幫這台平板選擇作答的偵探</div>
    <div class="roles">${Object.entries(ROLES).map(([k,r])=>`<button class="role" data-r="${k}" style="border-color:${r.color}">
      <div class="e">${r.e}</div><div class="n" style="color:${r.color}">${r.name}</div><div class="d">${r.d}</div></button>`).join('')}</div></div>`;
  app.querySelectorAll('.role').forEach(b => b.onclick = () => { S.role = b.dataset.r; save(); render(); });
}

/* ===== 表頭 ===== */
const gridHead = () => `<tr><th class="w">誰</th>${COLS.map(([c,t])=>`<th class="${c}">${t}</th>`).join('')}</tr>`;
const whoCell = `<td class="wcell"><span class="e">🥥</span>椰子</td>`;
const doneBar = locked => locked
  ? `<div class="banner">✔ 完成了！等一下和老師一起討論 <button class="tbtn" id="edit" style="margin-left:10px">我要修改</button></div>`
  : `<div class="row" style="justify-content:center"><button class="done" id="done">完成 ✔</button></div>`;
function bindDone(st){
  if($('#done')) $('#done').onclick = () => { st.done = true; save(); render(); };
  if($('#edit')) $('#edit').onclick = () => { st.done = false; save(); render(); };
}

/* ===== 版本A：拖曳字卡 ===== */
function viewA(){
  const A = S.A;
  if(!A.order) { A.order = shuffle(CARDS.map(c=>c.id)); save(); }
  const T = '找出椰子的「遇到的困難」「怎麼做」「結果」，把字卡拖到對的格子裡。';
  const placed = Object.values(A.place);
  const cardHTML = id => { const c = CARDS.find(x=>x.id===id); return `<div class="card" data-c="${id}"><span class="tx">${esc(c.t)}</span>${spk(c.t)}</div>`; };
  app.innerHTML = `<div class="${A.done?'locked':''}" style="display:flex;flex-direction:column;gap:12px">
    <div class="task">${esc(T)}${spk(T)}</div>
    <table class="grid">${gridHead()}<tr>${whoCell}${COLS.map(([c])=>`<td class="drop ${c}" data-cell="${c}">${A.place[c]?cardHTML(A.place[c]):''}</td>`).join('')}</tr></table>
    <div class="tray" id="tray">${A.order.filter(id=>!placed.includes(id)).map(cardHTML).join('') || '<span class="tip" style="align-self:center">字卡都放好了！把字卡拖回這裡可以重新放。</span>'}</div>
    <div class="say">唸一唸：<span class="bl"></span>遇到<span class="bl" style="min-width:190px"></span>，它<span class="bl" style="min-width:190px"></span>，結果<span class="bl" style="min-width:190px"></span>。</div>
    ${doneBar(A.done)}</div>`;
  bindDone(A);
  if(A.done) return;

  // 點一下選卡、再點格子；或直接拖曳
  let sel = null;
  const put = (id, cell) => {
    for(const k in A.place) if(A.place[k]===id) delete A.place[k];   // 從原來的格子拿起
    if(cell) A.place[cell] = id;                                       // 格子原本的卡會回到下方
    save(); viewA();
  };
  app.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.c;
    let sx=0, sy=0, moved=false, ghost=null;
    card.addEventListener('pointerdown', e => {
      if(e.target.closest('.spk')) return;
      sx=e.clientX; sy=e.clientY; moved=false; card.setPointerCapture(e.pointerId);
    });
    card.addEventListener('pointermove', e => {
      if(!card.hasPointerCapture(e.pointerId)) return;
      if(!moved && Math.hypot(e.clientX-sx, e.clientY-sy) < 10) return;
      if(!moved){ moved=true; const r=card.getBoundingClientRect(); ghost=card.cloneNode(true); ghost.classList.add('drag'); ghost.style.width=r.width+'px';
        ghost.dataset.ox = sx - r.left; ghost.dataset.oy = sy - r.top; document.body.appendChild(ghost); card.classList.add('ghost'); }
      ghost.style.left = (e.clientX - ghost.dataset.ox) + 'px'; ghost.style.top = (e.clientY - ghost.dataset.oy) + 'px';
      app.querySelectorAll('td.drop').forEach(td => td.classList.remove('over'));
      const t = document.elementFromPoint(e.clientX, e.clientY); const td = t && t.closest('td.drop'); if(td) td.classList.add('over');
    });
    const up = e => {
      if(!card.hasPointerCapture(e.pointerId)) return; card.releasePointerCapture(e.pointerId);
      if(ghost){ ghost.remove(); ghost=null; card.classList.remove('ghost'); }
      if(moved){
        const t = document.elementFromPoint(e.clientX, e.clientY);
        const td = t && t.closest('td.drop'), tray = t && t.closest('#tray');
        if(td) put(id, td.dataset.cell); else if(tray) put(id, null); else viewA();
      } else {
        if(sel === id){ sel = null; card.classList.remove('sel'); return; }
        const inCell = card.closest('td.drop');
        if(sel && inCell) return put(sel, inCell.dataset.cell);   // 已選好卡片，點格子裡的卡＝換掉它
        app.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel')); sel = id; card.classList.add('sel');
      }
    };
    card.addEventListener('pointerup', up); card.addEventListener('pointercancel', up);
  });
  app.querySelectorAll('td.drop').forEach(td => td.addEventListener('click', e => { if(sel && !e.target.closest('.card')) put(sel, td.dataset.cell); }));
  $('#tray').addEventListener('click', e => { if(sel && !e.target.closest('.card')) put(sel, null); });
}

/* ===== 版本B：點選關鍵詞 ===== */
let actCol = 'k';
const MAX = 2;
function viewB(){
  const B = S.B;
  const T = '讀課文第三段講椰子的句子，找出椰子的「遇到的困難」「怎麼做」「結果」，每一格點選 1～2 個關鍵詞。';
  const owner = i => COLS.map(c=>c[0]).find(c => B.pick[c].includes(i));
  const CHECKS = ['我選的關鍵詞都可以在第三段找到','「怎麼做」選的是椰子做的事，不是別種植物的','「結果」選的是最後發生的事'];
  app.innerHTML = `<div class="${B.done?'locked':''}" style="display:flex;flex-direction:column;gap:12px">
    <div class="task">${esc(T)}${spk(T)}</div>
    <table class="grid gridB">${gridHead()}<tr>${whoCell}${COLS.map(([c,t])=>`<td class="pick ${c} ${actCol===c && !B.done?'act':''}" data-cell="${c}">
      <div class="cnt">${actCol===c && !B.done ? '👉 現在選這一格' : '點這裡選這一格'}（${B.pick[c].length}/${MAX}）</div>
      <div class="chips">${B.pick[c].slice().sort((a,b)=>a-b).map(i=>`<span class="chip ${c}">${esc(PASSAGE[i])}</span>`).join('')}</div></td>`).join('')}</tr></table>
    <div class="two">
      <div class="passage"><div class="ph"><span>第三段（椰子）</span>${spk(PASSAGE_TEXT)}</div>${PASSAGE.map((w,i)=> /^[，。]$/.test(w) ? `<span class="pu">${w}</span>` : `<span class="tok ${owner(i)||''}" data-i="${i}">${esc(w)}</span>`).join('')}</div>
      <div class="checks"><h3>自我檢查</h3>${CHECKS.map((t,i)=>`<div class="ck ${B.checks[i]?'on':''}" data-i="${i}"><span class="bx">${B.checks[i]?'✔':''}</span>${t}</div>`).join('')}</div>
    </div>
    <div class="tip" id="tip"></div>
    ${doneBar(B.done)}</div>`;
  bindDone(B);
  if(B.done) return;
  app.querySelectorAll('td.pick').forEach(td => td.onclick = () => { actCol = td.dataset.cell; viewB(); });
  app.querySelectorAll('.tok').forEach(el => el.onclick = () => {
    const i = +el.dataset.i, o = owner(i);
    if(o){ B.pick[o] = B.pick[o].filter(x=>x!==i); save(); return viewB(); }
    if(B.pick[actCol].length >= MAX){ const tip=$('#tip'); tip.textContent = `這一格已經選了 ${MAX} 個，想換的話先點一下要拿掉的詞。`; return; }
    B.pick[actCol].push(i); save(); viewB();
  });
  app.querySelectorAll('.ck').forEach(el => el.onclick = () => { const i=+el.dataset.i; B.checks[i] = !B.checks[i]; save(); viewB(); });
}

render();
</script>
</body>
</html>
