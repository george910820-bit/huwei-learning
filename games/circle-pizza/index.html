>全班的披薩盒塔<\/h2>\n      <div class=\"count\" id=\"count\"><\/div>\n      <svg id=\"towerSvg\" viewBox=\"0 0 240 400\" aria-label=\"全班包好的披薩盒疊成一座塔\"><\/svg>\n      <p class=\"msg\" id=\"towerMsg\" hidden>疊到最高了！大家好會包裝！<\/p>\n      <div class=\"row\"><button id=\"clearTower\">把披薩盒搬走<\/button><\/div>\n    <\/aside>\n  <\/div>\n<\/div>\n\n<script>\n(()=>{\n// 班級紀錄: the class record picked on the home page decides which saved progress this page uses\nconst MAT=\"wrap\";\nconst REC=(()=>{try{const a=JSON.parse(localStorage.getItem(\"pizzaRecs\")||\"{}\")[MAT];return a&&a.cur&&a.cur!==\"main\"?\"@\"+a.cur:\"\";}catch(e){return\"\";}})();\nfunction recTouch(){try{const all=JSON.parse(localStorage.getItem(\"pizzaRecs\")||\"{}\"),a=all[MAT];if(!a)return;const id=a.cur||\"main\",it=(a.list||[]).find(x=>x.id===id);\n  if(it){it.at=Date.now();localStorage.setItem(\"pizzaRecs\",JSON.stringify(all));}}catch(e){}}\nconst $=id=>document.getElementById(id);\nconst NS=\"http://www.w3.org/2000/svg\";\nconst reduce=matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e;};\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};\nconst pick=a=>a[Math.floor(Math.random()*a.length)];\nconst fmt=v=>String(Math.round(v*100)/100);\nconst fracHTML=(k,n)=>`<span class=\"frac\"><span>${k}<\/span><span>${n}<\/span><\/span>`;\nconst GOAL=10;\n\n/* ---------- sound ---------- */\nlet ac=null;\nfunction tone(fs,dur,type=\"triangle\",gap=0.09,vol=0.18){\n  if(!$(\"tSound\").checked)return;\n  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}\n  const t0=ac.currentTime;\n  fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;const s=t0+i*gap;\n    g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+0.02);g.gain.exponentialRampToValueAtTime(0.001,s+dur);\n    o.connect(g).connect(ac.destination);o.start(s);o.stop(s+dur+0.05);});\n}\nconst sRight=()=>tone([1047,1319],0.3);\nconst sWrong=()=>tone([196,165],0.25,\"square\",0.12,0.07);\n\n/* ---------- customers ---------- */\nconst PEOPLE=[\n  {skin:\"#f2c9a0\",hair:\"#2b1d14\",shirt:\"#3a7bd5\",style:\"short\"},\n  {skin:\"#e8b48a\",hair:\"#5a3a22\",shirt:\"#d6402b\",style:\"long\"},\n  {skin:\"#f6d2b0\",hair:\"#bdbdbd\",shirt:\"#3f7d3a\",style:\"bun\"},\n  {skin:\"#c98f63\",hair:\"#1b1b1b\",shirt:\"#e3a51b\",style:\"cap\"},\n  {skin:\"#f2c9a0\",hair:\"#7a4a2a\",shirt:\"#8a3fc0\",style:\"pony\"},\n];\nfunction drawCustomer(p,mood){\n  const box=$(\"customer\");box.innerHTML=\"\";\n  const s=el(\"svg\",{viewBox:\"0 0 150 190\",\"aria-hidden\":\"true\"},box);\n  el(\"path\",{d:\"M25 190 C25 140 50 125 75 125 C100 125 125 140 125 190 Z\",fill:p.shirt},s);\n  el(\"rect\",{x:66,y:110,width:18,height:20,fill:p.skin},s);\n  if(p.style===\"long\")el(\"path\",{d:\"M38 70 C38 30 112 30 112 70 L116 128 L34 128 Z\",fill:p.hair},s);\n  el(\"circle\",{cx:75,cy:72,r:40,fill:p.skin},s);\n  if(p.style===\"short\"||p.style===\"long\"||p.style===\"pony\")el(\"path\",{d:\"M35 68 C35 28 115 28 115 68 C102 52 80 46 56 50 C46 52 40 58 35 68 Z\",fill:p.hair},s);\n  if(p.style===\"pony\")el(\"circle\",{cx:118,cy:56,r:14,fill:p.hair},s);\n  if(p.style===\"bun\"){el(\"path\",{d:\"M37 66 C37 30 113 30 113 66 C100 50 50 50 37 66 Z\",fill:p.hair},s);el(\"circle\",{cx:75,cy:28,r:14,fill:p.hair},s);}\n  if(p.style===\"cap\"){el(\"path\",{d:\"M35 62 C35 26 115 26 115 62 Z\",fill:\"#d6402b\"},s);el(\"rect\",{x:70,y:56,width:58,height:9,rx:4,fill:\"#b3261e\"},s);}\n  el(\"circle\",{cx:61,cy:72,r:4.5,fill:\"#2f2418\"},s);el(\"circle\",{cx:89,cy:72,r:4.5,fill:\"#2f2418\"},s);\n  el(\"circle\",{cx:52,cy:86,r:6,fill:\"#f08a8a\",opacity:.45},s);el(\"circle\",{cx:98,cy:86,r:6,fill:\"#f08a8a\",opacity:.45},s);\n  const m=mood===\"happy\"?\"M60 90 Q75 106 90 90\":mood===\"worry\"?\"M62 98 Q75 90 88 98\":\"M63 94 L87 94\";\n  el(\"path\",{d:m,fill:mood===\"happy\"?\"#b3261e\":\"none\",stroke:\"#2f2418\",\"stroke-width\":3.5,\"stroke-linecap\":\"round\",\"stroke-linejoin\":\"round\"},s);\n  if(mood===\"worry\")el(\"path\",{d:\"M112 50 q6 10 0 14 q-6 -4 0 -14z\",fill:\"#7ec4ff\"},s);\n}\n\n/* ---------- numbers ---------- */\n// [taken, cut into, degrees]\nconst SLICES=[[1,2,180],[1,3,120],[1,4,90],[1,6,60],[1,8,45],[1,10,36],[2,3,240],[3,4,270]];\n// diameter chosen so \"diameter ÷ slices × taken\" is a small whole number, and the radius is a whole number too\nfunction numbersFor(k,n){\n  const opts=[];for(let j=1;j<=8;j++){const d=n*j;if(d%2||d>40)continue;const m=j*k;if(m>8)continue;opts.push({d,m});}\n  return pick(opts);\n}\n\n/* ---------- the slice picture ---------- */\nfunction drawSlice(Q){\n  const box=$(\"pic\");box.innerHTML=\"\";\n  const s=el(\"svg\",{viewBox:\"0 0 340 320\",role:\"img\",\"aria-label\":\"一片披薩\"},box);\n  const cx=170,cy=160,r=118,step=2*Math.PI/Q.n,a0=Q.rot,a1=a0+Q.k*step,big=Q.k*step>Math.PI?1:0;\n  const P=(a,rr=r)=>[cx+Math.cos(a)*rr,cy+Math.sin(a)*rr];\n  const [x0,y0]=P(a0),[x1,y1]=P(a1);\n  el(\"circle\",{cx,cy,r,fill:\"none\",stroke:\"#bfb39f\",\"stroke-width\":3,\"stroke-dasharray\":\"8 7\"},s);\n  if(Q.level===1)for(let i=0;i<Q.n;i++){const[x,y]=P(a0+i*step);el(\"line\",{x1:cx,y1:cy,x2:x,y2:y,stroke:\"#bfb39f\",\"stroke-width\":3,\"stroke-dasharray\":\"8 7\"},s);}\n  const id=\"cl\"+Math.random().toString(36).slice(2,8);\n  el(\"path\",{d:`M${cx} ${cy} L${x0} ${y0} A${r} ${r} 0 ${big} 1 ${x1} ${y1} Z`},el(\"clipPath\",{id},el(\"defs\",{},s)));\n  const g=el(\"g\",{\"clip-path\":`url(#${id})`},s);\n  el(\"circle\",{cx,cy,r,fill:\"#d48a3a\"},g);el(\"circle\",{cx,cy,r:r*0.88,fill:\"#c8321e\"},g);el(\"circle\",{cx,cy,r:r*0.83,fill:\"#f6c445\"},g);\n  for(let i=0;i<10;i++){const a=i/10*Math.PI*2+0.3,q=i%2?0.55:0.3;const[x,y]=P(a,r*q);el(\"circle\",{cx:x,cy:y,r:11,fill:\"#b3261e\"},g);el(\"circle\",{cx:x-1.5,cy:y-1.5,r:8,fill:\"#d9473a\"},g);}\n  for(let i=0;i<5;i++){const[x,y]=P(i*1.3+0.9,r*0.68);el(\"ellipse\",{cx:x,cy:y,rx:9,ry:6,fill:\"none\",stroke:\"#2f8a3a\",\"stroke-width\":2.5},g);}\n  // outline: crust in red, the two cuts in blue\n  el(\"path\",{d:`M${x0} ${y0} A${r} ${r} 0 ${big} 1 ${x1} ${y1}`,fill:\"none\",stroke:\"var(--tomato)\",\"stroke-width\":6},s);\n  el(\"line\",{x1:cx,y1:cy,x2:x0,y2:y0,stroke:\"var(--cut)\",\"stroke-width\":6,\"stroke-linecap\":\"round\"},s);\n  el(\"line\",{x1:cx,y1:cy,x2:x1,y2:y1,stroke:\"var(--cut)\",\"stroke-width\":6,\"stroke-linecap\":\"round\"},s);\n  // gold highlights that light up as each step is answered\n  const hArc=el(\"path\",{d:`M${x0} ${y0} A${r} ${r} 0 ${big} 1 ${x1} ${y1}`,fill:\"none\",stroke:\"#ffc21a\",\"stroke-width\":12,\"stroke-linecap\":\"round\",pathLength:1,class:\"hl\",id:\"hArc\"},s);\n  el(\"path\",{d:`M${x0} ${y0} L${cx} ${cy} L${x1} ${y1}`,fill:\"none\",stroke:\"#ffc21a\",\"stroke-width\":12,\"stroke-linecap\":\"round\",\"stroke-linejoin\":\"round\",pathLength:1,class:\"hl\",id:\"hCut\"},s);\n  el(\"path\",{d:`M${cx} ${cy} L${x0} ${y0} A${r} ${r} 0 ${big} 1 ${x1} ${y1} Z`,fill:\"none\",stroke:\"#e3a51b\",\"stroke-width\":16,\"stroke-linejoin\":\"round\",pathLength:1,class:\"ribbon\",id:\"hAll\",opacity:.9},s);\n  el(\"circle\",{cx,cy,r:7,fill:\"#2f2418\",stroke:\"#fff\",\"stroke-width\":3},s);\n  const txt=(x,y,t,c,anchor=\"middle\")=>{const e=el(\"text\",{x,y,\"text-anchor\":anchor,\"font-size\":22,\"font-weight\":900,fill:c,stroke:\"#fffef9\",\"stroke-width\":6,\"paint-order\":\"stroke\",\"font-family\":\"var(--font)\"},s);e.textContent=t;return e;};\n  // half brackets on one side of a segment, like on a ruler\n  const brace=(p1,p2,nrm,color)=>{const L=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]),u=[(p2[0]-p1[0])/L,(p2[1]-p1[1])/L],h=16,w=18;\n    const Q2=(x,y)=>[p1[0]+u[0]*x+nrm[0]*y,p1[1]+u[1]*x+nrm[1]*y],f=q=>q.map(v=>v.toFixed(1)).join(\" \");\n    el(\"path\",{d:`M${f(Q2(0,6))} Q${f(Q2(0,h))} ${f(Q2(w,h+2))} M${f(Q2(L,6))} Q${f(Q2(L,h))} ${f(Q2(L-w,h+2))}`,fill:\"none\",stroke:color,\"stroke-width\":4,\"stroke-linecap\":\"round\"},s);\n    return Q2(L/2,h+26);};\n  const mid=(a0+a1)/2;\n  if(Q.given===\"r\"){\n    const nrm=[Math.sin(a0),-Math.cos(a0)];                 // the side of the first cut that faces away from the slice\n    const[tx,ty]=brace([cx,cy],[x0,y0],nrm,\"var(--cut)\");\n    txt(tx,ty+8,`半徑 ${Q.r} 公分`,\"var(--cut)\");\n  }else{\n    let b=mid+Math.PI/2;const ux=Math.cos(b),uy=Math.sin(b);\n    el(\"line\",{x1:cx-ux*r,y1:cy-uy*r,x2:cx+ux*r,y2:cy+uy*r,stroke:\"var(--diam)\",\"stroke-width\":4,\"stroke-dasharray\":\"10 7\"},s);\n    let nrm=[-uy,ux];if(nrm[0]*Math.cos(mid)+nrm[1]*Math.sin(mid)>0)nrm=[uy,-ux];   // bracket on the side away from the slice\n    const[tx,ty]=brace([cx-ux*r,cy-uy*r],[cx+ux*r,cy+uy*r],nrm,\"var(--diam)\");\n    txt(Math.min(Math.max(tx,70),270),Math.min(Math.max(ty+8,26),312),`直徑 ${Q.d} 公分`,\"var(--diam)\");\n  }\n  if(Q.level===2){\n    const ar=30,[q0x,q0y]=P(a0,ar),[q1x,q1y]=P(a1,ar);\n    el(\"path\",{d:`M${q0x} ${q0y} A${ar} ${ar} 0 ${big} 1 ${q1x} ${q1y}`,fill:\"none\",stroke:\"#2f2418\",\"stroke-width\":4},s);\n    const[lx,ly]=P(mid,58);txt(lx,ly+8,`${Q.deg}°`,\"#2f2418\");\n  }\n}\n\n/* ---------- questions ---------- */\nconst SAY1=[\n  (f,g)=>`我要 ${f} 個披薩，${g}，要用金色邊條沿著這一片的邊包一圈，邊條要多長？`,\n  (f,g)=>`這片 ${f} 個披薩要送朋友！${g}，幫我貼一圈包裝邊條，要剪多長？`,\n  (f,g)=>`老闆，${f} 個披薩外帶，${g}，邊條要準備幾公分？`,\n];\nconst SAY2=[\n  (a,g)=>`我要角是 ${a}° 的那一片，${g}，包裝邊條要多長？`,\n  (a,g)=>`幫我包一片 ${a}° 的披薩，${g}，邊條要剪幾公分？`,\n  (a,g)=>`我買了一片 ${a}° 的披薩，${g}，沿著邊貼一圈邊條要多長？`,\n];\nconst uniq=(ans,list)=>[...new Set(list.map(fmt))].filter(v=>v!==fmt(ans)&&Number(v)>0);\nlet level=1,Q=null,steps=[],ai=0,P=null,order=0,lastSlice=-1;\n\nfunction newCustomer(){\n  order++;$(\"next\").classList.remove(\"ready\");$(\"doneMsg\").textContent=\"\";\n  P=pick(PEOPLE.filter(x=>x!==P));drawCustomer(P,\"neutral\");\n  const c=$(\"customer\");c.classList.remove(\"enter\");void c.offsetWidth;c.classList.add(\"enter\");\n  let si;do{si=Math.floor(Math.random()*SLICES.length);}while(si===lastSlice);lastSlice=si;\n  const[k,n,deg]=SLICES[si],{d,m}=numbersFor(k,n),r=d/2;\n  Q={level,k,n,deg,d,m,r,given:Math.random()<0.5?\"r\":\"d\",rot:Math.random()*Math.PI*2};\n  const arc=m*3.14,total=arc+d;\n  const giv=Q.given===\"r\"?`半徑是 ${r} 公分`:`整個披薩的直徑是 ${d} 公分`;\n  $(\"bubble\").innerHTML=`<p>${level===1?pick(SAY1)(fracHTML(k,n),giv):pick(SAY2)(deg,giv)}<\/p>`;\n  drawSlice(Q);\n  steps=[];\n  if(level===2){\n    const wrong=shuffle(SLICES.filter(x=>x[2]!==deg)).slice(0,3);\n    steps.push({line:`這一片是 <span class=\"slot\"><\/span> 個披薩`,key:`${k}/${n}`,\n      cards:shuffle([[k,n],...wrong]).map(x=>({key:`${x[0]}/${x[1]}`,html:fracHTML(x[0],x[1])})),\n      hint:`一整個披薩是 360°，${deg}° 是 360° 的幾分之幾？`,hl:null});\n  }\n  // the cards are expressions, not answers: students pick how to work it out, no long multiplication\n  const F=fracHTML(k,n),dE=Q.given===\"r\"?`${r} × 2`:`${d}`;          // the diameter, written from what the customer gave\n  const others=shuffle(SLICES.filter(x=>x[0]/x[1]!==k/n));\n  const ex=(key,html)=>({key,html:html||key});\n  const arcOK=ex(`${dE} × 3.14 × ${k}/${n}`,`${dE} × 3.14 × ${F}`);\n  const arcWrong=shuffle([\n    ex(`${dE} × 3.14`),                                                              // forgot it's only part of the pizza\n    Q.given===\"r\"?ex(`${r} × 3.14 × ${k}/${n}`,`${r} × 3.14 × ${F}`)                // used the radius as the diameter\n                 :ex(`${d} × 2 × 3.14 × ${k}/${n}`,`${d} × 2 × 3.14 × ${F}`),       // doubled the diameter\n    ex(`${dE} × 3.14 × ${others[0][0]}/${others[0][1]}`,`${dE} × 3.14 × ${fracHTML(others[0][0],others[0][1])}`),   // wrong part\n    ex(`${dE} + 3.14 × ${k}/${n}`,`${dE} ＋ 3.14 × ${F}`),\n  ]).slice(0,3);\n  steps.push({line:`<span class=\"c-arc\">餅皮（弧）<\/span> ＝ <span class=\"slot\"><\/span>`,key:arcOK.key,\n    cards:shuffle([arcOK,...arcWrong       const mine=recAll(),theirs=JSON.parse(d.data.pizzaRecs||"{}");
      Object.keys(d.data).forEach(k=>{if(k!=="pizzaRecs")ls.set(k,d.data[k]);});
      Object.keys(theirs).forEach(m=>{const A=mine[m]||{cur:theirs[m].cur,list:[]};theirs[m].list.forEach(it=>{const i=A.list.findIndex(x=>x.id===it.id);if(i>=0)A.list[i]=it;else A.list.push(it);});mine[m]=A;});
      recSave(mine);R.sel=recOf(R.g.id).cur||R.sel;drawRec();$("recMsg").textContent="讀回來了！選一筆按「確認」就能接著用";}
    catch(err){$("recMsg").textContent="這個檔案不是披薩教室的紀錄";}};r.readAsText(f);};
window.addEventListener("hashchange",show);
new MutationObserver(()=>Object.values(frames).forEach(syncTheme)).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
show();

/* ---------- records for 披薩盒展開: the page in the frame asks, this page talks to the database ---------- */
let dbP=null;
const getDB=()=>dbP||(dbP=(async()=>{try{return window.claude&&window.claude.use?await window.claude.use("db"):null;}catch(e){return null;}})());
let subbed=false;
window.addEventListener("message",async e=>{
  const f=frames.box;if(!f||e.source!==f.contentWindow)return;
  const m=e.data;if(!m||!m.pz)return;
  const reply=x=>{const fb=frames.box;if(fb&&fb.contentWindow)fb.contentWindow.postMessage(x,"*");};
  const db=await getDB();
  if(m.pz==="db-hello"){reply({pz:"db-ready",ok:!!db});return;}
  if(!db)return;
  if(m.pz==="db-sub"&&!subbed){subbed=true;
    db.collection(m.name).onSnapshot(snap=>reply({pz:"db-snap",docs:snap.docs.filter(d=>d.exists).map(d=>({id:d.id,data:d.data()}))}),
      err=>{subbed=false;reply({pz:"db-err",error:String(err&&err.code||err)});});}
  else if(m.pz==="db-sub"){ // a reload of the frame: send what is there now
    try{const s=await db.collection(m.name).get();reply({pz:"db-snap",docs:s.docs.filter(d=>d.exists).map(d=>({id:d.id,data:d.data()}))});}catch(err){}}
  if(m.pz==="db-set"){try{await db.collection(m.name).doc(m.id).set(m.data);reply({pz:"db-res",rid:m.rid,ok:true});}
    catch(err){reply({pz:"db-res",rid:m.rid,ok:false,error:String(err&&err.code||err)});}}
});
})();
</script>
<style>
/* a small 3.14 under every 圓周率, placed outside the flow so nothing moves */
.pi-word{position:relative;display:inline-block}
.pi-word::after{content:"3.14";position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:-.55em;font-size:.42em;line-height:1;font-weight:700;letter-spacing:.02em;white-space:nowrap;opacity:.75;pointer-events:none}
</style>
<script>
(()=>{const W="圓周率";
function wrap(root){
  if(!root||!root.nodeType)return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue.includes(W))return NodeFilter.FILTER_REJECT;
    const p=n.parentElement;if(!p||p.closest(".pi-word,svg,script,style,title,textarea"))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;}});
  const list=[];while(tw.nextNode())list.push(tw.currentNode);
  list.forEach(n=>{const parts=n.nodeValue.split(W),frag=document.createDocumentFragment();
    parts.forEach((t,i)=>{if(t)frag.appendChild(document.createTextNode(t));
      if(i<parts.length-1){const s=document.createElement("span");s.className="pi-word";s.textContent=W;frag.appendChild(s);}});
    n.replaceWith(frag);});
}
wrap(document.body);
new MutationObserver(ms=>{for(const m of ms){
  if(m.type==="characterData")wrap(m.target.parentNode);
  else m.addedNodes.forEach(n=>wrap(n.nodeType===3?n.parentNode:n));
}}).observe(document.body,{childList:true,subtree:true,characterData:true});
})();
</script>
