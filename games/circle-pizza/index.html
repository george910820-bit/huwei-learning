<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style></head><body><title>披薩圓周長教室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&display=swap">
<style>
/* Layout: a menu board of the unit — five materials as cards in teaching order; picking one turns the page into a player with a slim bar on top and the material below */
:root{
  --paper:#f6f1e7; --surface:#fffdf8; --ink:#2f2418; --muted:#7a6a58; --grid:#d9cdb8;
  --kraft:#c9955c; --kraft-dark:#8a5a2b; --tomato:#c62f24; --basil:#2f8a3a; --cheese:#f6c445; --cut:#2563c9; --focus:#1d6fd6;
  --font:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#201a14; --surface:#2a221a; --ink:#f3eadb; --muted:#b8a78f; --grid:#4a3d2f;
  --kraft:#b8834b; --kraft-dark:#e0ad73; --tomato:#ff6a52; --basil:#7cc46f; --cheese:#f2c94c; --cut:#6ea2ff; --focus:#6aa8ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#201a14; --surface:#2a221a; --ink:#f3eadb; --muted:#b8a78f; --grid:#4a3d2f;
  --kraft:#b8834b; --kraft-dark:#e0ad73; --tomato:#ff6a52; --basil:#7cc46f; --cheese:#f2c94c; --cut:#6ea2ff; --focus:#6aa8ff; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.55}
button,a{font:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.home{max-width:1100px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px}
.hero svg{width:96px;height:96px;flex:none}
.eyebrow{margin:0;font-size:16px;font-weight:700;color:var(--kraft-dark);letter-spacing:.06em}
h1{margin:2px 0 4px;font-size:clamp(32px,5vw,50px);font-weight:900;line-height:1.15;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:40em}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:16px}
.item:first-child{grid-column:1/-1}   /* the warm-up used every lesson sits on its own row; the four lesson materials fill two by two */
.item{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:start;text-align:left;cursor:pointer;
  background:var(--surface);border:2px solid var(--grid);border-radius:16px;padding:16px;color:var(--ink);transition:transform .15s,border-color .15s}
.item:hover{transform:translateY(-3px);border-color:var(--kraft-dark)}
.item svg{width:84px;height:84px;display:block}
.item .no{font-size:15px;font-weight:900;color:var(--kraft-dark);font-variant-numeric:tabular-nums}
.item h2{margin:0;font-size:25px;font-weight:900;line-height:1.25}
.item p{margin:4px 0 0;font-size:18px;color:var(--muted)}
.item .go{margin-top:10px;display:inline-flex;align-items:center;gap:6px;font-weight:900;color:var(--tomato)}
.note{margin:0;font-size:15px;color:var(--muted)}
.player{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:calc(8px + env(safe-area-inset-top,0px)) 8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:2px solid var(--grid)}
.bar button{font-size:17px;font-weight:700;cursor:pointer;border-radius:10px;padding:6px 14px;border:2px solid var(--ink);background:var(--surface);color:var(--ink)}
.bar #home{background:var(--kraft-dark);border-color:var(--kraft-dark);color:var(--surface)}
.bar .title{font-size:20px;font-weight:900;margin-right:auto;min-width:0}
.bar .title small{font-size:15px;font-weight:700;color:var(--muted);margin-left:8px}
.stage{flex:1;position:relative;min-height:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--paper)}
@media (max-width:520px){.bar .title small{display:none}}
/* 班級紀錄: asked every time a material is opened, like an e-book's class records */
.rec-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(40,25,10,.38);padding:16px}
.rec{width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.3)}
.rec-head{display:flex;align-items:center;gap:16px;padding:20px 24px}
.rec-head svg{width:64px;height:64px;flex:none}
.rec-head small{display:block;font-size:16px;color:var(--muted)}
.rec-head strong{display:block;font-size:26px;font-weight:900;color:var(--tomato);line-height:1.25}
.rec-body{background:color-mix(in srgb,var(--paper) 70%,var(--grid));padding:18px 22px;display:grid;gap:12px;min-height:0;overflow:auto}
.rec-body h3{margin:0;font-size:20px;font-weight:900}
.rec-list{display:grid;gap:10px;max-height:300px;overflow:auto;padding:2px}
.rec-item{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:2px solid transparent;background:var(--surface);cursor:pointer}
.rec-item[aria-checked="true"]{border-color:var(--tomato);box-shadow:0 0 0 2px color-mix(in srgb,var(--tomato) 25%,transparent)}
.rec-item .pen{width:44px;height:44px;border-radius:10px;border:1px solid var(--grid);display:grid;place-items:center;font-size:24px;background:var(--paper)}
.rec-item b{display:block;font-size:19px}
.rec-item .when{display:block;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.rec-item .sum{display:block;font-size:15px;color:var(--basil);font-weight:700}
.rec-item input{font:inherit;font-size:18px;font-weight:700;width:100%;padding:4px 8px;border-radius:8px;border:2px solid var(--kraft);background:var(--paper);color:var(--ink)}
.rec-more{border:0;background:transparent;font-size:24px;line-height:1;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--muted)}
.rec-more:hover{background:var(--paper)}
.rec-menu{display:flex;flex-wrap:wrap;gap:8px;grid-column:1/-1}
.rec-menu button,.rec-foot button,.rec-sync button{font-size:16px;font-weight:700;border-radius:10px;padding:8px 14px;border:2px solid var(--grid);background:var(--surface);color:var(--ink);cursor:pointer}
.rec-menu .danger{border-color:#e2574c;color:#c0392b}
.rec-menu .danger[data-armed="1"]{background:#e2574c;color:#fff}
.rec-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:4px}
.rec-foot .cnt{margin-right:auto;color:var(--muted);font-size:16px}
.rec-foot .ok{background:#16133a;border-color:#16133a;color:#fff;min-width:88px}
.rec-sync{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:15px;color:var(--muted)}
.rec-msg{margin:0;font-size:15px;font-weight:700;color:var(--basil);min-height:1.2em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main class="home" id="homeView">
  <header class="hero">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="#d48a3a"/><circle cx="50" cy="50" r="40" fill="#c8321e"/><circle cx="50" cy="50" r="37" fill="#f6c445"/>
      <path d="M50 50 L50 4 A46 46 0 0 1 89.8 27 Z" fill="#fffdf8" opacity=".9"/>
      <g fill="#b3261e"><circle cx="34" cy="38" r="6"/><circle cx="60" cy="64" r="6"/><circle cx="36" cy="66" r="5"/><circle cx="66" cy="44" r="5"/></g>
      <circle cx="50" cy="50" r="46" fill="none" stroke="#8a5a2b" stroke-width="3" stroke-dasharray="5 4"/>
    </svg>
    <div>
      <p class="eyebrow">六年級數學　康軒　第六單元</p>
      <h1>披薩圓周長教室</h1>
    </div>
  </header>
  <nav class="menu" id="menu" aria-label="教材"></nav>
  <p class="note">每次打開教材都會先選「班級紀錄」：選昨天那一筆，配料、小費、紀錄表就接著用；也可以按「紀錄同步」存成檔案，帶到別台電腦。</p>
</main>

<div class="rec-wrap" id="recWrap" hidden><div class="rec" role="dialog" aria-modal="true" aria-labelledby="recName">
  <div class="rec-head"><span id="recIcon"></span><div><small>您正在進入</small><strong id="recName"></strong></div></div>
  <div class="rec-body">
    <h3>班級紀錄</h3>
    <div class="rec-list" id="recList" role="radiogroup" aria-label="班級紀錄"></div>
    <div class="rec-sync" id="recSync" hidden>
      <button type="button" id="recExport">把紀錄存成檔案</button><button type="button" id="recImport">從檔案讀回紀錄</button>
      <span>換電腦或電腦會還原時，先存成檔案帶著走</span><input type="file" id="recFile" accept=".json,application/json" hidden>
    </div>
    <p class="rec-msg" id="recMsg" aria-live="polite"></p>
    <div class="rec-foot"><span class="cnt" id="recCnt"></span>
      <button type="button" id="recSyncBtn" aria-expanded="false">紀錄同步</button><button type="button" id="recAdd">＋ 新增班級紀錄</button><button type="button" class="ok" id="recOk">確認</button></div>
  </div>
</div></div>

<section class="player" id="player" hidden>
  <div class="bar">
    <button id="home" type="button">← 教材總覽</button>
    <span class="title" id="ptitle"></span>
  </div>
  <div class="stage" id="stage"></div>
</section>

<script>
const PAGES={"four": "<!doctype html><html lang=\"zh-Hant\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}<\/style><\/head><body><title>披薩四兄弟<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&display=swap\">\n<style>\n/* Layout: same kraft-paper classroom look as 披薩盒展開 — the quiz pizza with four name slots on the left, the class pizza filling up on the right, name cards in a tray below */\n:root{\n  --paper:#f6f1e7; --surface:#fffdf8; --ink:#2f2418; --muted:#7a6a58;\n  --grid:#d9cdb8; --kraft:#c9955c; --kraft-dark:#8a5a2b;\n  --tomato:#d6402b; --cut:#2563c9; --diam:#8a3fc0; --center:#2f2418; --basil:#3f7d3a; --cheese:#f7cd5d; --focus:#1d6fd6;\n  --ok:#2f8a3a; --ok-soft:#e1f2dc; --no:#c0392b;\n  --font:\"Chiron GoRound TC\",\"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",sans-serif;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){\n  --paper:#201a14; --surface:#2a221a; --ink:#f3eadb; --muted:#b8a78f;\n  --grid:#4a3d2f; --kraft:#b8834b; --kraft-dark:#e0ad73;\n  --tomato:#ff6a52; --cut:#6ea2ff; --diam:#c08bff; --center:#2f2418; --basil:#7cc46f; --cheese:#f2c94c; --focus:#6aa8ff;\n  --ok:#7cc46f; --ok-soft:#24361f; --no:#ff7b6b; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --paper:#201a14; --surface:#2a221a; --ink:#f3eadb; --muted:#b8a78f;\n  --grid:#4a3d2f; --kraft:#b8834b; --kraft-dark:#e0ad73;\n  --tomato:#ff6a52; --cut:#6ea2ff; --diam:#c08bff; --center:#2f2418; --basil:#7cc46f; --cheese:#f2c94c; --focus:#6aa8ff;\n  --ok:#7cc46f; --ok-soft:#24361f; --no:#ff7b6b; color-scheme:dark}\nbody{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.5}\n.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}\n.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}\nh1{font-size:clamp(28px,4vw,40px);font-weight:900;margin:0;margin-right:auto}\n.toggles{display:flex;flex-wrap:wrap;gap:16px;font-size:17px}\n.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}\n.toggles input{width:20px;height:20px;accent-color:var(--basil)}\nbutton{font:inherit;font-size:19px;font-weight:700;cursor:pointer;border-radius:12px;padding:10px 20px;border:2px solid var(--ink);background:var(--surface);color:var(--ink)}\nbutton:focus-visible{outline:3px solid var(--focus);outline-offset:2px}\n.lv{display:inline-flex;border:2px solid var(--kraft-dark);border-radius:12px;overflow:hidden}\n.lv button{border:0;border-radius:0;background:transparent;padding:10px 18px}\n.lv button[aria-pressed=\"true\"]{background:var(--kraft-dark);color:var(--surface)}\n.prompt{margin:4px 4px 8px;font-size:clamp(22px,2.8vw,30px);font-weight:900;text-align:center}\n.prompt .r{color:var(--cut)}.prompt .d{color:var(--diam)}\n.slot.num{width:22%}\n.card.num{background:#fff3c4}\n#next{background:var(--kraft-dark);border-color:var(--kraft-dark);color:var(--surface)}\n#next.ready{animation:nudge 1s ease-in-out infinite}\n@keyframes nudge{50%{transform:scale(1.07)}}\n.main{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:16px;align-items:start}\n@media (max-width:560px){.main{grid-template-columns:1fr}}\n.main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}\nbody.mode-teach .for-quiz,body.mode-quiz .for-teach{display:none!important}\n.teach svg{display:block;width:100%;height:auto;max-height:72vh;touch-action:none;cursor:crosshair;user-select:none}\n.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s ease forwards}\n@keyframes draw{to{stroke-dashoffset:0}}\n.mark-pop{transform-box:fill-box;transform-origin:center;animation:popm .4s cubic-bezier(.3,1.6,.5,1)}\n@keyframes popm{0%{transform:scale(0)}100%{transform:scale(1)}}\n.lbl{font-family:var(--font);font-weight:900;paint-order:stroke;stroke:#fffdf8;stroke-width:8px;stroke-linejoin:round}\n.lbl .sub{font-weight:700;opacity:.85}\n.lbl-in{opacity:0;animation:fadein .4s .45s forwards}\n@keyframes fadein{to{opacity:1}}\n#toQuiz{background:var(--basil);border-color:var(--basil);color:#fff}\n#toQuiz.ready{animation:nudge 1s ease-in-out infinite}\n.panel{background:var(--surface);border:2px solid var(--grid);border-radius:14px;padding:12px;min-width:0}\n.stage{position:relative;width:100%;aspect-ratio:600/440;max-width:100%}\n.stage svg{position:absolute;inset:0;width:100%;height:100%}\n.slot{position:absolute;width:26%;height:15.5%;transform:translate(-50%,-50%);border:3px dashed var(--muted);border-radius:14px;background:var(--surface);\n  display:flex;align-items:center;justify-content:center;font-size:clamp(20px,3vw,32px);font-weight:900;color:var(--muted);transition:background .15s,border-color .15s}\n.slot.hover{border-color:var(--kraft-dark);background:color-mix(in srgb,var(--cheese) 35%,var(--surface))}\n.slot.done{border:3px solid var(--ok);background:var(--ok-soft);color:var(--ok);animation:pop .35s ease}\n.slot .sub{display:block;font-size:.55em;font-weight:700}\n.slot.done .card-in{display:flex;flex-direction:column;align-items:center;line-height:1.15}\n@keyframes pop{0%{transform:translate(-50%,-50%) scale(.8)}60%{transform:translate(-50%,-50%) scale(1.1)}100%{transform:translate(-50%,-50%) scale(1)}}\n.tray{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:14px;min-height:96px;padding:10px;border-radius:14px;border:2px dashed var(--grid)}\n.card{touch-action:none;user-select:none;cursor:grab;min-width:140px;padding:12px 18px;border-radius:14px;background:var(--cheese);color:#2f2418;border:3px solid #b8861f;\n  box-shadow:0 4px 0 #b8861f;font-size:clamp(24px,3vw,32px);font-weight:900;display:flex;flex-direction:column;align-items:center;line-height:1.15}\n.card .sub,.slot .sub{font-size:.5em;font-weight:700;opacity:.85;line-height:1.25;text-align:center;white-space:normal}\n.card.dragging{position:fixed;z-index:20;cursor:grabbing;box-shadow:0 10px 20px rgba(0,0,0,.25);pointer-events:none}\n.card.shake{animation:shake .4s}\n@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}\n.hide-sub .sub{display:none}\n.class h2{margin:0 0 4px;font-size:22px;font-weight:900}\n.count{font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}\n.class svg{width:100%;height:auto;display:block}\n.topping{transform-box:fill-box;transform-origin:center;animation:drop .5s cubic-bezier(.3,1.6,.5,1)}\n@keyframes drop{0%{transform:scale(0) translateY(-40px);opacity:0}100%{transform:scale(1);opacity:1}}\n.pick-msg{margin:6px 0 4px;font-size:18px;font-weight:900;color:var(--muted);text-align:center}\n.pick-msg.on{color:var(--ok)}\n.palette{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}\n.palette button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:15px;border-radius:12px;border:2px solid var(--grid)}\n.palette button svg{width:44px;height:44px}\n.palette button:disabled{opacity:.4;cursor:default}\n.palette.on button:not(:disabled){border-color:var(--ok);animation:nudge 1.2s ease-in-out infinite}\n.palette.on button:hover:not(:disabled){background:var(--ok-soft)}\n.class .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}\n.class .row button{font-size:16px;padding:6px 14px}\n.done-msg{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:var(--ok-soft);border:2px solid var(--ok);color:var(--ok);font-weight:900;font-size:20px;text-align:center}\n.steam path{animation:steam 1.6s ease-in-out infinite}\n@keyframes steam{0%{opacity:0;transform:translateY(8px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}\n#hintBtn{background:#fff3c4;border-color:#b8861f;color:#5a3d0a}\n.hintcard{background:#fffbea;border:2px solid #e2c15a;border-radius:14px;padding:10px 12px;display:grid;gap:6px;justify-items:center;color:#2f2418}\n.hintcard h3{margin:0;font-size:19px;font-weight:900;color:#8a5a00}\n.hintcard svg{width:100%;max-width:300px;height:auto;display:block}\n.hintcard .eq{font-size:clamp(22px,2.6vw,28px);font-weight:900;text-align:center;line-height:1.3}\n.hintcard .eq .r{color:var(--cut)}.hintcard .eq .d{color:var(--diam)}\n.hintcard .more{font-size:16px;font-weight:700;color:#6b5236;text-align:center}\n.hintpop{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(30,20,10,.35)}\n.hintpop .box{background:var(--surface);border-radius:18px;padding:16px;max-width:min(420px,calc(100vw - 32px));display:grid;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.3)}\n.hintpop .box button{justify-self:center}\nbody:not(.lv-basic) #sideHint,body.mode-teach #sideHint{display:none}\nbody.mode-quiz.lv-basic .hintwrap{display:none}\n.qa{display:grid;gap:10px;justify-items:center;margin-top:8px}\n.qa .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}\n.qa .row button{min-width:110px;font-size:22px}\n.qa .step{font-size:clamp(20px,2.4vw,26px);font-weight:900;text-align:center}\n.qa .step .r{color:var(--cut)}.qa .step .d{color:var(--diam)}.qa .step .c{color:var(--tomato)}\n.qa button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}\n.qa button.wrong{background:#fde2de;border-color:var(--no);color:var(--no)}\n.fb{margin:6px 0 0;padding:8px 12px;border-radius:10px;font-weight:900;font-size:19px;text-align:center}\n.fb.ok{background:var(--ok-soft);color:var(--ok);border:2px solid var(--ok)}\n.fb.no{background:#fde9e6;color:var(--no);border:2px solid var(--no)}\n.done-steps{font-size:18px;font-weight:700;color:var(--muted);text-align:center}\n.pick{cursor:pointer}\n.stage.drawing svg{touch-action:none;cursor:crosshair}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style>\n\n<div class=\"wrap\">\n  <div class=\"top\">\n    <h1>披薩四兄弟<\/h1>\n    <div class=\"toggles\">\n      <label><input type=\"checkbox\" id=\"tSub\" checked>顯示定義<\/label>\n      <label><input type=\"checkbox\" id=\"tSound\" checked>音效<\/label>\n    <\/div>\n    <span class=\"for-teach\"><button id=\"clear\">擦掉重畫<\/button><\/span>\n    <span class=\"for-teach\"><button id=\"toQuiz\">小測驗<\/button><\/span>\n    <span class=\"for-quiz\"><span class=\"lv\" role=\"group\" aria-label=\"測驗難度\"><button id=\"lvBasic\" aria-pressed=\"true\">基礎<\/button><button id=\"lvAdv\" aria-pressed=\"false\">進階<\/button><button id=\"lvSp\" aria-pressed=\"false\">特別題<\/button><\/span><\/span>\n    <span class=\"hintwrap\"><button id=\"hintBtn\" aria-haspopup=\"dialog\">💡 半徑＋半徑＝？<\/button><\/span>\n    <span class=\"for-quiz\"><button id=\"back\">回到披薩<\/button><\/span>\n    <span class=\"for-quiz\"><button id=\"next\">下一題<\/button><\/span>\n  <\/div>\n\n  <section class=\"panel for-teach teach\">\n    <svg id=\"teach\" viewBox=\"0 0 800 590\" aria-label=\"披薩：點中間出現圓心，從中間滑到邊出現半徑，從邊滑到另一邊出現直徑，沿著邊畫一圈出現圓周\"><\/svg>\n  <\/section>\n\n  <div class=\"main for-quiz\">\n    <section class=\"panel\">\n      <p class=\"prompt\" id=\"prompt\" hidden><\/p>\n      <div class=\"stage\" id=\"stage\">\n        <svg id=\"quiz\" viewBox=\"0 0 600 440\" aria-label=\"披薩上有圓心、圓周、半徑、直徑四個位置，把名稱卡拖到對的框裡\"><\/svg>\n      <\/div>\n      <div class=\"tray\" id=\"tray\" aria-label=\"名稱卡\"><\/div>\n      <div class=\"qa\" id=\"qa\"><\/div>\n      <p class=\"fb\" id=\"fb\" hidden aria-live=\"polite\"><\/p>\n    <\/section>\n\n    <aside class=\"panel class\">\n      <div id=\"sideHint\"><\/div>\n      <h2>全班的披薩<\/h2>\n      <div class=\"count\" id=\"count\"><\/div>\n      <svg id=\"classPizza\" viewBox=\"0 0 300 300\" aria-label=\"全班答對一次，就在披薩上放一個配料\"><\/svg>\n      <p class=\"done-msg\" id=\"doneMsg\" hidden>披薩完成了！大家好棒！<\/p>\n      <p class=\"pick-msg\" id=\"pickMsg\">答對了就可以選一個配料！<\/p>\n      <div class=\"palette\" id=\"palette\" aria-label=\"配料\"><\/div>\n      <div class=\"row\"><button id=\"newPizza\">換一個新披薩<\/button><\/div>\n    <\/aside>\n  <\/div>\n<\/div>\n<div class=\"hintpop\" id=\"hintPop\" hidden role=\"dialog\" aria-modal=\"true\" aria-label=\"小提示\"><div class=\"box\"><div id=\"popHint\"><\/div><button id=\"hintClose\">知道了<\/button><\/div><\/div>\n\n<script>\n(()=>{\n// 班級紀錄: the class record picked on the home page decides which saved progress this page uses\nconst MAT=\"four\";\nconst REC=(()=>{try{const a=JSON.parse(localStorage.getItem(\"pizzaRecs\")||\"{}\")[MAT];return a&&a.cur&&a.cur!==\"main\"?\"@\"+a.cur:\"\";}catch(e){return\"\";}})();\nfunction recTouch(){try{const all=JSON.parse(localStorage.getItem(\"pizzaRecs\")||\"{}\"),a=all[MAT];if(!a)return;const id=a.cur||\"main\",it=(a.list||[]).find(x=>x.id===id);\n  if(it){it.at=Date.now();localStorage.setItem(\"pizzaRecs\",JSON.stringify(all));}}catch(e){}}\nconst $=id=>document.getElementById(id);\nconst NS=\"http://www.w3.org/2000/svg\";\nconst reduce=matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n// the math definitions, one array entry per line (pizza words are only for the teacher's spoken hints)\nconst NAMES={center:{n:\"圓心\",s:[\"圓正中心的點\"]},circ:{n:\"圓周\",s:[\"圓的周界\"]},\n  radius:{n:\"半徑\",s:[\"從圓心到圓周\",\"的直線\"]},diam:{n:\"直徑\",s:[\"通過圓心且兩端\",\"在圓周上的直線\"]}};\nconst subHTML=k=>NAMES[k].s.join(\"<br>\");\nconst KEYS=[\"center\",\"circ\",\"radius\",\"diam\"];\nconst CORNERS=[{x:92,y:58,a:-135},{x:508,y:58,a:-45},{x:92,y:382,a:135},{x:508,y:382,a:45}];\nconst CX=300,CY=220,R=148,CAP=20;\nconst deg=a=>a*Math.PI/180;\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};\nconst el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;};\n\n/* ---------- sound ---------- */\nlet ac=null;\nfunction tone(freqs,dur,type=\"sine\",gap=0.09,vol=0.18){\n  if(!$(\"tSound\").checked)return;\n  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}\n  const t0=ac.currentTime;\n  freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;\n    const s=t0+i*gap;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+0.02);g.gain.exponentialRampToValueAtTime(0.001,s+dur);\n    o.connect(g).connect(ac.destination);o.start(s);o.stop(s+dur+0.05);});\n}\nconst sRight=()=>tone([1047,1319],0.35,\"triangle\");\nconst sWrong=()=>tone([196,165],0.25,\"square\",0.12,0.07);\nconst sDone=()=>tone([784,988,1175,1568],0.45,\"triangle\",0.11);\n\n/* ---------- pizza drawing (SVG) ---------- */\nfunction pizzaSVG(g,cx,cy,r,opts={}){\n  el(\"circle\",{cx,cy,r,fill:\"#d48a3a\"},g);\n  el(\"circle\",{cx,cy,r:r*0.9,fill:\"#eab06a\"},g);\n  el(\"circle\",{cx,cy,r:r*0.85,fill:\"#c8321e\"},g);\n  let d=\"\";for(let i=0;i<=96;i++){const a=i/96*Math.PI*2,rr=r*(0.785+0.022*Math.sin(a*9)+0.012*Math.sin(a*4+1));d+=(i?\"L\":\"M\")+(cx+Math.cos(a)*rr).toFixed(1)+\" \"+(cy+Math.sin(a)*rr).toFixed(1);}\n  el(\"path\",{d:d+\"Z\",fill:\"#f6c445\"},g);\n  for(let i=0;i<22;i++){const a=i/22*Math.PI*2+0.1;el(\"circle\",{cx:cx+Math.cos(a)*r*0.95,cy:cy+Math.sin(a)*r*0.95,r:r*0.012,fill:\"#9a5a22\"},g);}\n  if(opts.toppings!==false){\n    [[0.5,0.3],[0.55,1.45],[0.52,2.6],[0.5,3.75],[0.48,4.95],[0.3,3.2]].forEach(([dd,a])=>pep(g,cx+Math.cos(a)*r*dd,cy+Math.sin(a)*r*dd,r*0.12));\n    [[0.62,2.0],[0.3,4.3],[0.62,5.6]].forEach(([dd,a])=>mush(g,cx+Math.cos(a)*r*dd,cy+Math.sin(a)*r*dd,r*0.09,a));\n    [[0.4,1.0],[0.66,3.1]].forEach(([dd,a])=>el(\"ellipse\",{cx:cx+Math.cos(a)*r*dd,cy:cy+Math.sin(a)*r*dd,rx:r*0.09,ry:r*0.06,fill:\"none\",stroke:\"#2f8a3a\",\"stroke-width\":r*0.03,transform:`rotate(${a*57.3} ${cx+Math.cos(a)*r*dd} ${cy+Math.sin(a)*r*dd})`},g));\n  }\n}\nfunction pep(g,x,y,s){el(\"circle\",{cx:x,cy:y,r:s,fill:\"#b3261e\"},g);el(\"circle\",{cx:x-s*0.15,cy:y-s*0.15,r:s*0.78,fill:\"#d9473a\"},g);\n  [[.3,.2],[-.35,.15],[.05,-.4]].forEach(([u,v])=>el(\"circle\",{cx:x+u*s,cy:y+v*s,r:s*0.13,fill:\"#8e1c16\"},g));}\nfunction mush(g,x,y,s,a){el(\"path\",{d:`M${x-s} ${y} A${s} ${s} 0 0 1 ${x+s} ${y} L${x+s*0.33} ${y} L${x+s*0.33} ${y+s*0.8} L${x-s*0.33} ${y+s*0.8} L${x-s*0.33} ${y} Z`,fill:\"#efe2c8\",stroke:\"#9c7a52\",\"stroke-width\":s*0.15,transform:`rotate(${a*57.3} ${x} ${y})`},g);}\nfunction olive(g,x,y,s){el(\"circle\",{cx:x,cy:y,r:s,fill:\"none\",stroke:\"#2b2522\",\"stroke-width\":s*0.55},g);}\nfunction pepper(g,x,y,s,a){el(\"ellipse\",{cx:x,cy:y,rx:s,ry:s*0.65,fill:\"none\",stroke:\"#2f8a3a\",\"stroke-width\":s*0.32,transform:`rotate(${a} ${x} ${y})`},g);}\nfunction basil(g,x,y,s,a){el(\"ellipse\",{cx:x,cy:y,rx:s,ry:s*0.45,fill:\"#3f8f3a\",transform:`rotate(${a} ${x} ${y})`},g);}\n\n/* ---------- 小提示：半徑＋半徑＝直徑 ---------- */\nfunction hintCard(box){box.innerHTML=`<div class=\"hintcard\"><h3>💡 小提示<\/h3>\n  <svg viewBox=\"0 0 300 220\" aria-hidden=\"true\">\n    <circle cx=\"150\" cy=\"80\" r=\"72\" fill=\"#fde7b0\" stroke=\"#d6402b\" stroke-width=\"5\"/>\n    <line x1=\"80\" y1=\"80\" x2=\"148\" y2=\"80\" stroke=\"#2563c9\" stroke-width=\"9\" stroke-linecap=\"round\"/>\n    <line x1=\"152\" y1=\"80\" x2=\"220\" y2=\"80\" stroke=\"#2563c9\" stroke-width=\"9\" stroke-linecap=\"round\"/>\n    <circle cx=\"150\" cy=\"80\" r=\"7\" fill=\"#2f2418\" stroke=\"#fff\" stroke-width=\"2\"/>\n    <text x=\"114\" y=\"66\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"900\" fill=\"#2563c9\" font-family=\"var(--font)\">半徑<\/text>\n    <text x=\"186\" y=\"66\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"900\" fill=\"#2563c9\" font-family=\"var(--font)\">半徑<\/text>\n    <path d=\"M78 164 q0 12 12 12 h48 q12 0 12 12 q0 -12 12 -12 h48 q12 0 12 -12\" fill=\"none\" stroke=\"#8a3fc0\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n    <line x1=\"78\" y1=\"80\" x2=\"78\" y2=\"160\" stroke=\"#8a3fc0\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/><line x1=\"222\" y1=\"80\" x2=\"222\" y2=\"160\" stroke=\"#8a3fc0\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>\n    <text x=\"150\" y=\"212\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"900\" fill=\"#8a3fc0\" font-family=\"var(--font)\">直徑<\/text>\n  <\/svg>\n  <div class=\"eq\"><span class=\"r\">半徑<\/span> ＋ <span class=\"r\">半徑<\/span> ＝ <span class=\"d\">直徑<\/span><\/div>\n  <div class=\"more\">直徑是半徑的 2 倍；半徑是直徑的一半<\/div><\/div>`;}\nhintCard($(\"sideHint\"));hintCard($(\"popHint\"));\n$(\"hintBtn\").onclick=()=>{$(\"hintPop\").hidden=false;$(\"hintClose\").focus();tone([660,880],0.2,\"triangle\");};\n$(\"hintClose\").onclick=()=>{$(\"hintPop\").hidden=true;$(\"hintBtn\").focus();};\n$(\"hintPop\").addEventListener(\"click\",e=>{if(e.target===$(\"hintPop\"))$(\"hintPop\").hidden=true;});\ndocument.addEventListener(\"keydown\",e=>{if(e.key===\"Escape\")$(\"hintPop\").hidden=true;});\n\n/* ---------- one round ---------- */\nlet placed=0;\nlet level=\"basic\",need=4;\nlet lastPlay=\"\";\nfunction resetRound(){placed=0;$(\"next\").classList.remove(\"ready\");$(\"qa\").innerHTML=\"\";$(\"fb\").hidden=true;$(\"tray\").hidden=false;$(\"stage\").classList.remove(\"drawing\");\n  document.querySelectorAll(\".slot\").forEach(x=>x.remove());$(\"quiz\").onpointerdown=null;}\nfunction feedback(ok,text){const f=$(\"fb\");f.hidden=false;f.className=\"fb \"+(ok?\"ok\":\"no\");f.textContent=text;}\nfunction roundWon(){placed=need;addTopping();sRight();setTimeout(sDone,350);$(\"next\").classList.add(\"ready\");}\nfunction newRound(){\n  resetRound();\n  if(level===\"adv\"){newAdvanced();return;}\n  if(level===\"sp\"){newSpecial();return;}\n  // 基礎: a different kind of question each time\n  const plays=[\"drag\",\"find\",\"yesno\",\"draw\"].filter(x=>x!==lastPlay),play=plays[Math.floor(Math.random()*plays.le Hant\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}<\/style><\/head><body><title>披薩盒展開<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&display=swap\">\n<style>\n/* Layout: a kraft-paper classroom stage — one big grid canvas on top, controls in one row, guess sheet + record sheet below */\n:root{\n  --paper:#f6f1e7; --surface:#fffdf8; --ink:#2f2418; --muted:#7a6a58;\n  --grid:#d9cdb8; --kraft:#c9955c; --kraft-in:#e8c99e; --kraft-dark:#8a5a2b; --diam:#8a3fc0;\n  --tomato:#d6402b; --cheese:#f7cd5d; --crust:#d9964a; --basil:#3f7d3a; --focus:#1d6fd6;\n  --edge:#ffcf00; --edge-line:#b38f00;\n  --font:\"Chiron GoRound TC\",\"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",sans-serif;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){\n  --paper:#201a14; --surface:#2a221a; --ink:#f3eadb; --muted:#b8a78f;\n  --grid:#4a3d2f; --kraft:#b8834b; --kraft-in:#d6b386; --kraft-dark:#e0ad73;\n  --tomato:#ff6a52; --cheese:#f2c94c; --crust:#d08a3e; --basil:#7cc46f; --focus:#6aa8ff;\n  --edge:#ffd60a; --edge-line:#ffe766; --diam:#c08bff; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --paper:#201a14; --surface:#2a221a; --ink:#f3eadb; --muted:#b8a78f;\n  --grid:#4a3d2f; --kraft:#b8834b; --kraft-in:#d6b386; --kraft-dark:#e0ad73;\n  --tomato:#ff6a52; --cheese:#f2c94c; --crust:#d08a3e; --basil:#7cc46f; --focus:#6aa8ff;\n  --edge:#ffd60a; --edge-line:#ffe766; --diam:#c08bff; color-scheme:dark}\nbody{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.5}\n.wrap{max-width:1100px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}\nh1{font-size:clamp(28px,4vw,40px);font-weight:900;margin:0;letter-spacing:.02em}\n.stage{background:var(--surface);border:2px solid var(--grid);border-radius:14px;padding:10px;min-width:0}\ncanvas{display:block;width:100%;cursor:pointer;touch-action:none}\n.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}\n.seg{display:flex;flex-wrap:wrap;border:2px solid var(--kraft-dark);border-radius:12px;overflow:hidden}\n.seg button{border:0;border-radius:0;background:transparent;color:var(--ink);padding:10px 16px}\n.seg button[aria-pressed=\"true\"]{background:var(--kraft-dark);color:var(--surface)}\nbutton{font:inherit;font-size:19px;font-weight:700;cursor:pointer;border-radius:12px;padding:10px 18px;border:2px solid var(--ink);background:var(--surface);color:var(--ink)}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}\nbutton.box{border-color:var(--edge-line);background:var(--edge);color:#2f2418}\nbutton.crust{border-color:var(--tomato);background:var(--tomato);color:#fff}\nbutton:disabled{opacity:.45;cursor:default}\n.toggles{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:17px;margin-left:4px}\n.show{display:flex;align-items:center;gap:8px}\n.show::before{content:\"\";width:22px;height:22px;border-radius:5px;border:3px solid currentColor;box-sizing:border-box}\n.showbox::before{border-color:var(--edge-line)}\n.showcrust::before{border-radius:50%;border-color:var(--tomato)}\n.showbox[aria-pressed=\"true\"]{background:var(--edge);border-color:var(--edge-line);color:#2f2418}\n.showcrust[aria-pressed=\"true\"]{background:var(--tomato);border-color:var(--tomato);color:#fff}\n.show[aria-pressed=\"true\"]::before{border-color:currentColor}\n.showguide::before{border-radius:0;border-width:0 0 0 3px;border-style:dashed;border-color:var(--tomato);width:4px;margin-left:8px}\n.showguide[aria-pressed=\"true\"]{background:#fde9e6;border-color:var(--tomato);color:var(--tomato)}\n.toggles input{width:20px;height:20px;accent-color:var(--basil)}\nbutton.cmp{border-color:var(--diam);background:var(--diam);color:#fff}\nbutton.side{border-color:var(--diam);background:var(--surface);color:var(--diam)}\n.say{margin:0;padding:10px 14px;border-radius:12px;background:var(--surface);border:2px dashed var(--kraft);font-size:20px;font-weight:900}\n.reveal-btn{justify-self:start;background:var(--kraft-dark);border-color:var(--kraft-dark);color:var(--surface)}\n.reveal{margin:0;padding:12px 14px;border-radius:12px;background:#fff3c4;border:2px solid #d9a400;color:#2f2418;font-size:19px;line-height:1.6}\n.reveal b{color:#b3261e}\n.sheet-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-top:6px;border-top:2px dashed var(--grid)}\n.sheet-bar h2{margin:0;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}\n.sheet-bar label{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--muted)}\nselect{font:inherit;font-size:17px;padding:6px 10px;border-radius:10px;border:2px solid var(--grid);background:var(--surface);color:var(--ink)}\n.status{font-size:15px;color:var(--muted)}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}\n.card{background:var(--surface);border:2px solid var(--grid);border-radius:14px;padding:16px 18px;display:grid;gap:12px;align-content:start;min-width:0}\n.card h3{margin:0;font-size:22px;font-weight:900}\n.tbl{overflow-x:auto}\ntable{width:100%;border-collapse:collapse}\nth,td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--grid);vertical-align:middle}\nth{font-size:15px;color:var(--muted);font-weight:700}\ntd.size{font-size:19px;font-weight:700;white-space:nowrap;padding-right:10px}\ntd input{width:100%;min-width:3.6em;font:inherit;font-size:19px;padding:6px 8px;border-radius:8px;border:2px solid var(--grid);background:var(--paper);color:var(--ink)}\n#intro{position:fixed;inset:0;z-index:50;background:var(--paper);transition:opacity .5s ease}\n#intro.leaving{opacity:0}\n#introCv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/style>\n\n<div id=\"intro\"><canvas id=\"introCv\" aria-label=\"披薩盒：把盒蓋往上拉可以打開，往下拉可以關上，打開後點披薩開始\"><\/canvas><\/div>\n\n<div class=\"wrap\">\n  <h1>披薩盒展開<\/h1>\n\n  <div class=\"stage\"><canvas id=\"cv\" aria-label=\"方格上的披薩盒，點盒子打開或關上，可展開盒子一圈或餅皮一圈\"><\/canvas><\/div>\n\n  <div class=\"controls\">\n    <div class=\"seg\" role=\"group\" aria-label=\"披薩大小\" id=\"sizes\"><\/div>\n    <button class=\"show showbox\" id=\"bShowBox\" aria-pressed=\"false\">盒子周長<\/button>\n    <button class=\"show showcrust\" id=\"bShowCrust\" aria-pressed=\"false\">披薩周長<\/button>\n    <button class=\"show showguide\" id=\"bGuide\" aria-pressed=\"false\">對比虛線<\/button>\n  <\/div>\n  <div class=\"controls\">\n    <button class=\"box\" id=\"bBox\">展開盒子一圈<\/button>\n    <button class=\"crust\" id=\"bCrust\">展開餅皮一圈<\/button>\n    <button class=\"cmp\" id=\"bCmp\">盒子一邊和披薩比比看<\/button>\n    <button class=\"side\" id=\"bSide\">量盒子一邊（直徑）<\/button>\n    <button id=\"bReset\">放回去<\/button>\n    <label class=\"toggles\"><input type=\"checkbox\" id=\"tExact\">顯示精確數字<\/label>\n  <\/div>\n\n  <p class=\"say\" id=\"say\" aria-live=\"polite\" hidden><\/p>\n  <div class=\"sheet-bar\">\n    <h2 id=\"sheetName\">紀錄<\/h2>\n    <label>換一天 <select id=\"dateSel\"><\/select><\/label>\n    <span class=\"status\" id=\"status\" aria-live=\"polite\"><\/span>\n  <\/div>\n  <div class=\"cards\">\n    <section class=\"card\">\n      <h3>先猜猜看<\/h3>\n      <div class=\"tbl\"><table><thead><tr><th>學生<\/th><th>餅皮一圈（圓周）會是幾格？<\/th><th>盒子一邊（直徑）會是幾格？<\/th><\/tr><\/thead><tbody id=\"guess\"><\/tbody><\/table><\/div>\n    <\/section>\n    <section class=\"card\">\n      <h3>紀錄表<\/h3>\n      <div class=\"tbl\"><table><thead><tr><th>披薩<\/th><th>餅皮一圈<br>（圓周）<\/th><th>盒子一邊<br>（直徑）<\/th><th>圓周 ÷ 直徑<\/th><\/tr><\/thead><tbody id=\"rec\"><\/tbody><\/table><\/div>\n      <button id=\"bReveal\" class=\"reveal-btn\">揭曉發現<\/button>\n      <p class=\"reveal\" id=\"reveal\" hidden>每一個披薩的 <b>圓周 ÷ 直徑<\/b> 都差不多是 <b>3.14<\/b>！<br>不管披薩大還是小都一樣，這個數就叫做「<b>圓周率<\/b>」。<\/p>\n    <\/section>\n  <\/div>\n<\/div>\n\n<script>\n(()=>{\n// 班級紀錄: the class record picked on the home page decides which saved progress this page uses\nconst MAT=\"box\";\nconst REC=(()=>{try{const a=JSON.parse(localStorage.getItem(\"pizzaRecs\")||\"{}\")[MAT];return a&&a.cur&&a.cur!==\"main\"?\"@\"+a.cur:\"\";}catch(e){return\"\";}})();\nfunction recTouch(){try{const all=JSON.parse(localStorage.getItem(\"pizzaRecs\")||\"{}\"),a=all[MAT];if(!a)return;const id=a.cur||\"main\",it=(a.list||[]).find(x=>x.id===id);\n  if(it){it.at=Date.now();localStorage.setItem(\"pizzaRecs\",JSON.stringify(all));}}catch(e){}}\n// 1 格 is the same for every pizza; a bigger pizza (and its box) covers more squares\nconst SIZES=[{n:\"小披薩\",d:1},{n:\"中披薩\",d:2},{n:\"大披薩\",d:3},{n:\"特大披薩\",d:4}];\nconst ROWS=5, PI=Math.PI;\nconst reduce=matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst $=id=>document.getElementById(id);\nconst cv=$(\"cv\");let ctx=cv.getContext(\"2d\");\nconst ctxRef={set(k){ctx=k;}};   // lets the start screen reuse the box and pizza drawings\n// step = tips finished; landed = box sides already stuck on the grid during an unfold\n// park = box slid one cell to the right of its line; pz = pizza resting right of its line\nconst S={size:2,lid:0,step:0,p:0,landed:0,park:0,s:0,out:false,px:0,py:0,row:2,shrink:0,drag:null,live:null,busy:false,\n  showBox:false,showCrust:false,exact:false,stick:null,guides:false,done:SIZES.map(()=>({box:false,crust:false,side:false}))};\nlet G={};\n\nfunction col(n){return getComputedStyle(document.documentElement).getPropertyValue(\"--\"+n).trim()}\n\nfunction layout(){\n  const W=cv.clientWidth;\n  const u=Math.min((W-16)/22.8,40),maxCell=4*u;   // u = one square; the biggest box is 4 squares wide\n  const cell=u*SIZES[S.size].d;                     // this pizza's box side\n  const H=Math.round(maxCell*3.2+40);\n  const dpr=window.devicePixelRatio||1;\n  cv.style.height=H+\"px\";cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);\n  ctx.setTransform(dpr,0,0,dpr,0,0);\n  G={W,H,maxCell,cell,u,x0:Math.max(8,0.5*maxCell),gy:H-40};\n  draw();\n}\n\n/* ---------- pizza ---------- */\nconst PEP=[[0.5,0.3],[0.55,1.45],[0.52,2.55],[0.5,3.75],[0.48,4.95],[0.12,0.9],[0.3,3.2]];\nconst MUSH=[[0.32,0.2],[0.62,2.0],[0.3,4.3],[0.62,5.6]];\nconst PEPPER=[[0.4,1.0],[0.66,3.1],[0.22,5.4]];\nconst OLIVE=[[0.66,0.85],[0.38,2.15],[0.68,4.3],[0.15,3.9]];\nconst BUBBLE=[[0.2,1.6],[0.58,2.95],[0.4,5.9],[0.7,1.7],[0.65,4.85]];\nfunction pizza(cx,cy,r,rot,peel,ring){\n  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);\n  const P=(d,a)=>[Math.cos(a)*r*d,Math.sin(a)*r*d];\n  ctx.fillStyle=\"#c8321e\";ctx.beginPath();ctx.arc(0,0,r*0.85,0,PI*2);ctx.fill();          // sauce\n  const g=ctx.createRadialGradient(-r*0.2,-r*0.25,r*0.1,0,0,r*0.82);\n  g.addColorStop(0,\"#ffe58a\");g.addColorStop(1,\"#f6c445\");\n  ctx.fillStyle=g;ctx.beginPath();                                                           // wavy melted cheese\n  for(let i=0;i<=36;i++){const a=i/36*PI*2,rr=r*(0.78+0.04*Math.sin(i*2.7));i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(rr,0);}\n  ctx.fill();\n  ctx.fillStyle=\"rgba(214,140,40,.45)\";BUBBLE.forEach(([d,a])=>{const[x,y]=P(d,a);ctx.beginPath();ctx.ellipse(x,y,r*0.06,r*0.04,a,0,PI*2);ctx.fill();});\n  PEP.forEach(([d,a])=>{const[x,y]=P(d,a);\n    ctx.fillStyle=\"#b3261e\";ctx.beginPath();ctx.arc(x,y,r*0.13,0,PI*2);ctx.fill();\n    ctx.fillStyle=\"#d9473a\";ctx.beginPath();ctx.arc(x-r*0.02,y-r*0.02,r*0.1,0,PI*2);ctx.fill();\n    ctx.fillStyle=\"#8e1c16\";[[.04,.03],[-.05,.02],[.01,-.05]].forEach(([u,v])=>{ctx.beginPath();ctx.arc(x+u*r,y+v*r,r*0.017,0,PI*2);ctx.fill();});});\n  MUSH.forEach(([d,a])=>{const[x,y]=P(d,a);ctx.save();ctx.translate(x,y);ctx.rotate(a);\n    ctx.fillStyle=\"#efe2c8\";ctx.strokeStyle=\"#9c7a52\";ctx.lineWidth=Math.max(1,r*0.015);\n    ctx.beginPath();ctx.arc(0,0,r*0.09,PI,0);ctx.lineTo(r*0.03,0);ctx.lineTo(r*0.03,r*0.07);ctx.lineTo(-r*0.03,r*0.07);ctx.lineTo(-r*0.03,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();});\n  ctx.lineWidth=Math.max(2,r*0.03);ctx.strokeStyle=\"#2f8a3a\";\n  PEPPER.forEach(([d,a])=>{const[x,y]=P(d,a);ctx.beginPath();ctx.ellipse(x,y,r*0.09,r*0.06,a,0,PI*2);ctx.stroke();});\n  ctx.strokeStyle=\"#2b2522\";OLIVE.forEach(([d,a])=>{const[x,y]=P(d,a);ctx.beginPath();ctx.arc(x,y,r*0.045,0,PI*2);ctx.stroke();});\n  ctx.fillStyle=\"#3f8f3a\";[[0.58,0.65],[0.2,2.6]].forEach(([d,a])=>{const[x,y]=P(d,a);ctx.beginPath();ctx.ellipse(x,y,r*0.08,r*0.035,a+1,0,PI*2);ctx.fill();});\n  if(peel<PI*2-1e-4){\n    const a0=PI/2,a1=PI/2-peel+PI*2;\n    ctx.strokeStyle=\"#d48a3a\";ctx.lineWidth=r*0.17;ctx.beginPath();ctx.arc(0,0,r*0.905,a0,a1);ctx.stroke();\n    ctx.strokeStyle=\"#eab06a\";ctx.lineWidth=r*0.06;ctx.beginPath();ctx.arc(0,0,r*0.88,a0,a1);ctx.stroke();\n    ctx.fillStyle=\"#9a5a22\";\n    for(let i=0;i<24;i++){const a=i/24*PI*2+0.1;let rel=((a-a0)%(PI*2)+PI*2)%(PI*2);if(rel>a1-a0)continue;\n      ctx.beginPath();ctx.arc(Math.cos(a)*r*0.93,Math.sin(a)*r*0.93,r*0.012,0,PI*2);ctx.fill();}\n    if(ring){ctx.strokeStyle=col(\"tomato\");ctx.lineWidth=Math.max(4,r*0.06);ctx.beginPath();ctx.arc(0,0,r*0.975,a0,a1);ctx.stroke();}\n  }\n  ctx.restore();\n}\n\n/* ---------- pizza box (drawn in a unit square, then scaled) ---------- */\nfunction boxTop(x,y,w,h){                      // closed lid seen from above; h<w squashes it while it flips\n  ctx.save();ctx.translate(x,y);ctx.scale(w,h);\n  const lw=1/Math.max(40,w);\n  ctx.fillStyle=\"#c8945a\";ctx.fillRect(0,0,1,1);\n  const gr=ctx.createLinearGradient(0,0,1,1);gr.addColorStop(0,\"rgba(255,255,255,.18)\");gr.addColorStop(1,\"rgba(0,0,0,.10)\");\n  ctx.fillStyle=gr;ctx.fillRect(0,0,1,1);\n  // red-and-white checkered bands\n  const n=10,bh=0.09;\n  for(let i=0;i<n;i++)for(let j=0;j<2;j++){ctx.fillStyle=(i+j)%2?\"#fff6ea\":\"#c62f24\";\n    ctx.fillRect(i/n,0.05+j*bh/2,1/n,bh/2);ctx.fillRect(i/n,0.95-bh+j*bh/2,1/n,bh/2);}\n  // badge\n  ctx.fillStyle=\"#fff6ea\";ctx.beginPath();ctx.arc(.5,.5,.27,0,PI*2);ctx.fill();\n  ctx.strokeStyle=\"#c62f24\";ctx.lineWidth=.03;ctx.beginPath();ctx.arc(.5,.5,.27,0,PI*2);ctx.stroke();\n  ctx.strokeStyle=\"#2f8a3a\";ctx.lineWidth=.012;ctx.beginPath();ctx.arc(.5,.5,.235,0,PI*2);ctx.stroke();\n  // slice icon\n  ctx.fillStyle=\"#f6c445\";ctx.beginPath();ctx.moveTo(.5,.6);ctx.lineTo(.4,.36);ctx.quadraticCurveTo(.5,.31,.6,.36);ctx.closePath();ctx.fill();\n  ctx.strokeStyle=\"#d48a3a\";ctx.lineWidth=.035;ctx.beginPath();ctx.moveTo(.4,.36);ctx.quadraticCurveTo(.5,.31,.6,.36);ctx.stroke();\n  ctx.fillStyle=\"#b3261e\";[[.47,.41],[.53,.45],[.5,.52]].forEach(([u,v])=>{ctx.beginPath();ctx.arc(u,v,.022,0,PI*2);ctx.fill();});\n  // steam\n  ctx.strokeStyle=\"rgba(255,255,255,.9)\";ctx.lineWidth=.014;ctx.lineCap=\"round\";\n  [.44,.5,.56].forEach(u=>{ctx.beginPath();ctx.moveTo(u,.29);ctx.bezierCurveTo(u-.03,.26,u+.03,.24,u,.2);ctx.stroke();});\n  // words\n  // corrugated edge\n  ctx.strokeStyle=\"#7a4f26\";ctx.lineWidth=lw*3;ctx.strokeRect(0,0,1,1);\n  ctx.strokeStyle=\"rgba(122,79,38,.45)\";ctx.lineWidth=lw*1.5;ctx.strokeRect(.025,.025,.95,.95);\n  ctx.restore();\n  if(Math.abs(h)>w*0.2){                       // words in real pixels, squashed with the lid\n    ctx.save();ctx.translate(x,y);ctx.scale(1,h/w);ctx.textAlign=\"center\";ctx.textBaseline=\"middle\";\n    ctx.fillStyle=\"#c62f24\";ctx.font=`900 ${Math.round(w*0.11)}px ${col(\"font\")}`;ctx.fillText(\"披薩\",w*.5,w*.665);\n    if(w>70){ctx.fillStyle=\"#6b4420\";ctx.font=`700 ${Math.round(w*0.06)}px ${col(\"font\")}`;ctx.fillText(\"熱騰騰 現烤\",w*.5,w*.8);}\n    ctx.restore();\n  }\n}\nfunction boxInside(x,y,w,h){                   // inside of the lid, folded up behind the box\n  ctx.save();ctx.translate(x,y);ctx.scale(w,h);\n  ctx.fillStyle=\"#e9cfa6\";ctx.fillRect(0,0,1,1);\n  ctx.fillStyle=\"rgba(190,120,40,.22)\";[[.28,.4,.09],[.7,.62,.06],[.55,.25,.04]].forEach(([u,v,s])=>{ctx.beginPath();ctx.arc(u,v,s,0,PI*2);ctx.fill();});\n  ctx.strokeStyle=\"rgba(122,79,38,.5)\";ctx.lineWidth=1/Math.max(40,w)*1.5;ctx.strokeRect(.06,.06,.88,.88);\n  ctx.strokeStyle=\"#7a4f26\";ctx.lineWidth=1/Math.max(40,w)*3;ctx.strokeRect(0,0,1,1);\n  ctx.restore();\n}\nfunction boxBase(x,y,c){\n  ctx.fillStyle=\"#d7ab72\";ctx.fillRect(x,y,c,c);\n  const i=c*0.06;ctx.fillStyle=\"#efdcbf\";ctx.fillRect(x+i,y+i,c-2*i,c-2*i);\n  ctx.strokeStyle=\"rgba(122,79,38,.5)\";ctx.lineWidth=1.5;ctx.strokeRect(x+i,y+i,c-2*i,c-2*i);\n  ctx.strokeStyle=\"#7a4f26\";ctx.lineWidth=3;ctx.strokeRect(x,y,c,c);\n}\n// yellow perimeter in a frame whose bottom-right corner is the origin; rect (-c,-c)-(0,0)\n// physical side k (0 bottom,1 right,2 top,3 left at start) sits at local slot (k - tips) mod 4\nfunction boxEdges(tips,landed){\n  const c=G.cell,w=Math.max(6,c*0.07);\n  const seg=[[-c,0,0,0],[0,0,0,-c],[0,-c,-c,-c],[-c,-c,-c,0]];\n  ctx.strokeStyle=col(\"edge\");ctx.lineWidth=w;ctx.lineCap=\"round\";\n  for(let k=landed;k<4;k++){const q=seg[((k-tips)%4+4)%4];\n    ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.lineTo(q[2],q[3]);ctx.stroke();}\n  ctx.lineCap=\"butt\";\n}\nfunction line(y,len,c){\n  ctx.strokeStyle=c;ctx.lineWidth=Math.max(7,G.cell*0.07);ctx.lineCap=\"round\";\n  ctx.beginPath();ctx.moveTo(G.x0,y);ctx.lineTo(G.x0+len,y);ctx.stroke();ctx.lineCap=\"butt\";\n}\nfunction endLabel(x,y,text,c,always){\n  if(!S.exact&&!always)return;\n  ctx.fillStyle=c;ctx.font=`900 ${Math.max(16,Math.round(G.u*0.5))}px ${col(\"font\")}`;\n  ctx.textAlign=\"center\";ctx.textBaseline=\"bottom\";ctx.fillText(text,x,y-8);\n}\n\nfunction draw(){\n  if(!G.W) return;\n  const {W,H,cell,u,x0,gy}=G,r=cell/2,cy2=gy-2*cell,d=SIZES[S.size].d;\n  ctx.fillStyle=col(\"surface\");ctx.fillRect(0,0,W,H);\n  ctx.strokeStyle=col(\"grid\");ctx.lineWidth=1.5;ctx.beginPath();\n  for(let x=x0-Math.ceil(x0/u)*u;x<=W;x+=u){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,gy);}\n  for(let y=gy-u;y>0;y-=u){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);}\n  ctx.stroke();\n  ctx.strokeStyle=col(\"ink\");ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();\n  ctx.fillStyle=col(\"muted\");ctx.font=`700 ${Math.max(12,Math.min(17,u*0.45))}px ${col(\"font\")}`;ctx.textAlign=\"center\";ctx.textBaseline=\"alphabetic\";\n  for(let k=0;x0+k*u<=W-4;k++){const x=x0+k*u;\n    ctx.strokeStyle=col(\"muted\");ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x,gy+8);ctx.stroke();\n    ctx.fillText(k,x,gy+30);}\n  // lines stuck on the grid\n  const D=S.done[S.size],L=S.live;\n  const boxLen=L&&L.kind===\"box\"?L.len:(D.box?4*cell:0);\n  const crustLen=L&&L.kind===\"crust\"?L.len:(D.crust!==false?PI*cell:0);\n  const cyL=gy-(L&&L.kind===\"crust\"?S.row:(D.crust===false?S.row:D.crust))*cell;\n  if(boxLen>0) line(gy-3,boxLen,col(\"edge\"));\n  if(crustLen>0) line(cyL,crustLen,col(\"tomato\"));\n  if(D.box&&!(L&&L.kind===\"box\")) endLabel(x0+2*cell,gy-6,4*d+\" 格\",col(\"edge-line\"));\n  if(D.crust!==false&&!(L&&L.kind===\"crust\")) endLabel(x0+1.57*cell,cyL,String(Math.round(314*d)/100)+\" 格\",col(\"tomato\"));\n  // 盒子一邊 laid on the squares just under the crust line, both starting at 0, so they can be compared\n  const sy=sideY();\n  if(D.side){line(sy,cell,col(\"diam\"));\n    if(S.exact){ctx.font=`900 ${Math.max(16,Math.round(u*0.5))}px ${col(\"font\")}`;ctx.textAlign=\"left\";ctx.textBaseline=\"middle\";ctx.lineWidth=5;ctx.strokeStyle=col(\"surface\");\n      ctx.strokeText(d+\" 格\",x0+cell+12,sy);ctx.fillStyle=col(\"diam\");ctx.fillText(d+\" 格\",x0+cell+12,sy);}}\n  // both unfolded: dashed guides from the ground up to the start and the end of the crust line\n  // 對比虛線: dashed lines from the squares' ruler up to both ends of each measured line, in that line's colour\n  if(S.guides){\n    const guide=(xs,y,c)=>{ctx.save();ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=3;\n      xs.forEach(x=>{ctx.setLineDash([10,8]);ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x,y);ctx.stroke();\n        ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(x,y-2);ctx.lineTo(x-7,y+12);ctx.lineTo(x+7,y+12);ctx.closePath();ctx.fill();});ctx.restore();};\n    if(crustLen>0)guide([x0,x0+crustLen],cyL,col(\"tomato\"));                 // 圓周 (red), also while it is still unrolling\n    if(D.side)guide([x0,x0+cell],sy,col(\"diam\"));                          // 直徑 (purple)\n  }\n  // box\n  const home=S.step===0&&S.p===0&&S.park===0;\n  const boxUnfolding=L&&L.kind===\"box\";\n  if(!home&&S.park>0){\n    const sz=cell*(1-0.2*S.park),left=x0+3*cell+S.park*cell*1.15;\n    ctx.save();ctx.translate(left+sz/2,gy-sz/2);ctx.rotate(S.step*PI/2);\n    boxTop(-sz/2,-sz/2,sz,sz);\n    if(S.showBox){ctx.strokeStyle=col(\"edge\");ctx.lineWidth=Math.max(6,cell*0.07);ctx.strokeRect(-sz/2,-sz/2,sz,sz);}\n    ctx.restore();\n  }else if(!home){\n    ctx.save();ctx.translate(x0+(S.step+1)*cell,gy);ctx.rotate(S.p*PI/2);\n    ctx.save();ctx.translate(-cell/2,-cell/2);ctx.rotate(S.step*PI/2);boxTop(-cell/2,-cell/2,cell,cell);ctx.restore();\n    if(boxUnfolding) boxEdges(S.step,S.landed); else if(S.showBox) boxEdges(0,0);\n    ctx.restore();\n  }else{\n    const bx=x0,by=gy-cell;\n    boxBase(bx,by,cell);\n    if(!S.out) pizza(bx+r,gy-r,r,0,0,S.showCrust);\n    const ch=Math.cos(S.lid*PI)*cell;\n    if(ch>0.5) boxTop(bx,by,cell,ch);\n    else if(ch<-0.5) boxInside(bx,by+ch,cell,-ch);\n    if(boxUnfolding){ctx.save();ctx.translate(bx+cell,gy);boxEdges(0,S.landed);ctx.restore();}\n    else if(S.showBox){ctx.save();ctx.translate(bx+cell,gy);boxEdges(0,0);ctx.restore();}\n  }\n  if(S.out){\n    const rolling=L&&L.kind===\"crust\",rr=r*(1-0.2*S.shrink);\n    pizza(S.px+S.s,S.py+r-rr,rr,S.s/r,(S.shrink>0||!rolling&&S.s===0)?0:S.s/r,rolling||S.showCrust);\n  }\n idth:100%}[hidden]{display:none!important}<\/style><\/head><body><title>披薩店點單<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&display=swap\">\n<style>\n/* Layout: same kraft-paper classroom look as the other pizza materials — the shop counter (customer, speech bubble, order slip, cards) on the left, the class tip box on the right */\n:root{\n  --paper:#f6f1e7; --surface:#fffdf8; --ink:#2f2418; --muted:#7a6a58;\n  --grid:#d9cdb8; --kraft-dark:#8a5a2b;\n  --tomato:#d6402b; --cut:#2563c9; --diam:#8a3fc0; --basil:#3f7d3a; --cheese:#f7cd5d; --focus:#1d6fd6;\n  --ok:#2f8a3a; --ok-soft:#e1f2dc; --gold:#e3a51b;\n  --font:\"Chiron GoRound TC\",\"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",sans-serif;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){\n  --paper:#201a14; --surface:#2a221a; --ink:#f3eadb; --muted:#b8a78f; --grid:#4a3d2f; --kraft-dark:#e0ad73;\n  --tomato:#ff6a52; --cut:#6ea2ff; --diam:#c08bff; --basil:#7cc46f; --cheese:#f2c94c; --focus:#6aa8ff;\n  --ok:#7cc46f; --ok-soft:#24361f; --gold:#f2c94c; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --paper:#201a14; --surface:#2a221a; --ink:#f3eadb; --muted:#b8a78f; --grid:#4a3d2f; --kraft-dark:#e0ad73;\n  --tomato:#ff6a52; --cut:#6ea2ff; --diam:#c08bff; --basil:#7cc46f; --cheese:#f2c94c; --focus:#6aa8ff;\n  --ok:#7cc46f; --ok-soft:#24361f; --gold:#f2c94c; color-scheme:dark}\nbody{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.5}\n.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}\n.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}\nh1{font-size:clamp(28px,4vw,40px);font-weight:900;margin:0;margin-right:auto}\n.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:17px}\n.toggles input{width:20px;height:20px;accent-color:var(--basil)}\nbutton{font:inherit;font-size:19px;font-weight:700;cursor:pointer;border-radius:12px;padding:10px 20px;border:2px solid var(--ink);background:var(--surface);color:var(--ink)}\nbutton:focus-visible{outline:3px solid var(--focus);outline-offset:2px}\n.lv{display:inline-flex;border:2px solid var(--kraft-dark);border-radius:12px;overflow:hidden}\n.lv button{border:0;border-radius:0;background:transparent;padding:10px 16px}\n.lv button[aria-pressed=\"true\"]{background:var(--kraft-dark);color:var(--surface)}\n#next{background:var(--kraft-dark);border-color:var(--kraft-dark);color:var(--surface)}\n#next.ready{animation:nudge 1s ease-in-out infinite}\n@keyframes nudge{50%{transform:scale(1.07)}}\n.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}\n@media (max-width:560px){.main{grid-template-columns:1fr}}\n.panel{background:var(--surface);border:2px solid var(--grid);border-radius:14px;padding:14px;min-width:0}\n.shop{display:grid;gap:14px}\n.scene{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:start}\n@media (max-width:700px){.scene{grid-template-columns:100px minmax(0,1fr)}}\n.customer svg{width:100%;height:auto;display:block}\n.customer.enter{animation:walkin .6s ease-out}\n@keyframes walkin{from{transform:translateX(-40px);opacity:0}}\n.bubble{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:12px 16px;font-size:clamp(20px,2.4vw,26px);font-weight:700;min-width:0}\n.bubble::before{content:\"\";position:absolute;left:-14px;top:34px;border:12px solid transparent;border-right-color:var(--ink);border-left:0}\n.bubble p{margin:0}\n.bubble .pic{margin-top:8px;max-width:340px}\n.bubble .pic svg{width:100%;height:auto;display:block}\n.slip{background:#fffef9;color:#2f2418;border:2px solid #d9cdb8;border-radius:6px;padding:16px 18px 18px;box-shadow:0 3px 0 #d9cdb8;\n  background-image:repeating-linear-gradient(transparent 0 46px,#eadfcb 46px 48px)}\n.slip .head{font-size:15px;color:#7a6a58;font-weight:700;border-bottom:2px dashed #d9cdb8;padding-bottom:6px;margin-bottom:12px;display:flex;justify-content:space-between}\n.formula{display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:8px;font-size:clamp(20px,2.7vw,36px);font-weight:900;white-space:nowrap;overflow-x:auto;padding-bottom:6px}\n.formula>*{flex:none}\n.tok.name{padding:2px 10px;border-radius:10px;background:#f4ead8}\n.slot{min-width:3.2em;min-height:1.6em;padding:2px 10px;border:3px dashed #7a6a58;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#7a6a58;transition:background .15s,border-color .15s}\n.slot.hover{border-color:#8a5a2b;background:#fbecc0}\n.slot.done{border:3px solid #2f8a3a;background:#e1f2dc;color:#2f8a3a;animation:pop .35s ease}\n@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}\n.tray{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:14px;min-height:90px;padding:10px;border-radius:14px;border:2px dashed var(--grid)}\n.card{touch-action:none;user-select:none;cursor:grab;min-width:110px;padding:10px 18px;border-radius:14px;background:var(--cheese);color:#2f2418;border:3px solid #b8861f;\n  box-shadow:0 4px 0 #b8861f;font-size:clamp(24px,3vw,32px);font-weight:900;text-align:center;white-space:nowrap}\n.card.dragging{position:fixed;z-index:20;cursor:grabbing;box-shadow:0 10px 20px rgba(0,0,0,.25);pointer-events:none}\n.card.shake{animation:shake .4s}\n@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}\n.jar h2{margin:0;font-size:22px;font-weight:900}\n.jar .total{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--kraft-dark)}\n.jar svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}\n.jar .msg{margin:6px 0 0;padding:10px 12px;border-radius:10px;background:var(--ok-soft);border:2px solid var(--ok);color:var(--ok);font-weight:900;font-size:20px;text-align:center}\n.jar .row{display:flex;gap:10px;margin-top:10px}\n.jar .row button{font-size:16px;padding:6px 14px}\n.coin{position:fixed;z-index:30;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#e3a51b 70%);border:3px solid #b8861f;\n  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#6b4a00;pointer-events:none;transition:transform .9s cubic-bezier(.5,-0.3,.6,1),opacity .2s .85s}\n.tip{font-size:22px;font-weight:900;color:var(--ok);text-align:center;min-height:1.5em;margin:0}\n#door{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;\n  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .5s ease}\n#door.leaving{opacity:0}\n#door svg{width:min(100%,760px);max-height:74vh;height:auto;display:block}\n#enter{font-size:clamp(24px,3vw,32px);font-weight:900;padding:14px 44px;border-radius:999px;background:#c62f24;border-color:#8e1c16;color:#fff;box-shadow:0 5px 0 #8e1c16;animation:nudge 1.4s ease-in-out infinite}\n#enter:active{transform:translateY(3px);box-shadow:0 2px 0 #8e1c16}\n.steam2 path{animation:steam 1.8s ease-in-out infinite}\n@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:.85}100%{opacity:0;transform:translateY(-12px)}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style>\n\n<div id=\"door\">\n  <svg viewBox=\"0 0 760 520\" role=\"img\" aria-label=\"披薩店門口\">\n    <rect x=\"0\" y=\"470\" width=\"760\" height=\"50\" fill=\"#b9a68a\"/>\n    <rect x=\"0\" y=\"466\" width=\"760\" height=\"8\" fill=\"#9c8a70\"/>\n    <!-- building -->\n    <rect x=\"60\" y=\"70\" width=\"640\" height=\"400\" fill=\"#e7c9a0\"/>\n    <g fill=\"#d9b585\" opacity=\".7\">\n      <rect x=\"80\" y=\"210\" width=\"40\" height=\"16\" rx=\"3\"/><rect x=\"640\" y=\"240\" width=\"40\" height=\"16\" rx=\"3\"/><rect x=\"96\" y=\"300\" width=\"40\" height=\"16\" rx=\"3\"/>\n      <rect x=\"628\" y=\"330\" width=\"40\" height=\"16\" rx=\"3\"/><rect x=\"84\" y=\"390\" width=\"40\" height=\"16\" rx=\"3\"/><rect x=\"646\" y=\"410\" width=\"40\" height=\"16\" rx=\"3\"/>\n    <\/g>\n    <rect x=\"44\" y=\"52\" width=\"672\" height=\"26\" rx=\"6\" fill=\"#7a4f26\"/>\n    <!-- sign -->\n    <rect x=\"210\" y=\"8\" width=\"340\" height=\"74\" rx=\"16\" fill=\"#2f8a3a\" stroke=\"#1e5e26\" stroke-width=\"5\"/>\n    <text x=\"380\" y=\"62\" text-anchor=\"middle\" font-size=\"46\" font-weight=\"900\" fill=\"#fffdf8\" font-family=\"var(--font)\">披薩店<\/text>\n    <circle cx=\"246\" cy=\"45\" r=\"16\" fill=\"#f6c445\" stroke=\"#d48a3a\" stroke-width=\"5\"/><circle cx=\"242\" cy=\"41\" r=\"4\" fill=\"#c8321e\"/><circle cx=\"251\" cy=\"49\" r=\"4\" fill=\"#c8321e\"/>\n    <circle cx=\"514\" cy=\"45\" r=\"16\" fill=\"#f6c445\" stroke=\"#d48a3a\" stroke-width=\"5\"/><circle cx=\"510\" cy=\"49\" r=\"4\" fill=\"#c8321e\"/><circle cx=\"519\" cy=\"41\" r=\"4\" fill=\"#c8321e\"/>\n    <!-- awning -->\n    <g>\n      <path d=\"M70 100 L690 100 L716 168 L44 168 Z\" fill=\"#fffdf8\"/>\n      <path d=\"M70 100 L132 100 L120 168 L44 168 Z M194 100 L256 100 L252 168 L176 168 Z M318 100 L380 100 L384 168 L308 168 Z M442 100 L504 100 L516 168 L440 168 Z M566 100 L628 100 L648 168 L572 168 Z\" fill=\"#c62f24\"/>\n      <path d=\"M44 168 q22 22 44 0 q22 22 44 0 q22 22 44 0 q22 22 44 0 q22 22 44 0 q22 22 44 0 q22 22 44 0 q22 22 44 0 q22 22 44 0 q22 22 44 0 q22 22 44 0 q22 22 44 0 q22 22 44 0 q22 22 44 0 q22 22 52 0 Z\" fill=\"#c62f24\"/>\n    <\/g>\n    <!-- window with a pizza -->\n    <rect x=\"100\" y=\"210\" width=\"290\" height=\"200\" rx=\"10\" fil =\"220\" height=\"10\" rx=\"3\" fill=\"#5c3a18\"/>\n    <!-- plants -->\n    <rect x=\"404\" y=\"424\" width=\"34\" height=\"42\" rx=\"5\" fill=\"#c9955c\"/><circle cx=\"421\" cy=\"412\" r=\"22\" fill=\"#3f8f3a\"/><circle cx=\"410\" cy=\"400\" r=\"12\" fill=\"#4fa34a\"/>\n    <rect x=\"668\" y=\"424\" width=\"34\" height=\"42\" rx=\"5\" fill=\"#c9955c\"/><circle cx=\"685\" cy=\"412\" r=\"22\" fill=\"#3f8f3a\"/><circle cx=\"696\" cy=\"400\" r=\"12\" fill=\"#4fa34a\"/>\n  <\/svg>\n  <button id=\"enter\">進入披薩店<\/button>\n<\/div>\n\n<div class=\"wrap\">\n  <div class=\"top\">\n    <h1>披薩店點單<\/h1>\n    <span class=\"lv\" role=\"group\" aria-label=\"難度\"><button id=\"lv1\" aria-pressed=\"true\">基礎<\/button><button id=\"lv2\" aria-pressed=\"false\">進階<\/button><\/span>\n    <span class=\"toggles\"><label><input type=\"checkbox\" id=\"tSound\" checked>音效<\/label><\/span>\n    <button id=\"next\">下一位客人<\/button>\n  <\/div>\n\n  <div class=\"main\">\n    <section class=\"panel shop\">\n      <div class=\"scene\">\n        <div class=\"customer\" id=\"customer\"><\/div>\n        <div class=\"bubble\" id=\"bubble\"><\/div>\n      <\/div>\n      <div class=\"slip\">\n        <div class=\"head\"><span>點餐單<\/span><span id=\"slipNo\"><\/span><\/div>\n        <div class=\"formula\" id=\"formula\"><\/div>\n      <\/div>\n      <p class=\"tip\" id=\"tip\" aria-live=\"polite\"><\/p>\n      <div class=\"tray\" id=\"tray\" aria-label=\"答案卡\"><\/div>\n    <\/section>\n\n    <aside class=\"panel jar\">\n      <h2>全班小費箱<\/h2>\n      <div class=\"total\" id=\"total\"><\/div>\n      <svg id=\"jarSvg\" viewBox=\"0 0 240 280\" aria-label=\"全班小費箱裡的小費\"><\/svg>\n      <p class=\"msg\" id=\"jarMsg\" hidden>小費箱滿了！大家好會做生意！<\/p>\n      <div class=\"row\"><button id=\"emptyJar\">把小費箱倒空<\/button><\/div>\n    <\/aside>\n  <\/div>\n<\/div>\n\n<script>\n(()=>{\n// 班級紀錄: the class record picked on the home page decides which saved progress this page uses\nconst MAT=\"order\";\nconst REC=(()=>{try{const a=JSON.parse(localStorage.getItem(\"pizzaRecs\")||\"{}\")[MAT];return a&&a.cur&&a.cur!==\"main\"?\"@\"+a.cur:\"\";}catch(e){return\"\";}})();\nfunction recTouch(){try{const all=JSON.parse(localStorage.getItem(\"pizzaRecs\")||\"{}\"),a=all[MAT];if(!a)return;const id=a.cur||\"main\",it=(a.list||[]).find(x=>x.id===id);\n  if(it){it.at=Date.now();localStorage.setItem(\"pizzaRecs\",JSON.stringify(all));}}catch(e){}}\nconst $=id=>document.getElementById(id);\nconst NS=\"http://www.w3.org/2000/svg\";\nconst reduce=matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e;};\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};\nconst pick=a=>a[Math.floor(Math.random()*a.length)];\nconst fmt=v=>String(Math.round(v*100)/100);\nconst TIP=10,GOAL=200;\n\n/* ---------- sound ---------- */\nlet ac=null;\nfunction tone(fs,dur,type=\"triangle\",gap=0.09,vol=0.18){\n  if(!$(\"tSound\").checked)return;\n  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}\n  const t0=ac.currentTime;\n  fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;const s=t0+i*gap;\n    g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+0.02);g.gain.exponentialRampToValueAtTime(0.001,s+dur);\n    o.connect(g).connect(ac.destination);o.start(s);o.stop(s+dur+0.05);});\n}\nconst sRight=()=>tone([1047,1319],0.35);\nconst sWrong=()=>tone([196,165],0.25,\"square\",0.12,0.07);\nconst sCoin=()=>tone([1568,2093],0.18,\"square\",0.06,0.06);\n\n/* ---------- customers ---------- */\nconst PEOPLE=[\n  {skin:\"#f2c9a0\",hair:\"#2b1d14\",shirt:\"#3a7bd5\",style:\"short\"},\n  {skin:\"#e8b48a\",hair:\"#5a3a22\",shirt:\"#d6402b\",style:\"long\"},\n  {skin:\"#f6d2b0\",hair:\"#bdbdbd\",shirt:\"#3f7d3a\",style:\"bun\"},\n  {skin:\" \"=\",\"圓周長\"],\n  [\"半徑\",\"×\",\"2\",\"×\",\"pi\",\"=\",\"圓周長\"],\n  [\"圓周長\",\"÷\",\"pi\",\"=\",\"直徑\"],\n  [\"圓周長\",\"÷\",\"直徑\",\"=\",\"圓周率\"],\n];\nconst NAMES=[\"直徑\",\"半徑\",\"圓周長\",\"圓周率\"],OPS=[\"×\",\"÷\",\"+\",\"−\"],NUMS=[\"2\",\"3.14\",\"4\",\"1\"];\nconst kind=t=>OPS.includes(t)?\"o\":NAMES.includes(t)?\"n\":\"d\";\nconst LINES1=[\"老闆，算式少了一塊，幫我補好才知道金邊要多長！\",\"點餐單被番茄醬弄髒了，空格裡原本寫什麼呀？\",\"我的披薩要剛剛好的金邊，請幫我把算式補完整。\",\"我是新來的外送員，這個算式缺了什麼？\"];\n\n/* ---------- level 2: pick the expression ---------- */\n// o.line: \"d\" draws the diameter, \"r\" the radius; labels are the words written beside the line and the crust\nfunction pizzaPic(o){\n  const box=document.createElement(\"div\");box.className=\"pic\";\n  const s=el(\"svg\",{viewBox:\"0 0 380 230\",\"aria-label\":`披薩：${o.lineLabel}，圓周長 ${o.circLabel}`},box);\n  const cx=120,cy=118,r=88,lc=o.line===\"r\"?\"var(--cut)\":\"var(--diam)\";\n  el(\"circle\",{cx,cy,r,fill:\"#f3dcb3\"},s);el(\"circle\",{cx,cy,r:r*0.82,fill:\"#f8e7b0\"},s);\n  [[0.5,0.4],[0.45,2.2],[0.5,4.1],[0.25,5.5]].forEach(([q,a])=>el(\"circle\",{cx:cx+Math.cos(a)*r*q,cy:cy+Math.sin(a)*r*q,r:10,fill:\"#e9a99f\"},s));\n  el(\"circle\",{cx,cy,r,fill:\"none\",stroke:\"var(--tomato)\",\"stroke-width\":7},s);\n  const x1=o.line===\"r\"?cx:cx-r,x2=cx+r;\n  el(\"line\",{x1,y1:cy,x2,y2:cy,stroke:lc,\"stroke-width\":7,\"stroke-linecap\":\"round\"},s);\n  el(\"circle\",{cx,cy,r:6,fill:\"#2f2418\",stroke:\"#fff\",\"stroke-width\":2},s);\n  // half brackets under the line, like on a ruler\n  const by=cy+8,w=o.line===\"r\"?14:20;\n  el(\"path\",{d:`M${x1} ${by} q0 16 ${w} 18 M${x2} ${by} q0 16 -${w} 18`,fill:\"none\",stroke:lc,\"stroke-width\":4,\"stroke-linecap\":\"round\"},s);\n  const t1=el(\"text\",{x:(x1+x2)/2,y:by+46,\"text-anchor\":\"middle\",\"font-size\":22,\"font-weight\":900,fill:lc,stroke:\"#fffdf8\",\"stroke-width\":6,\"paint-order\":\"stroke\",\"font-family\":\"var(--font)\"},s);\n  t1.textContent=o.lineLabel;\n  el(\"path\",{d:`M${cx+r*0.72} ${cy-r*0.72} L238 46`,stroke:\"var(--tomato)\",\"stroke-width\":2.5,\"stroke-dasharray\":\"6 5\"},s);\n  const t2=el(\"text\",{x:242,y:40,\"font-size\":22,\"font-weight\":900,fill:\"var(--tomato)\",\"font-family\":\"var(--font)\"},s);t2.textContent=o.circLabel;\n  const t3=el(\"text\",{x:242,y:66,\"font-size\":16,\"font-weight\":700,fill:\"var(--tomato)\",\"font-family\":\"var(--font)\"},s);t3.textContent=\"（圓周長）\";\n  return box;\n}\n// each kind: what the customer says, what the slip asks for, the right expression, three easy mix-ups and the picture\nconst KINDS2=[\n  d=>{const c=fmt(d*3.14);return{say:`我的披薩圓周長 ${c} 公分、直徑 ${d} 公分，圓周率要怎麼算？`,ask:\"圓周率\",\n    ans:`${c} ÷ ${d}`,wrong:[`${d} ÷ ${c}`,`${c} × ${d}`,`${c} − ${d}`],pic:{line:\"d\",lineLabel:`直徑 ${d} 公分`,circLabel:`${c} 公分`}};},\n  d=>({say:`我要直徑 ${d} 公分的披薩，金邊（圓周長）要怎麼算？`,ask:\"圓周長\",\n    ans:`${d} × 3.14`,wrong:[`${d} ÷ 3.14`,`${d} + 3.14`,`${d} × 2 × 3.14`],pic:{line:\"d\",lineLabel:`直徑 ${d} 公分`,circLabel:\"？ 公分\"}}),\n  d=>{const r=d/2;return{say:`我的披薩半徑 ${r} 公分，金邊（圓周長）要怎麼算？`,ask:\"圓周長\",\n    ans:`${r} × 2 × 3.14`,wrong:[`${r} × 3.14`,`${r} ÷ 2 × 3.14`,`${r} + 2 + 3.14`],pic:{line:\"r\",lineLabel:`半徑 ${r} 公分`,circLabel:\"？ 公分\"}};},\n  d=>{const c=fmt(d*3.14);return{say:`這個披薩的圓周長是 ${c} 公分，直徑要怎麼算？`,ask:\"直徑\",\n    ans:`${c} ÷ 3.14`,wrong:[`${c} × 3.14`,`3.14 ÷ ${c}`,`${c} − 3.14`],pic:{line:\"d\",lineLabel:\"直徑 ？ 公分\",circLabel:`${c} 公分`}};},\n];\nlet lastKind=-1;\n/* ---------- rounds ---------- */\nlet level=1,order=0,P=null,triedWrong=false;\nfunction newCustomer(){\n  order++;triedWrong=false;$(\"slipNo\").textContent=\"第 \"+order+\" 號\";$(\"tip\").textContent=\"\";\n  $(\"next\").classList.remove(\"ready\");\n  P=pick(PEOPLE.filter(x=>x!==P));drawCustomer(P,\"neutral\");\n  const c=$(\"customer\");c.classList.remove(\"enter\");void c.offsetWidth;c.classList.add(\"enter\");\n  level===1?round1():round2();\n}\nfunction round1(){\n  const f=pick(FORMULAS),usePi=Math.random()<0.5?\"圓周率\":\"3.14\";\n  const toks=f.map(t=>t===\"pi\"?usePi:t);\n  const blanks=toks.map((t,i)=>i).filter(i=>toks[i]!==\"=\");\n  const bi=pick(blanks),ans=toks[bi],k=kind(ans);\n  $(\"bubble\").innerHTML=`<p>${pick(LINES1)}<\/p>`;\n  const fm=$(\"formula\");fm.innerHTML=\"\";\n  toks.forEach((t,i)=>{const sp=document.createElement(\"span\");\n    if(i===bi){sp.className=\"slot\";sp.dataset.key=ans;sp.textContent=\"？\";}\n    else{sp.className=\"tok\"+(kind(t)===\"n\"?\" name\":\"\");sp.textContent=t;}\n    fm.appendChild(sp);});\n  // three wrong cards of the same kind, never another way to write the same answer\n  let pool=(k===\"o\"?OPS:k===\"n\"?NAMES:NUMS).filter(x=>x!==ans);\n  if(ans===\"圓周率\")pool=pool.filter(x=>x!==\"3.14\");\n  cards(shuffle([ans,...shuffle(pool).slice(0,3)]));\n}\nfunction round2(){\n  let ki;do{ki=Math.floor(Math.random()*KINDS2.length);}while(ki===lastKind);lastKind=ki;   // never the same kind twice in a row\n  const q=KINDS2[ki](pick([2,4,6,8,10,20]));\n  const b=$(\"bubble\");b.innerHTML=`<p>${q.say}<\/p>`;b.appendChild(pizzaPic(q.pic));\n  const fm=$(\"formula\");fm.innerHTML=\"\";\n  const a=document.createElement(\"span\");a.className=\"tok name\";a.textContent=q.ask;fm.appendChild(a);\n  const e=document.createElement(\"span\");e.className=\"tok\";e.textContent=\"＝\";fm.appendChild(e);\n  const sl=document.createElement(\"span\");sl.className=\"slot\";sl.dataset.key=q.ans;sl.textContent=\"？\";sl.style.minWidth=\"6em\";fm.appendChild(sl);\n  cards(shuffle([q.ans,...q.wrong]));\n}\nfunction cards(list){\n  const tray=$(\"tray\");tray.innerHTML=\"\";\n  list.forEach((v,i)=>{const b=document.createElement(\"div\");b.className=\"card\";b.dataset.key=v;b.id=\"card-\"+i;\n    b.setAttribute(\"role\",\"button\");b.textContent=v;b.addEventListener(\"pointerdown\",startDrag);tray.appendChild(b);});\n}\n\n/* ---------- drag ---------- */\nlet D=null;\nfunction startDrag(e){\n  if($(\"next\").classList.contains(\"ready\"))return;\n  const card=e.currentTarget,r=card. -items:start}\n@media (max-width:760px){.main{grid-template-columns:1fr}}\n.panel{background:var(--surface);border:2px solid var(--grid);border-radius:14px;padding:14px;min-width:0}\n.shop{display:grid;gap:14px}\n.scene{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}\n.customer svg{width:100%;height:auto;display:block}\n.customer.enter{animation:walkin .6s ease-out}\n@keyframes walkin{from{transform:translateX(-40px);opacity:0}}\n.bubble{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px 16px;font-size:clamp(20px,2.3vw,25px);font-weight:700;min-width:0}\n.bubble::before{content:\"\";position:absolute;left:-14px;top:26px;border:12px solid transparent;border-right-color:var(--ink);border-left:0}\n.bubble p{margin:0}\n.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;font-size:.85em;margin:0 .1em}\n.frac>span:first-child{border-bottom:.1em solid currentColor;padding:0 .15em .06em}\n.frac>span:last-child{padding-top:.06em}\n.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start}\n@media (max-width:900px){.work{grid-template-columns:1fr}}\n.pic{background:#fffef9;border:2px solid #e6dcc8;border-radius:12px;padding:6px}\n.pic svg{width:100%;height:auto;display:block;max-height:58vh}\n.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none}\n.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:12px;border:2px solid var(--grid);background:var(--surface);transition:opacity .2s,border-color .2s,background .2s}\n.step.locked{opacity:.4}\n.step.active{border:3px solid var(--kraft-dark);background:color-mix(in srgb,var(--cheese) 18%,var(--surface))}\n.step.done{border-color:var(--ok);background:var(--ok-soft)}\n.badge{width:36px;height:36px;border-radius:50%;background:var(--kraft-dark);color:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}\n.step.done .badge{background:var(--ok)}\n.line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:clamp(19px,2.1vw,24px);font-weight:900}\n.c-arc{color:var(--tomato)}.c-cut{color:var(--cut)}\n.slot{min-width:3.6em;min-height:1.7em;padding:2px 10px;border:3px dashed var(--muted);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surface);transition:background .15s,border-color .15s}\n.slot.hover{border-color:var(--kraft-dark);background:color-mix(in srgb,var(--cheese) 40%,var(--surface))}\n.slot.done{border:3px solid var(--ok);color:var(--ok);background:var(--surface);animation:pop .35s ease}\n@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}\n.hint{margin:4px 0 0;font-size:17px;font-weight:700;color:var(--muted);display:none}\nbody.show-hint .step.active .hint{display:block}   /* only the step being worked on shows its hint, so later hints never give away an earlier answer */\n.tray{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:14px;min-height:88px;padding:10px;border-radius:14px;border:2px dashed var(--grid)}\n.card{touch-action:none;user-select:none;cursor:grab;min-width:100px;padding:10px 18px;border-radius:14px;background:var(--cheese);color:#2f2418;border:3px solid #b8861f;\n  box-shadow:0 4px 0 #b8861f;font-size:clamp(24px,3vw,32px);font-weight:900;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}\n.card .c-arc{color:#b3261e}.card .c-cut{color:#1d4fa8}\n.card.expr{font-size:clamp(19px,2.1vw,25px);padding:10px 14px}\n.slot.done{white-space:nowrap}\n.card.dragging{position:fixed;z-index:20;cursor:grabbing;box-shadow:0 10px 20px rgba(0,0,0,.25);pointer-events:none}\n.card.shake{animation:shake .4s}\n@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}\n.done-msg{font-size:24px;font-weight:900;color:var(--ok);text-align:center;margin:0;min-height:1.5em}\n.hl{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .8s ease}\n.hl.on{stroke-dashoffset:0}\n.ribbon{stroke-dasharray:1;stroke-dashoffset:1}\n.ribbon.go{animation:wrapit 1.6s ease forwards}\n@keyframes wrapit{to{stroke-dashoffset:0}}\n.tower h2{margin:0;font-size:22px;font-weight:900}\n.tower .count{font-size:26px;font-weight:900;color:var(--kraft-dark);font-variant-numeric:tabular-nums}\n.tower svg{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}\n.tower .msg{margin:6px 0 0;padding:10px 12px;border-radius:10px;background:var(--ok-soft);border:2px solid var(--ok);color:var(--ok);font-weight:900;font-size:20px;text-align:center}\n.tower .row{display:flex;gap:10px;margin-top:10px}\n.tower .row button{font-size:16px;padding:6px 14px}\n.newbox{transform-box:fill-box;transform-origin:center;animation:drop .6s cubic-bezier(.3,1.5,.5,1)}\n@keyframes drop{from{transform:translateY(-80px);opacity:0}}\n.flybox{position:fixed;z-index:30;width:70px;height:22px;border-radius:4px;background:#c9955c;border:3px solid #7a4f26;pointer-events:none;transition:transform .9s cubic-bezier(.5,-0.3,.6,1),opacity .2s .8s}\n#bench{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;\n  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .5s ease}\n#bench.leaving{opacity:0}\n#bench svg{width:min(100%,760px);max-height:70vh;height:auto;display:block}\n#bench h2{margin:0;font-size:clamp(32px,5vw,52px);font-weight:900;color:#8a5a2b}\n#start{font-size:clamp(24px,3vw,32px);font-weight:900;padding:14px 44px;border-radius:999px;background:#c62f24;border-color:#8e1c16;color:#fff;box-shadow:0 5px 0 #8e1c16;animation:nudge 1.4s ease-in-out infinite}\n.shine{animation:shine 2s ease-in-out infinite}\n@keyframes shine{50%{opacity:.35}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hl,.ribbon{stroke-dashoffset:0}}\n<\/style>\n\n<div id=\"bench\">\n  <h2>披薩包裝工作台<\/h2>\n  <svg viewBox=\"0 0 760 430\" role=\"img\" aria-label=\"包裝工作台：桌上有一片披薩、一捲金色邊條、剪刀和披薩盒\">\n    <rect x=\"40\" y=\"250\" width=\"680\" height=\"34\" rx=\"8\" fill=\"#a8743f\"/>\n    <rect x=\"40\" y=\"236\" width=\"680\" height=\"22\" rx=\"8\" fill=\"#c9955c\"/>\n    <rect x=\"80\" y=\"284\" width=\"26\" height=\"130\" fill=\"#8a5a2b\"/><rect x=\"654\" y=\"284\" width=\"26\" height=\"130\" fill=\"#8a5a2b\"/>\n    <!-- cutting board with a slice -->\n    <rect x=\"250\" y=\"196\" width=\"250\" height=\"44\" rx=\"10\" fill=\"#d9b585\" stroke=\"#a8743f\" stroke-width=\"4\"/>\n    <circle cx=\"512\" cy=\"218\" r=\"12\" fill=\"none\" stroke=\"#a8743f\" stroke-width=\"5\"/>\n    <path d=\"M300 214 L460 150 A170 170 0 0 1 470 214 Z\" transform=\"translate(0,-12)\" fill=\"#f6c445\" stroke=\"#d48a3a\" stroke-width=\"7\" stroke-linejoin=\"round\"/>\n    <path d=\"M460 138 A170 170 0 0 1 470 202\" fill=\"none\" stroke=\"#d48a3a\" stroke-width=\"14\" stroke-linecap=\"round\"/>\n    <circle cx=\"400\" cy=\"186\" r=\"10\" fill=\"#b3261e\"/><circle cx=\"440\" cy=\"172\" r=\"9\" fill=\"#b3261e\"/><circle cx=\"448\" cy=\"196\" r=\"8\" fill=\"#b3261e\"/>\n    <path class=\"shine\" d=\"M296 202 L462 134 A172 172 0 0 1 472 202 Z\" fill=\"none\" stroke=\"#ffd34d\" stroke-width=\"6\" stroke-dasharray=\"14 10\" stroke-linejoin=\"round\"/>\n    <!-- ribbon roll -->\n    <ellipse cx=\"150\" cy=\"200\" rx=\"56\" ry=\"56\" fill=\"#e3a51b\" stroke=\"#b8861f\" stroke-width=\"6\"/>\n    <ellipse cx=\"150\" cy=\"200\" rx=\"20\" ry=\"20\" fill=\"#fff3c4\" stroke=\"#b8861f\" stroke-width=\"5\"/>\n    <path d=\"M190 236 Q230 240 250 226\" fill=\"none\" stroke=\"#e3a51b\" stroke-width=\"12\" stroke-linecap=\"round\"/>\n    <!-- scissors -->\n    <g transform=\"translate(570 190) rotate(-20)\">\n      <circle
