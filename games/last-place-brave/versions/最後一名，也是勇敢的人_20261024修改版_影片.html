<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>最後一名，也是勇敢的人</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{
  /* Layout: dark theater surround, 16:9 cartoon stage, subtitle strip inside the stage, chunky control deck below */
  --night:#1d2340; --deck:#272f57; --line:#3c4679; --paper:#fffaf0; --sun:#ffc83d; --coral:#ff6b57; --mint:#37c99b; --sky:#3fa9f5; --ink:#2b2036; --muted:#b5bce0;
  --f-round:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--f-body);
  background-image:radial-gradient(circle at 20% 0%,#2b3570 0,transparent 45%),radial-gradient(circle at 90% 100%,#33275e 0,transparent 40%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tag{font-family:var(--f-round);font-size:.95rem;background:var(--sun);color:var(--ink);padding:5px 14px;border-radius:999px;font-weight:700;letter-spacing:.06em}
h1{margin:0;font-family:var(--f-round);font-weight:400;font-size:clamp(1.3rem,3.2vw,1.9rem);text-wrap:balance}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:22px;overflow:hidden;background:#000;border:5px solid var(--ink);box-shadow:0 0 0 3px var(--line),0 18px 40px rgba(0,0,0,.45)}
.stage svg{display:block;width:100%;height:100%}
.sub{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);max-width:92%;display:flex;align-items:center;gap:.55em;
  background:rgba(29,22,46,.82);padding:.35em .9em .4em .4em;border-radius:999px;font-family:var(--f-round);font-size:clamp(.95rem,2.6vw,1.9rem);line-height:1.35;color:#fff}
.sub.in{animation:subin .3s cubic-bezier(.3,1.5,.5,1)}
.who{flex:none;color:var(--ink);font-size:.75em;padding:.2em .7em;border-radius:999px;font-weight:700}
#subText{min-width:0}
@keyframes subin{from{transform:translate(-50%,10px)}to{transform:translate(-50%,0)}}
.bigplay{position:absolute;inset:0;margin:auto;width:min(46%,320px);height:min(22%,110px);display:flex;align-items:center;justify-content:center;gap:.5em;
  font:inherit;font-family:var(--f-round);font-size:clamp(1.2rem,3.4vw,2.2rem);color:var(--ink);background:var(--sun);border:5px solid var(--ink);border-radius:999px;
  box-shadow:0 8px 0 var(--ink);cursor:pointer;top:62%;bottom:auto;transition:transform .12s,box-shadow .12s}
.bigplay:hover{transform:translateY(-3px);box-shadow:0 11px 0 var(--ink)}
.bigplay:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
.bigplay i{font-style:normal;font-size:.9em}
.deck{background:var(--deck);border:3px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;gap:5px;height:14px}
.seg{flex-basis:0;min-width:10px;border:0;padding:0;border-radius:7px;background:#3e4880;overflow:hidden;cursor:pointer}
.seg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--coral))}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrls .spacer{flex:1}
.btn{font:inherit;font-family:var(--f-round);font-size:1.05rem;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.main{background:var(--sun);min-width:7.5em}
.btn[aria-pressed="false"]{background:#cfd3ea}
.btn:focus-visible,.seg:focus-visible,.chap:focus-visible,.bigplay:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.chapters{display:flex;gap:8px;flex-wrap:wrap}
.chap{font:inherit;font-family:var(--f-round);font-size:.95rem;color:var(--paper);background:transparent;border:2px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:7px;cursor:pointer}
.chap span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:.85rem;font-variant-numeric:tabular-nums}
.chap.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.chap.on span{background:var(--coral);color:#fff}
.vpanel{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:16px;display:grid;gap:12px}
.vrow{display:grid;grid-template-columns:8em 1fr auto;gap:10px;align-items:center}
.vrow label{font-weight:900}
.vrow select{font:inherit;font-weight:700;border:3px solid var(--ink);border-radius:10px;padding:7px;min-width:0;width:100%;background:#fff;color:var(--ink)}
.vrow input[type=range]{width:100%;accent-color:var(--coral)}
.vnote{margin:0;color:#6b5f80;line-height:1.5}
.vnote:empty{display:none}
.tip{margin:0;color:var(--muted);font-size:.92rem;line-height:1.6}
.tip kbd{font-family:inherit;background:#3e4880;border-radius:6px;padding:1px 7px}
@media (max-width:640px){.vrow{grid-template-columns:1fr}.btn{font-size:.95rem;padding:7px 10px}.ctrls .spacer{display:none}}
.stage:fullscreen{border:0;border-radius:0;width:100vw;height:100vh;aspect-ratio:auto;display:flex;align-items:center;background:#000}
.stage:fullscreen svg{height:auto;max-height:100vh}
.stage:fullscreen .sub{font-size:2.8vw}
@media (prefers-reduced-motion:reduce){.sub.in{animation:none}.btn,.bigplay{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="tag">溝通小劇場</span><h1>最後一名，也是勇敢的人</h1></header>
  <div class="stage" id="stage">
    <svg id="svg" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="阿樂、小安和阿凱的卡通短片"></svg>
    <div class="sub" id="sub" aria-live="polite"><span class="who" id="subWho">旁白</span><span id="subText"></span></div>
    <button class="bigplay" id="bigplay"><i aria-hidden="true">▶</i><b>開始播放</b></button>
  </div>
  <div class="deck">
    <div class="bar" id="bar"></div>
    <div class="ctrls">
      <button class="btn main" id="play" aria-pressed="false">▶ 播放</button>
      <button class="btn" id="prev">⏮ 上一段</button>
      <button class="btn" id="replay">↺ 重播這段</button>
      <button class="btn" id="next">下一段 ⏭</button>
      <span class="spacer"></span>
      <button class="btn" id="voice" aria-pressed="true">語音：開</button>
      <button class="btn" id="subs" aria-pressed="true">字幕：開</button>
      <button class="btn" id="vset" aria-expanded="false" aria-controls="vpanel">語音設定</button>
      <button class="btn" id="fs">全螢幕</button>
    </div>
    <div class="chapters" id="chapters"></div>
    <div class="vpanel" id="vpanel" hidden>
      <div class="vrow"><label for="selN">旁白的聲音</label><select id="selN"></select><button class="btn" id="testN">試聽</button></div>
      <div class="vrow"><label for="selC">角色的聲音</label><select id="selC"></select><button class="btn" id="testC">試聽</button></div>
      <div class="vrow"><label for="rate">說話速度 <b id="rateLab">0.85</b></label><input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="0.85"><span></span></div>
      <p class="vnote" id="vnote"></p>
      <div><button class="btn main" id="vclose">完成</button></div>
    </div>
    <p class="tip">按 <kbd>空白鍵</kbd> 暫停或繼續，<kbd>←</kbd> <kbd>→</kbd> 換段落。暫停後再播放，會從這一句重新念。</p>
  </div>
</div>
<script>
// ===== 共用向量動畫引擎：角色、表情、漫畫特效、背景 =====
const W = 1280, H = 720, OL = '#2b2036';
const FONT = "'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const EZ = {
  lin: t => t,
  io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  back: t => { const c1 = 1.8, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  el: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI / 3)) + 1,
};
function kf(t, k) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) {
    if (t <= k[i][0]) { const [t0, v0] = k[i - 1], [t1, v1, e] = k[i]; return lerp(v0, v1, EZ[e || 'io']((t - t0) / (t1 - t0))); }
  }
  return k[k.length - 1][1];
}
const pop = (t, at, dur = .4) => t < at ? 0 : EZ.back(clamp((t - at) / dur));
const fade = (t, a, b) => clamp((t - a) / (b - a));
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const f1 = n => Math.round(n * 10) / 10;
const between = (t, a, b) => t >= a && t < b;

// ---------- 角色資料 ----------
const CH = {
  le:  { name: '阿樂', skin: '#ffd8b4', hair: '#5a3416', shirt: '#ff8a3d', pants: '#2f62d6', shoe: '#e8463c', style: 'spiky', cap: '#e63946', ph: 0, blink: .3 },
  an:  { name: '小安', skin: '#ffe2c8', hair: '#3b2240', shirt: '#ff6fa8', pants: '#7c5ce0', shoe: '#7c5ce0', style: 'pony', ph: 1.1, blink: 1.5 },
  kai: { name: '阿凱', skin: '#f3c9a1', hair: '#1f2230', shirt: '#2fbf8f', pants: '#4d5468', shoe: '#2a2f45', style: 'neat', glasses: true, ph: 2.2, blink: 2.4 },
  t:   { name: '林老師', skin: '#f5cda6', hair: '#2a2a33', shirt: '#3b6fe0', pants: '#2c4fae', shoe: '#ffffff', style: 'short', adult: true, ph: .6, blink: .9 },
};
function P(id, o) {
  return Object.assign({ id, x: 640, y: 680, s: .85, face: 1, expr: 'neutral', talk: false, lx: .25, ly: 0,
    la: [12, 0], ra: [12, 0], armsAuto: true, tilt: 0, htilt: 0, jump: 0, sx: 1, sy: 1, run: 0, walk: 0,
    fx: [], hat: id === 'le', op: 1, legs: null, palms: false, thumb: false, finger: false, belly: 1,
    red: 0, gloom: 0, mouthO: false, flag: false, sticker: false, shakeX: 0 }, o);
}

// 手臂關節位置（角色本地座標，side=1 前手，-1 後手）
function armPts(side, a1, a2) {
  const sx = side * 46, sy = -188;
  const r1 = -side * a1 * Math.PI / 180;
  const ex = sx - Math.sin(r1) * 48, ey = sy + Math.cos(r1) * 48;
  const r2 = r1 - side * a2 * Math.PI / 180;
  const hx = ex - Math.sin(r2) * 42, hy = ey + Math.cos(r2) * 42;
  return { sx, sy, ex, ey, hx, hy, r1, r2 };
}
function pose(c, T) {
  const d = CH[c.id];
  let la = c.la, ra = c.ra, legA = c.legs || [0, 0], bob = 0;
  if (c.run) {
    const ph = T * c.run * Math.PI * 2 + d.ph, sw = Math.sin(ph);
    legA = [sw * 40, -sw * 40]; bob = Math.abs(Math.cos(ph)) * 12;
    if (c.armsAuto) { la = [28 + sw * 32, -80]; ra = [28 - sw * 32, -80]; }
  } else if (c.walk) {
    const ph = T * c.walk * Math.PI * 2 + d.ph, sw = Math.sin(ph);
    legA = [sw * 22, -sw * 22]; bob = Math.abs(Math.cos(ph)) * 6;
    if (c.armsAuto) { la = [12 + sw * 16, 0]; ra = [12 - sw * 16, 0]; }
  }
  const br = Math.sin((T + d.ph) * 2.6) * .012;
  return { la, ra, legA, bob, br };
}
// 手在世界座標的位置（掛道具用）
function handWorld(c, side, T) {
  const p = c._p || pose(c, T);
  const a = side === 1 ? p.ra : p.la;
  const h = armPts(side, a[0], a[1]);
  return { x: c.x + c.shakeX + h.hx * c.s * c.face * c.sx, y: c.y - c.jump - p.bob * c.s + h.hy * c.s * c.sy };
}
function headWorld(c) { return { x: c.x + c.shakeX, y: c.y - c.jump - 290 * c.s * c.sy }; }

// ---------- 身體零件 ----------
function armSVG(side, a, d, c) {
  const p = armPts(side, a[0], a[1]);
  const sleeve = d.shirt;
  let s = `<line x1="${p.sx}" y1="${p.sy}" x2="${f1(p.ex)}" y2="${f1(p.ey)}" stroke="${OL}" stroke-width="32" stroke-linecap="round"/>
  <line x1="${f1(p.ex)}" y1="${f1(p.ey)}" x2="${f1(p.hx)}" y2="${f1(p.hy)}" stroke="${OL}" stroke-width="25" stroke-linecap="round"/>
  <line x1="${p.sx}" y1="${p.sy}" x2="${f1(p.ex)}" y2="${f1(p.ey)}" stroke="${sleeve}" stroke-width="23" stroke-linecap="round"/>
  <line x1="${f1(p.ex)}" y1="${f1(p.ey)}" x2="${f1(p.hx)}" y2="${f1(p.hy)}" stroke="${d.adult ? sleeve : d.skin}" stroke-width="16" stroke-linecap="round"/>`;
  if (d.adult) s += `<line x1="${p.sx}" y1="${p.sy}" x2="${f1(p.ex)}" y2="${f1(p.ey)}" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/>`;
  const hx = f1(p.hx), hy = f1(p.hy);
  if (c.palms) {
    const ang = p.r2 * 180 / Math.PI + 180;
    let fing = '';
    for (let i = 0; i < 4; i++) fing += `<ellipse cx="${-15 + i * 10}" cy="-26" rx="6" ry="14" fill="${d.skin}" stroke="${OL}" stroke-width="4"/>`;
    s += `<g transform="translate(${hx},${hy}) rotate(${f1(ang)})">${fing}<ellipse cx="22" cy="-6" rx="13" ry="7" transform="rotate(-35 22 -6)" fill="${d.skin}" stroke="${OL}" stroke-width="4"/><circle r="20" fill="${d.skin}" stroke="${OL}" stroke-width="4.5"/></g>`;
  } else {
    if ((c.thumb === side || c.thumb === 2)) s += `<rect x="${f1(p.hx - 6)}" y="${f1(p.hy - 34)}" width="13" height="26" rx="6.5" fill="${d.skin}" stroke="${OL}" stroke-width="4"/>`;
    if ((c.finger === side)) s += `<rect x="${f1(p.hx - 5)}" y="${f1(p.hy - 38)}" width="11" height="30" rx="5.5" fill="${d.skin}" stroke="${OL}" stroke-width="4"/>`;
    s += `<circle cx="${hx}" cy="${hy}" r="15" fill="${d.skin}" stroke="${OL}" stroke-width="4.5"/>`;
  }
  return s;
}
function legSVG(side, ang, d) {
  const col = d.adult ? d.pants : d.skin;
  return `<g transform="translate(${side * 22},-104) rotate(${f1(ang)})"><rect x="-13" y="-6" width="26" height="96" rx="12" fill="${col}" stroke="${OL}" stroke-width="4.5"/>${d.adult ? '' : `<rect x="-13" y="64" width="26" height="16" fill="#fff" stroke="${OL}" stroke-width="3.5"/>`}<ellipse cx="9" cy="94" rx="25" ry="13" fill="${d.shoe}" stroke="${OL}" stroke-width="4.5"/></g>`;
}
function hairBackSVG(d, T) {
  if (d.style !== 'pony') return '';
  const sw = Math.sin(T * 5 + d.ph) * 9;
  return `<g transform="translate(-74,-352) rotate(${f1(sw - 18)})"><path d="M0 0 C-64 8 -96 86 -52 150 C-34 104 -6 56 0 0Z" fill="${d.hair}" stroke="${OL}" stroke-width="5" stroke-linejoin="round"/></g>
  <circle cx="-74" cy="-352" r="14" fill="#ffd23f" stroke="${OL}" stroke-width="4"/>`;
}
function hairFrontSVG(d) {
  const st = `stroke="${OL}" stroke-width="5" stroke-linejoin="round"`;
  if (d.style === 'spiky') {
    const pts = [];
    for (let i = 0; i <= 10; i++) { const a = (190 + i * 16) * Math.PI / 180, R = i % 2 ? 124 : 100; pts.push([R * Math.cos(a), -290 + R * Math.sin(a)]); }
    const fr = [[92, -318], [66, -342], [40, -322], [14, -346], [-12, -326], [-38, -346], [-64, -326], [-92, -318]];
    return `<path d="M${pts.concat(fr).map(p => f1(p[0]) + ' ' + f1(p[1])).join(' L')}Z" fill="${d.hair}" ${st}/>`;
  }
  if (d.style === 'pony') {
    return `<path d="M-100 -262 C-112 -410 112 -410 100 -262 L92 -306 Q62 -322 32 -336 Q2 -318 -28 -338 Q-60 -322 -92 -306Z" fill="${d.hair}" ${st}/>
    <path d="M-98 -300 Q-114 -246 -96 -214 L-84 -262Z M98 -300 Q114 -246 96 -214 L84 -262Z" fill="${d.hair}" ${st}/>
    <g transform="translate(52,-350) rotate(20)"><path d="M0 0 L-18 -11 L-18 11Z M0 0 L18 -11 L18 11Z" fill="#ffd23f" stroke="${OL}" stroke-width="3.5"/><circle r="6" fill="#ff9f1c" stroke="${OL}" stroke-width="3"/></g>`;
  }
  if (d.style === 'neat') {
    return `<path d="M-98 -268 C-114 -408 114 -408 98 -268 L90 -318 Q46 -356 -6 -330 Q-54 -312 -92 -318Z" fill="${d.hair}" ${st}/>`;
  }
  return `<path d="M-96 -282 C-108 -402 108 -402 96 -282 L88 -326 Q0 -356 -88 -326Z" fill="${d.hair}" ${st}/>`;
}
function capSVG(d) {
  return `<path d="M-99 -306 C-104 -418 104 -418 99 -306 Q0 -324 -99 -306Z" fill="${d.cap}" stroke="${OL}" stroke-width="5" stroke-linejoin="round"/>
  <path d="M52 -312 Q150 -318 182 -288 Q124 -292 52 -300Z" fill="#b5222d" stroke="${OL}" stroke-width="5" stroke-linejoin="round"/>
  <path d="M-60 -386 Q0 -404 60 -386" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".8"/>
  <circle cx="0" cy="-404" r="9" fill="#b5222d" stroke="${OL}" stroke-width="4"/>`;
}
function hatProp(x, y, rot, sc = 1) {
  const d = CH.le;
  return `<g transform="translate(${f1(x)},${f1(y)}) rotate(${f1(rot)}) scale(${sc}) translate(0,360)">${capSVG(d)}</g>`;
}

// ---------- 表情 ----------
const BROW = { neutral: [0, 0], happy: [-.2, -6], laugh: [-.2, -8], proud: [-.4, -8], surprised: [-.2, -18], shocked: [0, -24],
  angry: [1.25, 6], determined: [.8, 2], sad: [-1, 0], teary: [-1.1, -2], cry: [-1.2, -4], worried: [-1, -4], calm: [0, -2],
  dizzy: [-.5, -6], awkward: [-.6, -2], tired: [-.5, 2], shy: [-.3, -4] };
function eyeSVG(e, cx, cy, sd, blink, T, d) {
  const ix = -sd;
  const oval = `<ellipse cx="${f1(cx)}" cy="${f1(cy)}" rx="11" ry="15" fill="${OL}"/><circle cx="${f1(cx + 3)}" cy="${f1(cy - 5)}" r="4.2" fill="#fff"/>`;
  const closedUp = `<path d="M${f1(cx - 13)} ${f1(cy + 4)} Q${f1(cx)} ${f1(cy - 15)} ${f1(cx + 13)} ${f1(cy + 4)}" fill="none" stroke="${OL}" stroke-width="6" stroke-linecap="round"/>`;
  const closedDn = `<path d="M${f1(cx - 13)} ${f1(cy)} Q${f1(cx)} ${f1(cy + 11)} ${f1(cx + 13)} ${f1(cy)}" fill="none" stroke="${OL}" stroke-width="6" stroke-linecap="round"/>`;
  const lid = (outerY, innerY) => `<path d="M${f1(cx - ix * 17)} ${f1(cy - 24)} L${f1(cx + ix * 17)} ${f1(cy - 24)} L${f1(cx + ix * 17)} ${f1(cy + innerY)} L${f1(cx - ix * 17)} ${f1(cy + outerY)}Z" fill="${d.skin}"/>`;
  if (['happy', 'laugh', 'proud', 'shy'].includes(e)) return closedUp;
  if (e === 'calm' || e === 'cry') return closedDn;
  if (e === 'awkward') return `<path d="M${f1(cx - 13)} ${f1(cy)} L${f1(cx + 13)} ${f1(cy)}" stroke="${OL}" stroke-width="6" stroke-linecap="round"/>`;
  if (e === 'dizzy') {
    let pth = ''; for (let i = 0; i <= 26; i++) { const a = i * .5 + T * 8 * sd, r = 1 + i * .55; pth += (i ? 'L' : 'M') + f1(cx + Math.cos(a) * r) + ' ' + f1(cy + Math.sin(a) * r); }

const svg = document.getElementById('svg');
const subWho = document.getElementById('subWho'), subText = document.getElementById('subText'), subBox = document.getElementById('sub');
const bigplay = document.getElementById('bigplay');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hasSpeech = 'speechSynthesis' in window;
let si = 0, bi = 0, bt = 0, st = 0, T = 0, playing = false, ended = false, S = { scroll: 0 }, lastSpeed = 0, frozenT = 0;
let speaking = false, started = false, uttId = 0, poster = true;
const opt = { voiceOn: hasSpeech, subs: true, rate: .85, vN: '', vC: '' };
try { const sv = JSON.parse(localStorage.getItem('brave-video-opt') || '{}'); Object.assign(opt, sv); if (!hasSpeech) opt.voiceOn = false; } catch (e) {}
const saveOpt = () => { try { localStorage.setItem('brave-video-opt', JSON.stringify(opt)); } catch (e) {} };

const total = SCENES.reduce((a, s) => a + s.beats.reduce((b, x) => b + x.d, 0), 0);
const cur = () => SCENES[si].beats[bi];
function speakText(text, who, onEnd) {
  if (!hasSpeech) return null;
  speechSynthesis.cancel();
  const sp = SPK[who] || SPK.N;
  const u = new SpeechSynthesisUtterance(text.replace(/（[^）]*）/g, '').replace(/——/g, '，').replace(/⋯+/g, '。'));
  const vs = zhVoices(), name = sp.role === 'n' ? opt.vN : opt.vC;
  const v = vs.find(x => x.name === name) || vs[0];
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'zh-TW';
  u.rate = opt.rate * sp.rate; u.pitch = sp.pitch;
  if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
  setTimeout(() => speechSynthesis.speak(u), 40);
  return u;
}
function zhVoices() {
  if (!hasSpeech) return [];
  const all = speechSynthesis.getVoices().filter(v => /^zh/i.test(v.lang) && !/HK|yue/i.test(v.lang));
  const score = v => (/TW|Hant/i.test(v.lang) ? 0 : 10) + (/Online|Natural|Neural/i.test(v.name) ? 0 : 2) + (v.localService ? 1 : 0);
  return all.sort((a, b) => score(a) - score(b));
}
function speakBeat() {
  started = false; speaking = false;
  if (!opt.voiceOn || !hasSpeech) return;
  const b = cur(), id = ++uttId;
  const u = speakText(b.say || b.text, b.who, () => { if (id === uttId) speaking = false; });
  if (!u) return;
  speaking = true;
  u.onstart = () => { if (id === uttId) started = true; };
}
function showSub() {
  const b = cur(), sp = SPK[b.who] || SPK.N;
  subWho.textContent = sp.name; subWho.style.background = sp.col;
  subText.textContent = b.text;
  subBox.classList.remove('in'); void subBox.offsetWidth; subBox.classList.add('in');
}
function startBeat(speak = true) {
  bt = 0; frozenT = T; showSub();
  if (playing && speak) speakBeat();
  updateUI();
}
function goScene(i, autoplay = playing) {
  poster = false;
  si = clamp(i, 0, SCENES.length - 1); bi = 0; st = 0; S = { scroll: 0 }; ended = false;
  if (hasSpeech) speechSynthesis.cancel(); uttId++; speaking = false;
  playing = autoplay; bigplay.hidden = playing;
  startBeat();
}
function nextBeat() {
  bi++;
  if (bi >= SCENES[si].beats.length) {
    if (si >= SCENES.length - 1) { bi--; playing = false; ended = true; bigplay.hidden = false; bigplay.querySelector('b').textContent = '再看一次'; updateUI(); return; }
    si++; bi = 0; st = 0; S = { scroll: 0 };
  }
  startBeat();
}
function setPlaying(p) {
  if (p && (ended || poster)) { poster = false; goScene(0, true); return; }
  playing = p; bigplay.hidden = p;
  if (!p) { if (hasSpeech) speechSynthesis.cancel(); uttId++; speaking = false; }
  else { st -= bt; bt = 0; frozenT = T; speakBeat(); }
  updateUI();
}
function isTalking() {
  const b = cur();
  if (b.noTalk) return false;
  if (opt.voiceOn && hasSpeech && playing) {
    if (speaking && (started || bt < .8)) return bt > .15;
    if (!started && bt < b.d * .8) return bt > .15;
    return false;
  }
  return bt < b.d * .75 && bt > .1;
}

  chapBox.appendChild(ch);
});

  const vb = document.getElementById('voice');
  vb.textContent = !hasSpeech ? '此瀏覽器不能念' : opt.voiceOn ? '語音：開' : '語音：關';
  vb.setAttribute('aria-pressed', opt.voiceOn); vb.disabled = !hasSpeech;
}
function updateBar() {
  [...segBox.children].forEach((seg, i) => {
    const sc = SCENES[i], dur = sc.beats.reduce((a, b) => a + b.d, 0);
    let p = 0;
    if (i < si) p = 1; else if (i === si) { const done = sc.beats.slice(0, bi).reduce((a, b) => a + b.d, 0); p = clamp((done + Math.min(bt, cur().d)) / dur); }
    seg.firstChild.style.width = (p * 100).toFixed(1) + '%';
  });
}

function transition(sc) {
  if (st > .9 || sc.tr === 'none') return '';
  const p = st / .9;
  if (sc.tr === 'wipe') {
    const cols = ['#3fa9f5', '#ff6b57', '#ffc83d'];
    return cols.map((c, i) => { const q = EZ.in(clamp((p - (2 - i) * .08) / .75)); return `<rect x="${f1(-260 + q * 1900)}" y="-60" width="1800" height="840" fill="${c}" transform="skewX(-14)"/>`; }).join('');
  }
  if (sc.tr === 'iris') { const r = EZ.out(clamp(p)) * 900; return `<path d="M-10 -10 H1290 V730 H-10Z M${f1(640 - r)} 360 a${f1(r)} ${f1(r)} 0 1 0 ${f1(2 * r)} 0 a${f1(r)} ${f1(r)} 0 1 0 ${f1(-2 * r)} 0Z" fill="#1d2340" fill-rule="evenodd"/>`; }
  if (sc.tr === 'flash') return `<rect width="1280" height="720" fill="#fff" opacity="${f1((1 - p) * 100) / 100}"/>`;
  return '';
}
function render() {
  const sc = SCENES[si], b = cur();
  const TT = b.freeze ? frozenT + Math.min(bt, .05) : T;
  const R = b.act(bt, TT, S);
  lastSpeed = R.speed || 0;
  const talk = isTalking();
  const chars = (R.chars || []).slice().sort((a, c) => a.y - c.y);
  for (const c of chars) c.talk = c.id === b.who && talk;
  const cam = R.cam || { x: 640, y: 360, z: 1 };
  let shx = 0, shy = 0;
  if (cam.shake && !reduce) { shx = (rnd(Math.floor(T * 40)) - .5) * cam.shake; shy = (rnd(Math.floor(T * 40) + 7) - .5) * cam.shake; }
  const gray = R.gray || 0;
  let out = `<defs>${DEFS}<filter id="gray"><feColorMatrix type="saturate" values="${f1((1 - gray * .85) * 100) / 100}"/></filter></defs>`;
  out += `<g transform="translate(${f1(640 + shx)},${f1(360 + shy)}) scale(${f1(cam.z * 1000) / 1000}) translate(${f1(-cam.x)},${f1(-cam.y)})" ${gray > .01 ? 'filter="url(#gray)"' : ''}>`;
  out += drawBG(R, TT, S) + (R.back || []).join('');
  for (const c of chars) out += fxBehind(c, TT);
  for (const c of chars) out += charSVG(c, TT);
  out += (R.front || []).join('');
  for (const c of chars) out += fxSVG(c, TT);
  out += `</g>` + (R.ui || []).join('') + transition(sc);
  svg.innerHTML = out;
}
let last = performance.now(), lastDraw = 0;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (playing) {
    bt += dt; st += dt; T += dt; S.scroll += lastSpeed * dt;
    const b = cur();
    const speechHold = opt.voiceOn && hasSpeech && speaking && (started || bt < b.d + 1.5) && bt < b.d + 12;
    if (bt >= b.d && !speechHold) nextBeat();
  }
  if (now - lastDraw > 22) { lastDraw = now; render(); updateBar(); }
  requestAnimationFrame(loop);
}

// 控制
playBtn.onclick = () => setPlaying(!playing);
bigplay.onclick = () => setPlaying(true);
document.getElementById('prev').onclick = () => goScene(si - 1, true);
document.getElementById('next').onclick = () => { if (si < SCENES.length - 1) goScene(si + 1, true); };
document.getElementById('replay').onclick = () => goScene(si, true);
document.getElementById('subs').onclick = () => { opt.subs = !opt.subs; saveOpt(); updateUI(); };
document.getElementById('voice').onclick = () => { opt.voiceOn = !opt.voiceOn; saveOpt(); if (!opt.voiceOn && hasSpeech) { speechSynthesis.cancel(); uttId++; speaking = false; } updateUI(); };
document.getElementById('fs').onclick = () => {
  const el = document.getElementById('stage');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
};
document.addEventListener('keydown', e => {
  if (e.target.closest('select,input')) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'ArrowRight') { if (si < SCENES.length - 1) goScene(si + 1, true); }
  if (e.key === 'ArrowLeft') goScene(si - 1, true);
});
// 語音設定
const vpanel = document.getElementById('vpanel'), vbtn = document.getElementById('vset');
const selN = document.getElementById('selN'), selC = document.getElementById('selC'), rate = document.getElementById('rate'), rateLab = document.getElementById('rateLab');
function fillVoices() {
  const vs = zhVoices();
  const html = vs.length ? vs.map(v => `<option value="${v.name}">${v.name}（${v.lang}）</option>`).join('') : '<option value="">找不到中文語音</option>';
  selN.innerHTML = html; selC.innerHTML = html;
  if (vs.length) {
    if (!vs.find(v => v.name === opt.vN)) opt.vN = vs[0].name;
    if (!vs.find(v => v.name === opt.vC)) opt.vC = (vs[1] || vs[0]).name;
    selN.value = opt.vN; selC.value = opt.vC;
  }
  document.getElementById('vnote').textContent = !hasSpeech ? '這個瀏覽器不支援朗讀，請改用 Chrome、Edge 或 Safari。' : !vs.length ? '這台裝置沒有中文語音。可以在系統設定加裝中文語音，或只看字幕。' : vs.length === 1 ? '這台裝置只有一個中文聲音，角色會用不同音高來分辨。' : '';
}
if (hasSpeech) { fillVoices(); speechSynthesis.onvoiceschanged = fillVoices; }
rate.value = opt.rate; rateLab.textContent = (+opt.rate).toFixed(2);
vbtn.onclick = () => { vpanel.hidden = !vpanel.hidden; vbtn.setAttribute('aria-expanded', !vpanel.hidden); if (hasSpeech) fillVoices(); };
document.getElementById('vclose').onclick = () => { vpanel.hidden = true; vbtn.setAttribute('aria-expanded', 'false'); };
selN.onchange = () => { opt.vN = selN.value; saveOpt(); };
selC.onchange = () => { opt.vC = selC.value; saveOpt(); };
rate.oninput = () => { opt.rate = +rate.value; rateLab.textContent = opt.rate.toFixed(2); saveOpt(); };
document.getElementById('testN').onclick = () => speakText('大家好，我是旁白。', 'N');
document.getElementById('testC').onclick = () => speakText('我一定要拿第一名！', 'le');

// 初始畫面：停在片名
window.__seek = (s, b, t) => { si = s; bi = b; bt = t; st = t; frozenT = T; showSub(); render(); };
si = 0; bi = 1; bt = 1.5; st = 1.5; T = 3; showSub(); updateUI();
requestAnimationFrame(loop);

</script>
