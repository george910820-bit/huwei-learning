<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>勇敢四步驟挑戰題</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{
  /* Layout: cartoon scene on the left (top on phones), chunky question card on the right, same theater palette as the video */
  --night:#1d2340; --deck:#272f57; --line:#3c4679; --paper:#fffaf0; --soft:#f3ead8; --sun:#ffc83d; --coral:#ff6b57; --mint:#2fbf8f; --sky:#3fa9f5; --pink:#ff6fa8; --ink:#2b2036; --muted:#6b5f80;
  --f-round:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px;
  background-image:radial-gradient(circle at 15% 0%,#2b3570 0,transparent 45%),radial-gradient(circle at 90% 100%,#33275e 0,transparent 40%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-round);font-size:1.05rem;background:var(--sun);color:var(--ink);padding:6px 16px;border-radius:999px;letter-spacing:.05em}
.prog{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#count{font-family:var(--f-round);color:#dfe3f7;font-variant-numeric:tabular-nums}
#dots{display:flex;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--deck);border:3px solid #8790c4}
.dot.done{background:var(--mint);border-color:var(--paper)} .dot.now{background:var(--sun);border-color:var(--paper);transform:scale(1.25)}
.tool{font:inherit;font-family:var(--f-round);font-size:.95rem;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer;box-shadow:0 3px 0 #0d1024}
.tool[aria-pressed="false"]{background:#cfd3ea}
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);aspect-ratio:16/9;max-width:100%;border:5px solid var(--ink);border-radius:24px;overflow:hidden;background:#000;box-shadow:0 0 0 3px var(--line),0 16px 34px rgba(0,0,0,.4)}
.stage svg{display:block;width:100%;height:100%}
@media (max-width:880px){.main{grid-template-columns:1fr}.stage{position:relative;top:0}}
#panel{background:var(--paper);border:5px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 #0d1024;padding:22px clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:16px;min-width:0}
.qrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.qt{margin:0;font-family:var(--f-round);font-weight:400;font-size:clamp(1.35rem,3vw,1.9rem);line-height:1.45;text-wrap:balance;min-width:0}
h1.qt{color:var(--ink)}
.qt .sent{border-radius:6px;transition:background .2s}
.qt .sent.reading{background:linear-gradient(transparent 52%,#ffe066 52%)}
.speak{flex:none;width:56px;height:56px;border-radius:50%;border:4px solid var(--ink);background:var(--sun);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center}
.speak.on{background:var(--coral);color:#fff;animation:pulse 1s ease-in-out infinite}
.nospeech .speak{display:none}
@keyframes pulse{50%{transform:scale(1.08)}}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rules li{display:flex;align-items:center;gap:12px;font-size:1.15rem;background:var(--soft);border-radius:16px;padding:10px 14px}
.n{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-round);font-weight:400;border:3px solid var(--ink)}
.s1{background:var(--coral)}.s2{background:var(--sky)}.s3{background:var(--mint)}
.namerow{display:grid;gap:6px;font-weight:700;font-size:1.05rem}
.namerow input{font:inherit;font-size:1.25rem;border:4px solid var(--ink);border-radius:14px;padding:10px 14px;background:#fff;color:var(--ink);min-width:0;width:100%}
.opts{display:grid;gap:12px}
.opts.yn{grid-template-columns:1fr 1fr}
.opts.feel{grid-template-columns:1fr 1fr}
.opts.feel.txt .opt{font-size:clamp(1rem,2.3vw,1.2rem);min-height:96px;padding:14px 12px}
.opts.ord{grid-template-columns:1fr 1fr}
.opt{font:inherit;font-family:var(--f-round);font-size:clamp(1.15rem,2.6vw,1.45rem);color:var(--ink);text-align:left;display:flex;align-items:center;gap:14px;min-width:0;position:relative;
  background:#fff;border:4px solid var(--ink);border-radius:20px;padding:14px 18px;cursor:pointer;box-shadow:0 6px 0 var(--ink);
  transition:transform .12s,box-shadow .12s,background .2s,opacity .2s;animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
.opt .ot{min-width:0}
.opt:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--ink)}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.opt:focus-visible,.big:focus-visible,.tool:focus-visible,.speak:focus-visible,.namerow input:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.badge{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;border:3px solid var(--ink)}
.c0 .badge{background:var(--coral)}.c1 .badge{background:var(--sky)}.c2 .badge{background:var(--pink)}
.yn .opt{justify-content:center;font-size:clamp(1.5rem,3.6vw,2rem);padding:18px 10px}
.yn-ic{font-size:1.3em;line-height:1;font-weight:900}.yn-ic.ok{color:var(--mint)}.yn-ic.no{color:#e63946}
.feel .opt{flex-direction:column;justify-content:center;gap:6px;padding:12px 8px;text-align:center}
.tick{position:absolute;top:8px;right:10px;width:30px;height:30px;border-radius:50%;background:var(--mint);color:#fff;display:none;place-items:center;font-size:1rem;border:3px solid var(--ink)}
.opt.picked{background:#fff3c4;outline:5px solid var(--sun);outline-offset:2px}
.opt.picked .tick{display:grid}
.tile{justify-content:center;background:color-mix(in srgb,var(--c) 22%,#fff);font-size:clamp(1.4rem,3.2vw,1.8rem)}
.slots{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:8px}
.slot{border:4px dashed #b9aecb;border-radius:16px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center}
.sl{font-size:.9rem;color:var(--muted);font-weight:700}
.sv{font-family:var(--f-round);font-size:clamp(1rem,2.4vw,1.3rem);min-height:1.4em}
.slot.filled{border-style:solid;border-color:var(--ink);background:var(--c);animation:boing .5s cubic-bezier(.3,1.8,.5,1)}
.slot.filled .sl,.slot.filled .sv{color:#fff}
.opt.used{opacity:.3;transform:scale(.94);pointer-events:none;box-shadow:0 2px 0 var(--ink)}
.opt.right{background:#c9f7d8;border-color:#1f8a50;animation:boing .6s cubic-bezier(.3,1.8,.5,1)}
.opt.wrongb{background:#ffe1e1}
.opt.dim{opacity:.4}
.opt.reading{background:#fff3b0;outline:5px solid var(--coral);outline-offset:3px}
.opt.shake{animation:shake .45s}
.fb{display:none;border-radius:18px;padding:14px 18px;font-size:1.2rem;line-height:1.6;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fb.show{display:flex;animation:slideup .35s cubic-bezier(.3,1.5,.5,1)}
.fb p{margin:0;min-width:0;flex:1 1 240px}
.fb p.reading{background:linear-gradient(transparent 55%,#ffe066 55%)}
.fb.good{background:#d8f5e3;border:3px dashed #1f8a50}
.fb.try{background:#fff0d6;border:3px dashed #ff9f1c}
.big{font:inherit;font-family:var(--f-round);font-size:1.3rem;border:4px solid var(--ink);border-radius:999px;padding:12px 28px;cursor:pointer;background:var(--coral);color:#fff;box-shadow:0 6px 0 var(--ink);align-self:flex-start;transition:transform .12s,box-shadow .12s}
.big:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--ink)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.big.ghost{background:var(--paper);color:var(--ink)}
.big:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 6px 0 var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span{background:var(--soft);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.95rem}
.stars{display:flex;gap:4px;flex-wrap:wrap}
.star{font-size:2rem;color:#d9d2e3;line-height:1}
.star.on{color:var(--sun);-webkit-text-stroke:2px var(--ink)}
.report{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.report li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:8px 12px;font-size:1.05rem}
.report .no{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.9rem;font-variant-numeric:tabular-nums}
.res{font-weight:900;font-size:.95rem;padding:4px 10px;border-radius:999px;white-space:nowrap}
.res.one{background:#c9f7d8;color:#14663b}.res.more{background:#ffe1c2;color:#8a4a00}
.note{margin:0;color:var(--muted);font-size:.95rem}
.endbtns{display:flex;gap:12px;flex-wrap:wrap}
.vpanel{background:var(--paper);border:4px solid var(--ink);border-radius:20px;padding:16px 18px;display:grid;gap:12px}
.vrow{display:grid;grid-template-columns:8em 1fr;gap:10px;align-items:center}
.vrow label{font-weight:900}
.vrow select{font:inherit;font-weight:700;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;min-width:0;width:100%}
.vrow input[type=range]{width:100%;accent-color:var(--coral)}
.chk{display:flex;gap:8px;align-items:center;font-weight:700}
.chk input{width:22px;height:22px;accent-color:var(--coral)}
.vnote{margin:0;color:var(--muted);line-height:1.5}.vnote:empty{display:none}
.vbtns{display:flex;gap:10px;flex-wrap:wrap}
#wipe{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
#wipe i{position:absolute;top:-10%;bottom:-10%;width:160%;left:-260%;transform:skewX(-12deg);visibility:hidden}
#wipe.go i{visibility:visible;animation:wipe .7s cubic-bezier(.65,0,.35,1) forwards}
#wipe i:nth-child(1){background:var(--coral)}#wipe i:nth-child(2){background:var(--sun);animation-delay:.06s}#wipe i:nth-child(3){background:var(--sky);animation-delay:.12s}
@keyframes wipe{0%{left:-260%}100%{left:200%}}
@keyframes popin{0%{transform:scale(.7)}100%{transform:scale(1)}}
@keyframes boing{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes slideup{0%{transform:translateY(14px)}100%{transform:translateY(0)}}
@media (max-width:520px){.opts.feel,.opts.ord{grid-template-columns:1fr 1fr}.slots{grid-template-columns:1fr 1fr}.vrow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#wipe{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="brand">虎尾小劇場・勇敢四步驟挑戰題</span>
    <div class="prog"><span id="count"></span><div id="dots" aria-hidden="true"></div>
      <button class="tool" id="vbtn" aria-expanded="false" aria-controls="vpanel">語音設定</button><button class="tool" id="sound" aria-pressed="true">音效：開</button></div></header>
  <div class="vpanel" id="vpanel" hidden>
    <div class="vrow"><label for="voice">念題目的聲音</label><select id="voice"></select></div>
    <div class="vrow"><label for="rate">說話速度 <b id="rateLab">0.85</b></label><input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="0.85"></div>
    <label class="chk" for="auto"><input type="checkbox" id="auto" checked>每一題自動念題目</label>
    <p class="vnote" id="vnote"></p>
    <div class="vbtns"><button class="tool" id="vtest">試聽</button><button class="tool" id="vclose">完成</button></div>
  </div>
  <div class="main">
    <div class="stage"><svg id="scene" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="題目的情境插圖"></svg></div>
    <section id="panel" aria-live="polite"></section>
  </div>
</div>
<div id="wipe" aria-hidden="true"><i></i><i></i><i></i></div>
<script>
// ===== 共用向量動畫引擎：角色、表情、漫畫特效、背景 =====
const W = 1280, H = 720, OL = '#2b2036';
const FONT = "'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const EZ = {
  lin: t => t,
  io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  back: t => { const c1 = 1.8, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  el: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI / 3)) + 1,
};
function kf(t, k) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) {
    if (t <= k[i][0]) { const [t0, v0] = k[i - 1], [t1, v1, e] = k[i]; return lerp(v0, v1, EZ[e || 'io']((t - t0) / (t1 - t0))); }
  }
  return k[k.length - 1][1];
}
const pop = (t, at, dur = .4) => t < at ? 0 : EZ.back(clamp((t - at) / dur));
const fade = (t, a, b) => clamp((t - a) / (b - a));
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const f1 = n => Math.round(n * 10) / 10;
const between = (t, a, b) => t >= a && t < b;

// ---------- 角色資料 ----------
const CH = {
  le:  { name: '阿樂', skin: '#ffd8b4', hair: '#5a3416', shirt: '#ff8a3d', pants: '#2f62d6', shoe: '#e8463c', style: 'spiky', cap: '#e63946', ph: 0, blink: .3 },
  an:  { name: '小安', skin: '#ffe2c8', hair: '#3b2240', shirt: '#ff6fa8', pants: '#7c5ce0', shoe: '#7c5ce0', style: 'pony', ph: 1.1, blink: 1.5 },
  kai: { name: '阿凱', skin: '#f3c9a1', hair: '#1f2230', shirt: '#2fbf8f', pants: '#4d5468', shoe: '#2a2f45', style: 'neat', glasses: true, ph: 2.2, blink: 2.4 },
  t:   { name: '林老師', skin: '#f5cda6', hair: '#2a2a33', shirt: '#3b6fe0', pants: '#2c4fae', shoe: '#ffffff', style: 'short', adult: true, coach: true, ph: .6, blink: .9 },
  mom: { name: '媽媽', skin: '#ffdcc0', hair: '#4a2a20', shirt: '#9b7bff', pants: '#5b4bb0', shoe: '#3a2f5a', style: 'bun', adult: true, skirt: '#5b4bb0', ph: 1.7, blink: 2.0 },
  dad: { name: '爸爸', skin: '#f0c39a', hair: '#26242e', shirt: '#4f8fd8', pants: '#3d4252', shoe: '#2a2f45', style: 'dad', adult: true, mustache: true, ph: .4, blink: 1.2 },
};
function P(id, o) {
  return Object.assign({ id, x: 640, y: 680, s: .85, face: 1, expr: 'neutral', talk: false, lx: .25, ly: 0,
    la: [12, 0], ra: [12, 0], armsAuto: true, tilt: 0, htilt: 0, jump: 0, sx: 1, sy: 1, run: 0, walk: 0,
    fx: [], hat: id === 'le', op: 1, legs: null, palms: false, thumb: false, finger: false, belly: 1,
    red: 0, gloom: 0, mouthO: false, flag: false, sticker: false, shakeX: 0 }, o);
}

// 手臂關節位置（角色本地座標，side=1 前手，-1 後手）
function armPts(side, a1, a2) {
  const sx = side * 46, sy = -188;
  const r1 = -side * a1 * Math.PI / 180;
  const ex = sx - Math.sin(r1) * 48, ey = sy + Math.cos(r1) * 48;
  const r2 = r1 - side * a2 * Math.PI / 180;
  const hx = ex - Math.sin(r2) * 42, hy = ey + Math.cos(r2) * 42;
  return { sx, sy, ex, ey, hx, hy, r1, r2 };
}
function pose(c, T) {
  const d = CH[c.id];
  let la = c.la, ra = c.ra, legA = c.legs || [0, 0], bob = 0;
  if (c.run) {
    const ph = T * c.run * Math.PI * 2 + d.ph, sw = Math.sin(ph);
    legA = [sw * 40, -sw * 40]; bob = Math.abs(Math.cos(ph)) * 12;
    if (c.armsAuto) { la = [28 + sw * 32, -80]; ra = [28 - sw * 32, -80]; }
  } else if (c.walk) {
    const ph = T * c.walk * Math.PI * 2 + d.ph, sw = Math.sin(ph);
    legA = [sw * 22, -sw * 22]; bob = Math.abs(Math.cos(ph)) * 6;
    if (c.armsAuto) { la = [12 + sw * 16, 0]; ra = [12 - sw * 16, 0]; }
  }
  const br = Math.sin((T + d.ph) * 2.6) * .012;
  return { la, ra, legA, bob, br };
}
// 手在世界座標的位置（掛道具用）
function handWorld(c, side, T) {
  const p = c._p || pose(c, T);
  const a = side === 1 ? p.ra : p.la;
  const h = armPts(side, a[0], a[1]);
  return { x: c.x + c.shakeX + h.hx * c.s * c.face * c.sx, y: c.y - c.jump - p.bob * c.s + h.hy * c.s * c.sy };
}
function headWorld(c) { return { x: c.x + c.shakeX, y: c.y - c.jump - 290 * c.s * c.sy }; }

// ---------- 身體零件 ----------
function armSVG(side, a, d, c) {
  const p = armPts(side, a[0], a[1]);
  const sleeve = d.shirt;
  let s = `<line x1="${p.sx}" y1="${p.sy}" x2="${f1(p.ex)}" y2="${f1(p.ey)}" stroke="${OL}" stroke-width="32" stroke-linecap="round"/>
  <line x1="${f1(p.ex)}" y1="${f1(p.ey)}" x2="${f1(p.hx)}" y2="${f1(p.hy)}" stroke="${OL}" stroke-width="25" stroke-linecap="round"/>
  <line x1="${p.sx}" y1="${p.sy}" x2="${f1(p.ex)}" y2="${f1(p.ey)}" stroke="${sleeve}" stroke-width="23" stroke-linecap="round"/>
  <line x1="${f1(p.ex)}" y1="${f1(p.ey)}" x2="${f1(p.hx)}" y2="${f1(p.hy)}" stroke="${d.adult ? sleeve : d.skin}" stroke-width="16" stroke-linecap="round"/>`;
  if (d.coach) s += `<line x1="${p.sx}" y1="${p.sy}" x2="${f1(p.ex)}" y2="${f1(p.ey)}" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/>`;
  const hx = f1(p.hx), hy = f1(p.hy);
  if (c.palms) {
    const ang = p.r2 * 180 / Math.PI + 180;
    let fing = '';
    for (let i = 0; i < 4; i++) fing += `<ellipse cx="${-15 + i * 10}" cy="-26" rx="6" ry="14" fill="${d.skin}" stroke="${OL}" stroke-width="4"/>`;
    s += `<g transform="translate(${hx},${hy}) rotate(${f1(ang)})">${fing}<ellipse cx="22" cy="-6" rx="13" ry="7" transform="rotate(-35 22 -6)" fill="${d.skin}" stroke="${OL}" stroke-width="4"/><circle r="20" fill="${d.skin}" stroke="${OL}" stroke-width="4.5"/></g>`;
  } else {
    if ((c.thumb === side || c.thumb === 2)) s += `<rect x="${f1(p.hx - 6)}" y="${f1(p.hy - 34)}" width="13" height="26" rx="6.5" fill="${d.skin}" stroke="${OL}" stroke-width="4"/>`;
    if ((c.finger === side)) s += `<rect x="${f1(p.hx - 5)}" y="${f1(p.hy - 38)}" width="11" height="30" rx="5.5" fill="${d.skin}" stroke="${OL}" stroke-width="4"/>`;
    s += `<circle cx="${hx}" cy="${hy}" r="15" fill="${d.skin}" stroke="${OL}" stroke-width="4.5"/>`;

function zhVoices() {
  if (!hasSpeech) return [];
  const all = speechSynthesis.getVoices().filter(v => /^zh/i.test(v.lang) && !/HK|yue/i.test(v.lang));
  const score = v => (/TW|Hant/i.test(v.lang) ? 0 : 10) + (/Online|Natural|Neural/i.test(v.name) ? 0 : 2);
  return all.sort((a, b) => score(a) - score(b));
}

function readSeq(items, btn) {
  if (!hasSpeech) return;

  if (btn) btn.classList.add('on');
  const step = k => {
    if (id !== readId) return;
    document.querySelectorAll('.reading').forEach(e => e.classList.remove('reading'));
    if (k >= items.length) { if (btn) btn.classList.remove('on'); return; }
    const it = items[k];

}

      } else {
        tries[order[st.i]]++;
        b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 450);
        st.fb = 'no'; st.ft = 0; st.ftStart = T; beep('no');
        showFb(false, q.no);
      }
    });
  }
}
function showFb(good, text) {
  const fb = document.getElementById('fb');
  fb.className = 'fb show ' + (good ? 'good' : 'try');
  fb.innerHTML = `<p>${text}</p>${good ? `<button class="big" id="nextQ">${st.i === order.length - 1 ? '看成績' : '下一題'}</button>` : ''}`;
  if (good) { const nb = document.getElementById('nextQ'); nb.onclick = () => { beep('tap'); wipe(() => showQ(st.i + 1)); }; setTimeout(() => nb.focus({ preventScroll: true }), 50); }
  readSeq([{ el: fb.querySelector('p'), text }]);
}
function answer(good, b, btns) {
  const qi = order[st.i], q = Q[qi];
  if (st.fb === 'ok') return;
  if (q.type !== 'order') tries[qi]++;
  if (q.type === 'order' && good) tries[qi]++;
  if (firstOk[qi] === null) firstOk[qi] = good && tries[qi] === 1;
  st.fb = good ? 'ok' : 'no'; st.ftStart = T;
  beep(good ? 'ok' : 'no');
  if (b) {
    if (good) { b.classList.add('right'); btns.forEach(x => { if (x !== b) x.classList.add('dim'); }); }
    else { b.classList.add('shake', 'wrongb'); setTimeout(() => { b.classList.remove('shake'); b.classList.add('used'); }, 450); }
  }
  showFb(good, good ? q.ok : q.no);
}
function showEnd() {
  st.i = order.length; st.t0 = T; st.fb = null;
  document.getElementById('count').textContent = '完成！';
  document.getElementById('dots').innerHTML = order.map(() => '<span class="dot done"></span>').join('');
  const n1 = order.filter(i => tries[i] === 1).length;
  const d = new Date(), date = `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
  const rows = order.map((i, k) => `<li><span class="no">${k + 1}</span><span class="qs">${Q[i].short}</span>${tries[i] === 1 ? '<span class="res one">一次就答對</span>' : `<span class="res more">試了 ${tries[i]} 次</span>`}</li>`).join('');
  const wrong = order.filter(i => tries[i] > 1);
  panel.innerHTML = `<div class="qrow"><h2 class="qt" id="qt"><span class="sent">${name ? name + '，' : ''}你完成挑戰了！</span><span class="sent">一次就答對 ${n1} 題，共 ${order.length} 題。</span></h2><button class="speak" id="spk" aria-label="念成績">${SPEAKER}</button></div>
  <div class="meta"><span>${name ? '名字：' + name : '名字：（沒有填）'}</span><span>日期：${date}</span><span>主題：${META.skill}</span></div>
  <div class="stars" aria-label="一次答對 ${n1} 題">${order.map((i) => `<span class="star ${tries[i] === 1 ? 'on' : ''}">★</span>`).join('')}</div>
  <ol class="report">${rows}</ol>
  <p class="note">老師可以截圖這一頁，當作評量紀錄。</p>
  <div class="endbtns">${wrong.length ? `<button class="big" id="redo">再練習答錯的 ${wrong.length} 題</button>` : ''}<button class="big ghost" id="again">全部重新挑戰</button></div>`;
  const sents = [...panel.querySelectorAll('#qt .sent')];
  document.getElementById('spk').onclick = e => readSeq(sents.map(el => ({ el, text: el.textContent })), e.currentTarget);
  readSeq(sents.map(el => ({ el, text: el.textContent })), document.getElementById('spk'));
  document.getElementById('again').onclick = () => { beep('tap'); start(null); };
  if (wrong.length) document.getElementById('redo').onclick = () => { beep('tap'); start(wrong); };
}
// feedback timer for scene overlay
setInterval(() => { if (st.fb) st.ft = T - (st.ftStart || T); }, 30);

// ---------- 設定 ----------
const vpanel = document.getElementById('vpanel'), vbtn = document.getElementById('vbtn');
const sel = document.getElementById('voice'), rate = document.getElementById('rate'), rateLab = document.getElementById('rateLab');
function fillVoices() {
  const vs = zhVoices();
  sel.innerHTML = vs.length ? vs.map(v => `<option value="${v.name}">${v.name}（${v.lang}）</option>`).join('') : '<option value="">找不到中文語音</option>';
  if (vs.length) { if (!vs.find(v => v.name === opt.voice)) opt.voice = vs[0].name; sel.value = opt.voice; }
  document.getElementById('vnote').textContent = !vs.length ? '這台裝置沒有中文語音，可以在系統設定加裝中文語音。' : '';
}
if (hasSpeech) { fillVoices(); speechSynthesis.onvoiceschanged = fillVoices; }
rate.value = opt.rate; rateLab.textContent = (+opt.rate).toFixed(2);
document.getElementById('auto').checked = opt.auto;
const sndBtn = document.getElementById('sound');
const sndUI = () => { sndBtn.textContent = opt.snd ? '音效：開' : '音效：關'; sndBtn.setAttribute('aria-pressed', opt.snd); };
sndUI();
sndBtn.onclick = () => { opt.snd = !opt.snd; saveOpt(); sndUI(); };
vbtn.onclick = () => { vpanel.hidden = !vpanel.hidden; vbtn.setAttribute('aria-expanded', !vpanel.hidden); if (hasSpeech) fillVoices(); };
document.getElementById('vclose').onclick = () => { vpanel.hidden = true; vbtn.setAttribute('aria-expanded', 'false'); };
sel.onchange = () => { opt.voice = sel.value; saveOpt(); };
rate.oninput = () => { opt.rate = +rate.value; rateLab.textContent = opt.rate.toFixed(2); saveOpt(); };
document.getElementById('auto').onchange = e => { opt.auto = e.target.checked; saveOpt(); };
document.getElementById('vtest').onclick = () => readSeq([{ text: '大家好，我們一起來挑戰！' }]);

window.__goto = k => { if (k < 0) showStart(); else showQ(k); };
showStart();
requestAnimationFrame(loop);


</script>
