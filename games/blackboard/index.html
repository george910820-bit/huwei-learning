<title>課堂小黑板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&display=swap">
<style>
/* Layout: one classroom board in a wooden frame filling the screen, with the chalk tray along the bottom holding every tool.
   Single look on purpose (wood + board), so every color is set here and does not follow the light/dark setting. */
:root{
  --wall:#3a3129; --wood:#9a6a3c; --wood-dark:#6e4723; --wood-light:#c08a55; --tray:#7b5230;
  --chalk:#f4f1e8; --btn:#f6ecd9; --btn-ink:#3b2a1a; --on:#ffd84d; --focus:#6aa8ff;
  --font:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--wall);color:var(--chalk);font-family:var(--font);font-size:16px;overflow:hidden}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;gap:0;padding-block:10px 8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));box-sizing:border-box}
.frame{flex:1;min-height:0;position:relative;border-radius:10px;padding:14px;background:linear-gradient(135deg,var(--wood-light),var(--wood) 40%,var(--wood-dark));box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.35)}
.holder{position:absolute;inset:14px;display:flex;align-items:center;justify-content:center}
.board{position:relative;box-shadow:inset 0 0 0 3px rgba(0,0,0,.35)}
.board canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
.tray{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:8px 10px;margin-top:-2px;border-radius:0 0 10px 10px;
  background:linear-gradient(var(--tray),#5c3b20);box-shadow:inset 0 3px 4px rgba(0,0,0,.35)}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.tray button{font:inherit;font-size:16px;font-weight:700;cursor:pointer;border:0;border-radius:8px;padding:7px 8px;background:var(--btn);color:var(--btn-ink);
  box-shadow:0 2px 0 rgba(0,0,0,.35);display:inline-flex;align-items:center;gap:5px;line-height:1.1}
.tray button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.tray button[aria-pressed="true"]{background:var(--on);box-shadow:inset 0 2px 0 rgba(0,0,0,.25)}
.tray button:disabled{opacity:.45;cursor:default}
.tray svg{width:20px;height:20px;flex:none}
@media (max-width:1500px){.tray button{font-size:15px;padding:7px 6px;gap:4px}.tray svg{width:18px;height:18px}.tray button .car{margin-left:-2px}.tray button .dot{width:14px;height:14px}}
@media (max-width:1340px){.tray{gap:6px 8px;padding:8px 6px}.tray .grp{gap:4px}.tray button{font-size:14px;padding:6px 5px;gap:3px}.tray svg{width:16px;height:16px}}
.sw{width:30px;height:30px;padding:0!important;border-radius:50%!important;border:3px solid rgba(0,0,0,.25)!important}
.sw[aria-pressed="true"]{outline:3px solid var(--on);outline-offset:2px}
.sz{width:34px;height:34px;padding:0!important;justify-content:center}
.sz i{display:block;border-radius:50%;background:var(--btn-ink)}
.page{font-weight:900;font-variant-numeric:tabular-nums;min-width:3.4em;text-align:center;color:var(--chalk)}
.tray button .dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,.3)}
.tray button .car{font-size:11px;opacity:.7;margin-left:1px}
.pop{position:absolute;bottom:calc(100% + 10px);z-index:20;background:#fbf4e6;color:var(--btn-ink);border-radius:14px;padding:12px 14px;box-shadow:0 10px 24px rgba(0,0,0,.4);
  display:grid;gap:10px;min-width:220px;max-width:min(600px,calc(100vw - 40px));max-height:calc(100vh - 120px);overflow:auto}
.pop .lib{flex-direction:column;gap:2px;padding:6px 6px;min-width:66px;font-size:13px}
.pop .lib svg{width:34px;height:34px}
.pop .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:min(560px,calc(100vw - 70px))}
.pop .thumb{flex-direction:column;gap:4px;padding:6px;font-size:14px}
.pop .thumb canvas{width:100%;border-radius:6px;display:block;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pop input[type=text]{width:180px;height:auto;font:inherit;font-size:15px;padding:6px 8px;border-radius:8px;border:2px solid #d9c6a3;background:#fff;color:#3b2a1a;accent-color:auto}
.pop .warn[data-armed="1"]{background:#e2574c;color:#fff}
.restore{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:7;display:flex;gap:8px;align-items:center;background:#fbf4e6;color:var(--btn-ink);
  padding:8px 10px 8px 16px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.4);font-weight:700}
.restore button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;background:#efe2c9;color:var(--btn-ink)}
.restore button.yes{background:var(--on)}
.pop::after{content:"";position:absolute;top:100%;left:var(--arrow,30px);border:9px solid transparent;border-top-color:#fbf4e6}
.pop h3{margin:0;font-size:14px;color:#8a6a46;letter-spacing:.04em}
.pop .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pop button{font:inherit;font-size:16px;font-weight:700;cursor:pointer;border:2px solid transparent;border-radius:10px;padding:7px 12px;background:#efe2c9;color:var(--btn-ink);display:inline-flex;align-items:center;gap:6px}
.pop button[aria-pressed="true"]{background:var(--on);border-color:#c79b00}
.pop button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pop svg{width:20px;height:20px}
.pop .sw{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid rgba(0,0,0,.2)}
.pop .sw[aria-pressed="true"]{outline:3px solid #c79b00;outline-offset:2px;border-color:rgba(0,0,0,.2)}
.pop .sz{flex-direction:column;gap:4px;min-width:54px;justify-content:center}
.pop .sz i{display:block;border-radius:50%;background:var(--btn-ink)}
.pop label{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;cursor:pointer}
.pop input{width:18px;height:18px;accent-color:#c79b00}
.toggle{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:700;color:var(--chalk);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--on)}
#danger[data-armed="1"]{background:#e2574c;color:#fff}
.toast{position:absolute;left:50%;top:22px;transform:translateX(-50%);background:rgba(20,15,10,.85);color:#fff;padding:8px 16px;border-radius:999px;font-size:16px;font-weight:700;pointer-events:none;transition:opacity .3s}
.toast.off{opacity:0}
.textin{position:absolute;z-index:5;min-width:120px;background:rgba(255,255,255,.08);border:2px dashed var(--on);border-radius:6px;outline:none;resize:none;overflow:hidden;
  font-family:var(--font);font-weight:700;line-height:1.25;padding:2px 4px;white-space:pre}
.imgbar{position:absolute;z-index:6;display:flex;gap:6px;background:#fbf4e6;border-radius:10px;padding:5px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.imgbar button{font:inherit;font-size:15px;font-weight:700;cursor:pointer;border:0;border-radius:8px;padding:6px 10px;background:#efe2c9;color:var(--btn-ink);display:inline-flex;align-items:center;gap:5px}
.imgbar button[aria-pressed="true"]{background:var(--on)}
.imgbar{align-items:center;flex-wrap:wrap;max-width:calc(100% - 8px)}
.imgbar .rng{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--btn-ink);padding:0 6px}
.imgbar .rng input{width:150px;accent-color:#c79b00}
.imgbar button.ok{background:var(--on)}
.imgbar.cutting{flex-direction:column;align-items:stretch;gap:6px;padding:8px}
.imgbar .ln{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.imgbar .ln b{font-size:14px;color:#8a6a46;min-width:76px}
.imgbar .ln:last-child{justify-content:flex-end}
.imgbar .sizes{display:inline-flex;gap:4px}.imgbar .sizes[hidden]{display:none}
.imgbar button:disabled{opacity:.45;cursor:default}
.imgbar svg{width:18px;height:18px}
.pop p.tip{margin:0;font-size:14px;line-height:1.5;color:#6b5236;max-width:330px}
.pop kbd{font:inherit;font-weight:700;background:#efe2c9;border-radius:5px;padding:0 5px}
.hint{position:absolute;right:22px;bottom:20px;font-size:14px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <div class="frame">
    <div class="holder" id="holder">
      <div class="board" id="board">
        <div class="imgbar" id="imgbar" hidden></div><input type="file" id="fileIn" accept="image/*" hidden><input type="file" id="lessonIn" accept=".json,application/json" hidden>
        <canvas id="bg"></canvas><canvas id="pic"></canvas><canvas id="ink"></canvas><canvas id="ov" aria-label="黑板：用滑鼠或觸控筆在上面寫字畫圖"></canvas>
        <div class="toast off" id="toast" aria-live="polite"></div>
        <div class="hint" id="hint" hidden></div>
      </div>
    </div>
  </div>
  <div class="tray" role="toolbar" aria-label="黑板工具">
    <div class="grp" id="main"></div>
    <div class="grp"><button id="prev" aria-label="上一頁">◀</button><button class="page" id="pageNo" title="看所有頁面、存課程">1 / 1</button><button id="nextP" aria-label="下一頁">▶</button><button id="addP">＋新頁</button></div>
    <div class="grp"><button id="delBtn" disabled>移除</button><button id="undo">回上一步</button><button id="redoBtn" disabled>下一步</button><button id="danger" data-armed="0">清除這頁</button><button id="save">存成圖片</button><button id="fs">全螢幕</button></div>
    <div class="pop" id="pop" hidden role="dialog"></div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
let W=1600;const H=900,GRID=40;   // the board is always 900 tall; its width stretches to fill the screen
const BG={chalk:{name:"黑板",ink:["#f4f1e8","#ffe066","#ff9ecb","#8ed1ff","#9ff09f","#ffb36b"]},
          white:{name:"白板",ink:["#222222","#d62828","#1d4ed8","#15803d","#7e22ce","#ea580c"]},
          grid:{name:"方格紙",ink:["#222222","#d62828","#1d4ed8","#15803d","#7e22ce","#ea580c"]}};
const SIZES=[{n:"細",w:4,font:28,dot:6},{n:"中",w:8,font:44,dot:10},{n:"粗",w:16,font:68,dot:15}];
const ICON={
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>',
  erase:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 16l9-9 6 6-6 6H7z"/><path d="M8 20h12"/></svg>',
  text:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 6h14M12 6v13"/></svg>',
  mouse:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M6 3l12 10h-6l3.5 7-2.5 1.2L9.5 14 6 18z"/></svg>',
  pic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>',
  crop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 2v16h16M2 6h16v16"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>',
  unlock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 017.5-2"/></svg>',
  mask:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="10" rx="1" fill="currentColor" fill-opacity=".25"/><path d="M10 10.5a2 2 0 113 1.7c-.7.4-1 .8-1 1.5"/></svg>',
  cutout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h4M12 4h3M19 4v4M20 12v3M20 19h-4M12 20H9M4 20v-4M4 12V9"/><path d="M9 15l3-6 3 6z" fill="currentColor"/></svg>',
  select:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"><path d="M5 9c0-4 14-6 15 0s-6 9-11 8-4-4-4-8z"/><path stroke-dasharray="none" d="M8 17l-2 5"/></svg>',
  remove:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>',
  move:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>',
  line:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 19L20 5"/></svg>',
  circle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 12h8" stroke-dasharray="2 2"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
  sector:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 19V6a13 13 0 0 1 13 13z"/></svg>',
  angle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19h16M4 19L15 6"/><path d="M10 19a6 6 0 0 0-2-4.5"/></svg>',
  ruler:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="20" height="8" rx="1"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/></svg>',
  tri45:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20V4l16 16z"/><path d="M8 16v-4l4 4z"/></svg>',
  tri60:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20V9l18 11z"/></svg>',
  compass:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="4" r="2"/><path d="M11 6L5 21M13 6l6 15"/><path d="M17 17l2 4" stroke-width="3"/></svg>',
  rect:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="6" width="16" height="12"/></svg>',
  free:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 20V6l10 14z" stroke="none"/><path d="M4 20L5 5c7 0 15 5 15 15z"/></svg>',
  poly:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l8 6-3 11H7L4 9z"/></svg>',
  shape:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="9" height="9"/><circle cx="16" cy="8" r="5"/></svg>',
  kit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 20V8l13 12z"/><path d="M14 3l7 7-3 3-7-7z"/></svg>',
  bg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="12" rx="1"/><path d="M8 21h8M12 17v4"/></svg>',
  prot:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18a9 9 0 0 1 18 0z"/><path d="M12 18V12M7 13l1.5 1.5M17 13l-1.5 1.5"/></svg>',
};
const TOOLS=[["pen","筆"],["erase","板擦"],["text","打字"],["move","移動"]];
const SHAPES=[["line","直線"],["circle","圓"],["sector","扇形"],["rect","矩形"],["poly","多邊形"],["free","不規則圖形"]];

/* ---------- state ---------- */
const PROT_R=260,CM=40;   // one centimetre on the ruler = one square on 方格紙
const S={tool:"pen",color:0,size:1,esize:1,bg:"chalk",label:true,inst:{prot:{show:false,x:800,y:620,rot:0},ruler:{show:false,x:420,y:300,rot:0},tri45:{show:false,x:260,y:760,rot:0},tri60:{show:false,x:1000,y:780,rot:0},compass:{show:false,x:800,y:520,r:200,a:0}},pages:[{objs:[],redo:[]}],pi:0,sel:[]};
const page=()=>S.pages[S.pi];
const imgCache=new Map();
function imgOf(src){let im=imgCache.get(src);if(!im){im=new Image();im.onload=()=>render();im.src=src;imgCache.set(src,im);}return im;}

/* ---------- canvases ---------- */
const cBg=$("bg"),cPic=$("pic"),cInk=$("ink"),cOv=$("ov"),xBg=cBg.getContext("2d"),xPic=cPic.getContext("2d"),xInk=cInk.getContext("2d"),xOv=cOv.getContext("2d");
const PIC=new Set(["img","mask"]);   // pictures and answer covers sit under the chalk, so 板擦 never rubs them out
let K=1,disp=1;
function fit(){
  const h=$("holder").getBoundingClientRect();W=Math.max(1200,Math.min(3200,Math.round(H*h.width/Math.max(h.height,1))));disp=Math.min(h.width/W,h.height/H);
  const bw=Math.floor(W*disp),bh=Math.floor(H*disp);$("board").style.width=bw+"px";$("board").style.height=bh+"px";
  K=disp*(window.devicePixelRatio||1);
  [cBg,cPic,cInk,cOv].forEach(c=>{c.width=Math.round(W*K);c.height=Math.round(H*K);});
  [xBg,xPic,xInk,xOv].forEach(x=>x.setTransform(K,0,0,K,0,0));
  drawBg(xBg);render();
}
function drawBg(x){
  x.save();
  if(S.bg==="chalk"){
    const g=x.createRadialGradient(W/2,H/2,100,W/2,H/2,W*0.7);g.addColorStop(0,"#2f5a43");g.addColorStop(1,"#1f3d2e");
    x.fillStyle=g;x.fillRect(0,0,W,H);
  }else{
    x.fillStyle="#fbfbf8";x.fillRect(0,0,W,H);
    if(S.bg==="grid"){
      for(let gx=0;gx<=W;gx+=GRID){x.strokeStyle=gx%(GRID*5)===0?"#9cc3e6":"#cfe1f2";x.lineWidth=gx%(GRID*5)===0?1.6:1;x.beginPath();x.moveTo(gx+.5,0);x.lineTo(gx+.5,H);x.stroke();}
      for(let gy=0;gy<=H;gy+=GRID){x.strokeStyle=gy%(GRID*5)===0?"#9cc3e6":"#cfe1f2";x.lineWidth=gy%(GRID*5)===0?1.6:1;x.beginPath();x.moveTo(0,gy+.5);x.lineTo(W,gy+.5);x.stroke();}
    }
  }
  x.restore();
}
const inkColor=c=>BG[S.bg].ink[c];
const fontOf=px=>`700 ${px}px ${getComputedStyle(document.documentElement).getPropertyValue("--font")}`;

/* ---------- drawing objects ---------- */
function strokePath(x,pts){x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
  if(pts.length===1){x.lineTo(pts[0][0]+.1,pts[0][1]+.1);}
  for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;x.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);}
  if(pts.length>1){const l=pts[pts.length-1];x.lineTo(l[0],l[1]);}x.stroke();}
function labelAt(x,txt,px,py,color){
  x.save();x.font=fontOf(26);x.textAlign="center";x.textBaseline="middle";
  x.lineWidth=7;x.strokeStyle=S.bg==="chalk"?"#1f3d2e":"#fbfbf8";x.lineJoin="round";x.strokeText(txt,px,py);
  x.fillStyle=color;x.fillText(txt,px,py);x.restore();}
let LSC=1;   // how much the item being drawn is enlarged, so grid labels still read true lengths
const I6=[1,0,0,1,0,0];
const mMul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
const mApply=(m,p)=>m?[m[0]*p[0]+m[2]*p[1]+m[4],m[1]*p[0]+m[3]*p[1]+m[5]]:p;
const mInv=m=>{const d=m[0]*m[3]-m[1]*m[2];return[m[3]/d,-m[1]/d,-m[2]/d,m[0]/d,(m[2]*m[5]-m[3]*m[4])/d,(m[1]*m[4]-m[0]*m[5])/d];};
const mScale=m=>m?Math.sqrt(Math.abs(m[0]*m[3]-m[1]*m[2])):1;
const toObj=(o,p)=>o.m?mApply(mInv(o.m),p):p;   // board point → the item's own (unrotated) coordinates

function sweepOf(o){return o.sweep;}

function drawObj(x,o){

function drawErased(x,o){const cv=x.canvas;if(!scr)scr=document.createElement("canvas");

function drawBase(x,o){

  if(o.t==="rect"){const x0=Math.min(o.a[0],o.b[0]),y0=Math.min(o.a[1],o.b[1]),w=Math.abs(o.b[0]-o.a[0]),h=Math.abs(o.b[1]-o.a[1]);

/* ---------- classroom instruments: protractor, ruler, set squares, compass ---------- */
const toLocal=(st,p)=>{const k=st.s||1,dx=(p[0]-st.x)/k,dy=(p[1]-st.y)/k,c=Math.cos(-st.rot),s=Math.sin(-st.rot);return[dx*c-dy*s,dx*s+dy*c];};
const toWorld=(st,q)=>{const k=st.s||1,c=Math.cos(st.rot),s=Math.sin(st.rot);return[st.x+(q[0]*c-q[1]*s)*k,st.y+(q[0]*s+q[1]*c)*k];};
function inPoly(q,poly){let i=0,j=poly.length-1,c=false;for(;i<poly.length;j=i++){const[a,b]=poly[i],[d,e]=poly[j];if(((b>q[1])!==(e>q[1]))&&(q[0]<(d-a)*(q[1]-b)/(e-b)+a))c=!c;}return c;}
function handle(x,q,color,kind,ang){x.save();x.fillStyle=color;x.beginPath();x.arc(q[0],q[1],16,0,7);x.fill();x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();
  if(kind==="move"){x.moveTo(q[0]-8,q[1]);x.lineTo(q[0]+8,q[1]);x.moveTo(q[0],q[1]-8);x.lineTo(q[0],q[1]+8);}
  else if(kind==="rot"){x.arc(q[0],q[1],8,-2.4,1.2);}
  else if(kind==="close"){x.moveTo(q[0]-6,q[1]-6);x.lineTo(q[0]+6,q[1]+6);x.moveTo(q[0]+6,q[1]-6);x.lineTo(q[0]-6,q[1]+6);}
  else if(kind==="scale"){const A=(ang||0)-Math.PI/4,c=Math.cos(A),s2=Math.sin(A),P=(u,v)=>[q[0]+u*c-v*s2,q[1]+u*s2+v*c];
    x.moveTo(...P(-8,0));x.lineTo(...P(8,0));x.moveTo(...P(3,-5));x.lineTo(...P(8,0));x.lineTo(...P(3,5));x.moveTo(...P(-3,-5));x.lineTo(...P(-8,0));x.lineTo(...P(-3,5));}
  else if(kind==="size"){const c=Math.cos(ang||0),s2=Math.sin(ang||0),P=(u,v)=>[q[0]+u*c-v*s2,q[1]+u*s2+v*c];   // ↔ along the compass opening
    x.moveTo(...P(-9,0));x.lineTo(...P(9,0));x.moveTo(...P(4,-5));x.lineTo(...P(9,0));x.lineTo(...P(4,5));x.moveTo(...P(-4,-5));x.lineTo(...P(-9,0));x.lineTo(...P(-4,5));}
  else{x.arc(q[0],q[1],5,0,7);}
  x.stroke();x.restore();}

// the compass: needle at (x,y), pencil at radius r and angle a
// the legs grow with the radius, so the compass can open to any size
function compassParts(st){const r=st.r,L=Math.max(230,r*.62),d=[Math.cos(st.a),Math.sin(st.a)],n=[d[1],-d[0]];

function drawCompass(x,st){const P=compassParts(st);x.save();x.lineCap="round";

  x.strokeStyle="#c9ced4";x.lineWidth=5;x.beginPath();x.moveTo(...P.hinge);x.lineTo(...P.needle);x.stroke();

  const ta=document.createElement("textarea");ta.className="textin";ta.id="textIn";ta.setAttribute("aria-label","在黑板上打字");

  ta.value=edit?edit.s:"";ta.rows=Math.max(1,ta.value.split("\n").length);

  if(edit){edit._hidden=true;render();}
  const grow=()=>{ta.style.width="0px";ta.style.width=Math.max(120,ta.scrollWidth+12)+"px";ta.rows=Math.max(1,ta.value.split("\n").length);};
  ta.addEventListener("input",grow);grow();

/* ---------- toolbar: a few main buttons; choices open in a small panel above the tray ---------- */
function mk(parent,id,html,label,fn){const b=document.createElement("button");b.type="button";b.id=id;b.innerHTML=html;if(label)b.setAttribute("aria-label",label);b.onclick=fn;(typeof parent==="string"?$(parent):parent).appendChild(b);return b;}
function setTool(t){if(cropObj&&t!=="move"){cropObj=null;hideHint();}if(t!==S.tool){if(bendObj)hideHint();bendObj=null;}if(act&&(act.k==="sweep"||act.k==="poly")){act=null;preview=null;hideHint();}S.tool=t;if(t!=="move")S.sel=[];eraserAt=null;syncUI();renderOv();}
const INST_BTN=[["prot","量角器"],["ruler","直尺"],["tri45","三角板 45°"],["tri60","三角板 30°"],["compass","圓規"]];
const INST_TIP={prot:"綠色鈕移動、藍色鈕旋轉、紫色鈕放大縮小、紅色叉叉收起來",ruler:"筆沿著尺的上緣畫出直線；紫色鈕放大縮小、紅色叉叉收起來",tri45:"筆沿著三角板的邊畫出直線；紫色鈕放大縮小、紅色叉叉收起來",tri60:"筆沿著三角板的邊畫出直線；紫色鈕放大縮小、紅色叉叉收起來",
  compass:"綠色鈕移動、藍色鈕拉開大小，拖著橘色筆尖繞一圈就畫出圓；紅色叉叉收起來"};
const regular=(n,R)=>Array.from({length:n},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[R*Math.cos(a),R*Math.sin(a)];});
const LIB=[
  ...[30,45,60,90,120,150].map(d=>({n:d+"°",k:"angle",deg:d})),
  {n:"正三角形",k:"poly",pts:[[0,0],[6,0],[3,-5.196]]},{n:"直角三角形",k:"poly",pts:[[0,0],[6,0],[0,-4]]},{n:"等腰三角形",k:"poly",pts:[[0,0],[6,0],[3,-6]]},
  {n:"正方形",k:"poly",pts:[[0,0],[5,0],[5,-5],[0,-5]]},{n:"長方形",k:"poly",pts:[[0,0],[8,0],[8,-4],[0,-4]]},{n:"平行四邊形",k:"poly",pts:[[0,0],[6,0],[8,-4],[2,-4]]},
  {n:"梯形",k:"poly",pts:[[0,0],[8,0],[6,-4],[2,-4]]},{n:"菱形",k:"poly",pts:[[0,0],[4,-3],[8,0],[4,3]]},
  {n:"正五邊形",k:"poly",pts:regular(5,3.5)},{n:"正六邊形",k:"poly",pts:regular(6,3.5)},
  {n:"圓",k:"circle",r:4},{n:"半圓",k:"sector",r:4,deg:180},{n:"四分之一圓",k:"sector",r:5,deg:90}];
function libIcon(it){let d="";
  if(it.k==="angle"){const a=it.deg*Math.PI/180,o=[it.deg>90?18:6,27],L=24;d=`M${o[0]+L} ${o[1]}L${o[0]} ${o[1]}L${(o[0]+L*Math.cos(a)).toFixed(1)} ${(o[1]-L*Math.sin(a)).toFixed(1)}`;
    return`<svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/><path stroke-width="1.6" d="M${o[0]+8} ${o[1]}A8 8 0 0 0 ${(o[0]+8*Math.cos(a)).toFixed(1)} ${(o[1]-8*Math.sin(a)).toFixed(1)}"/></svg>`;}
  if(it.k==="circle")return`<svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="17" cy="17" r="13"/></svg>`;
  if(it.k==="sector")return it.deg===180?`<svg viewBox="0 0 34 34" fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M3 24A14 14 0 0 1 31 24Z"/></svg>`
    :`<svg viewBox="0 0 34 34" fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M6 29V5A24 24 0 0 1 30 29Z"/></svg>`;
  const xs=it.pts.map(p=>p[0]),ys=it.pts.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys),sc=26/Math.max(Math.max(...xs)-x0,Math.max(...ys)-y0),
    w=(Math.max(...xs)-x0)*sc,h=(Math.max(...ys)-y0)*sc;
  d=it.pts.map((p,i)=>(i?"L":"M")+((p[0]-x0)*sc+(34-w)/2).toFixed(1)+" "+((p[1]-y0)*sc+(34-h)/2).toFixed(1)).join("")+"Z";
  return`<svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="${d}"/></svg>`;}
function insertLib(it){const col=S.color,w=SIZES[S.size].w,c=[Math.round(W/2/GRID)*GRID,Math.round(H/2/GRID)*GRID];let o;
  if(it.k==="angle"){const L=6*GRID;o={t:"angle",c:col,w,o:[c[0]-(it.deg>90?0:2*GRID),c[1]+2*GRID],r:L,r2:L,a0:0,sweep:-it.deg*Math.PI/180};}
  else if(it.k==="circle")o={t:"circle",c:col,w,o:c,r:it.r*GRID,ra:0};
  else if(it.k==="sector"){const r=it.r*GRID;o=it.deg===180?{t:"sector",c:col,w,o:[c[0],c[1]+r/2],r,a0:0,sweep:-Math.PI}:{t:"sector",c:col,w,o:[c[0]-r/2,c[1]+r/2],r,a0:0,sweep:-Math.PI/2};}
  else{const xs=it.pts.map(p=>p[0]),ys=it.pts.map(p=>p[1]),mx=(Math.min(...xs)+Math.max(...xs))/2,my=(Math.min(...ys)+Math.max(...ys))/2;
    const pts=it.pts.map(p=>[c[0]+(p[0]-mx)*GRID,c[1]+(p[1]-my)*GRID]);o={t:"poly",c:col,w,pts,ctl:pts.map(()=>null),closed:true};}
  commit(o);setTool("move");S.sel=[o];render();toast("放好了：拖曳移動，藍色鈕旋轉、紫色鈕放大縮小");}
const SHAPE_KEYS=SHAPES.map(x=>x[0]);
let shapePick="line",openPop=null;
const MAIN=[
  {id:"mouse",html:()=>`${ICON.mouse}滑鼠`,on:()=>S.tool==="mouse",click:()=>{closePop();setTool("mouse");}},
  {id:"pen",html:()=>`${ICON.pen}筆<span class="dot" style="background:${inkColor(S.color)}"></span><span class="car">▾</span>`,on:()=>S.tool==="pen",click:()=>{setTool("pen");togglePop("pen");}},
  {id:"erase",html:()=>`${ICON.erase}板擦<span class="car">▾</span>`,on:()=>S.tool==="erase",click:()=>{setTool("erase");togglePop("erase");}},
  {id:"text",html:()=>`${ICON.text}打字`,on:()=>S.tool==="text",click:()=>{closePop();setTool("text");}},
  {id:"move",html:()=>`${ICON.select}選擇`,on:()=>S.tool==="move",click:()=>{closePop();if(S.tool!=="move")toast("按一下選一個，或在空白處拖曳圈起來");setTool("move");}},
  {id:"pic",html:()=>`${ICON.pic}圖片<span class="car">▾</span>`,on:()=>S.tool==="mask",click:()=>togglePop("pic")},
  {id:"shape",html:()=>`${ICON[shapePick]}圖形<span class="car">▾</span>`,on:()=>SHAPE_KEYS.includes(S.tool),click:()=>togglePop("shape")},
  {id:"kit",html:()=>{const n=INST_BTN.filter(([k])=>S.inst[k].show).length;return`${ICON.kit}工具<span class="car">▾</span>`;},on:()=>S.tool==="angle"||INST_BTN.some(([k])=>S.inst[k].show),click:()=>togglePop("kit")},
  {id:"bg",html:()=>`${ICON.bg}${BG[S.bg].name}<span class="car">▾</span>`,on:()=>false,click:()=>togglePop("bg")},
];
MAIN.forEach(m=>mk("main","m-"+m.id,"",null,m.click));
function opt(row,id,html,pressed,fn,cls){const b=mk(row,id,html,null,fn);if(cls)b.className=cls;b.setAttribute("aria-pressed",String(pressed));return b;}
function section(title){const box=$("pop");if(title){const h=document.createElement("h3");h.textContent=title;box.appendChild(h);}const r=document.createElement("div");r.className="row";box.appendChild(r);return r;}
function buildPop(){
  const box=$("pop");box.innerHTML="";const k=openPop;if(!k)return;
  if(k==="pen"){let r=section("顏色");for(let i=0;i<6;i++){const b=opt(r,"c-"+i,"",S.color===i,()=>{S.color=i;refresh();},"sw");b.style.background=inkColor(i);b.setAttribute("aria-label","顏色 "+(i+1));}
    r=section("粗細");SIZES.forEach((z,i)=>opt(r,"s-"+i,`<i style="width:${z.dot}px;height:${z.dot}px"></i>${z.n}`,S.size===i,()=>{S.size=i;refresh();},"sz"));}
  if(k==="erase"){const r=section("板擦大小");ESIZES.forEach((z,i)=>opt(r,"e-"+i,`<i style="width:${z.dot}px;height:${z.dot}px"></i>${z.n}`,S.esize===i,()=>{S.esize=i;refresh();},"sz"));}
  if(k==="shape"){let r=section("畫什麼圖形");SHAPES.forEach(([s2,n])=>opt(r,"t-"+s2,ICON[s2]+n,S.tool===s2,()=>{shapePick=s2;setTool(s2);closePop();if(s2==="poly")toast("一下一下點出頂點，點回第一個點就完成");}));
    r=section("常用圖形和角（點一下放到黑板中間）");LIB.forEach((it,i)=>{const b=mk(r,"lib-"+i,libIcon(it)+`<span>${it.n}</span>`,null,()=>{closePop();insertLib(it);});b.className="lib";});
    r=section();const l=document.createElement("label");l.innerHTML=`<input type="checkbox" id="tLabel" ${S.label?"checked":""}>標示數值（長度、半徑、角度）`;r.appendChild(l);
    $("tLabel").onchange=e=>{S.label=e.target.checked;render();};}
  if(k==="kit"){let r=section("量角度");opt(r,"t-angle",ICON.angle+"量角",S.tool==="angle",()=>{setTool("angle");closePop();});
    r=section("拿出教具（再按一次收起來）");INST_BTN.forEach(([i,n])=>opt(r,"t-"+i,ICON[i]+n,S.inst[i].show,()=>{const st=S.inst[i];st.show=!st.show;renderOv();refresh();if(st.show)toast(INST_TIP[i]);}));
    if(S.inst.compass.show){const c=S.inst.compass,step=d=>{c.r=Math.max(CM_MIN,Math.min(CM_MAX,Math.round((c.r+d)/(GRID/2))*(GRID/2)));refresh();};
      r=section("圓規半徑");mk(r,"cm-dn","－","縮小半徑",()=>step(-GRID/2));const v=document.createElement("b");v.id="cmVal";v.style.minWidth="88px";v.style.textAlign="center";
      v.textContent=cmText(c.r)+(S.bg==="grid"?" 格":" 公分");r.appendChild(v);mk(r,"cm-up","＋","放大半徑",()=>step(GRID/2));}}
  if(k==="pages"){const g=section("所有頁面（點一下跳過去）");g.className="thumbs";
    S.pages.forEach((pg,i)=>{const b=opt(g,"pg-"+i,"",i===S.pi,()=>{closePop();goPage(i);},"thumb");b.appendChild(composePage(pg,150/W));
      const l=document.createElement("span");l.textContent=`第 ${i+1} 頁`+(liveOf(pg).length?"":"（空白）");b.appendChild(l);});
    let r=section();mk(r,"pgAdd","＋在後面加一頁",null,()=>{closePop();$("addP").click();});
    if(S.pages.length>1){const del=mk(r,"pgDel",`刪掉第 ${S.pi+1} 頁`,null,()=>{if(del.dataset.armed!=="1"){del.dataset.armed="1";del.textContent="再按一次刪掉";return;}
      S.pages.splice(S.pi,1);S.pi=Math.min(S.pi,S.pages.length-1);S.sel=[];render();buildPop();toast("刪掉了");});del.className="warn";}
    r=section("整堂課存起來，下次打開就能接著教或複習");const nm=document.createElement("input");nm.type="text";nm.id="lessonName";nm.value=lessonName;nm.setAttribute("aria-label","課程名稱");
    nm.oninput=()=>{lessonName=nm.value.trim()||"我的課程";};r.appendChild(nm);
    mk(r,"lessonSave","存成課程檔",null,()=>{saveBlob(`${lessonName}_小黑板課程.json`,new Blob([JSON.stringify(lessonData())],{type:"application/json"}),`存好了，共 ${S.pages.length} 頁`);});
    r=section();mk(r,"lessonOpen","打開課程檔",null,()=>$("lessonIn").click());
    const tip=document.createElement("p");tip.className="tip";tip.textContent="課程檔會存下所有頁面、圖片和遮答案的色塊。打開課程檔會換掉目前黑板上的內容。";$("pop").appendChild(tip);}
  if(k==="pic"){let r=section("放入課本圖片");mk(r,"pickFile",ICON.pic+"選擇圖片檔",null,()=>{closePop();$("fileIn").click();});
    const tip=document.createElement("p");tip.className="tip";tip.innerHTML="或截圖：按 <kbd>Win</kbd>＋<kbd>Shift</kbd>＋<kbd>S</kbd> 框起課本，回到黑板按 <kbd>Ctrl</kbd>＋<kbd>V</kbd>。也可以把圖片檔直接拖進黑板。";$("pop").appendChild(tip);
    r=section("遮住答案");opt(r,"t-mask",ICON.mask+"拉框蓋住答案",S.tool==="mask",()=>{setTool("mask");closePop();toast("拉框蓋住答案；上課時用「滑鼠」點色塊就打開");});}
  if(k==="bg"){const r=section("背景");Object.entries(BG).forEach(([b2,v])=>opt(r,"b-"+b2,v.name,S.bg===b2,()=>{S.bg=b2;drawBg(xBg);render();closePop();}));}
  // point the little arrow at the button that opened the panel
  const btn=k==="pages"?$("pageNo"):$("m-"+k),tray=document.querySelector(".tray"),br=btn.getBoundingClientRect(),tr=tray.getBoundingClientRect();
  box.hidden=false;const left=Math.max(8,Math.min(br.left-tr.left,tr.width-box.offsetWidth-8));box.style.left=left+"px";
  box.style.setProperty("--arrow",Math.max(16,br.left-tr.left-left+br.width/2-9)+"px");
}
function refresh(){syncUI();buildPop();renderOv();}
function togglePop(k){openPop=openPop===k?null:k;if(!openPop){closePop();return;}buildPop();syncUI();}
function closePop(){openPop=null;$("pop").hidden=true;$("pop").innerHTML="";syncUI();}
document.addEventListener("pointerdown",e=>{if(openPop&&!e.target.closest("#pop")&&!e.target.closest("#main")&&!e.target.closest("#pageNo"))closePop();},true);
$("pageNo").onclick=()=>togglePop("pages");
function syncUI(){
  MAIN.forEach(m=>{const b=$("m-"+m.id);b.innerHTML=m.html();b.setAttribute("aria-pressed",String(m.on()||openPop===m.id));});
  $("pageNo").innerHTML=`${S.pi+1} / ${S.pages.length}<span class="car">▾</span>`;$("pageNo").setAttribute("aria-pressed",String(openPop==="pages"));$("prev").disabled=S.pi===0;$("nextP").disabled=S.pi===S.pages.length-1;
  $("undo").disabled=!page().objs.length;$("redoBtn").disabled=!page().redo.length;
  $("delBtn").disabled=!S.sel.length;$("delBtn").innerHTML=ICON.remove+"移除";
}
function redo(){const p=page();if(!p.redo.length)return;const o=p.redo.pop();if(o.t==="_edit")restoreObj(o.ref,o.after);if(o.t==="_edits")o.list.forEach(c=>restoreObj(c.ref,c.after));p.objs.push(o);render();}
function goPage(i){commitText();S.pi=i;S.sel=[];render();}
$("prev").onclick=()=>S.pi>0&&goPage(S.pi-1);
$("nextP").onclick=()=>S.pi<S.pages.length-1&&goPage(S.pi+1);
$("addP").onclick=()=>{S.pages.splice(S.pi+1,0,{objs:[],redo:[]});goPage(S.pi+1);toast("新增第 "+(S.pi+1)+" 頁");};
$("undo").onclick=()=>undo();
$("delBtn").onclick=()=>delSel();
$("redoBtn").onclick=()=>redo();
// clearing asks for a second press instead of a pop-up
let armT=0;$("danger").onclick=()=>{const b=$("danger");
  if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="再按一次清除";clearTimeout(armT);armT=setTimeout(()=>{b.dataset.armed="0";b.textContent="清除這頁";},2500);return;}
  b.dataset.armed="0";b.textContent="清除這頁";S.pages[S.pi]={objs:[],redo:[]};S.sel=[];render();toast("這一頁清乾淨了");};
$("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():$("app").requestFullscreen().catch(()=>toast("這裡不能全螢幕"));}catch(e){toast("這裡不能全螢幕");}};
document.addEventListener("fullscreenchange",()=>{$("fs").textContent=document.fullscreenElement?"離開全螢幕":"全螢幕";setTimeout(fit,50);});

/* ---------- save the page as a picture ---------- */
// a whole page drawn onto one canvas: background, pictures, then chalk
function composePage(pg,k){const c=document.createElement("canvas");c.width=Math.round(W*k);c.height=Math.round(H*k);const x=c.getContext("2d");x.scale(k,k);
  drawBg(x);const layer=()=>{const q=document.createElement("canvas");q.width=c.width;q.height=c.height;const xx=q.getContext("2d");xx.scale(k,k);return[q,xx];};
  const[pc,xp]=layer(),[ic,xi]=layer();liveOf(pg).forEach(o=>drawObj(PIC.has(o.t)?xp:xi,o));x.drawImage(pc,0,0,W,H);x.drawImage(ic,0,0,W,H);return c;}
async function saveBlob(name,blob,ok){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;}catch(e){}
  if(dl){try{await dl.save({filename:name,data:blob});toast(ok);}catch(err){toast(err&&err.code==="declined"?"沒有存檔":"這裡不能存檔");}return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast(ok);}   // outside Claude: a normal download
const stamp=()=>{const d=new Date(),pad=n=>String(n).padStart(2,"0");return`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;};
function lessonData(){return{app:"課堂小黑板",v:3,bg:S.bg,pages:S.pages.map(pg=>liveOf(pg).map(o=>{const c=JSON.parse(JSON.stringify(o));delete c._hidden;return c;}))};}
function loadLesson(d){if(!d||d.app!=="課堂小黑板"||!Array.isArray(d.pages)||!d.pages.length)throw new Error("bad");
  S.pages=d.pages.map(objs=>({objs,redo:[]}));S.pi=0;S.sel=[];if(BG[d.bg])S.bg=d.bg;drawBg(xBg);render();}
let lessonName="我的課程";
$("lessonIn").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();
  r.onload=()=>{try{loadLesson(JSON.parse(r.result));lessonName=f.name.replace(/(_小黑板課程)?\.json$/i,"");closePop();toast(`打開了「${lessonName}」，共 ${S.pages.length} 頁`);}catch(err){toast("這個檔案不是小黑板的課程檔");}};r.readAsText(f);};
// keep the latest board in this browser, so a closed tab can be picked up again
const SAVE_KEY="classboard-autosave";let saveT=0;
addEventListener("pagehide",()=>{clearTimeout(saveT);saveNow();});
function saveNow(){try{const d=lessonData();if(d.pages.some(p=>p.length))localStorage.setItem(SAVE_KEY,JSON.stringify({at:Date.now(),d}));}catch(e){}}
function autosave(){clearTimeout(saveT);saveT=setTimeout(()=>{try{const d=lessonData();if(d.pages.some(p=>p.length))localStorage.setItem(SAVE_KEY,JSON.stringify({at:Date.now(),d}));}catch(e){}},1500);}
function offerRestore(){let rec=null;try{rec=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");}catch(e){}
  if(!rec||!rec.d||!rec.d.pages||!rec.d.pages.some(p=>p.length))return;
  const t=new Date(rec.at),pad=n=>String(n).padStart(2,"0"),when=`${t.getMonth()+1}/${t.getDate()} ${pad(t.getHours())}:${pad(t.getMinutes())}`;
  const bar=document.createElement("div");bar.className="restore";bar.innerHTML=`上次的黑板還在（${when}，${rec.d.pages.length} 頁），要接回來嗎？`;
  const y=document.createElement("button");y.className="yes";y.textContent="接回來";const n=document.createElement("button");n.textContent="不用";
  y.onclick=()=>{try{loadLesson(rec.d);toast("接回來了");}catch(e){toast("接不回來");}bar.remove();};n.onclick=()=>bar.remove();
  bar.append(y,n);$("board").appendChild(bar);}
$("save").onclick=async()=>{
  const c=composePage(page(),2);
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  saveBlob(`課堂小黑板_${stamp()}_第${S.pi+1}頁.png`,blob,"已存成圖片");
};

/* ---------- keys, hints, toast ---------- */
document.addEventListener("keydown",e=>{
  if(textBox)return;const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==="z"){e.preventDefault();e.shiftKey?redo():undo();}
  else if((e.ctrlKey||e.metaKey)&&k==="y"){e.preventDefault();redo();}
  else if((k==="delete"||k==="backspace")&&S.sel.length){e.preventDefault();delSel();}
  else if(k==="enter"&&act&&act.k==="poly"){e.preventDefault();finishPoly();}
  else if(k==="escape"){if(cut)finishCut(false);closePop();if(cropObj){cropObj=null;hideHint();}if(act&&(act.k==="sweep"||act.k==="poly")){act=null;preview=null;hideHint();renderOv();}S.sel=[];renderOv();syncUI();}
});
let toastT=0;function toast(m){const t=$("toast");t.textContent=m;t.classList.remove("off");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add("off"),1800);}
function showHint(m){$("hint").textContent=m;$("hint").hidden=false;}function hideHint(){$("hint").hidden=true;}

new ResizeObserver(fit).observe($("holder"));
document.fonts&&document.fonts.ready.then(()=>render());
fit();
offerRestore();
})();
</script>
