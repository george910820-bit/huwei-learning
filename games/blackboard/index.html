<title>課堂小黑板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&display=swap">
<style>
/* Layout: one classroom board in a wooden frame filling the screen, with the chalk tray along the bottom holding every tool.
   Single look on purpose (wood + board), so every color is set here and does not follow the light/dark setting. */
:root{
  --wall:#3a3129; --wood:#9a6a3c; --wood-dark:#6e4723; --wood-light:#c08a55; --tray:#7b5230;
  --chalk:#f4f1e8; --btn:#f6ecd9; --btn-ink:#3b2a1a; --on:#ffd84d; --focus:#6aa8ff;
  --font:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--wall);color:var(--chalk);font-family:var(--font);font-size:16px;overflow:hidden}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;gap:0;padding-block:10px 8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));box-sizing:border-box}
.frame{flex:1;min-height:0;position:relative;border-radius:10px;padding:14px;background:linear-gradient(135deg,var(--wood-light),var(--wood) 40%,var(--wood-dark));box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.35)}
.holder{position:absolute;inset:14px;display:flex;align-items:center;justify-content:center}
.board{position:relative;box-shadow:inset 0 0 0 3px rgba(0,0,0,.35)}
.board canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
.tray{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:8px 10px;margin-top:-2px;border-radius:0 0 10px 10px;
  background:linear-gradient(var(--tray),#5c3b20);box-shadow:inset 0 3px 4px rgba(0,0,0,.35)}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.tray button{font:inherit;font-size:16px;font-weight:700;cursor:pointer;border:0;border-radius:8px;padding:7px 8px;background:var(--btn);color:var(--btn-ink);
  box-shadow:0 2px 0 rgba(0,0,0,.35);display:inline-flex;align-items:center;gap:5px;line-height:1.1}
.tray button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.tray button[aria-pressed="true"]{background:var(--on);box-shadow:inset 0 2px 0 rgba(0,0,0,.25)}
.tray button:disabled{opacity:.45;cursor:default}
.tray svg{width:20px;height:20px;flex:none}
@media (max-width:1500px){.tray button{font-size:15px;padding:7px 6px;gap:4px}.tray svg{width:18px;height:18px}.tray button .car{margin-left:-2px}.tray button .dot{width:14px;height:14px}}
@media (max-width:1340px){.tray{gap:6px 8px;padding:8px 6px}.tray .grp{gap:4px}.tray button{font-size:14px;padding:6px 5px;gap:3px}.tray svg{width:16px;height:16px}}
.sw{width:30px;height:30px;padding:0!important;border-radius:50%!important;border:3px solid rgba(0,0,0,.25)!important}
.sw[aria-pressed="true"]{outline:3px solid var(--on);outline-offset:2px}
.sz{width:34px;height:34px;padding:0!important;justify-content:center}
.sz i{display:block;border-radius:50%;background:var(--btn-ink)}
.page{font-weight:900;font-variant-numeric:tabular-nums;min-width:3.4em;text-align:center;color:var(--chalk)}
.tray button .dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,.3)}
.tray button .car{font-size:11px;opacity:.7;margin-left:1px}
.pop{position:absolute;bottom:calc(100% + 10px);z-index:20;background:#fbf4e6;color:var(--btn-ink);border-radius:14px;padding:12px 14px;box-shadow:0 10px 24px rgba(0,0,0,.4);
  display:grid;gap:10px;min-width:220px}
.pop::after{content:"";position:absolute;top:100%;left:var(--arrow,30px);border:9px solid transparent;border-top-color:#fbf4e6}
.pop h3{margin:0;font-size:14px;color:#8a6a46;letter-spacing:.04em}
.pop .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pop button{font:inherit;font-size:16px;font-weight:700;cursor:pointer;border:2px solid transparent;border-radius:10px;padding:7px 12px;background:#efe2c9;color:var(--btn-ink);display:inline-flex;align-items:center;gap:6px}
.pop button[aria-pressed="true"]{background:var(--on);border-color:#c79b00}
.pop button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pop svg{width:20px;height:20px}
.pop .sw{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid rgba(0,0,0,.2)}
.pop .sw[aria-pressed="true"]{outline:3px solid #c79b00;outline-offset:2px;border-color:rgba(0,0,0,.2)}
.pop .sz{flex-direction:column;gap:4px;min-width:54px;justify-content:center}
.pop .sz i{display:block;border-radius:50%;background:var(--btn-ink)}
.pop label{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;cursor:pointer}
.pop input{width:18px;height:18px;accent-color:#c79b00}
.toggle{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:700;color:var(--chalk);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--on)}
#danger[data-armed="1"]{background:#e2574c;color:#fff}
.toast{position:absolute;left:50%;top:22px;transform:translateX(-50%);background:rgba(20,15,10,.85);color:#fff;padding:8px 16px;border-radius:999px;font-size:16px;font-weight:700;pointer-events:none;transition:opacity .3s}
.toast.off{opacity:0}
.textin{position:absolute;z-index:5;min-width:120px;background:rgba(255,255,255,.08);border:2px dashed var(--on);border-radius:6px;outline:none;resize:none;overflow:hidden;
  font-family:var(--font);font-weight:700;line-height:1.25;padding:2px 4px;white-space:pre}
.hint{position:absolute;right:22px;bottom:20px;font-size:14px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <div class="frame">
    <div class="holder" id="holder">
      <div class="board" id="board">
        <canvas id="bg"></canvas><canvas id="ink"></canvas><canvas id="ov" aria-label="黑板：用滑鼠或觸控筆在上面寫字畫圖"></canvas>
        <div class="toast off" id="toast" aria-live="polite"></div>
        <div class="hint" id="hint" hidden></div>
      </div>
    </div>
  </div>
  <div class="tray" role="toolbar" aria-label="黑板工具">
    <div class="grp" id="main"></div>
    <div class="grp"><button id="prev" aria-label="上一頁">◀</button><span class="page" id="pageNo">1 / 1</span><button id="nextP" aria-label="下一頁">▶</button><button id="addP">＋新頁</button></div>
    <div class="grp"><button id="delBtn" disabled>移除</button><button id="undo">回上一步</button><button id="redoBtn" disabled>下一步</button><button id="danger" data-armed="0">清除這頁</button><button id="save">存成圖片</button><button id="fs">全螢幕</button></div>
    <div class="pop" id="pop" hidden role="dialog"></div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
let W=1600;const H=900,GRID=40;   // the board is always 900 tall; its width stretches to fill the screen
const BG={chalk:{name:"黑板",ink:["#f4f1e8","#ffe066","#ff9ecb","#8ed1ff","#9ff09f","#ffb36b"]},
          white:{name:"白板",ink:["#222222","#d62828","#1d4ed8","#15803d","#7e22ce","#ea580c"]},
          grid:{name:"方格紙",ink:["#222222","#d62828","#1d4ed8","#15803d","#7e22ce","#ea580c"]}};
const SIZES=[{n:"細",w:4,font:28,dot:6},{n:"中",w:8,font:44,dot:10},{n:"粗",w:16,font:68,dot:15}];
const ICON={
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>',
  erase:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 16l9-9 6 6-6 6H7z"/><path d="M8 20h12"/></svg>',
  text:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 6h14M12 6v13"/></svg>',
  mouse:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M6 3l12 10h-6l3.5 7-2.5 1.2L9.5 14 6 18z"/></svg>',
  select:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"><path d="M5 9c0-4 14-6 15 0s-6 9-11 8-4-4-4-8z"/><path stroke-dasharray="none" d="M8 17l-2 5"/></svg>',
  remove:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>',
  move:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>',
  line:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 19L20 5"/></svg>',
  circle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 12h8" stroke-dasharray="2 2"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
  sector:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 19V6a13 13 0 0 1 13 13z"/></svg>',
  angle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19h16M4 19L15 6"/><path d="M10 19a6 6 0 0 0-2-4.5"/></svg>',
  ruler:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="20" height="8" rx="1"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/></svg>',
  tri45:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20V4l16 16z"/><path d="M8 16v-4l4 4z"/></svg>',
  tri60:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20V9l18 11z"/></svg>',
  compass:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="4" r="2"/><path d="M11 6L5 21M13 6l6 15"/><path d="M17 17l2 4" stroke-width="3"/></svg>',
  rect:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="6" width="16" height="12"/></svg>',
  free:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 20V6l10 14z" stroke="none"/><path d="M4 20L5 5c7 0 15 5 15 15z"/></svg>',
  poly:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l8 6-3 11H7L4 9z"/></svg>',
  shape:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="9" height="9"/><circle cx="16" cy="8" r="5"/></svg>',
  kit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 20V8l13 12z"/><path d="M14 3l7 7-3 3-7-7z"/></svg>',
  bg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="12" rx="1"/><path d="M8 21h8M12 17v4"/></svg>',
  prot:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18a9 9 0 0 1 18 0z"/><path d="M12 18V12M7 13l1.5 1.5M17 13l-1.5 1.5"/></svg>',
};
const TOOLS=[["pen","筆"],["erase","板擦"],["text","打字"],["move","移動"]];
const SHAPES=[["line","直線"],["circle","圓"],["sector","扇形"],["rect","矩形"],["poly","多邊形"],["free","不規則圖形"]];

/* ---------- state ---------- */
const PROT_R=260,CM=40;   // one centimetre on the ruler = one square on 方格紙
const S={tool:"pen",color:0,size:1,esize:1,bg:"chalk",label:true,inst:{prot:{show:false,x:800,y:620,rot:0},ruler:{show:false,x:420,y:300,rot:0},tri45:{show:false,x:260,y:760,rot:0},tri60:{show:false,x:1000,y:780,rot:0},compass:{show:false,x:800,y:520,r:200,a:0}},pages:[{objs:[],redo:[]}],pi:0,sel:[]};
const page=()=>S.pages[S.pi];
const imgCache=new Map();
function imgOf(src){let im=imgCache.get(src);if(!im){im=new Image();im.onload=()=>render();im.src=src;imgCache.set(src,im);}return im;}

/* ---------- canvases ---------- */
const cBg=$("bg"),cInk=$("ink"),cOv=$("ov"),xBg=cBg.getContext("2d"),xInk=cInk.getContext("2d"),xOv=cOv.getContext("2d");
let K=1,disp=1;
function fit(){
  const h=$("holder").getBoundingClientRect();W=Math.max(1200,Math.min(3200,Math.round(H*h.width/Math.max(h.height,1))));disp=Math.min(h.width/W,h.height/H);
  const bw=Math.floor(W*disp),bh=Math.floor(H*disp);$("board").style.width=bw+"px";$("board").style.height=bh+"px";
  K=disp*(window.devicePixelRatio||1);
  [cBg,cInk,cOv].forEach(c=>{c.width=Math.round(W*K);c.height=Math.round(H*K);});
  [xBg,xInk,xOv].forEach(x=>x.setTransform(K,0,0,K,0,0));
  drawBg(xBg);render();
}
function drawBg(x){
  x.save();
  if(S.bg==="chalk"){
    const g=x.createRadialGradient(W/2,H/2,100,W/2,H/2,W*0.7);g.addColorStop(0,"#2f5a43");g.addColorStop(1,"#1f3d2e");
    x.fillStyle=g;x.fillRect(0,0,W,H);
  }else{
    x.fillStyle="#fbfbf8";x.fillRect(0,0,W,H);
    if(S.bg==="grid"){
      for(let gx=0;gx<=W;gx+=GRID){x.strokeStyle=gx%(GRID*5)===0?"#9cc3e6":"#cfe1f2";x.lineWidth=gx%(GRID*5)===0?1.6:1;x.beginPath();x.moveTo(gx+.5,0);x.lineTo(gx+.5,H);x.stroke();}
      for(let gy=0;gy<=H;gy+=GRID){x.strokeStyle=gy%(GRID*5)===0?"#9cc3e6":"#cfe1f2";x.lineWidth=gy%(GRID*5)===0?1.6:1;x.beginPath();x.moveTo(0,gy+.5);x.lineTo(W,gy+.5);x.stroke();}
    }
  }
  x.restore();
}
const inkColor=c=>BG[S.bg].ink[c];
const fontOf=px=>`700 ${px}px ${getComputedStyle(document.documentElement).getPropertyValue("--font")}`;

/* ---------- drawing objects ---------- */
function strokePath(x,pts){x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
  if(pts.length===1){x.lineTo(pts[0][0]+.1,pts[0][1]+.1);}
  for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;x.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);}
  if(pts.length>1){const l=pts[pts.length-1];x.lineTo(l[0],l[1]);}x.stroke();}
function labelAt(x,txt,px,py,color){
  x.save();x.font=fontOf(26);x.textAlign="center";x.textBaseline="middle";
  x.lineWidth=7;x.strokeStyle=S.bg==="chalk"?"#1f3d2e":"#fbfbf8";x.lineJoin="round";x.strokeText(txt,px,py);
  x.fillStyle=color;x.fillText(txt,px,py);x.restore();}
const cells=v=>{const c=Math.round(v/GRID*10)/10;return (Number.isInteger(c)?c:c.toFixed(1))+" 格";};
function sweepOf(o){return o.sweep;}
function drawObj(x,o){
  x.save();x.lineCap="round";x.lineJoin="round";
  const col=o.c!=null?inkColor(o.c):null;
  if(o.t==="ink"){x.strokeStyle=col;x.lineWidth=o.w;
    if(S.bg==="chalk"){x.shadowColor=col;x.shadowBlur=o.w*.35;}strokePath(x,o.pts);}
  if(o.t==="erase"){x.globalCompositeOperation="destination-out";x.strokeStyle="#000";x.lineWidth=o.w;strokePath(x,o.pts);}
  if(o.t==="line"){x.strokeStyle=col;x.lineWidth=o.w;x.beginPath();x.moveTo(...o.a);x.lineTo(...o.b);x.stroke();
    if(S.label&&S.bg==="grid"){const L=Math.hypot(o.b[0]-o.a[0],o.b[1]-o.a[1]);if(L>20)labelAt(x,cells(L),(o.a[0]+o.b[0])/2,(o.a[1]+o.b[1])/2-24,col);}}
  if(o.t==="circle"){x.strokeStyle=col;x.lineWidth=o.w;x.beginPath();x.arc(o.o[0],o.o[1],o.r,0,Math.PI*2);x.stroke();
    if(S.label){x.fillStyle=col;x.beginPath();x.arc(o.o[0],o.o[1],Math.max(5,o.w*.7),0,7);x.fill();
      x.setLineDash([10,8]);x.lineWidth=Math.max(2,o.w*.5);x.beginPath();x.moveTo(...o.o);x.lineTo(o.o[0]+o.r*Math.cos(o.ra||0),o.o[1]+o.r*Math.sin(o.ra||0));x.stroke();x.setLineDash([]);
      if(S.bg==="grid")labelAt(x,"半徑 "+cells(o.r),o.o[0]+o.r*.5*Math.cos(o.ra||0),o.o[1]+o.r*.5*Math.sin(o.ra||0)-24,col);}}
  if(o.t==="sector"||o.t==="angle"){
    const [cx,cy]=o.o,r=o.r,a0=o.a0,a1=o.a0+o.sweep,ccw=o.sweep<0;
    x.strokeStyle=col;x.lineWidth=o.w;
    if(o.t==="sector"){x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+r*Math.cos(a0),cy+r*Math.sin(a0));x.arc(cx,cy,r,a0,a1,ccw);x.closePath();
      x.globalAlpha=.18;x.fillStyle=col;x.fill();x.globalAlpha=1;x.stroke();
      if(S.label){x.fillStyle=col;x.beginPath();x.arc(cx,cy,Math.max(5,o.w*.7),0,7);x.fill();}}
    else{const r2=o.r2||r;x.beginPath();x.moveTo(cx+r*Math.cos(a0),cy+r*Math.sin(a0));x.lineTo(cx,cy);x.lineTo(cx+r2*Math.cos(a1),cy+r2*Math.sin(a1));x.stroke();
      x.lineWidth=Math.max(2,o.w*.6);x.beginPath();x.arc(cx,cy,Math.min(60,r*.35,r2*.35),a0,a1,ccw);x.stroke();}
    if(S.label){const deg=Math.round(Math.abs(o.sweep)*180/Math.PI),m=a0+o.sweep/2,rr=o.t==="sector"?r*.6:Math.min(60,r*.35,(o.r2||r)*.35)+38;
      labelAt(x,deg+"°",cx+rr*Math.cos(m),cy+rr*Math.sin(m),col);}}
  if(o.t==="text"){x.fillStyle=col;x.font=fontOf(o.size);x.textBaseline="top";
    if(S.bg==="chalk"){x.shadowColor=col;x.shadowBlur=3;}
    o.s.split("\n").forEach((ln,i)=>x.fillText(ln,o.x,o.y+i*o.size*1.25));}
  if(o.t==="rect"){const x0=Math.min(o.a[0],o.b[0]),y0=Math.min(o.a[1],o.b[1]),w=Math.abs(o.b[0]-o.a[0]),h=Math.abs(o.b[1]-o.a[1]);
    x.strokeStyle=col;x.lineWidth=o.w;x.strokeRect(x0,y0,w,h);
    if(S.label&&S.bg==="grid"&&w>20&&h>20){labelAt(x,cells(w),x0+w/2,y0-24,col);labelAt(x,cells(h),x0-40,y0+h/2,col);}}
  if(o.t==="poly"){x.strokeStyle=col;x.lineWidth=o.w;x.lineJoin="round";x.beginPath();const C=o.ctl||[];
    o.pts.forEach((q,i)=>!i?x.moveTo(...q):C[i]?x.quadraticCurveTo(...C[i],...q):x.lineTo(...q));
    if(o.closed){if(C[0])x.quadraticCurveTo(...C[0],...o.pts[0]);x.closePath();}else if(o.cur)x.lineTo(...o.cur);x.stroke();
    if(!o.closed){x.fillStyle=col;x.beginPath();x.arc(o.pts[0][0],o.pts[0][1],Math.max(6,o.w),0,7);x.fill();}}
  if(o.t==="arc"){x.strokeStyle=col;x.lineWidth=o.w;x.beginPath();x.arc(o.o[0],o.o[1],o.r,o.a0,o.a0+o.sweep,o.sweep<0);x.stroke();
    if(S.label&&Math.abs(o.sweep)>=Math.PI*2-0.01){x.fillStyle=col;x.beginPath();x.arc(o.o[0],o.o[1],Math.max(4,o.w*.6),0,7);x.fill();
      if(S.bg==="grid")labelAt(x,"半徑 "+cells(o.r),o.o[0],o.o[1]-28,col);}}
  if(o.t==="img"){const im=imgOf(o.src);if(im.complete&&im.naturalWidth)x.drawImage(im,o.x,o.y,o.w,o.h);}
  x.restore();
}

/* ---------- classroom instruments: protractor, ruler, set squares, compass ---------- */
const toLocal=(st,p)=>{const dx=p[0]-st.x,dy=p[1]-st.y,c=Math.cos(-st.rot),s=Math.sin(-st.rot);return[dx*c-dy*s,dx*s+dy*c];};
const toWorld=(st,q)=>{const c=Math.cos(st.rot),s=Math.sin(st.rot);return[st.x+q[0]*c-q[1]*s,st.y+q[0]*s+q[1]*c];};
function inPoly(q,poly){let i=0,j=poly.length-1,c=false;for(;i<poly.length;j=i++){const[a,b]=poly[i],[d,e]=poly[j];if(((b>q[1])!==(e>q[1]))&&(q[0]<(d-a)*(q[1]-b)/(e-b)+a))c=!c;}return c;}
function handle(x,q,color,kind,ang){x.save();x.fillStyle=color;x.beginPath();x.arc(q[0],q[1],16,0,7);x.fill();x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();
  if(kind==="move"){x.moveTo(q[0]-8,q[1]);x.lineTo(q[0]+8,q[1]);x.moveTo(q[0],q[1]-8);x.lineTo(q[0],q[1]+8);}
  else if(kind==="rot"){x.arc(q[0],q[1],8,-2.4,1.2);}
  else if(kind==="size"){const c=Math.cos(ang||0),s2=Math.sin(ang||0),P=(u,v)=>[q[0]+u*c-v*s2,q[1]+u*s2+v*c];   // ↔ along the compass opening
    x.moveTo(...P(-9,0));x.lineTo(...P(9,0));x.moveTo(...P(4,-5));x.lineTo(...P(9,0));x.lineTo(...P(4,5));x.moveTo(...P(-4,-5));x.lineTo(...P(-9,0));x.lineTo(...P(-4,5));}
  else{x.arc(q[0],q[1],5,0,7);}
  x.stroke();x.restore();}
const TRI={tri45:[[0,0],[360,0],[0,-360]],tri60:[[0,0],[420,0],[0,-242]]};
const INST={
  prot:{
    local:{move:[-PROT_R-26,0],rot:[PROT_R+26,0]},
    body:q=>q[1]<=4&&Math.hypot(q[0],q[1])<=PROT_R,
    edges:[],
    draw(x){const r=PROT_R;
      x.fillStyle="rgba(190,225,255,.28)";x.strokeStyle="rgba(30,80,140,.9)";x.lineWidth=2;
      x.beginPath();x.arc(0,0,r,Math.PI,0);x.closePath();x.fill();x.stroke();
      x.beginPath();x.arc(0,0,r*.45,Math.PI,0);x.stroke();
      for(let d=0;d<=180;d++){const a=Math.PI+d*Math.PI/180,L=d%10===0?22:d%5===0?14:8;
        x.beginPath();x.moveTo(Math.cos(a)*r,Math.sin(a)*r);x.lineTo(Math.cos(a)*(r-L),Math.sin(a)*(r-L));x.lineWidth=d%10===0?2:1;x.stroke();
        if(d%10===0){x.save();x.translate(Math.cos(a)*(r-38),Math.sin(a)*(r-38));x.rotate(a+Math.PI/2);x.fillStyle="#123a66";x.font="700 15px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(d,0,0);x.restore();
          x.save();x.translate(Math.cos(a)*(r-60),Math.sin(a)*(r-60));x.rotate(a+Math.PI/2);x.fillStyle="#b3261e";x.font="700 13px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(180-d,0,0);x.restore();}}
      x.beginPath();x.moveTo(0,0);x.lineTo(0,-r*.45);x.stroke();
      x.fillStyle="#d62828";x.beginPath();x.arc(0,0,6,0,7);x.fill();}},
  ruler:{
    local:{move:[-50,35],rot:[650,35]},
    body:q=>q[0]>=-20&&q[0]<=620&&q[1]>=0&&q[1]<=70,
    edges:[[[-20,0],[620,0]]],
    draw(x){x.fillStyle="rgba(255,236,170,.55)";x.strokeStyle="rgba(140,100,20,.95)";x.lineWidth=2;
      x.beginPath();x.rect(-20,0,640,70);x.fill();x.stroke();
      x.strokeStyle="#5a3d0a";x.fillStyle="#3a2805";x.font="700 16px sans-serif";x.textAlign="center";x.textBaseline="top";
      for(let mm=0;mm<=150;mm++){const px=mm*CM/10,L=mm%10===0?22:mm%5===0?15:8;x.lineWidth=mm%10===0?2:1;
        x.beginPath();x.moveTo(px,0);x.lineTo(px,L);x.stroke();if(mm%10===0)x.fillText(mm/10,px,25);}
      x.font="700 13px sans-serif";x.fillText("公分",585,48);}},
  tri45:{
    local:{move:[-34,34],rot:[394,34]},
    body:q=>inPoly(q,TRI.tri45),
    edges:[[[0,0],[360,0]],[[0,0],[0,-360]],[[360,0],[0,-360]]],
    draw(x){triDraw(x,TRI.tri45,["90°","45°","45°"]);}},
  tri60:{
    local:{move:[-34,34],rot:[454,34]},
    body:q=>inPoly(q,TRI.tri60),
    edges:[[[0,0],[420,0]],[[0,0],[0,-242]],[[420,0],[0,-242]]],
    draw(x){triDraw(x,TRI.tri60,["90°","30°","60°"]);}},

function triDraw(x,P,ang){
  const cx=(P[0][0]+P[1][0]+P[2][0])/3,cy=(P[0][1]+P[1][1]+P[2][1])/3,inner=P.map(([a,b])=>[cx+(a-cx)*.42,cy+(b-cy)*.42]);
  x.fillStyle="rgba(255,200,120,.38)";x.strokeStyle="rgba(150,80,10,.95)";x.lineWidth=2;
  x.beginPath();P.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.closePath();inner.slice().reverse().forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.closePath();x.fill("evenodd");
  x.beginPath();P.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.closePath();x.stroke();
  x.beginPath();inner.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.closePath();x.stroke();
  x.strokeStyle="#5a3d0a";for(let c=0;c*CM/10<=P[1][0];c++){const px=c*CM/10,L=c%10===0?16:c%5===0?11:6;x.lineWidth=c%10===0?2:1;x.beginPath();x.moveTo(px,0);x.lineTo(px,-L);x.stroke();}
  x.fillStyle="#7a3d05";x.font="700 18px sans-serif";x.textAlign="center";x.textBaseline="middle";
  x.fillText(ang[0],26,-24);x.fillText(ang[1],P[1][0]-(P[1][0]>400?66:52),-14);x.fillText(ang[2],18,P[2][1]+(P[2][1]<-300?60:44));
}
// the compass: needle at (x,y), pencil at radius r and angle a
// the legs grow with the radius, so the compass can open to any size
function compassParts(st){const r=st.r,L=Math.max(230,r*.62),d=[Math.cos(st.a),Math.sin(st.a)],n=[d[1],-d[0]];
  const h=Math.sqrt(Math.max(L*L-(r/2)*(r/2),900)),mid=[st.x+d[0]*r/2,st.y+d[1]*r/2],hinge=[mid[0]+n[0]*h,mid[1]+n[1]*h];
  return{needle:[st.x,st.y],pencil:[st.x+d[0]*r,st.y+d[1]*r],hinge,size:[st.x+d[0]*(r+46),st.y+d[1]*(r+46)],r,a:st.a};}
const CM_MIN=20,CM_MAX=2400;
const cmText=v=>{const c=Math.round(v/GRID*10)/10;return (Number.isInteger(c)?c:c.toFixed(1));};
function drawCompass(x,st){const P=compassParts(st);x.save();x.lineCap="round";
  x.strokeStyle="#8a929c";x.lineWidth=12;x.beginPath();x.moveTo(...P.hinge);x.lineTo(...P.needle);x.stroke();
  x.strokeStyle="#c9ced4";x.lineWidth=5;x.beginPath();x.moveTo(...P.hinge);x.lineTo(...P.needle);x.stroke();
  x.strokeStyle="#d9a400";x.lineWidth=12;x.beginPath();x.moveTo(...P.hinge);x.lineTo(...P.pencil);x.stroke();
  x.strokeStyle=inkColor(S.color);x.lineWidth=6;const t=[P.pencil[0]+(P.hinge[0]-P.pencil[0])*.07,P.pencil[1]+(P.hinge[1]-P.pencil[1])*.07];x.beginPath();x.moveTo(...t);x.lineTo(...P.pencil);x.stroke();
  x.strokeStyle="#c9ced4";x.lineWidth=3;x.setLineDash([6,6]);x.beginPath();x.moveTo(...P.needle);x.lineTo(...P.pencil);x.stroke();x.setLineDash([]);
  x.fillStyle="#d62828";x.beginPath();x.arc(...P.needle,5,0,7);x.fill();
  handle(x,P.hinge,"#15803d","move");handle(x,P.pencil,"#ea580c","dot");handle(x,P.size,"#1d4ed8","size",P.a);
  labelAt(x,"半徑 "+cmText(P.r)+(S.bg==="grid"?" 格":" 公分"),(P.needle[0]+P.pencil[0])/2,(P.needle[1]+P.pencil[1])/2+26,"#ea580c");
  x.restore();}
function drawInst(x){
  ["tri45","tri60","ruler","prot"].forEach(k=>{const st=S.inst[k];if(!st.show)return;x.save();x.translate(st.x,st.y);x.rotate(st.rot);INST[k].draw(x);x.restore();
    handle(x,toWorld(st,INST[k].local.move),"#15803d","move");handle(x,toWorld(st,INST[k].local.rot),"#1d4ed8","rot");});
  if(S.inst.compass.show)drawCompass(x,S.inst.compass);
}
// which instrument part is under the pointer: handles always win; bodies move only with the 移動 tool
function instHit(p){
  const c=S.inst.compass;
  if(c.show){const P=compassParts(c);for(const[k,q]of[["size",P.size],["pencil",P.pencil],["move",P.hinge]])if(Math.hypot(p[0]-q[0],p[1]-q[1])<22)return{k:"compass",mode:k};}
  for(const k of["prot","ruler","tri60","tri45"]){const st=S.inst[k];if(!st.show)continue;
    for(const m of["move","rot"]){const q=toWorld(st,INST[k].local[m]);if(Math.hypot(p[0]-q[0],p[1]-q[1])<22)return{k,mode:m};}
    if(S.tool==="move"&&INST[k].body(toLocal(st,p)))return{k,mode:"move"};}
  return null;}
// pen near a straight edge of the ruler or a set square: the stroke follows that edge
function edgeNear(p){let best=null,bd=22;
  ["ruler","tri45","tri60"].forEach(k=>{const st=S.inst[k];if(!st.show)return;INST[k].edges.forEach(([a,b])=>{const A=toWorld(st,a),B=toWorld(st,b);
    const vx=B[0]-A[0],vy=B[1]-A[1],t=Math.max(0,Math.min(1,((p[0]-A[0])*vx+(p[1]-A[1])*vy)/(vx*vx+vy*vy))),q=[A[0]+vx*t,A[1]+vy*t],d=Math.hypot(p[0]-q[0],p[1]-q[1]);
    if(d<bd){bd=d;best={A,B};}});});return best;}
function onEdge(e,p){const{A,B}=e,vx=B[0]-A[0],vy=B[1]-A[1],t=Math.max(0,Math.min(1,((p[0]-A[0])*vx+(p[1]-A[1])*vy)/(vx*vx+vy*vy)));return[A[0]+vx*t,A[1]+vy*t];}

/* ---------- geometry helpers ---------- */
function bbox(o){
  if(o.t==="text"){xInk.save();xInk.font=fontOf(o.size);const lines=o.s.split("\n");const w=Math.max(...lines.map(l=>xInk.measureText(l).width));xInk.restore();return{x:o.x,y:o.y,w,h:lines.length*o.size*1.25};}
  if(o.t==="img")return{x:o.x,y:o.y,w:o.w,h:o.h};
  if(o.t==="poly"){const all=o.pts.concat((o.ctl||[]).filter(Boolean)),xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);const x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y};}
  if(o.t==="line"||o.t==="rect")return{x:Math.min(o.a[0],o.b[0]),y:Math.min(o.a[1],o.b[1]),w:Math.abs(o.b[0]-o.a[0]),h:Math.abs(o.b[1]-o.a[1])};
  if(o.t==="circle"||o.t==="sector"||o.t==="angle"||o.t==="arc"){const r=Math.max(o.r,o.r2||0);return{x:o.o[0]-r,y:o.o[1]-r,w:2*r,h:2*r};}
  if(o.t==="ink"){const xs=o.pts.map(p=>p[0]),ys=o.pts.map(p=>p[1]);const x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y};}
  return null;}
// the box around everything that is selected
function selBox(){const bs=S.sel.map(bbox).filter(Boolean);if(!bs.length)return null;const x=Math.min(...bs.map(b=>b.x)),y=Math.min(...bs.map(b=>b.y));
  return{x,y,w:Math.max(...bs.map(b=>b.x+b.w))-x,h:Math.max(...bs.map(b=>b.y+b.h))-y};}
const inSelBox=p=>{const b=selBox();return b&&p[0]>=b.x-8&&p[0]<=b.x+b.w+8&&p[1]>=b.y-8&&p[1]<=b.y+b.h+8;};
// an item counts as circled when most of it sits inside the loop
function circled(o,loop){const b=bbox(o);if(!b)return false;
  const pts=o.pts&&o.pts.length?o.pts.filter((_,i)=>i%Math.ceil(o.pts.length/40)===0):[[b.x,b.y],[b.x+b.w,b.y],[b.x,b.y+b.h],[b.x+b.w,b.y+b.h],[b.x+b.w/2,b.y+b.h/2]];
  return pts.filter(q=>inPoly(q,loop)).length>=pts.length*.7;}
function hit(pt){const objs=page().objs;for(let i=objs.length-1;i>=0;i--){const o=objs[i];if(o.t==="erase")continue;const b=bbox(o);if(!b)continue;
  if(pt[0]>=b.x-10&&pt[0]<=b.x+b.w+10&&pt[1]>=b.y-10&&pt[1]<=b.y+b.h+10)return o;}return null;}
function moveObj(o,dx,dy){
  if(o.t==="text"||o.t==="img"){o.x+=dx;o.y+=dy;}
  if(o.t==="poly"){o.pts=o.pts.map(p=>[p[0]+dx,p[1]+dy]);if(o.ctl)o.ctl=o.ctl.map(p=>p&&[p[0]+dx,p[1]+dy]);}
  if(o.t==="line"||o.t==="rect"){o.a=[o.a[0]+dx,o.a[1]+dy];o.b=[o.b[0]+dx,o.b[1]+dy];}
  if(o.o)o.o=[o.o[0]+dx,o.o[1]+dy];
  if(o.t==="ink")o.pts=o.pts.map(p=>[p[0]+dx,p[1]+dy]);}
const snap=pt=>{if(S.bg!=="grid")return pt;const sx=Math.round(pt[0]/GRID)*GRID,sy=Math.round(pt[1]/GRID)*GRID;
  return Math.hypot(sx-pt[0],sy-pt[1])<12?[sx,sy]:pt;};
const ESIZES=[{n:"小",w:24,dot:8},{n:"中",w:56,dot:14},{n:"大",w:110,dot:22}];
const eraseW=()=>ESIZES[S.esize].w;

/* ---------- history ---------- */
function commit(o){page().objs.push(o);page().redo=[];render();}
function undo(){const p=page();if(p.objs.length){p.redo.push(p.objs.pop());S.sel=[];render();}}
function redo(){const p=page();if(p.redo.length){p.objs.push(p.redo.pop());render();}}
// moving or resizing is recorded as a pair so 復原 puts the item back
function recordMove(o,before){const p=page();const after=JSON.stringify(o);if(after===before)return;
  p.objs.push({t:"_edit",ref:o,before,after});p.redo=[];}
// moving several items at once is one step, so 回上一步 brings them all back together
function recordGroup(list,before){const p=page();const ch=list.map((o,i)=>({ref:o,before:before[i],after:JSON.stringify(o)})).filter(c=>c.before!==c.after);
  if(!ch.length)return;p.objs.push({t:"_edits",list:ch});p.redo=[];}
const realObjs=()=>page().objs;

/* ---------- pointer ---------- */
const pt=e=>{const r=cOv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];};
let act=null,eraserAt=null;
cOv.addEventListener("pointerdown",e=>{
  if(textBox){commitText();return;}

  if(sh){const o=bendTarget();if(!o.ctl)o.ctl=o.pts.map(()=>null);act={k:sh.k,o,i:sh.i,before:JSON.stringify(o)};return;}
  const ih=instHit(p);
  if(ih){const st=S.inst[ih.k];act={k:"inst",which:ih.k,mode:ih.mode,start:p,orig:{...st}};
    if(ih.k==="compass"&&ih.mode==="pencil"){const c=st;act.lastA=Math.atan2(p[1]-c.y,p[0]-c.x);   // turning measured around the needle
      act.arc={t:"arc",c:S.color,w:SIZES[S.size].w,o:[c.x,c.y],r:compassParts(c).r,a0:c.a,sweep:0};preview=act.arc;}
    else if(ih.k!=="compass"&&ih.mode==="rot"){const q=INST[ih.k].local.rot;act.off=Math.atan2(q[1],q[0]);}
    return;}
  const T=S.tool,col=S.color,w=SIZES[S.size].w;
  if(T==="pen"){const ed=edgeNear(p);act={k:"draw",edge:ed,o:{t:"ink",c:col,w,pts:[ed?onEdge(ed,p):p]}};preview=act.o;renderOv();}
  else if(T==="erase"){act={k:"draw",o:{t:"erase",w:eraseW(),pts:[p]}};page().objs.push(act.o);page().redo=[];render();}
  else if(T==="text"){openText(p);}
  else if(T==="move"){
    const one=S.sel.length===1&&S.sel[0];

      if(o.pts.length>=3&&Math.hypot(q[0]-f[0],q[1]-f[1])<20){finishPoly();return;}   // back on the first point
      if(o.pts.length>=min&&Math.hypot(q[0]-l[0],q[1]-l[1])<6){finishPoly();return;}                                            // a double click
      o.pts.push(q);o.ctl.push(null);renderOv();return;}
    bendObj=null;act={k:"poly",o:{t:"poly",c:col,w,pts:[q],ctl:[null],cur:q}};preview=act.o;
    showHint(T==="free"?"先一下一下點出角，點回第一個點完成；完成後再拉邊上的橘點讓它變彎":"點回第一個點（或按 Enter）完成，Esc 取消");renderOv();}
  else if(T==="circle"){const c=snap(p);act={k:"shape",o:{t:"circle",c:col,w,o:c,r:0,ra:0}};preview=act.o;}
  else if(T==="sector"||T==="angle"){

});
cOv.addEventListener("pointermove",e=>{
  const p=pt(e);
  eraserAt=S.tool==="erase"?p:null;
  if(!act){if(S.tool==="erase")renderOv();cOv.style.cursor=instHit(p)?"grab":S.tool==="move"?(inSelBox(p)||hit(p)?"move":"crosshair"):S.tool==="text"?"text":S.tool==="mouse"?"default":"crosshair";if(shapeHandle(bendTarget(),p))cOv.style.cursor="grab";return;}
  if(act.k==="inst"){const st=S.inst[act.which];
    if(act.which==="compass"){
      if(act.mode==="move"){const q=snap([act.orig.x+p[0]-act.start[0],act.orig.y+p[1]-act.start[1]]);st.x=q[0];st.y=q[1];}
      else if(act.mode==="size"){let r=Math.hypot(p[0]-st.x,p[1]-st.y)-46;if(S.bg==="grid"&&Math.abs(r-Math.round(r/GRID)*GRID)<8)r=Math.round(r/GRID)*GRID;   // eases onto whole squares

  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  const d=new Date(),pad=n=>String(n).padStart(2,"0");
  const name=`課堂小黑板_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}_第${S.pi+1}頁.png`;
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;}catch(e){}
  if(dl){try{await dl.save({filename:name,data:blob});toast("已存成圖片");}catch(err){toast(err&&err.code==="declined"?"沒有存檔":"這裡不能存檔");}return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("已存成圖片");   // outside Claude: a normal download
};

/* ---------- keys, hints, toast ---------- */
document.addEventListener("keydown",e=>{
  if(textBox)return;const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==="z"){e.preventDefault();e.shiftKey?redo():undo();}
  else if((e.ctrlKey||e.metaKey)&&k==="y"){e.preventDefault();redo();}
  else if((k==="delete"||k==="backspace")&&S.sel.length){e.preventDefault();delSel();}
  else if(k==="enter"&&act&&act.k==="poly"){e.preventDefault();finishPoly();}
  else if(k==="escape"){closePop();if(act&&(act.k==="sweep"||act.k==="poly")){act=null;preview=null;hideHint();renderOv();}S.sel=[];renderOv();syncUI();}
});
let toastT=0;function toast(m){const t=$("toast");t.textContent=m;t.classList.remove("off");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add("off"),1800);}
function showHint(m){$("hint").textContent=m;$("hint").hidden=false;}function hideHint(){$("hint").hidden=true;}

new ResizeObserver(fit).observe($("holder"));
document.fonts&&document.fonts.ready.then(()=>render());
fit();
})();
</script>
