<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漢堡偵探社 第三號案件：牛小勇的勇氣漢堡</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6EC; --ink:#3B2A1A; --muted:#7A6652; --line:#E5D8C3; --accent:#D9622B;
    --ok:#2E8B57; --okbg:#E6F5EC; --pow:#F2A31B; --cou:#E2483B;
    --title:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    --body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  body{min-height:100vh;display:flex;flex-direction:column}
  button{font-family:inherit;color:inherit}
  [hidden]{display:none!important}
  .tbtn{font-size:16px;padding:7px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer}
  .tbtn.on{background:#3B2A1A;color:#fff;border-color:#3B2A1A}
  .spk{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:19px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .spk.on{background:#E1EEF8;border-color:#2F7FB5}
  body.notts .spk{opacity:.25;pointer-events:none}

  /* ===== 大屏 ===== */
  .bar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#FFF9EF;border-bottom:2px solid var(--line);flex-wrap:wrap}
  .bar h1{font-family:var(--title);font-weight:400;font-size:24px;margin:0 8px 0 0}
  .chs{display:flex;gap:6px;flex-wrap:wrap}
  .ch{font-family:var(--title);font-size:16px;padding:5px 12px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer}
  .ch.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .bar .r{margin-left:auto;display:flex;gap:8px;align-items:center}
  .narr{font-family:var(--title);font-size:17px;padding:6px 14px;border-radius:999px;border:3px solid #2F7FB5;background:#E1EEF8;cursor:pointer}
  .narr.teacher{border-color:#8A5A33;background:#FFF0D9}
  .boardwrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;padding:10px 14px}
  .stagecol{display:flex;flex-direction:column;gap:8px;min-width:0}
  .stage{position:relative;aspect-ratio:16/9;width:100%;max-height:calc(100vh - 190px);border-radius:20px;overflow:hidden;background:#cfe8f1;border:4px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.12);margin:0 auto}
  .stage svg.scene{position:absolute;inset:0;width:100%;height:100%}
  .meters{position:absolute;top:12px;right:14px;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.85);border-radius:14px;padding:8px 12px;font-family:var(--title);font-size:17px;z-index:3}
  .meter{display:flex;align-items:center;gap:8px}
  .meter .bx{width:150px;height:14px;border-radius:999px;background:#EEE3D2;overflow:hidden}
  .meter .bx i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.3,1.3,.5,1)}
  .badges{position:absolute;top:12px;left:14px;display:flex;gap:6px;z-index:3}
  .badges span{background:rgba(255,255,255,.9);border-radius:999px;padding:4px 10px;font-family:var(--title);font-size:16px;animation:pop .6s}
  .chapter{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(59,42,26,.82);color:#fff;font-family:var(--title);font-size:46px;padding:18px 40px;border-radius:22px;z-index:4;animation:fadeio 2.2s forwards;pointer-events:none;text-align:center}
  .chapter small{display:block;font-size:24px;opacity:.85}
  @keyframes fadeio{0%{opacity:0;transform:translate(-50%,-40%)}15%,75%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0}}
  .sub.withplate{right:31%}
  .sub{position:absolute;left:3%;right:3%;bottom:3%;background:rgba(255,255,255,.95);border-radius:18px;padding:12px 18px 14px;z-index:3;border:3px solid var(--line);min-height:96px}
  .sub .who{display:inline-block;font-family:var(--title);font-size:20px;color:#fff;border-radius:999px;padding:1px 14px;margin-bottom:4px}
  .sub .tx{font-family:var(--title);font-size:clamp(20px,2.2vw,34px);line-height:1.45}
  .ask{position:absolute;inset:0;background:rgba(251,246,236,.94);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
  .ask .q{font-family:var(--title);font-size:clamp(24px,2.6vw,40px);text-align:center}
  .opts{display:grid;gap:14px;width:96%}
  .opt{position:relative;background:#fff;border:4px solid var(--line);border-radius:22px;padding:14px 12px 46px;cursor:pointer;text-align:center;transition:transform .15s}
  .opt:hover{transform:translateY(-3px);border-color:var(--accent)}
  .opt .ic{font-size:clamp(40px,4.6vw,70px);line-height:1.15}
  .opt .ic svg{width:clamp(54px,5.6vw,86px);height:auto}
  .opt .t{font-family:var(--title);font-size:clamp(18px,1.8vw,28px);line-height:1.35}
  .opt .base{position:absolute;top:8px;left:10px;font-size:14px;color:var(--muted)}
  .opt.no{opacity:.45;border-style:dashed}
  .layerpop{animation:layerDrop .6s cubic-bezier(.3,1.4,.5,1) both}
  @keyframes layerDrop{from{transform:translateY(-120px);opacity:0}to{transform:none;opacity:1}}
  .platepop{animation:plateGlow 1.2s ease both}
  @keyframes plateGlow{0%{opacity:.2}40%{opacity:1}60%{opacity:.6}100%{opacity:1}}
  .badgebox{display:flex;flex-direction:column;gap:10px;align-items:center}.badgebox .opt{width:100%}.badgebox .bigbtn{font-size:19px;padding:8px 18px}
  .who-chips{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
  .who-chips span{font-family:var(--title);font-size:15px;color:#fff;border-radius:999px;padding:2px 10px;animation:pop .4s}
  .pause{position:absolute;inset:0;background:rgba(59,42,26,.55);z-index:5;display:flex;align-items:center;justify-content:center}
  .pause .card{background:#fff;border-radius:26px;padding:28px 40px;max-width:80%;text-align:center;border:6px solid var(--pow)}
  .pause .lab{font-family:var(--title);font-size:24px;color:var(--accent)}
  .pause .q{font-family:var(--title);font-size:clamp(26px,3vw,44px);line-height:1.5;margin:10px 0}
  .pause .hint{font-size:22px;color:#2E6B3A;background:#EAF5E4;border-radius:14px;padding:8px 16px;margin:6px 0 12px}
  .hintbtn{font-family:var(--title);font-size:18px;padding:8px 18px;border-radius:999px;border:2px dashed #CDBB9F;background:#FFF8EC;color:var(--muted);cursor:pointer}
  .post{position:absolute;left:50%;bottom:calc(3% + 150px);transform:translateX(-50%);display:flex;gap:14px;z-index:6}
  .bigbtn{font-family:var(--title);font-size:24px;padding:12px 28px;border-radius:999px;border:none;background:var(--accent);color:#fff;box-shadow:0 5px 0 #9C3F14;cursor:pointer}
  .bigbtn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #CDBB9F;border:2px solid var(--line)}
  .plate{position:absolute;right:14px;top:96px;background:rgba(255,255,255,.92);border-radius:16px;padding:10px 12px;z-index:3;font-family:var(--title);font-size:17px;width:190px}
  .plate div{display:flex;align-items:center;gap:8px;padding:3px 0;color:#B9A88F}
  .plate div.on{color:var(--ok)}
  .plate div b{width:22px;height:22px;border-radius:50%;border:3px solid currentColor;display:inline-grid;place-items:center;font-size:14px}
  .plate div.on b::after{content:'✔'}
  .controls{display:flex;gap:10px;align-items:center;justify-content:center}
  .nextbtn{font-family:var(--title);font-size:26px;padding:10px 46px;border-radius:999px;border:none;background:#2F7FB5;color:#fff;box-shadow:0 5px 0 #1F5A84;cursor:pointer}
  .side{display:flex;flex-direction:column;gap:10px;min-width:0}
  .panel{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px}
  .panel h3{font-family:var(--title);font-weight:400;font-size:19px;margin:0 0 6px}
  .ps{display:flex;flex-direction:column;gap:6px}
  .p{display:flex;align-items:center;gap:8px;font-size:16px}
  .p .nm{font-family:var(--title);font-size:17px;color:#fff;border-radius:999px;padding:1px 12px;white-space:nowrap}
  .p .st{white-space:nowrap}
  .p .st{color:var(--muted);font-size:15px}
  .p .st.on{color:var(--ok)}
  .p .pick{margin-left:auto;font-size:15px;color:var(--ink);text-align:right}
  .qrs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .qrs div{text-align:center;font-family:var(--title);font-size:15px}
  .qrs svg{width:100%;height:auto;border-radius:6px;outline:3px solid var(--pc)}
  .warn{background:#FFF3D6;border:2px solid #E2B34A;border-radius:12px;padding:8px 12px;font-size:15px}
  .bigqr{position:fixed;inset:0;background:rgba(251,246,236,.97);z-index:20;display:flex;flex-wrap:wrap;gap:30px;align-items:center;justify-content:center;padding:30px}
  .bigqr .q{text-align:center;font-family:var(--title);font-size:30px}
  .bigqr svg{width:min(36vh,26vw);height:auto;outline:5px solid var(--pc);border-radius:10px;display:block;margin-bottom:8px}
  .rec{display:grid;grid-template-columns:1fr;gap:8px;width:70%}
  .rec .ly{border-radius:18px;padding:12px 18px;font-family:var(--title);font-size:clamp(18px,1.9vw,28px);text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center}
  .rec .top{background:#E8A94F;border-radius:60px 60px 16px 16px}
  .rec .mid{background:#9CCB6B} .rec .mid2{background:#A8653B;color:#FFF3E6}
  .rec .bot{background:#E8A94F;border-radius:16px 16px 40px 40px}
  .rec .ly.empty{background:#fff;border:3px dashed var(--line);color:#B9A88F}

  /* 角色動作 */
  .calf{transform-box:fill-box;transform-origin:50% 100%}
  .calf.bounce{animation:bounce 1s ease-in-out infinite}
  .calf.run{animation:run .35s ease-in-out infinite}
  .calf.wobble{animation:wobble 1.2s ease-in-out infinite}
  .calf.fall{animation:fall 1s forwards}
  .calf.cheer{animation:cheer .6s ease-in-out infinite}
  @keyframes bounce{50%{transform:translateY(-10px)}}
  @keyframes run{50%{transform:translateY(-14px) rotate(-3deg)}}
  @keyframes wobble{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
  @keyframes fall{60%{transform:rotate(80deg) translateY(10px)}100%{transform:rotate(80deg) translateY(10px)}}
  @keyframes cheer{50%{transform:translateY(-18px)}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .scrollbg{animation:scroll 1.2s linear infinite}
  @keyframes scroll{to{transform:translateX(-120px)}}

  /* ===== 平板 ===== */
  .tab{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px;max-width:1100px;width:100%;margin:0 auto}
  .thead{display:flex;align-items:center;gap:10px}
  .thead .nm{font-family:var(--title);font-size:26px;color:#fff;border-radius:999px;padding:3px 18px}
  .thead .net{margin-left:auto;font-size:16px;color:var(--muted);background:#F1F5F8;border-radius:999px;padding:4px 12px}
  .thead .net.on{color:var(--ok);background:var(--okbg)}
  .wait{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
  .wait .e{font-size:90px}
  .wait .t{font-family:var(--title);font-size:34px}
  .wait .s{font-size:20px;color:var(--muted)}
  .tq{font-family:var(--title);font-size:30px;line-height:1.45;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .topts{display:grid;gap:16px}
  .topt{background:#fff;border:4px solid var(--line);border-radius:24px;padding:18px 14px;cursor:pointer;display:flex;align-items:center;gap:14px;text-align:left;font-family:var(--title);font-size:28px;line-height:1.4}
  .topt .ic{font-size:60px;flex:none;width:90px;text-align:center}
  .topt .ic svg{width:80px;height:auto}
  .topt .t{flex:1}
  .topt.sel{border-color:var(--accent);background:#FFF0E6;box-shadow:0 0 0 5px rgba(217,98,43,.25)}
  .sent{font-family:var(--title);font-size:26px;color:var(--ok);text-align:center}
  .start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center}
  .start .big{font-family:var(--title);font-size:42px}
  .start .roles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .start .roles button{font-family:var(--title);font-size:26px;padding:16px 26px;border-radius:20px;border:3px solid var(--line);background:#fff;cursor:pointer}
  .start .boardgo{font-family:var(--title);font-size:24px;padding:14px 30px;border-radius:999px;border:none;background:var(--accent);color:#fff;cursor:pointer}

  .modal{position:fixed;inset:0;background:rgba(40,25,10,.45);display:flex;align-items:center;justify-content:center;z-index:30}
  .sheet{background:#fff;border-radius:22px;padding:22px 26px;width:min(600px,92vw);max-height:90vh;overflow:auto}
  .sheet h2{font-family:var(--title);font-weight:400;font-size:28px;margin:0 0 12px}
  .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:18px}
  .it small{display:block;color:var(--muted);font-size:14px}
  .it input{font-size:18px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);width:150px}
  .seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:6px 12px;font-size:16px;cursor:pointer}
  .seg button.on{background:#3B2A1A;color:#fff}
  @media (prefers-reduced-motion:reduce){.calf,.scrollbg,.chapter,.badges span{animation:none!important}}
  @media (max-width:1000px){.boardwrap{grid-template-columns:1fr}}
  /* ===== v2：第一視角、小精靈、開場設定、回顧影片、推薦卡 ===== */
  .fpv{position:absolute;inset:0;transform-origin:50% 60%}
  /* 舞台永遠維持 16:9，整個畫面都看得到 */
  .stage{max-height:none!important;border:none!important;box-shadow:0 0 0 4px #fff,0 6px 20px rgba(0,0,0,.12)!important;flex:none}
  .fpv svg.scene{position:absolute;inset:0;width:100%;height:100%}
  .v-run{animation:bob .45s ease-in-out infinite}
  .v-slow{animation:bob 1.3s ease-in-out infinite}
  .v-cheer{animation:bob .9s ease-in-out infinite}
  .v-dizzy{animation:dizzy 1.8s ease-in-out infinite}
  .v-dizzy svg.scene{filter:blur(2.5px) saturate(.7)}
  .v-fall{animation:fallv 1s cubic-bezier(.5,0,.6,1) forwards}
  .v-down{transform:scale(1.2) rotate(22deg) translateY(110px)}
  @keyframes bob{0%,100%{transform:scale(1.06) translateY(0)}50%{transform:scale(1.06) translateY(-12px) rotate(.5deg)}}
  @keyframes dizzy{0%,100%{transform:scale(1.08) rotate(-2.5deg) translateX(-10px)}50%{transform:scale(1.08) rotate(2.5deg) translateX(10px)}}
  @keyframes fallv{0%{transform:scale(1.06)}35%{transform:scale(1.1) rotate(-6deg) translateY(-20px)}70%{transform:scale(1.2) rotate(26deg) translateY(130px)}85%{transform:scale(1.2) rotate(20deg) translateY(104px)}100%{transform:scale(1.2) rotate(22deg) translateY(110px)}}
  .lane{stroke-dasharray:34 56}
  .v-run .lane{animation:dash .45s linear infinite}
  .v-slow .lane{animation:dash 1.5s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-90}}
  .pumpL,.pumpR{transform-box:fill-box;transform-origin:50% 100%}
  .v-run .pumpL{animation:pump .45s ease-in-out infinite alternate}
  .v-run .pumpR{animation:pump .45s ease-in-out infinite alternate-reverse}
  .v-slow .pumpL{animation:pump 1.3s ease-in-out infinite alternate}
  .v-slow .pumpR{animation:pump 1.3s ease-in-out infinite alternate-reverse}
  @keyframes pump{from{transform:translateY(0)}to{transform:translateY(70px)}}
  .shake{animation:shake .12s linear infinite}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .biteup{transform-box:fill-box;transform-origin:50% 50%;animation:biteup 1.6s ease-in-out infinite}
  @keyframes biteup{0%,100%{transform:none}50%{transform:translateY(-60px) scale(1.25)}}
  .vig{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(20,10,0,.55) 100%)}
  .vig.dark{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(10,0,20,.75) 100%);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.7}}
  .flash{position:absolute;inset:0;pointer-events:none;z-index:2;background:rgba(220,40,30,.45);animation:flash .9s forwards}
  @keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
  .stars{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:46px;z-index:2;animation:spin 2s linear infinite;pointer-events:none}
  @keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}

  /* 小精靈 */
  .sprite{position:absolute;left:1.5%;bottom:calc(3% + 84px);width:clamp(84px,9vw,140px);z-index:4;transition:transform .3s}
  .sprite svg{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
  .sprite.idle{animation:floaty 2.6s ease-in-out infinite}
  .sprite.talk{animation:talk .55s ease-in-out infinite}
  .sprite.talk::after{content:'';position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(255,236,150,.55),rgba(255,236,150,0) 70%);z-index:-1}
  .sprite.in{animation:jumpin 1s cubic-bezier(.3,1.4,.5,1) both}
  @keyframes floaty{50%{transform:translateY(-8px)}}
  @keyframes talk{50%{transform:translateY(-12px) scale(1.06)}}
  @keyframes jumpin{0%{transform:translate(380%,-300%) scale(.4) rotate(-30deg);opacity:0}60%{opacity:1}100%{transform:none}}
  .sub.withsprite{left:calc(1.5% + clamp(84px,9vw,140px) + 8px)}

  /* 開場設定、QR 畫面 */
  .setup{position:fixed;inset:0;background:var(--bg);z-index:25;overflow:auto;display:flex;justify-content:center;padding:26px 16px}
  .setup .box{width:min(860px,100%)}
  .setup h2{font-family:var(--title);font-weight:400;font-size:34px;margin:0 0 4px;text-align:center}
  .setup .lead{text-align:center;color:var(--muted);font-size:18px;margin-bottom:16px}
  .setup .row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px;font-family:var(--title);font-size:22px;flex-wrap:wrap}
  .setup .seg button{font-size:19px;padding:8px 16px;font-family:var(--title)}
  .prow{display:grid;grid-template-columns:28px minmax(120px,1fr) auto auto;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:8px}
  .prow .dot{width:24px;height:24px;border-radius:50%}
  .prow input{font-family:var(--title);font-size:22px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);width:100%}
  .prow .lab{font-size:13px;color:var(--muted);display:block;text-align:center;margin-bottom:2px}
  .setup .go{display:flex;justify-content:center;gap:14px;margin-top:18px;flex-wrap:wrap}
  .qrgrid{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;margin:10px 0}
  .qrgrid .q{text-align:center;font-family:var(--title);font-size:26px;background:#fff;border-radius:18px;padding:14px;border:4px solid var(--pc)}
  .qrgrid svg{width:min(30vh,22vw,240px);height:auto;display:block;margin:0 auto 6px}
  .qrgrid .st{font-size:18px;color:var(--muted)}
  .qrgrid .st.on{color:var(--ok)}

  /* 回顧影片 */
  .film{position:absolute;inset:0;z-index:4;pointer-events:none}
  .film::before,.film::after{content:'';position:absolute;left:0;right:0;height:8%;background:#111}
  .film::before{top:0}.film::after{bottom:0}
  .film .tag{position:absolute;top:10%;left:2%;font-family:var(--title);font-size:clamp(16px,1.6vw,24px);color:#fff;background:rgba(0,0,0,.55);border-radius:999px;padding:4px 16px}
  .film .tag b{color:#FF6A55}
  .film .kind{position:absolute;top:10%;right:2%;font-family:var(--title);font-size:clamp(18px,1.9vw,28px);border-radius:999px;padding:4px 18px;color:#fff}

  o = o || {};

  const lx = (i, a, b) => a + (b - a) * i / (lanes - 1);
  let lines = '';
  for(let i=0;i<lanes;i++) lines += `<line x1="${lx(i,top[0],top[1])}" y1="300" x2="${lx(i,bot[0],bot[1])}" y2="720" stroke="#fff" stroke-width="${i===0||i===lanes-1?6:4}"/>`;
  let dashes = '';
  for(let i=0;i<lanes-1;i++){ const a = (lx(i,top[0],top[1]) + lx(i+1,top[0],top[1]))/2, b = (lx(i,bot[0],bot[1]) + lx(i+1,bot[0],bot[1]))/2;
    dashes += `<line class="lane" x1="${a}" y1="302" x2="${b}" y2="720" stroke="#F3B6A8" stroke-width="5" stroke-linecap="round"/>`; }
  const crowd = Array.from({length:48},(_,k)=>`<circle cx="${14+k*27}" cy="${236+(k%3)*18}" r="${o.cheer?11:9}" fill="${['#E2483B','#2F7FB5','#F4CF4A','#3E8E4A','#8E4FB0'][k%5]}"${o.cheer && k%2 ? ' class="cheerdot"' : ''}/>`).join('');
  return `<rect width="1280" height="720" fill="#BFE3F2"/><g fill="#fff" opacity=".9"><ellipse cx="220" cy="90" rx="100" ry="30"/><ellipse cx="1020" cy="70" rx="120" ry="34"/></g>

}

/* 你的手（第一視角） */
const SKIN = '#F1C9A5', SKIN2 = '#E2B08A', SLEEVE = '#2F7FB5';
function arm(x, y, rot, cls, inner){
  return `<g transform="translate(${x} ${y}) rotate(${rot})"><g class="${cls||''}">
    <rect x="-62" y="40" width="124" height="260" rx="50" fill="${SLEEVE}"/><rect x="-62" y="40" width="124" height="34" rx="14" fill="#fff" opacity=".85"/>
    <rect x="-48" y="-30" width="96" height="100" rx="40" fill="${SKIN}"/>
    <path d="M-40 -10h80M-40 14h80" stroke="${SKIN2}" stroke-width="5" stroke-linecap="round"/>${inner||''}</g></g>`;
}
function heldItem(hold){
  switch(hold){
    case 'toast': return `<g transform="translate(540 300) scale(2.5)">${sIcon('toast')}</g>`;
    case 'donut': return `<text x="640" y="500" text-anchor="middle" font-size="230">🍩</text>`;
    case 'tofu': return `<g><path d="M560 640L690 360M610 640L720 370" stroke="#C79A5B" stroke-width="14" stroke-linecap="round"/><g transform="translate(645 290) scale(1.5)">${sIcon('tofu')}</g></g>`;
    case 'tofuburger': return `<g transform="translate(640 440) scale(2.4)"><path d="M-46 -6Q-46 -48 0 -48Q46 -48 46 -6Z" fill="#B9773C"/><g fill="#F3E3C3"><circle cx="-16" cy="-30" r="3"/><circle cx="8" cy="-36" r="3"/><circle cx="24" cy="-24" r="3"/></g><path d="M-50 -6h100l-4 8h-92z" fill="#5FB04C"/><ellipse cx="0" cy="8" rx="46" ry="10" fill="#F2C46B" stroke="#D98E2E" stroke-width="3"/><rect x="-46" y="16" width="92" height="16" rx="8" fill="#9C6131"/></g>`;
    default: return '';
  }
}
function hands(b){
  const v = b.v || '', hold = b.hold || '';
  if(v==='fall' || v==='down') return `<g>${arm(330, 560, 35, 'shake')}${arm(950, 570, -30, '')}</g>`;
  // 掉棒：棒子掉在跑道上，雙手往前伸
  if(v==='handoff') return `<g>${arm(1000, 520, -40, 'reach')}</g>`;
  if(v==='wait') return `<g>${arm(330, 600, 20, '')}${arm(950, 600, -20, '')}</g>`;
  if(v==='drop') return `<g><g transform="translate(720 455) rotate(-62)"><rect x="-22" y="-75" width="44" height="150" rx="16" fill="#E2483B"/><rect x="-22" y="-35" width="44" height="30" fill="#fff"/></g>
    <ellipse cx="720" cy="500" rx="90" ry="12" fill="#000" opacity=".15"/></g>${arm(420, 560, 26, 'shake')}${arm(860, 560, -26, 'shake')}`;
  if(v==='run' || v==='slow' || v==='cheer'){
    const baton = hold==='baton' ? `<rect x="-22" y="-150" width="44" height="150" rx="16" fill="#E2483B"/><rect x="-22" y="-110" width="44" height="30" fill="#fff"/>` : '';
    if(v==='cheer') return `<g>${arm(250, 330, -14, 'pumpL')}${arm(1030, 330, 14, 'pumpR')}</g>`;
    return `<g>${arm(240, 470, 34, 'pumpL')}${arm(1040, 470, -34, 'pumpR', baton)}</g>`;
  }
  if(v==='dizzy') return `<g class="shake">${arm(270, 520, 30, '')}${arm(1010, 520, -30, '')}</g>`;
  if(hold){
    const item = heldItem(hold);
    return `<g class="${v==='eat' ? 'biteup' : ''}">${item}</g>${arm(480, 520, 30, '')}${arm(800, 520, -30, '')}`;
  }
  return '';
}
/* 組合整個畫面：場景＋手＋漢堡＋我的餐盤 */
function sceneSVG(sc, b, withPlate){
  b = b || {};
  const bg = SC[sc] ? SC[sc](b) : SC.shop();
  return `<svg class="scene" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">${bg}
    ${sc==='kitchen' ? `<g transform="translate(400 488)">${burgerLayers()}</g>` : ''}
    ${sc==='kitchen' && withPlate ? plantPlate() : ''}
    ${hands(b)}</svg>`;
}

/* 植物力量盤：五類植物性食物，選對一層亮一格（自行設計） */
const PPLATE = {
  grain:{n:'全穀', c:'#F2B33D', ex:'小麥、糙米、燕麥'},
  bean:{n:'豆類', c:'#E07A3B', ex:'黃豆、毛豆、黑豆'},
  veg:{n:'蔬菜', c:'#5FB04C', ex:'生菜、番茄、菇類'},
  nut:{n:'堅果種子', c:'#B07A4A', ex:'芝麻、花生、核桃'},
  fruit:{n:'水果', c:'#EE8FB0', ex:'香蕉、蘋果、芭樂'},
};
function plantPlate(){
  const cx = 1082, cy = 270, r = 104, F = "font-family=\"Huninn,'Noto Sans TC',sans-serif\"";
  const pt = (a, rr) => [cx + rr*Math.sin(a*Math.PI/180), cy - rr*Math.cos(a*Math.PI/180)];
  const on = k => G.plate.includes(k), newest = G.popNow;
  const food = k => { const o = G.burger.find(x => x.cat===k); return o ? o.t : ''; };
  const OFF = '#EFE7DA', OFFT = '#B9A88F', keys = Object.keys(PPLATE);
  let secs = '';
  keys.forEach((k, i) => { const p = PPLATE[k], a0 = i*72, a1 = a0 + 72, lit = on(k);
    const [x0,y0] = pt(a0,r), [x1,y1] = pt(a1,r), [lx,ly] = pt(a0 + 36, 66);
    secs += `<g${k===newest?' class="platepop"':''}><path d="M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}z" fill="${lit?p.c:OFF}" stroke="#fff" stroke-width="5"/>
      <text x="${lx.toFixed(1)}" y="${(ly+(lit?-3:7)).toFixed(1)}" text-anchor="middle" font-size="${p.n.length>2?17:21}" fill="${lit?'#fff':OFFT}" ${F} font-weight="700">${p.n}</text>
      ${lit ? `<text x="${lx.toFixed(1)}" y="${(ly+17).toFixed(1)}" text-anchor="middle" font-size="13" fill="#fff" ${F}>${esc(food(k))}</text>` : ''}</g>`; });
  const lines = keys.map((k,i) => { const lit = on(k);
    return `<circle cx="922" cy="${448+i*28}" r="8" fill="${lit?PPLATE[k].c:OFF}"/><text x="938" y="${455+i*28}" font-size="18" fill="${lit?'#3B2A1A':OFFT}" ${F} font-weight="${lit?700:400}">${PPLATE[k].n}：${PPLATE[k].ex}</text>`; }).join('');
  return `<g transform="translate(0 30)"><rect x="900" y="100" width="365" height="492" rx="22" fill="#fff" stroke="#BFD9A8" stroke-width="5"/>
    <text x="1082" y="140" text-anchor="middle" font-size="30" fill="#3E8E4A" ${F} font-weight="700">🌱 植物力量盤</text>
    <circle cx="${cx}" cy="${cy}" r="${r+10}" fill="#F3F8EE" stroke="#BFD9A8" stroke-width="3"/>${secs}
    <circle cx="${cx}" cy="${cy}" r="22" fill="#fff"/><text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="22">🌱</text>
    <text x="1082" y="${cy+r+40}" text-anchor="middle" font-size="17" fill="#6B8F5A" ${F}>全部來自植物，種類越多越好</text>${lines}</g>`;
}

function loadScript(src){ return new Promise((ok,no)=>{ const t=document.createElement('script'); t.src=src; t.onload=ok; t.onerror=no; document.head.appendChild(t); }); }
function mockDB(){
  const ch = new BroadcastChannel('niu-mock'), store = {}, ws = {};
  const key = (r,w) => r+'/'+w;
  const emit = k => (ws[k]||[]).forEach(cb => cb(JSON.parse(JSON.stringify(store[k]||{}))));
  const put = (k,d,local) => { store[k] = Object.assign(store[k]||{}, d); if(!local) ch.postMessage({k,d}); emit(k); };
  ch.onmessage = e => { if(e.data.hello){ if(window.onHello) onHello(); return; } put(e.data.k, e.data.d, true); };
  return { update:(r,w,d)=>put(key(r,w),d), watch:(r,w,cb)=>{ const k=key(r,w); (ws[k]=ws[k]||[]).push(cb); cb(JSON.parse(JSON.stringify(store[k]||{}))); ch.postMessage({hello:1}); },
    offlineOnExit:(r,w)=>addEventListener('pagehide',()=>ch.postMessage({k:key(r,w),d:{online:false}})), connected:cb=>cb(true) };
}
async function initSync(){
  if(MOCK){ DB = mockDB(); return; }
  if(!FIREBASE_CONFIG) return;
  try{
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database(), ref = (r,w) => db.ref(`coconut/${r}/${w}`);
    DB = { update:(r,w,d)=>ref(r,w).update(d), watch:(r,w,cb)=>ref(r,w).on('value', sn => cb(sn.val() || {})),
      offlineOnExit:(r,w)=>ref(r,w).child('online').onDisconnect().set(false),
      connected:cb=>db.ref('.info/connected').on('value', sn => cb(!!sn.val())) };
  }catch(e){ console.warn('雲端連線失敗', e); DB = null; }
}

let voices = [], voiceN = null, voiceC = null;
function initTTS(){
  if(!('speechSynthesis' in window)) return;
  const pick = () => { voices = speechSynthesis.getVoices();
    const zh = voices.filter(v=>/zh[-_]TW/i.test(v.lang)); const any = zh.length ? zh : voices.filter(v=>/^zh/i.test(v.lang));
    voiceN = any.find(v=>/HsiaoChen|Hanhan|Mei|Female|女/i.test(v.name)) || any[0] || null;
    voiceC = any.find(v=>v!==voiceN && /Yunjhe|Zhiwei|Male|男/i.test(v.name)) || voiceN;
    document.body.classList.toggle('notts', !voiceN); };
  pick(); speechSynthesis.onvoiceschanged = pick;
}
function speak(text, who, btn, onend){
  if(!voiceN){ if(onend) setTimeout(onend, 5500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,''));
  const v = who==='牛' ? voiceC : voiceN; u.voice = v; u.lang = v.lang;
  u.rate = who==='牛' ? .95 : who==='你' ? .95 : .88; u.pitch = who==='牛' ? 1.35 : who==='你' ? 1.15 : 1;
  document.querySelectorAll('.spk.on').forEach(b=>b.classList.remove('on')); if(btn) btn.classList.add('on');
  let done = false;
  u.onend = u.onerror = () => { btn && btn.classList.remove('on'); if(!done && onend){ done = true; onend(); } };
  speechSynthesis.speak(u);
}

function saveProg(){
  if(!G || !G.started) return;
  const g = {}; ['ci','chosen','played','pickers','badges','run','preSnap'].forEach(k => { if(G[k]!==undefined) g[k] = G[k]; });
  try{ localStorage.setItem(PKEY, JSON.stringify({at:Date.now(), sig:progSig(), g})); }catch(e){}

function loadProg(){
  try{ const o = JSON.parse(localStorage.getItem(PKEY) || 'null');
    if(!o || o.sig!==progSig() || Date.now()-o.at > 14*864e5) return null;
    if(!(o.g.ci>0 || Object.keys(o.g.preSnap||{}).length)) return null;
    return o; }catch(e){ return null; }

const SPLIT = ['d1','d2'];          // 這兩個決定點會切成每人一塊的畫面
function picksFor(d){
  return partList().map(k => { const v = (G.parts||{})[k] || {}; return v.dec===d && v.ask===G.ask && v.pick ? {k, pick:v.pick, why:v.why||'', pred:v.pred||'', say:v.say||''} : null; }).filter(Boolean);
}
function allPicked(d){
  const ps = picksFor(d); if(!ps.length || ps.length < partList().length) return false;
  return ps.every(p => { const lv = pLv(p.k); return lv===2 || ((!DEC[d].why || p.why) && (lv<4 || !PRED[d] || p.pred)); });
}
/* 挑戰版：這個選擇實際讓量表怎麼變 */
function actualDir(d, o){
  const P = PRED[d]; if(!P) return '';
  const ci = CH.findIndex(c => c.beats.some(x => x.dec===d)), [pow, cou] = baseMeters(ci);
  let v = P.m==='pow' ? pow : cou; const v0 = v;
  DEC[d].res[o].forEach(b => { const f = b.fx; if(!f) return;
    if(P.m==='pow' && f.pow!=null) v = f.pow < 0 ? Math.max(0, v + f.pow) : f.pow;
    if(P.m==='cou'){ if(f.cou!=null) v = f.cou; if(f.dcou) v = Math.max(0, Math.min(100, v + f.dcou)); } });
  return v - v0 > 5 ? 'up' : v0 - v > 5 ? 'down' : 'same';
}
const pdir = id => PDIR.find(x => x[0]===id) || ['', '…', ''];
function predRow(){
  const d = G.queue && G.queue.dec, o = d && G.chosen[d]; if(!d || !PRED[d]) return '';
  const ps = ((G.pickers||{})[d] || []).filter(p => p.pick===o && p.pred); if(!ps.length) return '';
  const act = actualDir(d, o);

function maybeAutoSplit(){

function curBeat(){ if(G.queue) return G.queue[G.qi]; return CH[G.ci].beats[G.bi]; }

function curScene(){

function applyFx(b){

/* 進到某一幕之前的力氣、勇氣（依目前的選擇重算） */
function baseMeters(ci){

  for(let i=0;i<ci;i++) CH[i].beats.forEach(b => {

/* 目前這一句的力氣、勇氣（往回時重算，避免重複加減） */
function recalcMeters(){

  const ap = b => { if(b && b.fx){ if(b.fx.pow!=null) pow = b.fx.pow < 0 ? Math.max(0, pow + b.fx.pow) : b.fx.pow; if(b.fx.cou!=null) cou = b.fx.cou; if(b.fx.dcou) cou = Math.max(0, Math.min(100, cou + b.fx.dcou)); } };

function resetAct3(){ G.burger = []; G.plate = []; G.popDone = null; ['b1','b2','b3','b4','b5'].forEach(k => delete G.chosen[k]); }
function jump(ci, bi){

/* 從徽章畫面回去補：只重播那一個決定，播完回到徽章畫面 */
function replayFor(k){

  const back = {ci:G.ci, bi:G.bi};
  if(k==='b3'){ jump(ci); G.returnTo = Object.assign(back, {dec:'b3'}); return; }
  jump(ci, CH[ci].beats.findIndex(b => b.dec===target));

function step(dir){

  if(dir>0 && G.queue && G.queue.isDec===false){ G.queue = null; advance(); return; }             // 選對食材：下一層
  if(G.post && dir>0) return;                         // 結果後的按鈕要老師選

  if(dir<0){
    if(G.post){ G.post = false; if(G.queue.pause){ G.pauseShow = G.queue.pause; } render(false); return; }
    if(G.pauseShow){ G.pauseShow = null; G.queue.pausePending = true; render(false); return; }
    if(G.queue){ if(G.qi>0){ G.qi--; recalcMeters(); render(false); } else { const d = G.queue.dec; G.queue = null; G.playingFor = ''; G.view = d && SPLIT.includes(d) && picksFor(d).length ? 'split' : 'ask'; [G.pow, G.cou] = baseMeters(G.ci); render(false); } return; }

function advance(){

/* 老師在大屏點選（或依學生選擇）播放某個選項 */
function choose(d, oid){

function rewind(){

  const sc = ids.map((id, i) => { const o = DEC[d].opts[id]; let n = 0;

    const ot = o.t.replace(/[，。！？、：\s]/g, '');
    for(let j=0;j<ot.length-1;j++) if(t.includes(ot.slice(j, j+2))) n += 1;
    if(ORD[i] && ORD[i].some(w => t.includes(w))) n += 5;
    return [id, n]; }).sort((a, b) => b[1] - a[1]);

    document.querySelectorAll('[data-vtype]').forEach(b => b.onclick = () => { const what = b.dataset.vtype, inp = $('#vin_' + what); got(what, inp ? inp.value.trim() : ''); });
  };
  /* ---------- 食物偵探任務：植物？動物？ ---------- */
  const sendSort = () => { if(DB && MS) DB.update(room, who, {online:true, sort:MS.a, sortRun:MS.run, sortDone:!!MS.done, at:Date.now()}); };
  const drawSort = (head, c) => {
    if(!MS || MS.run !== BS.run) MS = {run:BS.run, a:{}, done:false};
    const ids = sortIds(c.lv), tts = !!c.tts, rv = !!BS.revealed;
    $('#root').innerHTML = `<div class="tab">${head}
      <div class="tq">🔍 這些食物來自植物，還是來自動物？${tts ? spk('這些食物來自植物，還是來自動物？') : ''}${c.lv===4 ? '<small style="display:block;font-size:20px;color:var(--muted)">包裝食品從外表看不出來，請看📋成分表再判斷</small>' : ''}</div>
      <div class="slist">${ids.map(id => { const it = SORT.find(x => x.id===id), a = MS.a[id];
        const mark = rv && a ? ((a==='p') === it.p ? ' ✔' : ' ✗') : '';
        return `<div class="srow${c.ans==='pic' || c.ans==='voice' ? ' pic' : ''}"><span class="si">${icon(it.ic)}</span><span>${esc(it.t)}${tts ? spk(it.t) : ''}${it.lab ? `<small class="lab">📋 成分：${esc(it.lab)}</small>` : ''}${rv ? `<small style="display:block;font-size:17px;color:var(--muted)">來自${esc(it.from)}${mark}</small>` : ''}</span>
          <button class="p ${a==='p'?'on':''}" data-s="${id}" data-v="p">🌱 植物</button><button class="a ${a==='a'?'on':''}" data-s="${id}" data-v="a">🐾 動物</button></div>`; }).join('')}</div>
      ${MS.done ? '<div class="sent">✔ 分好了！看大屏，等老師揭曉</div>' : ''}</div>`;
    document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { MS.a[b.dataset.s] = b.dataset.v; MS.done = ids.every(id => MS.a[id]); sendSort(); draw(); });
  };
  /* ---------- 前後測 ---------- */
  const drawPoll = (head, c, w) => {
    if(!MP || MP.run !== BS.run) MP = {run:BS.run};
    const tts = !!c.tts, mine = MP[w];
    $('#root').innerHTML = `<div class="tab">${head}
      <div class="tq">${esc(POLL.q)}${tts ? spk(POLL.q) : ''}</div>
      <div class="tpoll">${POLL.opts.map(([id, em, lab]) => `<div role="button" class="topt ${mine===id?'sel':''}" data-p="${id}"><span class="em">${em}</span><span class="t">${lab}</span>${tts ? spk(lab) : ''}</div>`).join('')}</div>
      ${mine ? '<div class="sent">✔ 送出了！看大屏</div>' : ''}</div>`;
    document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { MP[w] = b.dataset.p;
      if(DB) DB.update(room, who, {online:true, ['poll_'+w]:MP[w], ['poll_'+w+'Run']:MP.run, at:Date.now()}); draw(); });
  };
  /* ---------- 推薦卡：把卡片拖到漢堡上 ---------- */
  let selCard = null;
  const drawRec = (head, c) => {
    if(!MR || MR.ask !== BS.ask) MR = {ask:BS.ask, T:'', M:[], R:'', B:'', w:'', done:false};
    const lv = c.lv, cap = MIDCAP[lv] || 3, tts = !!c.tts;
    const full = () => MR.T && MR.M.length && MR.B && (lv<4 || MR.R);
    const used = [MR.T, MR.B, MR.R, ...MR.M].filter(Boolean);
    const bank = [...(BANK[lv] || BANK[3]), ...(lv===4 && MR.w ? ['W'] : [])].filter(id => !used.includes(id));
    const ctext = id => id==='W' ? '✏️ ' + MR.w : CARDS[id].t;
    const card = (id, where) => `<div class="rcard ${selCard===id?'sel':''}${id==='W'?' own':''}" data-card="${id}" data-from="${where}"><span class="t">${esc(ctext(id))}</span>${tts ? spk(ctext(id)) : ''}</div>`;
    const zone = (z, lab, tip) => { const items = z==='M' ? MR.M : (MR[z] ? [MR[z]] : []);
      return `<div class="zone ${z}" data-zone="${z}"><div class="zl">${lab}<small>${tip}</small></div>
        ${items.map(id => card(id, z)).join('')}${(z==='M' ? items.length < cap : !items.length) ? `<div class="ph">把卡片拖到這裡${z==='M' ? `（最多 ${cap} 張）` : ''}</div>` : ''}</div>`; };
    $('#root').innerHTML = `<div class="tab" style="max-width:1300px">${head}
      <div class="tq">🍔 勇氣漢堡推薦卡：把卡片拖到漢堡上${tts ? spk('勇氣漢堡推薦卡：把卡片拖到漢堡上') : ''}</div>
      ${MR.done ? `<div class="sent">✔ 完成了！看大屏，一起討論</div>` : ''}
      <div class="rect"><div class="rburger">${zone('T','上層麵包｜論點','我推薦什麼？')}${zone('M','中間的料｜論據','為什麼值得推薦？')}${lv===4 ? zone('R','挑戰｜回應反對意見', OBJ) : ''}${zone('B','下層麵包｜重申論點','再說一次推薦')}</div>
        <div class="bank"><h4>🃏 卡片（點一下或拖曳）</h4>${bank.map(id => card(id, 'bank')).join('') || '<div style="color:var(--muted)">卡片都用完了</div>'}
          ${lv===4 && !MR.done ? `<div class="own"><input id="ownCard" maxlength="40" placeholder="✏️ 自己寫一張論據卡" value="${esc(MR.wd != null ? MR.wd : MR.w)}"><button class="vbtn" id="ownCardOk">${MR.w ? '改好了' : '做成卡片'}</button></div>` : ''}</div></div>
      <div class="rdone">${MR.done ? '<button class="bigbtn ghost" id="redo">✏️ 再修改</button>' : `<button class="bigbtn" id="done" ${full() ? '' : 'disabled style="opacity:.45"'}>完成 ✔</button>`}</div></div>`;
    if($('#ownCard')) $('#ownCard').oninput = e => { MR.wd = e.target.value; };
    if($('#ownCardOk')) $('#ownCardOk').onclick = () => { const v = $('#ownCard').value.trim(); MR.w = v; MR.wd = null; if(!v){ if(MR.R==='W') MR.R = ''; MR.M = MR.M.filter(x => x!=='W'); } sendRec(); draw(); };
    if($('#done')) $('#done').onclick = () => { if(!full()) return; MR.done = true; sendRec(); draw(); };
    if($('#redo')) $('#redo').onclick = () => { MR.done = false; sendRec(); draw(); };
    const place = (id, z) => {
      if(MR.done) return;
      // 先從原本的位置拿掉
      if(MR.T===id) MR.T = ''; if(MR.B===id) MR.B = ''; if(MR.R===id) MR.R = ''; MR.M = MR.M.filter(x => x!==id);
      if(z==='T' || z==='B' || z==='R') MR[z] = id;
      else if(z==='M'){ if(MR.M.length >= cap) MR.M.pop(); MR.M.push(id); }
      selCard = null; sendRec(); draw();
    };
    const unplace = id => { if(MR.done) return; if(MR.T===id) MR.T = ''; if(MR.B===id) MR.B = ''; if(MR.R===id) MR.R = ''; MR.M = MR.M.filter(x => x!==id); selCard = null; sendRec(); draw(); };
    // 點選：先點卡片、再點漢堡的某一層；點已放上的卡片會拿回來
    document.querySelectorAll('.zone').forEach(zn => zn.addEventListener('click', e => { if(e.target.closest('.rcard')) return; if(selCard) place(selCard, zn.dataset.zone); }));
    // 拖曳（手指或滑鼠）
    document.querySelectorAll('.rcard[data-card]').forEach(el => el.addEventListener('pointerdown', e => {
      if(e.target.closest('.spk') || MR.done) return;
      e.preventDefault();
      const id = el.dataset.card, from = el.dataset.from, x0 = e.clientX, y0 = e.clientY;
      let ghost = null, hot = null;
      const zoneAt = (x, y) => { const t = document.elementFromPoint(x, y); return t && t.closest('.zone'); };
      const move = ev => {
        if(!ghost && Math.hypot(ev.clientX-x0, ev.clientY-y0) > 10){ ghost = el.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost); el.classList.add('dragging'); }
        if(ghost){ ghost.style.left = (ev.clientX - 60) + 'px'; ghost.style.top = (ev.clientY - 30) + 'px';
          const z = zoneAt(ev.clientX, ev.clientY); if(hot && hot!==z) hot.classList.remove('hot'); if(z){ z.classList.add('hot'); } hot = z; }
      };
      const up = ev => {
        removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
        if(ghost){ ghost.remove(); el.classList.remove('dragging'); if(hot) hot.classList.remove('hot');
          const z = zoneAt(ev.clientX, ev.clientY);
          if(z) place(id, z.dataset.zone); else if(from!=='bank') unplace(id);
          return; }
        // 沒有拖動＝點一下
        if(from!=='bank') unplace(id); else { selCard = selCard===id ? null : id; draw(); }
      };
      addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
    }));
  };
  draw();
  if(!DB) return;
  DB.connected(ok => { const n = $('#net'); if(n){ n.className = 'net' + (ok?' on':''); n.textContent = ok ? '🟢 已連上大屏' : '⚪ 連線中…'; }
    if(ok){ DB.offlineOnExit(room, who); DB.update(room, who, {online:true, at:Date.now()}); } });
  window.onHello = () => { DB.update(room, who, {online:true, dec:MY.dec||'', ask:MY.ask||0, pick:MY.pick||'', why:MY.why||'', pred:MY.pred||'', say:MY.say||''}); if(MR) sendRec(); if(MS) sendSort();
    if(MP) ['pre','post'].forEach(w => { if(MP[w]) DB.update(room, who, {['poll_'+w]:MP[w], ['poll_'+w+'Run']:MP.run}); }); };
  DB.update(room, who, {online:true, at:Date.now()});
  let lastKey = '';
  DB.watch(BOARD_NODE.room, BOARD_NODE.who, v => { BS = v || {};
    // 大屏只是更新時間、內容沒變就不要重畫（避免打斷學生點選、拖曳）
    const key = JSON.stringify([BS.dec, BS.ask, BS.tried, BS.ch, BS.parts, BS.run, BS.revealed]);
    if(key === lastKey) return; lastKey = key;
    if(document.querySelector('.rcard.ghost')) return;
    draw(); });
}

/* =====================================================================
   開始畫面
   ===================================================================== */
function startPage(){
  $('#root').innerHTML = `<div class="start">
    <svg viewBox="-110 -110 220 330" style="width:170px">${calf('happy')}</svg>
    <div class="big">漢堡偵探社 第三號案件<br>勇氣漢堡</div>
    <button class="boardgo" id="bg">▶ 開始</button></div>`;
  $('#bg').onclick = () => { location.href = location.pathname + '?view=board' + (MOCK?'&mock=1':''); };
}

/* =====================================================================
   啟動
   ===================================================================== */
initTTS();
(async () => {
  await initSync();
  const old = {A:'1', B:'2'}[QS.get('who')] || QS.get('g');      // 舊版連結也能用
  const p = QS.get('p') || old;
  if(QS.get('view')==='board') boardMain();
  else if(/^[1-6]$/.test(p||'')) tabletMain('P'+p);
  else startPage();
})();

</script>
