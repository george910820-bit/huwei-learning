:root {
  --color-bg: #f5ead8;
  --color-surface: #ebddc5;
  --color-text: #201e1d;
  --color-accent: #c67139;
  --color-accent-2: #7a8a5e;
  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f9f4ed;
  --color-neutral-200: #eee7db;
  --color-neutral-300: #dcd3c4;
  --color-neutral-400: #c0b6a5;
  --color-neutral-500: #a19786;
  --color-neutral-600: #82796a;
  --color-neutral-700: #645c50;
  --color-neutral-800: #474238;
  --color-neutral-900: #2e2b25;

  --color-accent-100: #fff2eb;
  --color-accent-200: #ffe1d0;
  --color-accent-300: #ffc6a5;
  --color-accent-400: #f6a06b;
  --color-accent-500: #d67f48;
  --color-accent-600: #b2622d;
  --color-accent-700: #8c491a;
  --color-accent-800: #643312;
  --color-accent-900: #402310;

  --color-accent-2-100: #f0fae1;
  --color-accent-2-200: #e1eecc;
  --color-accent-2-300: #ccdbb2;
  --color-accent-2-400: #aebf92;
  --color-accent-2-500: #8fa073;
  --color-accent-2-600: #728157;
  --color-accent-2-700: #56633f;
  --color-accent-2-800: #3d472b;
  --color-accent-2-900: #272e1b;

  --font-heading: "Caprasimo", system-ui, sans-serif;
  --font-heading-weight: 400;
  --font-body: "Figtree", system-ui, sans-serif;

  --space-1: 4.4px;
  --space-2: 8.8px;
  --space-3: 13.2px;
  --space-4: 17.6px;
  --space-6: 26.4px;
  --space-8: 35.2px;

  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 28px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);
}
html,body{margin:0;background:#f5ead8;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{font-family:"Figtree","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#201e1d}
button{font-family:inherit;touch-action:manipulation}
:root{--g:#4f9e3f;--gl:#e6f3df;--gd:#2f6b25;--b:#3f7fc7;--bl:#e1ecf8;--bd:#2b5e99}
.stagewrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1000px;height:720px;transform-origin:0 0;background:#fffaf2;border-radius:28px;box-shadow:0 12px 32px rgba(46,43,37,.18)}
.gear,.spk{position:absolute;width:64px;height:64px;border-radius:50%;border:0;background:#ebddc5;display:grid;place-items:center;cursor:pointer;z-index:5}
.prog{position:absolute;left:96px;top:40px;display:flex;gap:6px}
.prog i{width:14px;height:14px;border-radius:50%;border:2.5px solid #8fa073;box-sizing:border-box}
.prog i.d{background:#8fa073}.prog i.o{border-color:#c67139;background:#ffe1d0}
.steps{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:12px}
.step{width:108px;height:78px;border-radius:16px;background:#ebddc5;display:grid;place-items:center;opacity:.35;border:3px solid transparent;position:relative;box-sizing:border-box}
.step.on{opacity:1;background:#fff;border-color:#c67139;box-shadow:0 0 0 6px rgba(198,113,57,.2)}
.step.done{opacity:.85;background:#e1eecc}
.step.done:after{content:"✓";position:absolute;right:-8px;top:-9px;width:26px;height:26px;border-radius:50%;background:#728157;color:#fff;font-weight:800;font-size:16px;display:grid;place-items:center}
.bigspk{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;border:0;background:#c67139;box-shadow:0 6px 0 #8c491a;display:grid;place-items:center;cursor:pointer;z-index:4}
.bigspk.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 #8c491a,0 0 0 0 rgba(198,113,57,.45)}50%{box-shadow:0 6px 0 #8c491a,0 0 0 16px rgba(198,113,57,0)}}
.dots{position:absolute;left:640px;top:44px;display:flex;gap:12px}
.dots i{width:24px;height:24px;border-radius:50%;background:#ebddc5}
.dots i.d{background:#8fa073}.dots i.o{background:#c67139;box-shadow:0 0 0 6px rgba(198,113,57,.25)}
.box{position:absolute;box-sizing:border-box;border:4px dashed #cdb894;border-radius:22px;background:#fff;transition:box-shadow .3s,border-color .3s,opacity .3s}
.box.tg{border:4px solid var(--g)}.box.tb{border:4px solid var(--b)}
.box.on{border-style:solid;border-color:#c67139;box-shadow:0 0 0 7px rgba(198,113,57,.22)}
.box.tg.on{border-color:var(--g);box-shadow:0 0 0 7px rgba(79,158,63,.25)}
.box.tb.on{border-color:var(--b);box-shadow:0 0 0 7px rgba(63,127,199,.25)}
.box.faint{opacity:.45}
.sym{position:absolute;text-align:center;font-size:56px;font-weight:800;color:#5a514a;line-height:60px}
.item{position:absolute;transition:left .7s ease,top .7s ease,width .7s ease,height .7s ease;cursor:default;z-index:3}
.item img{width:100%;height:100%;display:block;pointer-events:none}
.item.tap{cursor:pointer;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.item.cnt{filter:drop-shadow(0 0 6px rgba(198,113,57,.7))}
.badge{position:absolute;right:-10px;top:-12px;min-width:30px;height:30px;padding:0 4px;box-sizing:border-box;border-radius:15px;background:#c67139;color:#fff;font-size:19px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.cover{position:absolute;box-sizing:border-box;border-radius:18px;border:4px solid #c67139;color:#a8501c;font-weight:800;display:grid;place-items:center;background:repeating-linear-gradient(45deg,#f7ead6,#f7ead6 10px,#efdcc0 10px,#efdcc0 20px);transition:left .7s,top .7s,width .7s,height .7s,font-size .7s;z-index:3}
.cover.tg{border-color:var(--g);color:var(--gd)}
.slot{position:absolute;box-sizing:border-box;border:4px solid #cdb894;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:62px;font-weight:800;color:#201e1d;transition:box-shadow .3s}
.slot.tg{border-color:var(--g);background:var(--gl);color:var(--gd)}
.slot.tb{border-color:var(--b);background:var(--bl);color:var(--bd)}
.slot.symslot{font-size:52px;color:#5a514a;border-style:dashed}
.slot.plain{border:0;background:none}
.slot.on{border-color:#c67139;box-shadow:0 0 0 8px rgba(198,113,57,.25)}
.slot.tg.on{border-color:var(--g);box-shadow:0 0 0 8px rgba(79,158,63,.3)}
.slot.tb.on{border-color:var(--b);box-shadow:0 0 0 8px rgba(63,127,199,.3)}
.slot.symslot.on{border-style:solid}
.slot.flash{border-color:#c67139;background:#fff4ea;border-style:solid}
.slot.tapnum{cursor:pointer;animation:bob 1.6s ease-in-out infinite}
.slot.glow{box-shadow:0 0 0 12px #ffc6a5,0 0 24px #f6a06b}
.ans{position:absolute;left:0;right:0;top:500px;display:flex;justify-content:center;gap:44px}
.abtn{position:relative;width:140px;height:116px;border-radius:24px;border:0;background:#c67139;color:#fff;font-size:68px;font-weight:800;box-shadow:0 7px 0 #8c491a;cursor:pointer;transition:transform .07s,opacity .2s}
.abtn.g{background:var(--g);box-shadow:0 7px 0 var(--gd)}.abtn.b{background:var(--b);box-shadow:0 7px 0 var(--bd)}
.abtn.wr{opacity:.35}
.abtn.symb{background:#fff;color:#5a514a;border:4px solid #c0b6a5;box-shadow:0 7px 0 #a19786}
.abtn.symb.glow{box-shadow:0 7px 0 #a19786,0 0 0 12px #ffc6a5,0 0 30px #f6a06b}
.abtn.glow{box-shadow:0 7px 0 #8c491a,0 0 0 12px #ffc6a5,0 0 30px #f6a06b}
.abtn.g.glow{box-shadow:0 7px 0 var(--gd),0 0 0 12px #ffc6a5,0 0 30px #f6a06b}.abtn.b.glow{box-shadow:0 7px 0 var(--bd),0 0 0 12px #ffc6a5,0 0 30px #f6a06b}
.abtn:disabled{cursor:default}
.ans.pad{gap:10px;top:510px;flex-wrap:wrap;padding:0 120px}
.ans.pad .abtn{width:76px;height:84px;font-size:46px;border-radius:18px;box-shadow:0 5px 0 #8c491a}
.ans.pad .abtn.g{box-shadow:0 5px 0 var(--gd)}.ans.pad .abtn.b{box-shadow:0 5px 0 var(--bd)}
.xmark{position:absolute;right:6px;top:2px;font-size:26px;color:#fff}
.cards{position:absolute;left:0;right:0;top:500px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:0 110px}
.card{width:92px;height:92px;border-radius:18px;border:4px solid #8fa073;background:#fff;font-size:54px;font-weight:800;color:#201e1d;box-shadow:0 5px 0 #728157;cursor:pointer;transition:transform .07s,opacity .2s}
.cards.small .card{width:72px;height:80px;font-size:44px}
.card.symc{border-color:#c0b6a5;box-shadow:0 5px 0 #a19786;color:#5a514a}
.card.g{background:var(--gl);border-color:var(--g);color:var(--gd);box-shadow:0 5px 0 var(--gd)}
.card.b{background:var(--bl);border-color:var(--b);color:var(--bd);box-shadow:0 5px 0 var(--bd)}
.card.wr{opacity:.3}
.card.glow{box-shadow:0 5px 0 #728157,0 0 0 10px #ffc6a5,0 0 26px #f6a06b}
.hints{position:absolute;left:22px;bottom:20px;display:flex;gap:12px}
.hint{height:56px;padding:0 18px;border-radius:16px;border:0;background:#e1eecc;color:#3d472b;font-size:20px;font-weight:700;cursor:pointer}
.nextbtn{position:absolute;right:110px;bottom:30px;width:96px;height:96px;border-radius:50%;border:0;background:#728157;box-shadow:0 6px 0 #56633f;display:grid;place-items:center;cursor:pointer;animation:pulse2 1.6s ease-in-out infinite}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.bigx{position:absolute;inset:0;display:grid;place-items:center;font-size:300px;color:rgba(178,98,45,.55);font-weight:800;pointer-events:none;z-index:20}
.side{position:fixed;right:10px;bottom:10px;z-index:60;display:flex;flex-direction:column;gap:8px}
.sbtn{width:52px;min-height:48px;border-radius:12px;border:2px solid #dcd3c4;background:#f9f4ed;color:#645c50;font-size:13px;line-height:1.15;padding:4px 2px;cursor:pointer}
.sbtn.on{border-color:#8fa073;background:#e1eecc;color:#3d472b}
.testbadge{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:70;pointer-events:none;padding:6px 16px;border-radius:999px;background:#e1eecc;color:#272e1b;font-size:14px;font-weight:700}
.ppwrap{position:fixed;inset:0;z-index:80;background:rgba(245,234,216,.96);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.ppcard{width:min(640px,100%);box-sizing:border-box;padding:20px 22px 22px;border-radius:24px;background:#f9f4ed;box-shadow:0 12px 32px rgba(46,43,37,.22);border:2px solid #dcd3c4;display:flex;flex-direction:column;gap:12px}
.pphead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pptitle{font-family:"Caprasimo","PingFang TC","Noto Sans TC",serif;font-size:26px}
.ppnext{width:72px;height:72px;flex:none;border-radius:50%;border:0;background:#728157;display:grid;place-items:center;cursor:pointer}
.ppnext.off{opacity:.35;cursor:default}
.pplabel{font-weight:700;color:#645c50}
.ppdesc{color:#645c50;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid #dcd3c4;background:#fff;color:#201e1d;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.big{min-height:54px;font-size:18px}
.chip.sel{background:#c67139;border-color:#8c491a;color:#fff}
.chip.ghost{background:transparent}
.chip.same{align-self:flex-start;background:#e1eecc;border-color:#aebf92}
.reward{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;box-sizing:border-box}
.rwtitle{font-family:"Caprasimo","PingFang TC","Noto Sans TC",serif;font-size:56px;color:#a8501c}
.rwbody{width:min(1000px,100%);display:flex;justify-content:center}
.rwimg{max-width:min(800px,92vw);max-height:62vh;border-radius:24px;box-shadow:0 12px 32px rgba(46,43,37,.22)}
.again{height:64px;padding:0 34px;border-radius:999px;border:0;background:#c67139;color:#fff;font-size:24px;font-weight:700;box-shadow:0 5px 0 #8c491a;cursor:pointer}
.teacher{max-width:900px;margin:0 auto;padding:20px 16px 60px;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.thead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.thead h1{font-family:"Caprasimo","PingFang TC","Noto Sans TC",serif;font-weight:400;color:#a8501c;margin:0;font-size:32px}
.start{height:56px;padding:0 26px;border-radius:999px;border:0;background:#c67139;color:#fff;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #8c491a}
.tcard{background:#fffaf2;border-radius:22px;padding:18px 20px;margin-bottom:16px;box-shadow:0 3px 10px rgba(46,43,37,.12)}
.tcard h2{margin:0 0 12px;font-size:21px}
.tgroup{margin:12px 0}
.ttitle{font-weight:700;margin:12px 0 6px}
.tnote{font-size:14px;color:#645c50;margin:0 0 8px;line-height:1.5}
.tnote.warn{color:#b2622d}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0;cursor:pointer}
.track{flex:none;width:60px;height:34px;border-radius:17px;background:#dcd3c4;position:relative;transition:background .2s}
.track i{position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
.track.on{background:#728157}.track.on i{left:30px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:48px;height:48px;border-radius:50%;border:2px solid #dcd3c4;background:#fff;font-size:24px;cursor:pointer}
.stepper b{font-size:26px;min-width:30px;text-align:center}
.stats{display:flex;flex-wrap:wrap;gap:12px}
.stat{flex:1 1 180px;background:#f9f4ed;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:28px;color:#a8501c}.stat span{font-size:14px;color:#645c50}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.chart{overflow-x:auto}
.pill{background:#f9f4ed;border-radius:999px;padding:6px 12px;font-size:14px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid #eee7db;padding:7px 6px;text-align:left;white-space:nowrap}
th{color:#645c50;font-weight:700}
.rwlist{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.rwitem{position:relative;width:96px;height:72px;border-radius:12px;overflow:hidden;border:3px solid #8fa073;cursor:pointer}
.rwitem.off{opacity:.3;border-color:#dcd3c4}
.rwitem img{width:100%;height:100%;object-fit:cover;display:block}
.rwitem .del{position:absolute;right:2px;bottom:2px;font-size:11px;border:0;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;padding:2px 5px;cursor:pointer}
.upl{cursor:pointer}

.slot.symcard{border:4px solid #8c7a5e;background:#fff;color:#201e1d;font-size:60px;border-radius:14px;box-shadow:0 5px 0 #c0b6a5;cursor:pointer;width:72px!important;margin-left:-6px;z-index:2}
.slot.symcard.pointable{border-color:#c67139;animation:bob 1.6s ease-in-out infinite}
.slot.symcard.glow{box-shadow:0 5px 0 #c0b6a5,0 0 0 12px #ffc6a5,0 0 24px #f6a06b}

class Game extends React.Component {

    const sv = lsGet(LS_S, {}) || {};

  }

  componentDidMount() {

  }

  S() { return this.state.settings; }
  saveSettings(settings) { this.setState({ settings }); lsSet(LS_S, settings); }
  setS(patch) { this.saveSettings({ ...this.state.settings, ...patch }); }

  speak(text) {
    if (!window.speechSynthesis || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-TW'; u.rate = 0.8;
    const vs = speechSynthesis.getVoices(); const v = vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  playWrong(kind) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const ac = this.ac || (this.ac = new AC()); if (ac.state === 'suspended') ac.resume(); const t = ac.currentTime;
      const tones = kind === 'buzz' ? [[150, 0, 0.22, 'square'], [150, 0.27, 0.4, 'square']] : [[330, 0, 0.28, 'sine'], [247, 0.16, 0.28, 'sine']];
      tones.forEach(([f, d, len, type]) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(kind === 'buzz' ? 0.12 : 0.18, t + d + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + d + len); o.connect(g).connect(ac.destination); o.start(t + d); o.stop(t + d + len + 0.02); });
    } catch (e) {}
  }

  /* ----- 出題 ----- */
  genQuestions() {
    const s = this.S();
    let modes = ['picture', 'listen', 'calc'].filter(k => s.modes[k]); if (!modes.length) modes = ['picture'];
    let pairs = Object.keys(PAIRS).filter(k => s.pairs[k]); if (!pairs.length) pairs = ['animal'];
    const pool = [];
    for (let a = s.zero ? 0 : 1; a <= s.maxSum; a++) for (let b = s.zero ? 0 : 1; a + b <= s.maxSum; b++) {
      if (a + b === 0) continue; if (a === b && !s.double) continue; pool.push([a, b]);
    }
    if (!pool.length) pool.push([2, 1], [1, 2], [3, 1]);
    let bag = [], pbag = [], mbag = [], prev = '', prevSum = -1;
    const qs = [];
    for (let i = 0; i < s.count; i++) {
      if (bag.length < 2) bag = bag.concat(shuffle(pool));
      let idx = bag.findIndex(([a, b]) => a + ',' + b !== prev && a + b !== prevSum); if (idx < 0) idx = 0;

  build(qd) {
    const s = this.S();
    const base = { ...qd, step: 1, sub: 'count', cntL: [], cntR: [], cntA: [], merged: false, shownL: qd.mode === 'picture' ? qd.a : 0, shownR: qd.mode === 'picture' ? qd.b : 0, slots: [null, '+', null, '=', null], opts: [], wrongNow: [], glow: null, errors: 0, prompted: false, hints: 0, wrongs: [], done: false, color: s.color, mustCount: s.mustCount };
    if (qd.mode === 'picture') { base.symSelf = !!s.symSelf; if (base.symSelf) base.slots = [null, null, null, null, null]; base.sub = (!s.mustCount || qd.a === 0) ? 'choose' : 'count'; if (base.sub === 'choose') base.opts = this.makeOpts(qd.a, 1, qd); }
    if (qd.mode === 'calc') { base.sub = 'tapnum'; base.slots = [qd.a, '+', qd.b, '=', null]; base.calcLv = s.calcLv; }
    if (qd.mode === 'listen') { base.lv = s.listenLv; base.slots = s.listenLv === 1 ? [null, '+', null, '=', null] : [null, null, null, null, null]; base.active = 0; base.seg = -1; base.step = 0; }
    return base;
  }
  makeOpts(v, step, q) {
    const s = this.S(), max = s.maxSum, lo = s.zero ? 0 : 1;
    if (s.answer === 'pad') return [];
    const k = s.answer === 'c3' ? 3 : 2;
    const cand = [];
    if (step === 1 && q.b !== v) cand.push(q.b);
    if (step === 2 && q.a !== v) cand.push(q.a);
    if (step === 4) { if (q.a !== v) cand.push(q.a); if (q.b !== v) cand.push(q.b); }
    shuffle([v + 1, v - 1, v + 2, v - 2]).forEach(x => cand.push(x));
    const ds = []; cand.forEach(x => { if (x >= lo && x <= Math.max(max, v + 1) && x !== v && !ds.includes(x)) ds.push(x); });
    for (let x = 0; ds.length < k - 1 && x <= 10; x++) if (x !== v && !ds.includes(x)) ds.push(x);
    const pick = shuffle(ds.slice(0, Math.max(k - 1, 1) + 1)).slice(0, k - 1);
    // 正確答案位置：隨機，但不可連續 3 次同一位置
    let pos = rnd(0, k - 1); const hst = this.posHist.slice(-2);
    if (hst.length === 2 && hst[0] === hst[1] && hst[0] === pos) pos = (pos + rnd(1, k - 1)) % k;
    this.posHist.push(pos);
    const opts = shuffle(pick); opts.splice(pos, 0, v); return opts;
  }
  symOpts() { let pos = rnd(0, 1); const hst = this.posHist.slice(-2); if (hst.length === 2 && hst[0] === hst[1] && hst[0] === pos) pos = 1 - pos; this.posHist.push(pos); return pos === 0 ? (this.state.cur.step === 1 ? ['+', '='] : ['=', '+']) : (this.state.cur.step === 1 ? ['=', '+'] : ['+', '=']); }
  newRound() {

    const questions = this.genQuestions(), cur = this.build(questions[0]);
    this.setState({ questions, q: 0, cur, lock: false, fx: null, ppT: null, ppPend: null, ppPage: false });

  }
  goNext() {
    this.setState({ ppT: null, ppPend: null, ppPage: false });
    const { q, questions } = this.state; this.clearTimers();
    if (q + 1 >= questions.length) {
      const rm = this.S().rewardMode;
      this.setState({ view: 'reward', rewardSrc: this.pickReward(), puzzleDone: false, puzzleKey: (this.state.puzzleKey || 0) + 1 });
      this.speak(rm === 'tangram' ? '看右邊，拼一樣的' : rm === 'picture' ? '完成了！' : '拼拼看');
      return;
    }
    const cur = this.build(questions[q + 1]);
    this.setState({ q: q + 1, cur, lock: false, fx: null }); this.onQStart(cur);
  }
  onArrow() { if (this.state.ppPend != null && this.ppOn()) this.setState({ ppT: this.state.ppPend, ppPage: true }); else this.goNext(); }

  /* ----- 語音 ----- */
  names(q) { const p = PAIRS[q.pair]; return { A: p.a[1], B: p.b[1], m: p.m }; }
  prompt(c) {
    const { A, B, m } = this.names(c);
    if (c.mode === 'listen') return null;
    if (c.mode === 'calc') { if (c.step === 1) return '點一下數字'; if (c.step === 2) return '再點一下這個數字'; if (c.step === 3) return c.calcLv === 'on' ? `從${cn(c.a)}開始，往下數` : '合起來，數一數'; return '合起來是多少？'; }
    if (c.sub === 'sym') return '要放什麼符號？';
    if (c.step === 1) return c.sub === 'count' ? `數一數，有幾${m}${A}？` : `有幾${m}${A}？`;
    if (c.step === 2) return c.sub === 'count' ? `數一數，有幾${m}${B}？` : `有幾${m}${B}？`;
    if (c.step === 3) return '合起來，數一數';
    return `合起來有幾${m}？`;
  }
  sentence(c) { return `${cn(c.a)}加${cn(c.b)}等於${cn(c.sum)}`; }
  segText(c, i) { return [cn(c.a), '加', cn(c.b), '等於', cn(c.sum)][i]; }
  onQStart(c) {
    if (this.state.view !== 'game') return;
    if (c.mode === 'listen') { this.later(() => this.listenPlay(), 700); return; }
    if (this.S().autoSpeak) this.later(() => this.speak(this.prompt(this.state.cur)), 700);
  }
  setCur(patch, cb) { this.setState(st => ({ cur: st.cur && { ...st.cur, ...(typeof patch === 'function' ? patch(st.cur) : patch) } }), cb); }

  /* ----- 點數 ----- */
  tapItem(g, i) {
    const { cur: c, lock } = this.state; if (!c || c.done || lock) return;
    if (c.mode === 'listen') return;
    const s = this.S();
    if (!c.merged) {
      if (c.step === 1 && g === 0 && c.mode === 'picture' && !c.cntL.includes(i)) {
        const cntL = [...c.cntL, i]; this.setCur({ cntL }); if (s.countSay) this.speak(cn(cntL.length));
        if (cntL.length === c.a && c.sub === 'count') this.toChoose(1);
      } else if (c.step === 2 && g === 1 && c.mode === 'picture' && !c.cntR.includes(i)) {
        const cntR = [...c.cntR, i]; this.setCur({ cntR }); if (s.countSay) this.speak(cn(cntR.length));
        if (cntR.length === c.b && c.sub === 'count') this.toChoose(2);
      }
      return;
    }
    if (c.step !== 3 && !(c.step === 4 && !c.mustCount)) return;
    const id = g + ':' + i; if (c.cntA.includes(id)) return;
    if (c.mode === 'calc' && c.calcLv === 'on' && g === 0) return;
    const cntA = [...c.cntA, id]; const base = c.mode === 'calc' && c.calcLv === 'on' ? c.a : 0;
    this.setCur({ cntA }); if (s.countSay) this.speak(cn(base + cntA.length));
    const need = c.mode === 'calc' && c.calcLv === 'on' ? c.b : c.sum;
    if (cntA.length === need && c.step === 3) this.later(() => this.toStep4(), 700);
  }
  toChoose(step) {
    this.setState({ lock: true });
    this.later(() => { const c = this.state.cur; const v = step === 1 ? c.a : c.b; const nc = { ...c, sub: 'choose', opts: this.makeOpts(v, step, c), wrongNow: [], glow: null }; this.setState({ cur: nc, lock: false }); this.speak(this.prompt(nc)); }, 650);
  }
  toStep(step) {
    const c = this.state.cur;
    if (step === 2) {
      const sub = c.mode === 'calc' ? 'tapnum' : (!c.mustCount || c.b === 0) ? 'choose' : 'count';
      const nc = { ...c, step: 2, sub, opts: sub === 'choose' ? this.makeOpts(c.b, 2, c) : [], wrongNow: [], glow: null };
      this.setState({ cur: nc }); this.later(() => this.speak(this.prompt(this.state.cur)), 500);
    }
    if (step === 3) {
      this.setState({ lock: true }); this.setCur({ step: 3, sub: 'count', merged: false, opts: [], wrongNow: [], glow: null });
      this.later(() => this.setCur({ merged: true }), 450);
      this.later(() => {
        const c2 = this.state.cur; this.setState({ lock: false });
        const need = c2.mode === 'calc' && c2.calcLv === 'on' ? c2.b : c2.sum;
        if (!c2.mustCount || need === 0) { this.toStep4(); return; }
        this.speak(this.prompt(c2));
      }, 1400);
    }
  }
  toStep4() {
    const c = this.state.cur; const nc = { ...c, step: 4, sub: 'choose', opts: this.makeOpts(c.sum, 4, c), wrongNow: [], glow: null };
    this.setState({ cur: nc, lock: false }); this.speak(this.prompt(nc));
  }
  /* 看算式：點數字長出圖 */
  tapNum(slot) {
    const { cur: c, lock } = this.state; if (!c || c.done || lock || c.mode !== 'calc' || c.sub !== 'tapnum') return;

    if (c.step === 1 && slot === 0) {

      if (c.calcLv === 'on') { this.setCur({ shownL: c.a }); this.speak(cn(c.a)); this.later(() => { this.setState({ lock: false }); this.toStep(2); }, 900); return; }
      if (c.a === 0) { this.speak('零，沒有'); this.later(() => { this.setState({ lock: false }); this.toStep(2); }, 1100); return; }
      for (let k = 1; k <= c.a; k++) this.later(() => { this.setCur({ shownL: k }); if (s.countSay) this.speak(cn(k)); }, (k - 1) * 750);

      if (c.b === 0) { this.speak('零，沒有'); this.later(() => { this.setState({ lock: false }); this.toStep(3); }, 1100); return; }
      for (let k = 1; k <= c.b; k++) this.later(() => { this.setCur({ shownR: k }); if (s.countSay) this.speak(cn(k)); }, (k - 1) * 750);
      this.later(() => { this.setState({ lock: false }); this.toStep(3); }, c.b * 750 + 500);
    }
