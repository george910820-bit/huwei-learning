<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>句型影片｜因為……，所以……</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{--night:#2a2350;--deck:#352d63;--line:#4b4285;--paper:#fffaf0;--sun:#ffd84d;--pink:#ff6f91;--ink:#4a3426;--sky:#4fa3e8;--muted:#c6bfe8;
  --f-round:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;--f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--f-body);padding:14px max(14px,env(safe-area-inset-left,0px)) 30px;
  background-image:radial-gradient(circle at 15% 0%,#3d3480 0,transparent 45%),radial-gradient(circle at 90% 100%,#4a2f6e 0,transparent 40%)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tag{font-family:var(--f-round);font-size:.95rem;background:var(--pink);color:#fff;padding:5px 14px;border-radius:999px;letter-spacing:.06em}
h1{margin:0;font-family:var(--f-round);font-weight:400;font-size:clamp(1.3rem,3.2vw,1.9rem)}
.stage{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#000;border:5px solid #1a1533;box-shadow:0 0 0 3px var(--line),0 18px 40px rgba(0,0,0,.45)}
.stage svg{display:block;width:100%;height:100%}
.theater{display:flex;flex-direction:column;gap:10px}
.subbar{min-height:clamp(3.2rem,7vw,5.2rem);display:flex;align-items:center;justify-content:center}
.sub{display:flex;align-items:center;gap:.55em;max-width:100%;background:#fffaf0;color:var(--ink);border:4px solid #1a1533;padding:.3em .9em .35em .35em;border-radius:999px;font-family:var(--f-round);font-size:clamp(1.05rem,2.7vw,2rem);line-height:1.35}
.sub.in{animation:subin .3s cubic-bezier(.3,1.5,.5,1)}
.who{flex:none;color:var(--ink);font-size:.72em;padding:.2em .7em;border-radius:999px;font-weight:700;white-space:nowrap}
@keyframes subin{from{transform:translateY(8px)}to{transform:none}}
.stage{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.phint{position:absolute;top:2.2%;right:1.6%;display:flex;align-items:center;gap:.35em;font-family:var(--f-round);font-size:clamp(.75rem,1.7vw,1.15rem);color:#fff;background:rgba(40,28,60,.62);padding:.25em .8em;border-radius:999px;pointer-events:none}
.flash{position:absolute;left:50%;top:50%;width:min(16%,110px);aspect-ratio:1;margin:calc(min(16%,110px) / -2) 0 0 calc(min(16%,110px) / -2);border-radius:50%;background:rgba(40,28,60,.55);color:#fff;display:grid;place-items:center;font-size:clamp(1.4rem,4vw,2.8rem);pointer-events:none;opacity:0}
.flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.95;transform:scale(.7)}40%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.deck{background:var(--deck);border:3px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;gap:5px;height:14px}
.seg{flex-basis:0;min-width:10px;border:0;padding:0;border-radius:7px;background:#4b4285;overflow:hidden;cursor:pointer}
.seg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--pink))}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn{font:inherit;font-family:var(--f-round);font-size:1.05rem;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 0 var(--ink);white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.main{background:var(--sun);min-width:7em}
.btn[aria-pressed="false"]{background:#d8d3ee}
.btn:focus-visible,.seg:focus-visible,.chap:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.chapters{display:flex;gap:8px;flex-wrap:wrap}
.chap{font:inherit;font-family:var(--f-round);font-size:.95rem;color:var(--paper);background:transparent;border:2px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:7px;cursor:pointer}
.chap span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:.85rem}
.chap.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.chap.on span{background:var(--pink);color:#fff}
.vpanel{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:16px;display:grid;gap:12px}
.vrow{display:grid;grid-template-columns:8em 1fr auto;gap:10px;align-items:center}
.vrow label{font-weight:900}
.vrow select{font:inherit;font-weight:700;border:3px solid var(--ink);border-radius:10px;padding:7px;width:100%;min-width:0;background:#fff;color:var(--ink)}
.vrow input[type=range]{width:100%;accent-color:var(--pink)}
.vnote{margin:0;color:#6b5f80}.vnote:empty{display:none}
.tip{margin:0;color:var(--muted);font-size:.92rem;line-height:1.6}
@media (max-width:640px){.vrow{grid-template-columns:1fr}.btn{font-size:.95rem;padding:7px 10px}.spacer{display:none}}
.theater:fullscreen{background:#1a1533;justify-content:center;align-items:center;padding:1vh}
.theater:fullscreen .stage{height:84vh;aspect-ratio:16/9;max-width:100vw}
.theater:fullscreen .sub{font-size:3.2vh}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="tag">虎尾句型小教室</span><h1>因為……，所以……</h1></header>
  <div class="theater" id="stage">
    <div class="stage">
      <svg id="svg" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="因為所以句型卡通短片"></svg>
      <div class="phint" id="phint">連點兩下　▶ 播放</div>
      <div class="flash" id="flash" aria-hidden="true">▶</div>
    </div>
    <div class="subbar"><div class="sub" id="sub" aria-live="polite"><span class="who" id="subWho">旁白</span><span id="subText"></span></div></div>
  </div>
  <div class="deck">
    <div class="bar" id="bar"></div>
    <div class="ctrls">
      <button class="btn main" id="play">▶ 播放</button>
      <button class="btn" id="prev">⏮ 上一段</button>
      <button class="btn" id="replay">↺ 重播這段</button>
      <button class="btn" id="next">下一段 ⏭</button>
      <span class="spacer"></span>
      <button class="btn" id="voice" aria-pressed="true">語音：開</button>
      <button class="btn" id="subs" aria-pressed="true">字幕：開</button>
      <button class="btn" id="vset" aria-expanded="false" aria-controls="vpanel">語音設定</button>
      <button class="btn" id="fs">全螢幕</button>
    </div>
    <div class="chapters" id="chapters"></div>
    <div class="vpanel" id="vpanel" hidden>
      <div class="vrow"><label for="selN">旁白的聲音</label><select id="selN"></select><button class="btn" id="testN">試聽</button></div>
      <div class="vrow"><label for="selC">角色的聲音</label><select id="selC"></select><button class="btn" id="testC">試聽</button></div>
      <div class="vrow"><label for="rate">說話速度 <b id="rateLab">0.85</b></label><input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="0.85"><span></span></div>
      <p class="vnote" id="vnote"></p>
      <div><button class="btn main" id="vclose">完成</button></div>
    </div>
    <p class="tip">在畫面上連點兩下可以播放或暫停，也可以按空白鍵，← → 換段落。「換你念念看」那一句會停幾秒，讓小朋友跟著亮起來的地方念。</p>
  </div>
</div>
<script>
// ===== 句型小教室｜Q版小動物動畫引擎 =====
const W = 1280, H = 720, OL = '#4a3426';
const FONT = "'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const EZ = {
  lin: t => t,
  io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  back: t => { const c1 = 1.8, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
function kf(t, k) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) {
    if (t <= k[i][0]) { const [t0, v0] = k[i - 1], [t1, v1, e] = k[i]; return lerp(v0, v1, EZ[e || 'io']((t - t0) / (t1 - t0))); }
  }
  return k[k.length - 1][1];
}
const pop = (t, at, dur = .4) => t < at ? 0 : EZ.back(clamp((t - at) / dur));
const fade = (t, a, b) => clamp((t - a) / (b - a));
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const f1 = n => Math.round(n * 10) / 10;

// ---------- 角色資料 ----------
const SP = {
  bear:  { name: '小熊', fur: '#c98b5a', fur2: '#f6dcbc', shirt: '#4fa3e8', trim: '#ffffff', ear: 'round', ph: 0 },
  bunny: { name: '小兔', fur: '#fffaf6', fur2: '#ffc6d5', shirt: '#ff8fb3', trim: '#fff3a8', ear: 'long', bow: '#ff4f86', ph: 1.3 },
  cat:   { name: '小貓', fur: '#ffb45e', fur2: '#fff2df', shirt: '#5cc98a', trim: '#ffe066', ear: 'tri', stripe: '#e88c30', tail: true, ph: 2.4 },
  owl:   { name: '貓頭鷹老師', fur: '#9579d6', fur2: '#f3ecff', shirt: '#9579d6', trim: '#ffd84d', ear: 'tuft', owl: true, ph: .7 },
};
function P(id, o) {
  return Object.assign({ id, x: 640, y: 660, s: .9, face: 1, expr: 'neutral', talk: false, lx: 0, ly: 0,
    la: [8], ra: [8], tilt: 0, htilt: 0, jump: 0, walk: 0, op: 1, fx: [], hold: null, sq: 0 }, o);
}
const WAVE = T => 150 + Math.sin(T * 9) * 22;
const UP = 165;

function armEnd(side, ang) {
  const a = ang * Math.PI / 180, sx = side * 46, sy = -112;
  return { sx, sy, hx: sx + side * Math.sin(a) * 52, hy: sy + Math.cos(a) * 52 };
}
function armSVG(side, ang, d) {
  const p = armEnd(side, ang);
  const col = d.owl ? d.fur : d.shirt;
  return `<line x1="${p.sx}" y1="${p.sy}" x2="${f1(p.hx)}" y2="${f1(p.hy)}" stroke="${OL}" stroke-width="33" stroke-linecap="round"/>
  <line x1="${p.sx}" y1="${p.sy}" x2="${f1(p.hx)}" y2="${f1(p.hy)}" stroke="${col}" stroke-width="24" stroke-linecap="round"/>
  <circle cx="${f1(p.hx)}" cy="${f1(p.hy)}" r="15" fill="${d.owl ? d.fur2 : d.fur}" stroke="${OL}" stroke-width="4.5"/>`;
}
function earsSVG(d, T, c) {
  const wig = Math.sin(T * 2.2 + d.ph) * 4;
  if (d.ear === 'round') return [-1, 1].map(s => `<circle cx="${s * 70}" cy="-290" r="30" fill="${d.fur}" stroke="${OL}" stroke-width="5"/><circle cx="${s * 70}" cy="-288" r="15" fill="${d.fur2}"/>`).join('');
  if (d.ear === 'long') {
    const droop = c.expr === 'sad' || c.expr === 'cry' ? 1 : 0;
    return [-1, 1].map(s => {
      const r = s * (10 + wig) + (droop ? s * 55 : 0);
      return `<g transform="rotate(${f1(r)} ${s * 38} -282)"><ellipse cx="${s * 38}" cy="-360" rx="25" ry="70" fill="${d.fur}" stroke="${OL}" stroke-width="5"/><ellipse cx="${s * 38}" cy="-356" rx="12" ry="50" fill="${d.fur2}"/></g>`;
    }).join('');
  }
  if (d.ear === 'tri') return [-1, 1].map(s => `<g transform="rotate(${f1(s * wig * .6)} ${s * 60} -270)"><path d="M${s * 28} -282 L${s * 72} -350 L${s * 92} -258Z" fill="${d.fur}" stroke="${OL}" stroke-width="5" stroke-linejoin="round"/><path d="M${s * 44} -282 L${s * 70} -326 L${s * 80} -270Z" fill="${d.fur2}"/></g>`).join('');
  if (d.ear === 'tuft') return [-1, 1].map(s => `<path d="M${s * 40} -284 L${s * 82} -338 L${s * 90} -262Z" fill="${d.fur}" stroke="${OL}" stroke-width="5" stroke-linejoin="round"/>`).join('');
  return '';
}
function eyesSVG(c, d, T) {
  const e = c.expr, lx = c.lx * 7, ly = c.ly * 5;
  const blink = ((T + d.ph * 1.7) % 3.9) < .13;
  let s = '';
  for (const sd of [-1, 1]) {
    const cx = sd * 34 + lx, cy = -220 + ly;
    if (d.owl) s += `<circle cx="${sd * 34}" cy="-220" r="34" fill="${d.fur2}" stroke="${OL}" stroke-width="4"/>`;
    if (e === 'happy' || e === 'laugh' || e === 'yum') {
      s += `<path d="M${cx - 13} ${cy + 4} Q${cx} ${cy - 14} ${cx + 13} ${cy + 4}" fill="none" stroke="${OL}" stroke-width="7" stroke-linecap="round"/>`;
    } else if (e === 'sleepy') {
      s += `<path d="M${cx - 13} ${cy} Q${cx} ${cy + 9} ${cx + 13} ${cy}" fill="none" stroke="${OL}" stroke-width="6" stroke-linecap="round"/>`;
    } else if (e === 'cry' || e === 'hurt') {
      s += `<path d="M${cx - 12 * sd} ${cy - 10} L${cx + 10 * sd} ${cy} L${cx - 12 * sd} ${cy + 10}" fill="none" stroke="${OL}" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    } else if (e === 'hot') {
      s += `<ellipse cx="${cx}" cy="${cy + 3}" rx="11" ry="9" fill="${OL}"/><path d="M${cx - 15} ${cy - 3} H${cx + 15}" stroke="${d.owl ? d.fur2 : d.fur}" stroke-width="9"/><path d="M${cx - 14} ${cy - 2} Q${cx} ${cy - 6} ${cx + 14} ${cy - 2}" fill="none" stroke="${OL}" stroke-width="5" stroke-linecap="round"/>`;
    } else if (blink && e !== 'surprised') {
      s += `<path d="M${cx - 12} ${cy} H${cx + 12}" stroke="${OL}" stroke-width="6" stroke-linecap="round"/>`;
    } else {
      const big = e === 'surprised' ? 1.25 : e === 'sad' ? .9 : 1;
      s += `<ellipse cx="${cx}" cy="${cy}" rx="${f1(12 * big)}" ry="${f1(16 * big)}" fill="${OL}"/><circle cx="${f1(cx - 4)}" cy="${f1(cy - 6 * big)}" r="${f1(5 * big)}" fill="#fff"/><circle cx="${f1(cx + 5)}" cy="${f1(cy + 6)}" r="2.4" fill="#fff"/>`;
    }
    if (e === 'sad' || e === 'cry') s += `<path d="M${cx - 14 * sd} ${cy - 30} L${cx + 10 * sd} ${cy - 22}" stroke="${OL}" stroke-width="5" stroke-linecap="round" transform="rotate(${sd * -8} ${cx} ${cy - 26})"/>`;
    if (e === 'think') s += `<path d="M${cx - 12} ${cy - 28} Q${cx} ${cy - 34} ${cx + 12} ${cy - 28}" fill="none" stroke="${OL}" stroke-width="4.5" stroke-linecap="round"/>`;
  }
  if (e === 'cry') {
    for (const sd of [-1, 1]) {
      const ph = (T * 1.5 + (sd > 0 ? .5 : 0)) % 1, x = sd * 40 + lx;
      s += `<path d="M${x} -208 Q${x + sd * 6} -180 ${x + sd * 4} -150" fill="none" stroke="#7cc8ff" stroke-width="10" stroke-linecap="round" opacity=".9"/><circle cx="${f1(x + sd * (8 + ph * 30))}" cy="${f1(-150 + ph * 50)}" r="${f1(7 * (1 - ph * .5))}" fill="#7cc8ff" opacity="${f1(1 - ph)}"/>`;
    }
  }
  return s;
}
function mouthSVG(c, d, T) {
  const e = c.expr, my = d.owl ? -184 : -178;
  const red = '#c9405a', tongue = '#ff8a9e';
  const open = (ry, rx = 15) => `<path d="M${-rx} ${my - 2} Q0 ${f1(my - 2 + ry * 2.2)} ${rx} ${my - 2}Z" fill="${red}" stroke="${OL}" stroke-width="4.5" stroke-linejoin="round"/><ellipse cx="0" cy="${f1(my - 2 + ry * 1.25)}" rx="${f1(rx * .5)}" ry="${f1(Math.max(1, ry * .45))}" fill="${tongue}"/>`;
  if (d.owl) {
    const o = c.talk ? (Math.sin(T * 16) + 1) * 4 : e === 'laugh' || e === 'surprised' ? 7 : 0;
    return `<path d="M-14 -196 L14 -196 L0 ${f1(-176 + o * .3)}Z" fill="#ffb02e" stroke="${OL}" stroke-width="4" stroke-linejoin="round"/>` + (o > .5 ? `<path d="M-10 ${f1(-180 + o * .3)} L10 ${f1(-180 + o * .3)} L0 ${f1(-168 + o)}Z" fill="#ff9a1f" stroke="${OL}" stroke-width="3.5" stroke-linejoin="round"/>` : '');
  }
  if (c.talk) return open(4 + (Math.sin(T * 16) + 1) * 4.5);
  switch (e) {
    case 'happy': return open(8, 16);
    case 'laugh': return open(13, 20);
    case 'surprised': return `<ellipse cx="0" cy="${my + 4}" rx="9" ry="12" fill="${red}" stroke="${OL}" stroke-width="4.5"/>`;
    case 'sad': case 'hurt': return `<path d="M-12 ${my + 6} Q0 ${my - 6} 12 ${my + 6}" fill="none" stroke="${OL}" stroke-width="5" stroke-linecap="round"/>`;
    case 'cry': return open(9, 17);
    case 'hot': return `<path d="M-10 ${my - 2} Q0 ${my + 4} 10 ${my - 2}" fill="none" stroke="${OL}" stroke-width="5" stroke-linecap="round"/><path d="M-6 ${my + 1} Q-6 ${my + 18} 0 ${my + 18} Q6 ${my + 18} 6 ${my + 1}Z" fill="${tongue}" stroke="${OL}" stroke-width="3.5"/>`;
    case 'sleepy': { const y = (Math.sin(T * 1.2) + 1) / 2; return y > .6 ? `<ellipse cx="0" cy="${my + 6}" rx="13" ry="${f1(10 + (y - .6) * 30)}" fill="${red}" stroke="${OL}" stroke-width="4.5"/>` : `<ellipse cx="0" cy="${my + 2}" rx="6" ry="4" fill="${red}" stroke="${OL}" stroke-width="3.5"/>`; }
    case 'yum': { const ch = Math.sin(T * 12) > 0; return ch ? `<path d="M-10 ${my} Q0 ${my + 10} 10 ${my}" fill="none" stroke="${OL}" stroke-width="5" stroke-linecap="round"/>` : `<ellipse cx="0" cy="${my + 3}" rx="8" ry="6" fill="${red}" stroke="${OL}" stroke-width="4"/>`; }
    case 'think': return `<path d="M-8 ${my + 2} H8" stroke="${OL}" stroke-width="5" stroke-linecap="round"/>`;
    default: return d.ear === 'round' ? `<path d="M-12 ${my - 2} Q0 ${my + 8} 12 ${my - 2}" fill="none" stroke="${OL}" stroke-width="5" stroke-linecap="round"/>`
      : `<path d="M-14 ${my - 3} q7 9 14 0 q7 9 14 0" fill="none" stroke="${OL}" stroke-width="4.5" stroke-linecap="round"/>`;
  }
}
function headSVG(c, d, T) {
  let s = earsSVG(d, T, c);
  s += `<ellipse cx="0" cy="-212" rx="98" ry="86" fill="${d.fur}" stroke="${OL}" stroke-width="5.5"/>`;
  if (d.stripe) s += `<path d="M-14 -296 L-10 -270 M0 -298 L0 -268 M14 -296 L10 -270" stroke="${d.stripe}" stroke-width="7" stroke-linecap="round"/>`;
  if (d.ear === 'round') s += `<ellipse cx="0" cy="-184" rx="38" ry="28" fill="${d.fur2}"/>`;
  if (d.owl) s += `<path d="M-60 -282 Q0 -262 60 -282" fill="none" stroke="#7b5fc0" stroke-width="5" stroke-linecap="round"/>`;
  // 腮紅
  if (!d.owl) s += `<ellipse cx="-62" cy="-186" rx="17" ry="10" fill="#ff8fa8" opacity="${c.expr === 'hot' ? .95 : .55}"/><ellipse cx="62" cy="-186" rx="17" ry="10" fill="#ff8fa8" opacity="${c.expr === 'hot' ? .95 : .55}"/>`;
  s += eyesSVG(c, d, T);
  if (!d.owl) s += d.ear === 'round' ? `<ellipse cx="0" cy="-198" rx="12" ry="8" fill="${OL}"/>` : `<path d="M-7 -200 L7 -200 L0 -192Z" fill="#ff7d97" stroke="${OL}" stroke-width="3" stroke-linejoin="round"/>`;
  s += mouthSVG(c, d, T);
  if (d.tail) s += [-1, 1].map(sd => `<path d="M${sd * 56} -196 L${sd * 100} -204 M${sd * 56} -186 L${sd * 100} -184" stroke="${OL}" stroke-width="3" stroke-linecap="round"/>`).join('');
  if (d.bow) s += `<g transform="translate(46,-286) rotate(16)"><path d="M0 0 L-26 -16 L-26 16Z M0 0 L26 -16 L26 16Z" fill="${d.bow}" stroke="${OL}" stroke-width="4" stroke-linejoin="round"/><circle r="8" fill="${d.bow}" stroke="${OL}" stroke-width="4"/></g>`;
  if (d.owl) s += `<g transform="translate(0,-300)"><path d="M-62 0 L0 -26 L62 0 L0 24Z" fill="#3a3352" stroke="${OL}" stroke-width="4" stroke-linejoin="round"/><rect x="-26" y="2" width="52" height="16" fill="#3a3352"/><path d="M40 0 Q52 20 50 40" fill="none" stroke="${d.trim}" stroke-width="4"/><circle cx="50" cy="44" r="6" fill="${d.trim}"/></g>`;
  return s;
}
function bodySVG(c, d, T) {

// ---------- 句子條（因為＝橘、所以＝藍） ----------
const COL = {
  cause: { f: '#ffe4c7', s: '#ff8a3d', t: '#a8480a', tag: '原因' },
  effect: { f: '#d9edff', s: '#3f8fe0', t: '#1b5aa3', tag: '結果' },
  c1: { f: '#ff8a3d', t: '#fff' }, c2: { f: '#3f8fe0', t: '#fff' },
};
// parts: [{t, k:'c1'|'cause'|'c2'|'effect'|'p'|'blank', a: 出現時間}]
function sentenceSVG(parts, cx, cy, t, o = {}) {
  const fs = o.fs || 58, pad = 26, gap = 10;
  const ws = parts.map(p => p.k === 'p' ? fs * .55 : p.k === 'blank' ? Math.max(fs * 4, tw(p.t || '', fs) + pad * 2) : tw(p.t, fs) + pad * 2);
  let total = ws.reduce((a, b) => a + b, 0) + gap * (parts.length - 1);
  const sc = Math.min(1, (o.maxW || 1220) / total);
  let x = -total / 2, s = '';
  parts.forEach((p, i) => {
    const w = ws[i], k = p.k, sc2 = p.a == null ? 1 : pop(t, p.a, .45);
    const mid = x + w / 2; x += w + gap;
    if (sc2 <= .01) return;
    const hl = o.hl === i ? 1 : 0, lift = hl ? -10 + Math.sin((o.T || 0) * 8) * 3 : 0;
    let g = '';
    const h = fs + 34;
    if (k === 'p') g = txt(p.t, 0, fs * .36, fs, OL, { sw: 0 });
    else if (k === 'c1' || k === 'c2') g = `<rect x="${f1(-w / 2)}" y="${-h / 2}" width="${f1(w)}" height="${h}" rx="${h / 2}" fill="${COL[k].f}" stroke="${OL}" stroke-width="5"/>${txt(p.t, 0, fs * .36, fs, COL[k].t, { sw: 0 })}`;
    else if (k === 'blank') {
      const c = COL[p.kind || 'cause'];
      g = `<rect x="${f1(-w / 2)}" y="${-h / 2}" width="${f1(w)}" height="${h}" rx="18" fill="#fff" stroke="${c.s}" stroke-width="5" stroke-dasharray="14 10"/>${txt(p.t || '？', 0, fs * .36, fs, c.s, { sw: 0 })}`;
    } else {
      const c = COL[k];
      g = `<rect x="${f1(-w / 2)}" y="${-h / 2}" width="${f1(w)}" height="${h}" rx="18" fill="${c.f}" stroke="${c.s}" stroke-width="6"/>${txt(p.t, 0, fs * .36, fs, c.t, { sw: 0 })}`;
    }
    if (hl) g = `<rect x="${f1(-w / 2 - 8)}" y="${-h / 2 - 8}" width="${f1(w + 16)}" height="${h + 16}" rx="26" fill="#fff36b" opacity=".85"/>` + g;
    if (o.labels && (k === 'cause' || k === 'effect' || k === 'blank')) {
      const c = COL[k === 'blank' ? (p.kind || 'cause') : k];
      g += `<g transform="translate(0,${h / 2 + 34})"><rect x="-50" y="-22" width="100" height="44" rx="22" fill="${c.s}"/>${txt(c.tag, 0, 11, 30, '#fff', { sw: 0 })}</g>`;
    }
    s += `<g transform="translate(${f1(mid)},${f1(lift)}) scale(${f1(sc2 * 100) / 100})">${g}</g>`;
  });
  const bgW = total + 60, bh = fs + 74 + (o.labels ? 60 : 0);
  const back = o.plate === false ? '' : `<rect x="${f1(-bgW / 2)}" y="${-fs / 2 - 37}" width="${f1(bgW)}" height="${bh}" rx="34" fill="#fffaf0" stroke="${OL}" stroke-width="6" opacity="${o.plateOp ?? .96}"/>`;
  return `<g transform="translate(${cx},${cy}) scale(${f1(sc * 1000) / 1000})">${back}${s}</g>`;
}
const SENT = (cause, effect, a = null, gapT = .5) => [
  { t: '因為', k: 'c1', a }, { t: cause, k: 'cause', a: a == null ? null : a + gapT }, { t: '，', k: 'p', a: a == null ? null : a + gapT * 2 },
  { t: '所以', k: 'c2', a: a == null ? null : a + gapT * 2 }, { t: effect, k: 'effect', a: a == null ? null : a + gapT * 3 }, { t: '。', k: 'p', a: a == null ? null : a + gapT * 3.5 },
];

// ---------- 畫一個畫面 ----------
function renderFrame(R, T) {
  const chars = (R.chars || []).slice().sort((a, c) => a.y - c.y);
  const gray = R.gray || 0;
  let out = `<defs>${DEFS}<filter id="gray"><feColorMatrix type="saturate" values="${f1((1 - gray * .85) * 100) / 100}"/></filter></defs>`;
  const cam = R.cam || { x: 640, y: 360, z: 1 };
  out += `<g transform="translate(640,360) scale(${f1(cam.z * 1000) / 1000}) translate(${f1(-cam.x)},${f1(-cam.y)})" ${gray > .01 ? 'filter="url(#gray)"' : ''}>`;
  out += drawBG(R, T) + (R.back || []).join('');
  for (const c of chars) out += charSVG(c, T);
  out += (R.front || []).join('');
  for (const c of chars) out += fxSVG(c, T);
  out += `</g>` + (R.ui || []).join('');
  return out;
}

const SPK = {
  N:     { name: '旁白', col: '#ffd84d', pitch: 1, rate: 1, role: 'n' },
  owl:   { name: '貓頭鷹老師', col: '#c3b0f2', pitch: .9, rate: .95, role: 'c' },

  cat:   { name: '小貓', col: '#ffc98a', pitch: 1.2, rate: 1.05, role: 'c' },
  all:   { name: '一起念', col: '#9fe2a8', pitch: 1, rate: .9, role: 'n' },
};
const hasSpeech = 'speechSynthesis' in window;
const VOPT = { rate: .85, vN: '', vC: '' };
try { Object.assign(VOPT, JSON.parse(localStorage.getItem('sentence-voice-opt') || '{}')); } catch (e) {}
const saveVOPT = () => { try { localStorage.setItem('sentence-voice-opt', JSON.stringify(VOPT)); } catch (e) {} };
function zhVoices() {
  if (!hasSpeech) return [];
  const all = speechSynthesis.getVoices().filter(v => /^zh/i.test(v.lang) && !/HK|yue/i.test(v.lang));
  const score = v => (/TW|Hant/i.test(v.lang) ? 0 : 10) + (/Online|Natural|Neural/i.test(v.name) ? 0 : 2) + (v.localService ? 1 : 0);
  return all.sort((a, b) => score(a) - score(b));
}
function speakText(text, who = 'N', onEnd, onStart) {
  if (!hasSpeech) { if (onEnd) setTimeout(onEnd, 50); return null; }
  speechSynthesis.cancel();
  const sp = SPK[who] || SPK.N;
  const u = new SpeechSynthesisUtterance(text.replace(/（[^）]*）/g, '').replace(/⋯+|……/g, '，'));
  const vs = zhVoices(), name = sp.role === 'n' ? VOPT.vN : VOPT.vC;
  const v = vs.find(x => x.name === name) || vs[0];
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'zh-TW';
  u.rate = VOPT.rate * sp.rate; u.pitch = sp.pitch;
  if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
  if (onStart) u.onstart = onStart;
  setTimeout(() => speechSynthesis.speak(u), 40);
  return u;
}

function clipEnd(id, T) { const c = CLIPS[id], b = c[c.length - 1]; return b.act(b.d + 20, T); }

// cause/effect：正確答案；wc/we：干擾卡（錯的原因、錯的結果）；ask：問句；say：遊戲裡的情境說明

const sentenceText = it => `因為${it.cause}，所以${it.effect}。`;

// ===== 影片腳本 =====
const BLANK = (cause = '', effect = '', a = null) => [
  { t: '因為', k: 'c1', a }, cause ? { t: cause, k: 'cause', a } : { t: '', k: 'blank', kind: 'cause', a }, { t: '，', k: 'p', a },
  { t: '所以', k: 'c2', a }, effect ? { t: effect, k: 'effect', a } : { t: '', k: 'blank', kind: 'effect', a }, { t: '。', k: 'p', a },

// 依時間推進的「念到哪裡」：回傳 parts 的索引
function karaoke(t, start, step) {
  if (t < start) return -1;

  return k < order.length ? order[k] : -1;
}
const cast = (t, T, o = {}) => {
  const ids = ['bear', 'bunny', 'cat'], xs = o.xs || [260, 500, 740];
  return ids.map((id, i) => {
    const at = (o.at ?? .2) + i * .2, landed = t > at + .5;

  });
};
function seriesTag(sc = 1) {
  return `<g transform="translate(640,64) scale(${f1(sc * 100) / 100})"><rect x="-210" y="-34" width="420" height="68" rx="34" fill="#ff6f91" stroke="${OL}" stroke-width="5"/>${txt(TOPIC.series, 0, 13, 38, '#fff', { sw: 0 })}</g>`;
}
function exampleBeats(it, n) {

  const base = (T, ui) => { const R = clipEnd(it.id, T); R.ui = ui; return R; };
  const Y = 108;
  return [
    ...clip,
    { who: 'owl', text: it.ask, d: 4, act: (t, T) => base(T, [sentenceSVG(BLANK('', it.effect, .2), 640, Y, t, { fs: 52, labels: true, hl: 1, T })]) },
    { who: 'owl', text: `因為${it.cause}。這是原因。`, d: 4.2, act: (t, T) => base(T, [sentenceSVG([...BLANK(it.cause, it.effect)].map((p, i) => i === 1 ? Object.assign({}, p, { a: .3 }) : p), 640, Y, t, { fs: 52, labels: true, hl: 1, T })]) },
    { who: 'owl', text: `所以，${it.effect}。這是結果。`, d: 4.4, act: (t, T) => base(T, [sentenceSVG(BLANK(it.cause, it.effect), 640, Y, t, { fs: 52, labels: true, hl: 4, T })]) },
    { who: 'owl', text: sentenceText(it), d: 5.4, act: (t, T) => base(T, [sentenceSVG(BLANK(it.cause, it.effect), 640, Y, t, { fs: 52, labels: true, hl: karaoke(t, .2, 1.1), T })]) },
    { who: 'all', text: '換你念念看！（跟著亮起來的地方念）', say: '換你念念看！', d: 8, act: (t, T) => base(T, [sentenceSVG(BLANK(it.cause, it.effect), 640, Y, t, { fs: 52, labels: true, hl: karaoke(t, 2, 1.4), T }), comic('換你念！', 1110, 300, 50, '#fff', pop(t, .1) * (1 - fade(t, 1.8, 2.1)), 6, '#5cc98a')]) },
  ];
}
const SCENES = [
  { name: '開場', tr: 'iris', beats: [
    { who: 'N', text: '歡迎來到虎尾句型小教室！', d: 4.4, act: (t, T) => ({ bg: 'stage', pal: 'warm',
      chars: [...cast(t, T, { y: 690, wave: true, xs: [250, 480, 710] }), P('owl', { x: 1000, y: t < 1 ? 1000 : kf(t, [[1, 1000], [1.4, 670, 'out'], [1.55, 690]]), s: .78, face: -1, expr: 'happy' })],
      ui: [seriesTag(pop(t, .1)), comic('因為⋯⋯所以⋯⋯', 640, 230, 84, '#fff', pop(t, 1.4), -3, '#ffb02e')] }) },
    { who: 'owl', text: '大家好，我是貓頭鷹老師。', d: 3.8, act: (t, T) => ({ bg: 'stage', pal: 'warm',

  { name: '認識句型', tr: 'wipe', beats: [

      chars: [P('owl', { x: 1060, y: 690, s: .82, face: -1, expr: 'neutral', ra: 105, fx: [F('bulb', 0, { t0: T - t + .3 })] })],
      ui: [sentenceSVG(BLANK('', '', .2), 560, 220, t, { fs: 64, labels: true, hl: t > 1 ? 1 : -1, T, maxW: 900 }), comic('為什麼？', 360, 480, 60, '#fff', pop(t, 1.6), -6, '#ff8a3d')] }) },
    { who: 'owl', text: '「所以」的後面，要說後來怎麼了，這叫做「結果」。', d: 6.2, act: (t, T) => ({ bg: 'stage', pal: 'cool',
      chars: [P('owl', { x: 1060, y: 690, s: .82, face: -1, expr: 'neutral', ra: 105 })],
      ui: [sentenceSVG(BLANK(), 560, 220, t, { fs: 64, labels: true, hl: t > 1 ? 4 : -1, T, maxW: 900 }), comic('為什麼？', 360, 480, 60, '#fff', 1, -6, '#ff8a3d'), comic('後來怎麼了？', 700, 520, 60, '#fff', pop(t, 1.6), 5, '#3f8fe0')] }) },
    { who: 'owl', text: '原因在前面，結果在後面。我們來看三個例子！', d: 5.6, act: (t, T) => ({ bg: 'stage', pal: 'cool',
      chars: [...cast(t, T, { y: 700, s: .6, xs: [180, 380, 580], at: 2.4, jump: t > 3.6 }), P('owl', { x: 1060, y: 690, s: .82, face: -1, expr: 'happy', ra: WAVE(T) })],
      ui: [sentenceSVG(BLANK(), 560, 220, t, { fs: 64, labels: true, T, maxW: 900 })] }) },
  ] },
  { name: '例子一：好熱', tr: 'wipe', beats: exampleBeats(ITEMS[0], '一') },
  { name: '例子二：下雨', tr: 'iris', beats: exampleBeats(ITEMS[1], '二') },
  { name: '例子三：肚子餓', tr: 'wipe', beats: exampleBeats(ITEMS[2], '三') },
  { name: '一起複習', tr: 'flash', beats: [
    { who: 'owl', text: '我們學了三個句子，一起再念一次。', d: 4.6, act: (t, T) => ({ bg: 'stage', pal: 'pink',
      ui: ITEMS.slice(0, 3).map((it, i) => sentenceSVG(BLANK(it.cause, it.effect, .3 + i * .5), 640, 110 + i * 200, t, { fs: 44, labels: true })) }) },
    { who: 'owl', text: '原因放在「因為」的後面，結果放在「所以」的後面。', d: 6, act: (t, T) => ({ bg: 'stage', pal: 'pink',
      ui: ITEMS.slice(0, 3).map((it, i) => sentenceSVG(BLANK(it.cause, it.effect), 640, 110 + i * 200, t, { fs: 44, labels: true, hl: t < 3 ? 1 : 4, T })) }) },
    { who: 'owl', text: '現在換你來玩句型遊戲，自己造句子吧！', d: 5.4, act: (t, T) => ({ bg: 'stage', pal: 'warm',
      chars: [...cast(t, T, { y: 690, wave: true, jump: true, xs: [250, 480, 710] }), P('owl', { x: 1000, y: 690, s: .78, face: -1, expr: 'laugh', ra: UP, fx: [F('spark')] })],
      ui: [seriesTag(), comic('換你造句囉！', 640, 220, 90, '#fff', pop(t, .8), -3, '#ff6f91'), confetti(t - .8, 5)] }) },
  ] },
];

// ===== 影片播放器 =====
const svg = document.getElementById('svg');
const subWho = document.getElementById('subWho'), subText = document.getElementById('subText'), subBox = document.getElementById('sub');
const phint = document.getElementById('phint'), flashEl = document.getElementById('flash');
let si = 0, bi = 0, bt = 0, st = 0, T = 0, playing = false, ended = false, poster = true;
let speaking = false, started = false, uttId = 0;
const opt = { voiceOn: hasSpeech, subs: true };
try { Object.assign(opt, JSON.parse(localStorage.getItem('sentence-video-opt') || '{}')); if (!hasSpeech) opt.voiceOn = false; } catch (e) {}
const saveOpt = () => { try { localStorage.setItem('sentence-video-opt', JSON.stringify(opt)); } catch (e) {} };
const cur = () => SCENES[si].beats[bi];

// 朗讀：記住念到哪裡，暫停後從那一句（逗號、句號分段）接著念
const cleanSay = t => t.replace(/（[^）]*）/g, '').replace(/⋯+|……/g, '，');
let sayText = '', sayBase = 0, sayChar = 0, sayStart = 0, sayBoundary = false, resumeAt = null;
function speakBeat(from = 0) {
  started = false; speaking = false; resumeAt = null;
  if (!opt.voiceOn || !hasSpeech) return;
  const b = cur(), id = ++uttId;
  sayText = cleanSay(b.say || b.text); sayBase = from; sayChar = from; sayBoundary = false; sayStart = 0;
  const part = sayText.slice(from);
  if (!part.replace(/[，。！？、；：\s]/g, '')) return;
  const u = speakText(part, b.who, () => { if (id === uttId) speaking = false; }, () => { if (id === uttId) { started = true; sayStart = performance.now(); } });
  if (u) {
    speaking = true;
    u.onboundary = e => { if (id === uttId) { sayBoundary = true; sayChar = from + (e.charIndex || 0); } };
  }
}
function pausedPos() {
  if (!speaking) return null;
  let pos = sayChar;
  if (!sayBoundary && started) {
    const sp = SPK[cur().who] || SPK.N, cps = 4.2 * VOPT.rate * sp.rate;
    pos = sayBase + Math.floor((performance.now() - sayStart) / 1000 * cps);
  }
  pos = Math.min(pos, sayText.length - 1);
  let k = pos - 1;
  while (k >= sayBase && !/[，。！？、；：]/.test(sayText[k])) k--;
  return Math.max(sayBase, k + 1);
}
function showSub() {
  const b = cur(), sp = SPK[b.who] || SPK.N;
  subWho.textContent = sp.name; subWho.style.background = sp.col;
  subText.textContent = b.text;
  subBox.classList.remove('in'); void subBox.offsetWidth; subBox.classList.add('in');
}
function startBeat() { bt = 0; resumeAt = null; showSub(); if (playing) speakBeat(); updateUI(); }
function goScene(i, autoplay = playing) {
  poster = false;
  si = clamp(i, 0, SCENES.length - 1); bi = 0; st = 0; ended = false;
  if (hasSpeech) speechSynthesis.cancel(); uttId++; speaking = false;
  playing = autoplay;
  startBeat();
}
function nextBeat() {
  bi++;
  if (bi >= SCENES[si].beats.length) {
    if (si >= SCENES.length - 1) { bi--; playing = false; ended = true; updateUI(); return; }
    si++; bi = 0; st = 0;
  }
  startBeat();
}
function setPlaying(p) {
  if (p && (ended || poster)) { goScene(0, true); return; }
  playing = p;
  if (!p) { const at = pausedPos(); if (hasSpeech) speechSynthesis.cancel(); uttId++; speaking = false; resumeAt = at; }
  else { if (resumeAt != null) speakBeat(resumeAt); else resumeAt = null; }
  updateUI();
}
function isTalking() {
  const b = cur();
  if (b.who === 'N' || b.who === 'all') return false;
  if (opt.voiceOn && hasSpeech && playing) {
    if (speaking && (started || bt < .8)) return bt > .15;
    return false;
  }
  return playing && bt < b.d * .75 && bt > .1;
}
const segBox = document.getElementById('bar'), chapBox = document.getElementById('chapters');
SCENES.forEach((sc, i) => {
  const dur = sc.beats.reduce((a, b) => a + b.d, 0);
  const seg = document.createElement('button');
  seg.className = 'seg'; seg.style.flexGrow = dur; seg.setAttribute('aria-label', '跳到：' + sc.name);
  seg.innerHTML = '<i></i>'; seg.onclick = () => goScene(i, true);
  segBox.appendChild(seg);
  const ch = document.createElement('button');
  ch.className = 'chap'; ch.innerHTML = `<span>${i + 1}</span>${sc.name}`; ch.onclick = () => goScene(i, true);
  chapBox.appendChild(ch);
});
const playBtn = document.getElementById('play');
function updateUI() {
  phint.hidden = playing;
  phint.textContent = ended ? '連點兩下　↺ 再看一次' : '連點兩下　▶ 播放';
  playBtn.innerHTML = playing ? '❚❚ 暫停' : '▶ 播放';
  [...chapBox.children].forEach((c, i) => c.classList.toggle('on', i === si));
  subBox.hidden = !opt.subs;
  const sb = document.getElementById('subs'); sb.textContent = opt.subs ? '字幕：開' : '字幕：關'; sb.setAttribute('aria-pressed', opt.subs);
  const vb = document.getElementById('voice');
  vb.textContent = !hasSpeech ? '這個瀏覽器不能念' : opt.voiceOn ? '語音：開' : '語音：關';
  vb.setAttribute('aria-pressed', opt.voiceOn); vb.disabled = !hasSpeech;
}
function updateBar() {
  [...segBox.children].forEach((seg, i) => {
    const sc = SCENES[i], dur = sc.beats.reduce((a, b) => a + b.d, 0);
    let p = 0;
    if (i < si) p = 1; else if (i === si) { const done = sc.beats.slice(0, bi).reduce((a, b) => a + b.d, 0); p = clamp((done + Math.min(bt, cur().d)) / dur); }
    seg.firstChild.style.width = (p * 100).toFixed(1) + '%';
  });
}
function transition(sc) {
  if (st > .9 || sc.tr === 'none') return '';
  const p = st / .9;
  if (sc.tr === 'wipe') {
    const cols = ['#4fa3e8', '#ff6f91', '#ffd84d'];
    return cols.map((c, i) => { const q = EZ.in(clamp((p - (2 - i) * .08) / .75)); return `<rect x="${f1(-260 + q * 1900)}" y="-60" width="1800" height="840" fill="${c}" transform="skewX(-14)"/>`; }).join('');
  }
  if (sc.tr === 'iris') { const r = EZ.out(clamp(p)) * 900; return `<path d="M-10 -10 H1290 V730 H-10Z M${f1(640 - r)} 360 a${f1(r)} ${f1(r)} 0 1 0 ${f1(2 * r)} 0 a${f1(r)} ${f1(r)} 0 1 0 ${f1(-2 * r)} 0Z" fill="#2a2350" fill-rule="evenodd"/>`; }
  if (sc.tr === 'flash') return `<rect width="1280" height="720" fill="#fff" opacity="${f1((1 - p) * 100) / 100}"/>`;
  return '';
}
function render() {
  const sc = SCENES[si], b = cur();
  const R = b.act(bt, T);
  const talk = isTalking();
  for (const c of R.chars || []) c.talk = c.id === b.who && talk;
  svg.innerHTML = renderFrame(R, T) + transition(sc);
}
let last = performance.now(), lastDraw = 0;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (playing) {
    bt += dt; st += dt; T += dt;
    const b = cur();
    const hold = opt.voiceOn && hasSpeech && speaking && (started || bt < b.d + 1.5) && bt < b.d + 12;
    if (bt >= b.d && !hold) nextBeat();
  }
  if (now - lastDraw > 22) { lastDraw = now; render(); updateBar(); }
  requestAnimationFrame(loop);
}
playBtn.onclick = () => setPlaying(!playing);
// 在畫面上連點兩下：播放／暫停（滑鼠和觸控都可以）
function flash() { flashEl.textContent = playing ? '▶' : '❚❚'; flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go'); }
const stageEl = document.querySelector('.stage');
let lastTap = 0, lastX = 0, lastY = 0;
stageEl.addEventListener('pointerup', e => {
  if (e.button > 0) return;
  const now = performance.now();
  if (now - lastTap < 380 && Math.hypot(e.clientX - lastX, e.clientY - lastY) < 40) { lastTap = 0; setPlaying(!playing); flash(); }
  else { lastTap = now; lastX = e.clientX; lastY = e.clientY; }
});
stageEl.addEventListener('dblclick', e => e.preventDefault());
document.getElementById('prev').onclick = () => goScene(si - 1, true);
document.getElementById('next').onclick = () => { if (si < SCENES.length - 1) goScene(si + 1, true); };
document.getElementById('replay').onclick = () => goScene(si, true);
document.getElementById('subs').onclick = () => { opt.subs = !opt.subs; saveOpt(); updateUI(); };
document.getElementById('voice').onclick = () => { opt.voiceOn = !opt.voiceOn; saveOpt(); if (!opt.voiceOn && hasSpeech) { speechSynthesis.cancel(); uttId++; speaking = false; } updateUI(); };
document.getElementById('fs').onclick = () => {
  const el = document.getElementById('stage');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
};
document.addEventListener('keydown', e => {
  if (e.target.closest('select,input')) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'ArrowRight') { if (si < SCENES.length - 1) goScene(si + 1, true); }
  if (e.key === 'ArrowLeft') goScene(si - 1, true);
});
// 語音設定
const vpanel = document.getElementById('vpanel'), vbtn = document.getElementById('vset');
const selN = document.getElementById('selN'), selC = document.getElementById('selC'), rate = document.getElementById('rate'), rateLab = document.getElementById('rateLab');
function fillVoices() {
  const vs = zhVoices();
  const html = vs.length ? vs.map(v => `<option value="${v.name}">${v.name}（${v.lang}）</option>`).join('') : '<option value="">找不到中文語音</option>';
  selN.innerHTML = html; selC.innerHTML = html;
  if (vs.length) {
    if (!vs.find(v => v.name === VOPT.vN)) VOPT.vN = vs[0].name;
    if (!vs.find(v => v.name === VOPT.vC)) VOPT.vC = (vs[1] || vs[0]).name;
    selN.value = VOPT.vN; selC.value = VOPT.vC;
  }
  document.getElementById('vnote').textContent = !hasSpeech ? '這個瀏覽器不支援朗讀，請改用 Chrome、Edge 或 Safari。' : !vs.length ? '這台裝置沒有中文語音，可以只看字幕。' : '';
}
if (hasSpeech) { fillVoices(); speechSynthesis.onvoiceschanged = fillVoices; }
rate.value = VOPT.rate; rateLab.textContent = (+VOPT.rate).toFixed(2);
vbtn.onclick = () => { vpanel.hidden = !vpanel.hidden; vbtn.setAttribute('aria-expanded', !vpanel.hidden); if (hasSpeech) fillVoices(); };
document.getElementById('vclose').onclick = () => { vpanel.hidden = true; vbtn.setAttribute('aria-expanded', 'false'); };
selN.onchange = () => { VOPT.vN = selN.value; saveVOPT(); };
selC.onchange = () => { VOPT.vC = selC.value; saveVOPT(); };
rate.oninput = () => { VOPT.rate = +rate.value; rateLab.textContent = VOPT.rate.toFixed(2); saveVOPT(); };
document.getElementById('testN').onclick = () => speakText('大家好，我是旁白。', 'N');
document.getElementById('testC').onclick = () => speakText('因為天氣很熱，所以小熊流了很多汗。', 'owl');

window.__seek = (s, b, t) => { si = s; bi = b; bt = t; st = 9; showSub(); render(); };
si = 0; bi = 2; bt = 3; st = 9; T = 3; showSub(); updateUI();
requestAnimationFrame(loop);
