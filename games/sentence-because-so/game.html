<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>句型遊戲｜因為……，所以……</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{--bg:#fff3dc;--card:#fffaf0;--ink:#4a3426;--line:#e9c48f;--sun:#ffd84d;--pink:#ff6f91;--mint:#38b77a;--red:#e8505b;--grape:#9579d6;
  --cause:#ff8a3d;--causeBg:#ffe4c7;--causeT:#a8480a;--effect:#3f8fe0;--effectBg:#d9edff;--effectT:#1b5aa3;
  --f-round:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;--f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 10% 0%,#ffe2b0 0,transparent 40%),radial-gradient(circle at 100% 100%,#ffd6e2 0,transparent 40%)}
.wrap{max-width:1240px;margin:0 auto;padding:12px 16px 30px}
.rf{font-family:var(--f-round);font-weight:400}
.btn{font:inherit;font-family:var(--f-round);font-size:1.15rem;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:16px;padding:9px 16px;cursor:pointer;box-shadow:0 4px 0 var(--ink);white-space:nowrap;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--ink)}
.btn.go{background:var(--sun)}
.btn.ok{background:var(--mint);color:#fff}
.btn.no{background:#ffe3e5}
.btn.big{font-size:1.5rem;padding:12px 28px;border-radius:20px}
.btn:focus-visible,.card:focus-visible,.slot:focus-visible{outline:4px solid #4fa3e8;outline-offset:3px}
/* ---------- 設定頁 ---------- */
.panel{background:var(--card);border:3px solid var(--line);border-radius:24px;box-shadow:0 6px 0 rgba(160,100,30,.18);padding:22px 26px}
#setup .hero{display:grid;grid-template-columns:1fr minmax(240px,42%);gap:20px;align-items:center}
#setup h1{margin:.2em 0 .3em;font-family:var(--f-round);font-weight:400;font-size:clamp(1.8rem,4.6vw,3rem);line-height:1.2}
.tag{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;padding:4px 14px;font-family:var(--f-round)}
.lead{font-size:1.1rem;line-height:1.7;margin:.3em 0}
#coverSvg{width:100%;border-radius:18px;border:3px solid var(--ink);display:block}
.form{display:grid;gap:14px;margin-top:18px}
.frow{display:grid;grid-template-columns:7.5em 1fr;gap:10px;align-items:center}
.frow>label,.frow>span{font-weight:900;font-size:1.05rem}
.frow input[type=text]{font:inherit;font-size:1.1rem;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;width:100%;max-width:320px}
.seg2{display:flex;flex-wrap:wrap;gap:8px}
.seg2 button{font:inherit;font-size:1.02rem;border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:14px;padding:8px 14px;cursor:pointer;text-align:left;line-height:1.35}
.seg2 button small{display:block;color:#8a6a4a;font-size:.85rem}
.seg2 button[aria-pressed="true"]{background:var(--sun);box-shadow:inset 0 0 0 2px var(--ink)}
.note{color:#8a6a4a;font-size:.95rem;line-height:1.6;margin:0}
@media (max-width:760px){#setup .hero{grid-template-columns:1fr}.frow{grid-template-columns:1fr}}
/* ---------- 遊戲頁 ---------- */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.lvl{font-family:var(--f-round);font-size:clamp(1.1rem,2.6vw,1.6rem)}
.lvl b{font-weight:400;color:#fff;background:var(--grape);padding:3px 12px;border-radius:999px;margin-right:6px}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:block}
.dots i.now{background:var(--sun)}
.dots i.done{background:var(--mint)}
.dots i.gap{width:8px;border:0;background:none}
.stagebox{position:relative;width:min(100%,calc(46vh * 16 / 9));margin:0 auto;aspect-ratio:16/9;border:4px solid var(--ink);border-radius:20px;overflow:hidden;background:#000}
.stagebox svg{display:block;width:100%;height:100%}
.replay{position:absolute;right:10px;bottom:10px;font-size:1rem;padding:6px 12px;background:rgba(255,250,240,.95)}
.prompt{display:flex;align-items:center;gap:10px;justify-content:center;margin:12px 0 6px;font-family:var(--f-round);font-size:clamp(1.15rem,2.7vw,1.7rem);text-align:center;flex-wrap:wrap}
.say{font-size:1rem;padding:5px 10px;border-radius:12px}
.modes{display:flex;gap:8px;justify-content:center;margin:6px 0 10px}
.modes button{font:inherit;font-family:var(--f-round);font-size:1.1rem;border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:6px 18px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:#fff}
.zone{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.frame{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;font-family:var(--f-round);font-size:clamp(1.3rem,3vw,2.3rem)}
.pill{border:3px solid var(--ink);border-radius:999px;padding:.12em .55em;color:#fff;line-height:1.4}
.pill.c1{background:var(--cause)}.pill.c2{background:var(--effect)}
.punct{font-size:1.2em;line-height:1;padding:0 .05em}
.slot{min-width:5.2em;min-height:1.9em;border:4px dashed #b9a99a;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;padding:.1em .3em;position:relative;cursor:pointer;transition:background .15s}
.slot.k-cause{border-color:var(--cause)}.slot.k-effect{border-color:var(--effect)}.slot.k-conn{min-width:3em}
.slot.k-cause::after,.slot.k-effect::after{position:absolute;bottom:-1.25em;left:50%;transform:translateX(-50%);font-size:.42em;color:#fff;border-radius:999px;padding:.05em .7em;white-space:nowrap}
.slot.k-cause::after{content:'原因';background:var(--cause)}.slot.k-effect::after{content:'結果';background:var(--effect)}
.slot.sel{background:#fff7c4;box-shadow:0 0 0 4px var(--sun)}
.slot.over{background:#fff3a8}
.slot.right{border-style:solid;border-color:var(--mint);background:#e2f7ea}
.slot .card{margin:0;box-shadow:none;border:0;background:transparent;padding:0;font-size:1em;cursor:pointer}
.frame.withlabels{margin-bottom:1.1em}
.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:3em}
.card{font-family:var(--f-round);font-size:clamp(1.25rem,2.8vw,2.1rem);background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:.2em .6em;box-shadow:0 5px 0 var(--ink);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;line-height:1.35}
.card.used{visibility:hidden}
.card.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg) scale(1.06);box-shadow:0 10px 20px rgba(0,0,0,.25)}
.card.conn1{color:var(--cause)}.card.conn2{color:var(--effect)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fb{min-height:1.6em;font-family:var(--f-round);font-size:clamp(1.05rem,2.4vw,1.5rem);text-align:center;padding:.3em .9em;border-radius:14px}
.fb.good{background:#e2f7ea;color:#1f7a4d}.fb.bad{background:#ffe8e3;color:#b23a2a}.fb.info{background:#eef3ff;color:#3a5aa8}
.fb:empty{display:none}
/* 語音 */
.mic{width:clamp(110px,16vw,150px);height:clamp(110px,16vw,150px);border-radius:50%;border:5px solid var(--ink);background:var(--pink);color:#fff;font-family:var(--f-round);font-size:1.15rem;cursor:pointer;box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;line-height:1.2}
.mic svg{width:46%;height:46%}
.mic.on{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 var(--ink),0 0 0 14px rgba(232,80,91,.25)}}
.heard{min-height:2.2em;min-width:min(100%,520px);background:#fff;border:3px dashed #c9b8a4;border-radius:16px;padding:.35em .8em;font-family:var(--f-round);font-size:clamp(1.2rem,2.8vw,1.9rem);text-align:center}
.heard .hi1{color:var(--cause);font-weight:900}.heard .hi2{color:var(--effect);font-weight:900}
.heard.empty{color:#a8957f;font-size:1.05rem}
.chk{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:1rem}
.chk span{border-radius:999px;padding:3px 12px;background:#efe7dc;color:#8a7864}
.chk span.y{background:#e2f7ea;color:#1f7a4d}
.judge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;border-top:3px dotted var(--line);padding-top:12px;width:100%}
.judge b{font-family:var(--f-round);font-weight:400;font-size:1.15rem;background:var(--ink);color:#fff;border-radius:10px;padding:4px 10px}
.vnote{font-size:.95rem;color:#8a6a4a;text-align:center;margin:0;max-width:640px;line-height:1.6}
.vnote:empty{display:none}
.hint{font-size:1rem;padding:5px 12px}
/* 過場、結果 */
.center{text-align:center}
.bigmsg{font-family:var(--f-round);font-size:clamp(1.8rem,5vw,3.2rem);margin:.2em 0}
table{border-collapse:collapse;width:100%;font-size:1.05rem;margin:14px 0}
th,td{border:2px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#ffe9c4}
td.st{white-space:nowrap;color:#e0a100;font-size:1.2rem}
.sumrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.sumrow div{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 18px;font-family:var(--f-round);font-size:1.2rem}
.sumrow b{font-size:1.8rem;font-weight:400;color:var(--pink)}
@media (max-width:520px){.frame{font-size:1.15rem;gap:5px}.slot{min-width:3.6em}.pill{padding:.1em .4em}.card{font-size:1.15rem}.zone{padding:12px 8px}}
@media print{.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <!-- 設定 -->
  <section id="setup" class="panel">
    <div class="hero">
      <div>
        <span class="tag">虎尾句型小教室</span>
        <h1>句型遊戲：<br>因為……，所以……</h1>
        <p class="lead">第一關：影片裡的三個句子。<br>第二關：看三段新的短片，自己造句。</p>
      </div>
      <svg id="coverSvg" viewBox="0 0 1280 720" aria-hidden="true"></svg>
    </div>
    <div class="form">
      <div class="frow"><label for="kid">小朋友名字</label><input type="text" id="kid" placeholder="可以不填" autocomplete="off"></div>
      <div class="frow"><span>難度</span><div class="seg2" id="optLevel">
        <button data-v="easy" aria-pressed="true">簡單<small>「因為」「所以」已經放好，只排原因和結果</small></button>
        <button data-v="hard" aria-pressed="false">挑戰<small>「因為」「所以」也要自己排</small></button></div></div>
      <div class="frow"><span>第一關作答</span><div class="seg2" id="optM1">
        <button data-v="build" aria-pressed="true">排字卡<small>點選或拖拉</small></button>
        <button data-v="voice" aria-pressed="false">用說的<small>老師判斷對不對</small></button></div></div>
      <div class="frow"><span>第二關作答</span><div class="seg2" id="optM2">
        <button data-v="build" aria-pressed="true">排字卡<small>點選或拖拉</small></button>
        <button data-v="voice" aria-pressed="false">用說的<small>老師判斷對不對</small></button></div></div>
      <p class="note">每一題都可以在畫面上切換「排字卡」和「用說的」。用說的要用 Chrome、開網路、接麥克風；辨識出來的字只是參考，對不對由老師按按鈕決定。</p>
      <div><button class="btn go big" id="startBtn">開始玩 ▶</button></div>
    </div>
  </section>

  <!-- 題目 -->
  <section id="play" hidden>
    <div class="top">
      <div class="lvl" id="lvl"></div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="stagebox"><svg id="svg" viewBox="0 0 1280 720" role="img" aria-label="情境短片"></svg>
      <button class="btn replay" id="replay">▶ 再看一次</button></div>
    <div class="prompt"><span id="promptText"></span><button class="btn say" id="sayPrompt" aria-label="念題目">🔊</button></div>
    <div class="modes" role="group" aria-label="作答方式">
      <button id="mBuild" aria-pressed="true">🖐 排字卡</button>
      <button id="mVoice" aria-pressed="false">🎤 用說的</button>
    </div>
    <div class="zone" id="zBuild">
      <div class="frame withlabels" id="frame"></div>
      <div class="tray" id="tray"></div>
      <div class="fb" id="fbB" aria-live="polite"></div>
      <div class="acts">
        <button class="btn" id="readBtn">🔊 念念看</button>
        <button class="btn" id="clearBtn">↺ 重排</button>
        <button class="btn go" id="checkBtn">✔ 檢查</button>
      </div>
    </div>
    <div class="zone" id="zVoice" hidden>
      <div class="frame" id="vframe"></div>
      <button class="btn hint" id="hintBtn">💡 給一點提示</button>
      <button class="mic" id="micBtn"><span><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg><br><b id="micLab" class="rf">按我說</b></span></button>
      <div class="heard empty" id="heard">按麥克風，用「因為……，所以……」說一句話</div>
      <div class="chk"><span id="c1">說到「因為」</span><span id="c2">說到「所以」</span></div>
      <p class="vnote" id="vnote"></p>
      <div class="fb" id="fbV" aria-live="polite"></div>
      <div class="judge noprint"><b>老師判斷</b><button class="btn ok" id="judgeOk">✔ 說對了</button><button class="btn no" id="judgeNo">✘ 再試一次</button></div>
    </div>
    <div class="zone" id="zNext" hidden>
      <div class="fb good" id="fbDone"></div>
      <div class="acts"><button class="btn" id="readAgain">🔊 再念一次</button><button class="btn go big" id="nextBtn">下一題 ➜</button></div>
    </div>
  </section>

  <!-- 過場 -->
  <section id="inter" class="panel center" hidden>
    <p class="bigmsg">第一關完成！</p>
    <p class="lead">接下來是第二關：看新的短片，自己用「因為……，所以……」造句。</p>
    <button class="btn go big" id="toPart2">開始第二關 ▶</button>
  </section>

  <!-- 成績 -->
  <section id="result" class="panel" hidden>
    <p class="bigmsg center">全部完成！</p>
    <p class="center lead" id="rInfo"></p>
    <div class="sumrow" id="rSum"></div>
    <table><thead><tr><th>題目</th><th>正確句子</th><th>作答方式</th><th>結果</th><th></th></tr></thead><tbody id="rBody"></tbody></table>
    <p class="note">這一頁可以截圖或列印，當作評量紀錄。「用說的」題目是老師按的結果。</p>
    <div class="acts noprint" style="margin-top:12px"><button class="btn" id="printBtn">🖨 列印</button><button class="btn go" id="againBtn">↺ 再玩一次</button></div>
  </section>
</div>
<script>
// ===== 句型小教室｜Q版小動物動畫引擎 =====
const W = 1280, H = 720, OL = '#4a3426';
const FONT = "'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const EZ = {
  lin: t => t,
  io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  back: t => { const c1 = 1.8, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
function kf(t, k) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) {
    if (t <= k[i][0]) { const [t0, v0] = k[i - 1], [t1, v1, e] = k[i]; return lerp(v0, v1, EZ[e || 'io']((t - t0) / (t1 - t0))); }
  }
  return k[k.length - 1][1];
}
const pop = (t, at, dur = .4) => t < at ? 0 : EZ.back(clamp((t - at) / dur));
const fade = (t, a, b) => clamp((t - a) / (b - a));
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const f1 = n => Math.round(n * 10) / 10;

// ---------- 角色資料 ----------
const SP = {
  bear:  { name: '小熊', fur: '#c98b5a', fur2: '#f6dcbc', shirt: '#4fa3e8', trim: '#ffffff', ear: 'round', ph: 0 },
  bunny: { name: '小兔', fur: '#fffaf6', fur2: '#ffc6d5', shirt: '#ff8fb3', trim: '#fff3a8', ear: 'long', bow: '#ff4f86', ph: 1.3 },
  cat:   { name: '小貓', fur: '#ffb45e', fur2: '#fff2df', shirt: '#5cc98a', trim: '#ffe066', ear: 'tri', stripe: '#e88c30', tail: true, ph: 2.4 },
  owl:   { name: '貓頭鷹老師', fur: '#9579d6', fur2: '#f3ecff', shirt: '#9579d6', trim: '#ffd84d', ear: 'tuft', owl: true, ph: .7 },
};
function P(id, o) {
  return Object.assign({ id, x: 640, y: 660, s: .9, face: 1, expr: 'neutral', talk: false, lx: 0, ly: 0,
    la: [8], ra: [8], tilt: 0, htilt: 0, jump: 0, walk: 0, op: 1, fx: [], hold: null, sq: 0 }, o);
}
const WAVE = T => 150 + Math.sin(T * 9) * 22;
const UP = 165;

function armEnd(side, ang) {
  const a = ang * Math.PI / 180, sx = side * 46, sy = -112;
  return { sx, sy, hx: sx + side * Math.sin(a) * 52, hy: sy + Math.cos(a) * 52 };
}
function armSVG(side, ang, d) {
  const p = armEnd(side, ang);
  const col = d.owl ? d.fur : d.shirt;
  return `<line x1="${p.sx}" y1="${p.sy}" x2="${f1(p.hx)}" y2="${f1(p.hy)}" stroke="${OL}" stroke-width="33" stroke-linecap="round"/>
  <line x1="${p.sx}" y1="${p.sy}" x2="${f1(p.hx)}" y2="${f1(p.hy)}" stroke="${col}" stroke-width="24" stroke-linecap="round"/>
  <circle cx="${f1(p.hx)}" cy="${f1(p.hy)}" r="15" fill="${d.owl ? d.fur2 : d.fur}" stroke="${OL}" stroke-width="4.5"/>`;
}
function earsSVG(d, T, c) {
  const wig = Math.sin(T * 2.2 + d.ph) * 4;
  if (d.ear === 'round') return [-1, 1].map(s => `<circle cx="${s * 70}" cy="-290" r="30" fill="${d.fur}" stroke="${OL}" stroke-width="5"/><circle cx="${s * 70}" cy="-288" r="15" fill="${d.fur2}"/>`).join('');
  if (d.ear === 'long') {
    const droop = c.expr === 'sad' || c.expr === 'cry' ? 1 : 0;
    return [-1, 1].map(s => {
      const r = s * (10 + wig) + (droop ? s * 55 : 0);
      return `<g transform="rotate(${f1(r)} ${s * 38} -282)"><ellipse cx="${s * 38}" cy="-360" rx="25" ry="70" fill="${d.fur}" stroke="${OL}" stroke-width="5"/><ellipse cx="${s * 38}" cy="-356" rx="12" ry="50" fill="${d.fur2}"/></g>`;
    }).join('');
  }
  if (d.ear === 'tri') return [-1, 1].map(s => `<g transform="rotate(${f1(s * wig * .6)} ${s * 60} -270)"><path d="M${s * 28} -282 L${s * 72} -350 L${s * 92} -258Z" fill="${d.fur}" stroke="${OL}" stroke-width="5" stroke-linejoin="round"/><path d="M${s * 44} -282 L${s * 70} -326 L${s * 80} -270Z" fill="${d.fur2}"/></g>`).join('');
  if (d.ear === 'tuft') return [-1, 1].map(s => `<path d="M${s * 40} -284 L${s * 82} -338 L${s * 90} -262Z" fill="${d.fur}" stroke="${OL}" stroke-width="5" stroke-linejoin="round"/>`).join('');
  return '';

const COL = {
  cause: { f: '#ffe4c7', s: '#ff8a3d', t: '#a8480a', tag: '原因' },
  effect: { f: '#d9edff', s: '#3f8fe0', t: '#1b5aa3', tag: '結果' },
  c1: { f: '#ff8a3d', t: '#fff' }, c2: { f: '#3f8fe0', t: '#fff' },
};
// parts: [{t, k:'c1'|'cause'|'c2'|'effect'|'p'|'blank', a: 出現時間}]
function sentenceSVG(parts, cx, cy, t, o = {}) {
  const fs = o.fs || 58, pad = 26, gap = 10;
  const ws = parts.map(p => p.k === 'p' ? fs * .55 : p.k === 'blank' ? Math.max(fs * 4, tw(p.t || '', fs) + pad * 2) : tw(p.t, fs) + pad * 2);
  let total = ws.reduce((a, b) => a + b, 0) + gap * (parts.length - 1);
  const sc = Math.min(1, (o.maxW || 1220) / total);
  let x = -total / 2, s = '';
  parts.forEach((p, i) => {
    const w = ws[i], k = p.k, sc2 = p.a == null ? 1 : pop(t, p.a, .45);
    const mid = x + w / 2; x += w + gap;
    if (sc2 <= .01) return;
    const hl = o.hl === i ? 1 : 0, lift = hl ? -10 + Math.sin((o.T || 0) * 8) * 3 : 0;
    let g = '';
    const h = fs + 34;
    if (k === 'p') g = txt(p.t, 0, fs * .36, fs, OL, { sw: 0 });
    else if (k === 'c1' || k === 'c2') g = `<rect x="${f1(-w / 2)}" y="${-h / 2}" width="${f1(w)}" height="${h}" rx="${h / 2}" fill="${COL[k].f}" stroke="${OL}" stroke-width="5"/>${txt(p.t, 0, fs * .36, fs, COL[k].t, { sw: 0 })}`;
    else if (k === 'blank') {
      const c = COL[p.kind || 'cause'];
      g = `<rect x="${f1(-w / 2)}" y="${-h / 2}" width="${f1(w)}" height="${h}" rx="18" fill="#fff" stroke="${c.s}" stroke-width="5" stroke-dasharray="14 10"/>${txt(p.t || '？', 0, fs * .36, fs, c.s, { sw: 0 })}`;
    } else {
      const c = COL[k];
      g = `<rect x="${f1(-w / 2)}" y="${-h / 2}" width="${f1(w)}" height="${h}" rx="18" fill="${c.f}" stroke="${c.s}" stroke-width="6"/>${txt(p.t, 0, fs * .36, fs, c.t, { sw: 0 })}`;
    }
    if (hl) g = `<rect x="${f1(-w / 2 - 8)}" y="${-h / 2 - 8}" width="${f1(w + 16)}" height="${h + 16}" rx="26" fill="#fff36b" opacity=".85"/>` + g;
    if (o.labels && (k === 'cause' || k === 'effect' || k === 'blank')) {
      const c = COL[k === 'blank' ? (p.kind || 'cause') : k];
      g += `<g transform="translate(0,${h / 2 + 34})"><rect x="-50" y="-22" width="100" height="44" rx="22" fill="${c.s}"/>${txt(c.tag, 0, 11, 30, '#fff', { sw: 0 })}</g>`;
    }
    s += `<g transform="translate(${f1(mid)},${f1(lift)}) scale(${f1(sc2 * 100) / 100})">${g}</g>`;
  });
  const bgW = total + 60, bh = fs + 74 + (o.labels ? 60 : 0);
  const back = o.plate === false ? '' : `<rect x="${f1(-bgW / 2)}" y="${-fs / 2 - 37}" width="${f1(bgW)}" height="${bh}" rx="34" fill="#fffaf0" stroke="${OL}" stroke-width="6" opacity="${o.plateOp ?? .96}"/>`;

}
const SENT = (cause, effect, a = null, gapT = .5) => [
  { t: '因為', k: 'c1', a }, { t: cause, k: 'cause', a: a == null ? null : a + gapT }, { t: '，', k: 'p', a: a == null ? null : a + gapT * 2 },
  { t: '所以', k: 'c2', a: a == null ? null : a + gapT * 2 }, { t: effect, k: 'effect', a: a == null ? null : a + gapT * 3 }, { t: '。', k: 'p', a: a == null ? null : a + gapT * 3.5 },

// ---------- 畫一個畫面 ----------
function renderFrame(R, T) {
  const chars = (R.chars || []).slice().sort((a, c) => a.y - c.y);
  const gray = R.gray || 0;
  let out = `<defs>${DEFS}<filter id="gray"><feColorMatrix type="saturate" values="${f1((1 - gray * .85) * 100) / 100}"/></filter></defs>`;
  const cam = R.cam || { x: 640, y: 360, z: 1 };
  out += `<g transform="translate(640,360) scale(${f1(cam.z * 1000) / 1000}) translate(${f1(-cam.x)},${f1(-cam.y)})" ${gray > .01 ? 'filter="url(#gray)"' : ''}>`;
  out += drawBG(R, T) + (R.back || []).join('');
  for (const c of chars) out += charSVG(c, T);
  out += (R.front || []).join('');
  for (const c of chars) out += fxSVG(c, T);
  out += `</g>` + (R.ui || []).join('');
  return out;
}

const SPK = {
  N:     { name: '旁白', col: '#ffd84d', pitch: 1, rate: 1, role: 'n' },
  owl:   { name: '貓頭鷹老師', col: '#c3b0f2', pitch: .9, rate: .95, role: 'c' },
  bear:  { name: '小熊', col: '#e8b48a', pitch: .75, rate: .95, role: 'c' },
  bunny: { name: '小兔', col: '#ffb3c8', pitch: 1.35, rate: 1, role: 'c' },
  cat:   { name: '小貓', col: '#ffc98a', pitch: 1.2, rate: 1.05, role: 'c' },
  all:   { name: '一起念', col: '#9fe2a8', pitch: 1, rate: .9, role: 'n' },
};
const hasSpeech = 'speechSynthesis' in window;
const VOPT = { rate: .85, vN: '', vC: '' };
try { Object.assign(VOPT, JSON.parse(localStorage.getItem('sentence-voice-opt') || '{}')); } catch (e) {}
const saveVOPT = () => { try { localStorage.setItem('sentence-voice-opt', JSON.stringify(VOPT)); } catch (e) {} };
function zhVoices() {
  if (!hasSpeech) return [];
  const all = speechSynthesis.getVoices().filter(v => /^zh/i.test(v.lang) && !/HK|yue/i.test(v.lang));
  const score = v => (/TW|Hant/i.test(v.lang) ? 0 : 10) + (/Online|Natural|Neural/i.test(v.name) ? 0 : 2) + (v.localService ? 1 : 0);
  return all.sort((a, b) => score(a) - score(b));
}
function speakText(text, who = 'N', onEnd, onStart) {
  if (!hasSpeech) { if (onEnd) setTimeout(onEnd, 50); return null; }
  speechSynthesis.cancel();
  const sp = SPK[who] || SPK.N;
  const u = new SpeechSynthesisUtterance(text.replace(/（[^）]*）/g, '').replace(/⋯+|……/g, '，'));
  const vs = zhVoices(), name = sp.role === 'n' ? VOPT.vN : VOPT.vC;
  const v = vs.find(x => x.name === name) || vs[0];
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'zh-TW';
  u.rate = VOPT.rate * sp.rate; u.pitch = sp.pitch;
  if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
  if (onStart) u.onstart = onStart;
  setTimeout(() => speechSynthesis.speak(u), 40);
  return u;
}

  if (c.type === 'c1' || c.type === 'c2') return `「${t}」放錯位置了，再想一想。`;
  if (sl.exp === 'cause') return (c.type === 'effect' || c.type === 'we') ? `「${t}」是結果，要放在「所以」的後面。` : `再看一次短片：真的是「${t}」嗎？`;
  return (c.type === 'cause' || c.type === 'wc') ? `「${t}」是原因，要放在「因為」的後面。` : `再看一次短片：真的是「${t}」嗎？`;
}
$('checkBtn').onclick = () => {
  if (G.solved) return;
  if (G.slots.some(s => !s.card)) { fb('fbB', 'info', '還有空格喔，把字卡放進去再檢查。'); return; }
  const wrong = [];
  for (const sl of G.slots) { if (sl.locked) continue; if (sl.card.type === sl.exp) sl.locked = true; else wrong.push(sl); }
  if (!wrong.length) { drawFrame(); success('build'); return; }
  G.tries++;
  const msg = hintFor(wrong[0]);
  const back = wrong.map(sl => sl.card);
  back.forEach(c => { c.slot.card = null; c.slot = null; });
  drawFrame();
  back.forEach(c => { c.el.classList.remove('shake'); void c.el.offsetWidth; c.el.classList.add('shake'); });
  fb('fbB', 'bad', msg); sfx.bad(); speakText(msg.replace(/[「」]/g, ''), 'owl');
};
$('clearBtn').onclick = () => { G.cards.forEach(c => { if (c.slot && !c.slot.locked) { c.slot.card = null; c.slot = null; } }); G.sel = -1; drawFrame(); $('fbB').textContent = ''; };
$('readBtn').onclick = () => {
  const hard = G.level === 'hard', s = G.slots.map(sl => sl.card ? sl.card.text : '');
  const text = hard ? `${s[0]}${s[1]}，${s[2]}${s[3]}。` : `因為${s[0]}，所以${s[1]}。`;
  if (G.slots.every(sl => !sl.card)) { fb('fbB', 'info', '先把字卡放進格子，再念念看。'); return; }
  speakText(text, 'owl');
};

// ---------- 用說的 ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function setupVoice() {
  drawVFrame();
  $('heard').className = 'heard empty'; $('heard').textContent = '按麥克風，用「因為……，所以……」說一句話';
  $('c1').className = ''; $('c2').className = '';
  $('fbV').textContent = ''; $('fbV').className = 'fb';
  $('hintBtn').disabled = false; $('hintBtn').textContent = '💡 給一點提示';
  $('judgeOk').disabled = false; $('judgeNo').disabled = false;
  if (!SR) { $('micBtn').disabled = true; $('micLab').textContent = '不能辨識'; $('vnote').textContent = '這個瀏覽器不能辨識語音（請用電腦版 Chrome）。沒關係，請小朋友直接說出來，老師聽完按下面的按鈕。'; }
  else $('vnote').textContent = '';
}
function drawVFrame() {
  const it = item(), h = G.hint;
  const b = (txt, k) => `<span class="slot k-${k}" style="cursor:default">${txt ? `<span style="opacity:.55">${esc(txt)}</span>` : '　'}</span>`;
  $('vframe').innerHTML = `<span class="pill c1">因為</span>${b(h >= 1 ? it.cause : '', 'cause')}<span class="punct">，</span><span class="pill c2">所以</span>${b(h >= 2 ? it.effect : '', 'effect')}<span class="punct">。</span>`;
  $('vframe').classList.add('withlabels');
}
$('hintBtn').onclick = () => {
  G.hint = Math.min(2, G.hint + 1); drawVFrame();
  $('hintBtn').textContent = G.hint >= 2 ? '💡 提示都給了' : '💡 再給一點提示';
  $('hintBtn').disabled = G.hint >= 2;
};
function showHeard(s, final) {
  const h = $('heard');
  if (!s) { h.className = 'heard empty'; h.textContent = final ? '沒有聽到，再按一次麥克風說說看。' : '正在聽⋯⋯'; return; }
  h.className = 'heard';
  h.innerHTML = esc(s).replace(/因為/g, '<span class="hi1">因為</span>').replace(/所以/g, '<span class="hi2">所以</span>');
  $('c1').className = /因為/.test(s) ? 'y' : ''; $('c2').className = /所以/.test(s) ? 'y' : '';
}
function stopMic() { try { rec && rec.stop(); } catch (e) {} listening = false; micUI(); }
function micUI() { $('micBtn').classList.toggle('on', listening); if (SR) $('micLab').textContent = listening ? '說完按我' : '按我說'; }
$('micBtn').onclick = () => {
  if (!SR) return;
  if (listening) { stopMic(); return; }
  if (hasSpeech) speechSynthesis.cancel();
  CP.playing = false;
  rec = new SR(); rec.lang = 'zh-TW'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let got = '';
  rec.onresult = e => { let s = ''; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; got = s; showHeard(s, false); };
  rec.onerror = e => {
    const m = { 'not-allowed': '麥克風被擋住了：請按網址列旁邊的圖示，允許使用麥克風。也可以直接聽小朋友說，再按老師判斷。', 'service-not-allowed': '麥克風被擋住了：請允許使用麥克風。也可以直接聽小朋友說，再按老師判斷。', 'no-speech': '沒有聽到聲音，請靠近麥克風再說一次。', 'network': '語音辨識需要網路，請確認有連上網路。', 'audio-capture': '找不到麥克風，請確認麥克風有接好。' }[e.error];
    if (m) $('vnote').textContent = m;
  };
  rec.onend = () => { listening = false; micUI(); showHeard(got, true); };
  try { rec.start(); listening = true; $('vnote').textContent = ''; showHeard('', false); } catch (e) { listening = false; }
  micUI();
};
$('judgeOk').onclick = () => { if (listening) stopMic(); success('voice'); };
$('judgeNo').onclick = () => {
  if (listening) stopMic();
  G.tries++; sfx.bad();
  fb('fbV', 'bad', G.hint < 2 ? '再說一次看看！可以按「給一點提示」，或再看一次短片。' : '再說一次看看！跟著提示說。');
  $('heard').className = 'heard empty'; $('heard').textContent = '按麥克風，再說一次';
  $('c1').className = ''; $('c2').className = '';
};

// ---------- 答對 ----------
function success(mode) {
  G.solved = true; sfx.good();
  const it = item();
  G.rec[G.qi] = { it, mode, tries: G.tries, hint: mode === 'voice' ? G.hint : 0 };
  $('zBuild').hidden = true; $('zVoice').hidden = true; $('zNext').hidden = false;
  $('fbDone').textContent = (G.tries === 1 ? '一次就答對了！' : '答對了！') + ' ' + sentenceText(it);
  $('nextBtn').textContent = G.qi === 2 ? '完成第一關 ➜' : G.qi === 5 ? '看成績 ➜' : '下一題 ➜';
  readModel();
}
function readModel() {
  const it = item();
  CP.playing = false;
  const parts = SENT(it.cause, it.effect);
  CP.ovT = T;
  CP.ov = (t, TT) => [sentenceSVG(parts, 640, 108, t, { fs: 52, labels: true, hl: karaokeIdx(t, .5, 1.05), T: TT }), comic('答對了！', 1080, 320, 64, '#fff', pop(t, .1) * (1 - fade(t, 2.4, 2.8)), 6, '#38b77a'), confetti(t, G.qi)];
  setTimeout(() => speakText(sentenceText(it), 'owl'), 350);
}
function karaokeIdx(t, start, step) { if (t < start) return -1; const o = [0, 1, 3, 4], k = Math.floor((t - start) / step); return k < 4 ? o[k] : -1; }
$('readAgain').onclick = readModel;
$('nextBtn').onclick = () => {
  if (hasSpeech) speechSynthesis.cancel();
  if (G.qi === 2) { show('inter'); speakText('第一關完成！接下來是第二關。', 'owl'); return; }
  if (G.qi === 5) { showResult(); return; }
  startQ(G.qi + 1);
};

// ---------- 成績 ----------
function showResult() {
  show('result');
  const d = new Date(), ds = `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
  $('rInfo').textContent = `${G.kid ? G.kid + '　' : ''}${ds}　難度：${G.level === 'hard' ? '挑戰' : '簡單'}`;
  const recs = G.rec.filter(Boolean), first = recs.filter(r => r.tries === 1).length;
  $('rSum').innerHTML = `<div>一次就答對 <b>${first}</b> 題</div><div>完成 <b>${recs.length}</b>／6 題</div>`;
  $('rBody').innerHTML = G.rec.map((r, i) => r ? `<tr><td>${i < 3 ? '第一關' : '第二關'} 第${i % 3 + 1}題</td><td>${esc(sentenceText(r.it))}</td><td>${r.mode === 'voice' ? '用說的' + (r.hint ? `（看了${r.hint}次提示）` : '') : '排字卡'}</td><td>${r.tries === 1 ? '一次答對' : `試了 ${r.tries} 次`}</td><td class="st">${'★'.repeat(r.tries === 1 ? 3 : r.tries === 2 ? 2 : 1)}</td></tr>` : '').join('');
  speakText('全部完成，你好棒！', 'owl');
}

// ---------- 主迴圈 ----------
let last = performance.now(), lastDraw = 0;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  if (!$('play').hidden) stepClip(dt);
  if (now - lastDraw > 30) {
    lastDraw = now;
    if (!$('play').hidden) renderStage();
    else if (!$('setup').hidden) $('coverSvg').innerHTML = renderFrame({ bg: 'stage', pal: 'warm', chars: [P('bear', { x: 330, y: 690, s: .62, expr: 'happy', ra: WAVE(T) }), P('bunny', { x: 560, y: 690, s: .62, expr: 'happy' }), P('cat', { x: 790, y: 690, s: .62, expr: 'laugh', face: -1 }), P('owl', { x: 1010, y: 690, s: .66, face: -1, expr: 'happy', ra: 110 })], ui: [sentenceSVG(SENT('', '').map((p, i) => i === 1 ? { t: '', k: 'blank', kind: 'cause' } : i === 4 ? { t: '', k: 'blank', kind: 'effect' } : p), 640, 150, 9, { fs: 70 })] }, T);
  }
  requestAnimationFrame(loop);
}
if (hasSpeech) { zhVoices(); speechSynthesis.onvoiceschanged = () => zhVoices(); }
window.__G = { startQ, G, success, showResult, CP };
requestAnimationFrame(loop);

</script>
