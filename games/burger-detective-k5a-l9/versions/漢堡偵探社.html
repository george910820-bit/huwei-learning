<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漢堡偵探社｜在挫折中成長</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6EC; --ink:#3B2A1A; --muted:#7A6652; --line:#E5D8C3;
    --bun:#E8A94F; --lettuce:#9CCB6B; --patty:#A8653B; --sauce:#F4CF4A;
    --ok:#2E8B57; --okbg:#E6F5EC; --soft:#FFF3D6; --accent:#D9622B;
    --font:"Microsoft JhengHei","微軟正黑體","Noto Sans TC","PingFang TC",sans-serif;
    --ui:var(--font);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui)}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:2px solid var(--line);background:#FFF9EF;flex-wrap:wrap}
  header h1{font-family:var(--font);font-size:28px;margin:0 12px 0 0;cursor:pointer}
  .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .grp .gl{font-size:15px;color:var(--muted);margin:0 2px 0 8px}
  .nb{font:inherit;font-size:17px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .nb.on{background:var(--accent);border-color:var(--accent);color:#fff}
  main{flex:1;padding:22px;max-width:1280px;width:100%;margin:0 auto}
  .q{font-family:var(--font);font-size:32px;line-height:1.5;margin:0 0 16px}
  .lead{font-size:22px;color:var(--muted);margin:0 0 14px}
  .msg{min-height:40px;font-size:26px;font-weight:700;margin:12px 0}
  .msg.ok{color:var(--ok)} .msg.try{color:#9A6B00}
  .btn{font:inherit;font-size:22px;padding:12px 24px;border-radius:14px;border:none;background:var(--accent);color:#fff;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

  /* 首頁 */
  .doors{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:8px}
  .door{background:#fff;border:3px solid var(--line);border-radius:22px;padding:26px;text-align:left;font:inherit;color:inherit;cursor:pointer}
  .door:hover{border-color:var(--accent)}
  .door .k{font-size:20px;color:var(--accent);font-weight:700}
  .door .t{font-family:var(--font);font-size:36px;margin:8px 0 10px}
  .door .d{font-size:20px;color:var(--muted);line-height:1.7}
  .door .e{font-size:44px}

  /* 共用：漢堡 */
  .layer{min-height:70px;padding:10px 16px;display:flex;align-items:center;gap:12px;border-radius:14px}
  .layer .t{font-weight:700;font-size:17px;width:122px;flex:none;text-align:center;line-height:1.3}
  .layer .c{font-family:var(--font);font-size:22px;line-height:1.4}
  .l-top{background:var(--bun);border-radius:80px 80px 14px 14px;min-height:88px}
  .l-bot{background:var(--bun);border-radius:14px 14px 44px 44px}
  .l-per{background:var(--lettuce)}
  .l-pla{background:var(--patty);color:#FFF3E6}
  .l-sauce{background:var(--sauce);border-radius:30px;min-height:54px;color:#5A4300}
  .l-dim{opacity:.55}
  .pulse{animation:pulse 1.1s ease-in-out infinite;outline:4px solid #fff;box-shadow:0 0 0 8px rgba(217,98,43,.45)}
  @keyframes pulse{50%{transform:scale(1.03)}}
  .drop{animation:drop .55s cubic-bezier(.3,1.5,.5,1)}
  .slotL{background:transparent!important;color:#B9A88F!important;border:3px dashed #D8CBB5}
  .slotL.l-top{border-radius:80px 80px 14px 14px}.slotL.l-bot{border-radius:14px 14px 44px 44px}.slotL.l-sauce{border-radius:30px}
  .slotL.now{border-color:var(--accent);color:var(--accent)!important;animation:pulse 1.1s ease-in-out infinite}
  .slidein{animation:slidein .5s cubic-bezier(.3,1.4,.5,1)}
  @keyframes slidein{0%{transform:translateX(140px);opacity:0}100%{transform:translateX(0);opacity:1}}
  @keyframes drop{0%{transform:translateY(-120px);opacity:0}100%{transform:translateY(0);opacity:1}}
  .wiggle{animation:wig .8s 2}
  @keyframes wig{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .pop{animation:pop .5s}
  @keyframes pop{50%{transform:scale(1.05)}}

  /* 昨天的漢堡 */
  .yest{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
  .yest .burger{display:flex;flex-direction:column;gap:6px}
  .say{font-family:var(--font);font-size:30px;line-height:1.6}

  /* 比一比 */
  .plants{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
  .pl{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;text-align:center}
  .pl .i{font-size:50px} .pl .n{font-family:var(--font);font-size:28px;font-weight:700}
  .pl .d{font-family:var(--font);font-size:21px;color:var(--muted);margin-top:4px;line-height:1.5}
  .task{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 22px;margin-bottom:14px}
  .task h2{font-size:23px;margin:0 0 10px;color:var(--accent)}
  .para{font-family:var(--font);font-size:27px;line-height:2.1}
  .seg{padding:4px 6px;border-radius:8px;cursor:pointer;border-bottom:3px dotted #CDBB9F}
  .seg:hover{background:#FFF0D9}
  .seg.right{background:var(--okbg);border-bottom-color:var(--ok);color:#1E5E3A;font-weight:700}
  .seg.no{background:#F6E9D8}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .big{font-family:var(--font);font-size:38px;font-weight:700;padding:24px;border-radius:20px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .big.right{background:var(--okbg);border-color:var(--ok);color:#1E5E3A}
  .big.no{background:#F6E9D8}

  /* 出餐挑戰 */
  .shop{display:grid;grid-template-columns:1fr 1.15fr;gap:28px;align-items:start}
  .ticket{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .bear{font-size:56px;display:inline-block}
  .bubble{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 16px;font-family:var(--font);font-size:22px;line-height:1.4}
  .stackwrap{display:flex;flex-direction:column;min-height:440px;justify-content:flex-start;border-radius:18px;background:#FFF9EF;border:2px dashed var(--line);padding:14px}
  .stack{display:flex;flex-direction:column;gap:5px}
  .plate{text-align:center;font-size:20px;color:var(--muted);border-top:6px solid #D8CBB5;border-radius:0 0 40px 40px;padding:8px;margin-top:6px}
  .turn{font-size:22px;font-weight:700;color:var(--accent)}
  .clock{font-size:18px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .clock input{width:22px;height:22px}
  .banner{background:#F3E4D6;border-radius:14px;padding:10px 16px;font-family:var(--font);font-size:24px;margin:8px 0}
  .banner b{color:#8A3D12}
  .q2{font-family:var(--font);font-size:28px;line-height:1.5;margin:10px 0 14px}
  .tray{display:flex;flex-direction:column;gap:12px}
  .card{background:#fff;border:3px solid var(--line);border-radius:16px;padding:14px 18px;font-family:var(--font);font-size:25px;line-height:1.45;cursor:pointer;user-select:none;touch-action:none}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 5px rgba(217,98,43,.25)}
  .card.drag{opacity:.35}
  .dragghost{position:fixed;pointer-events:none;z-index:50;opacity:.92;transform:rotate(-2deg)}
  .pslots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
  .pslot{background:#F3E4D6;border:3px dashed #C9A27E;border-radius:16px;padding:10px;text-align:center;min-height:130px;cursor:pointer}
  .pslot .i{font-size:40px} .pslot .n{font-family:var(--font);font-size:24px;font-weight:700}
  .pslot .got{font-family:var(--font);font-size:18px;color:#5A3A1E;margin-top:4px;line-height:1.4}
  .pslot.fill{border-style:solid;border-color:var(--ok);background:var(--okbg)}
  .trash{margin-top:8px;font-size:20px;color:var(--muted);display:inline-block;padding:8px 14px;border-radius:12px;background:#F1EAE0}
  .note{background:var(--soft);border:2px solid #E2B34A;border-radius:14px;padding:12px 16px;font-size:20px;line-height:1.6;margin-top:10px}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
  .confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 2s ease-in forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}

  /* 口訣變身秀 */
  .rounds{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
  .rd{font:inherit;font-size:19px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer}
  .rd.on{border-color:var(--accent);background:#FFF0E6}
  .rd.done::after{content:" ✔";color:var(--ok)}
  .stage{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:24px 0}
  .ph{background:#fff;border:3px solid var(--line);border-radius:24px;padding:22px 10px;text-align:center;transition:transform .2s,border-color .2s,background .2s}
  .ph .act{font-size:76px;line-height:1}
  .ph .how{font-size:20px;color:var(--muted);margin:6px 0 10px}
  .ph .w{font-family:var(--font);font-size:52px;font-weight:700;letter-spacing:4px;min-height:70px}
  .ph .w .hole{display:inline-block;min-width:1.9em;border-bottom:5px solid #CDBB9F;color:transparent}
  .ph.beat{border-color:var(--accent);background:#FFF0E6;transform:scale(1.06)}
  .ph.beat .w .hole{border-bottom-color:var(--accent)}
  .center{text-align:center}
  .stamp{display:inline-block;font-family:var(--font);font-size:56px;font-weight:700;color:#C0392B;border:7px solid #C0392B;border-radius:14px;padding:6px 26px;transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}
  @keyframes stamp{0%{transform:rotate(-8deg) scale(3);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.slidein,.slotL.now,.drop,.wiggle,.confetti i,.pulse,.stamp,.shake,.pop{animation:none}.ph{transition:none}}
  @media (max-width:900px){.doors,.shop,.two,.plants,.yest,.stage{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1 data-go="home">🍔 漢堡偵探社</h1>
  <div class="grp"><span class="gl">第1節</span><button class="nb" data-go="l1">課文漢堡出餐</button></div>
  <div class="grp"><span class="gl">第2節</span>
    <button class="nb" data-go="yest">昨天的漢堡</button>
    <button class="nb" data-go="cmp">比一比</button>
    <button class="nb" data-go="l2">植物漢堡出餐</button>
    <button class="nb" data-go="chant">口訣變身秀</button>
  </div>
</header>
<main id="app"></main>
<script>
const $ = (s, el=document) => el.querySelector(s);
const app = $('#app');
let timer = null, beatTimer = null, sel = null;
function stopAll(){ if(timer){ clearInterval(timer); timer=null; } if(beatTimer){ clearTimeout(beatTimer); beatTimer=null; } sel=null; document.querySelectorAll('.confetti').forEach(x=>x.remove()); }
function flash(el,c){ if(!el) return; el.classList.remove(c); void el.offsetWidth; el.classList.add(c); }
function say(t, ok){ const m=$('#msg'); if(!m) return; m.className='msg '+(ok?'ok':'try'); m.textContent=t; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function nav(k){ document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on', b.dataset.go===k)); }
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click', ()=>go(b.dataset.go)));
function go(k){ stopAll(); nav(k); ({home, l1, yest, cmp, l2, chant})[k](); window.scrollTo(0,0); }

/* 課文內容 */
const TOP = '在挫折中勇往直前，才能磨練出堅強的意志。';
const BOT = '以正向的心態面對逆境，化危機為轉機。';
const PL3 = [
  {n:'仙人掌', i:'🌵', hard:'高溫又缺水', how:'長出肥厚的莖存水，葉片變成針刺狀', res:'在沙漠中生存下來', bad:'放棄不管，慢慢枯掉', infer:true},
  {n:'落葉樹', i:'🍂', hard:'低溫', how:'秋冬落葉，把能量存起來', res:'開春時節給予幼芽養分', bad:'躲起來不面對'},
  {n:'椰子',   i:'🥥', hard:'被潮水帶進海裡，漂流數月', how:'靠厚厚的外皮保護種子', res:'被沖上沙灘，生根發芽', bad:'直接放棄，沉到海底'},
];

function home(){
  app.innerHTML = `
    <p class="lead">歡迎來到漢堡偵探社！〈在挫折中成長〉這篇文章，就是一個漢堡。</p>
    <div class="doors">
      <button class="door" data-k="l1"><div class="e">🍔</div><div class="k">第1節</div><div class="t">課文漢堡出餐</div><div class="d">四段課文，誰是麵包、誰是料？<br>把整篇文章疊成一個漢堡。</div></button>
      <button class="door" data-k="yest"><div class="e">🔍</div><div class="k">第2節</div><div class="t">植物偵探結案報告</div><div class="d">打開昨天漢堡的「植物」那一層，<br>找出三種植物在挫折中成長的祕密。</div></button>
    </div>`;
  app.querySelectorAll('.door').forEach(b=>b.onclick=()=>go(b.dataset.k));
}

/* ---------- 出餐引擎 ---------- */
function shop(cfg){
  let step = 0, sec = 0, timing = false, mistakes = 0;
  app.innerHTML = `
    <div class="shop">
      <div>
        <div class="ticket"><span class="bear" id="bear">🐻</span><div class="bubble" id="bubble">${cfg.order}</div></div>
        <div class="stackwrap"><div class="stack" id="stack"></div><div class="plate">🍽️ 漢堡模型</div></div>
      </div>
      <div>
        <div class="row" style="justify-content:space-between">
          <span class="turn" id="turn"></span>
          <label class="clock"><input type="checkbox" id="tg"> 碼表挑戰 <b id="tm">0:00</b></label>
        </div>
        <div id="banner"></div>
        <p class="q2" id="title"></p>
        <div id="slots"></div>
        <div class="tray" id="tray"></div>
        <div class="msg" id="msg"></div>
        <div id="note"></div>
        <div class="trash" id="trash">🗑️ 壞掉的料</div>
        <div class="row" id="ctl" style="margin-top:12px"></div>
      </div>
    </div>`;
  const fmt = t => Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
  $('#tg').onchange = e => { timing = e.target.checked;
    if(timing && !timer) timer = setInterval(()=>{ const tm=$('#tm'); if(!tm){ clearInterval(timer); timer=null; return; } sec++; tm.textContent=fmt(sec); }, 1000);
    if(!timing && timer){ clearInterval(timer); timer=null; } };
  const bear = (face, text) => { $('#bear').textContent=face; $('#bubble').textContent=text; flash($('#bear'),'pop'); };
  $('#stack').innerHTML = cfg.slots.map(L => L.pre
    ? `<div class="layer ${L.cls}" data-s="${L.id}"><div class="t">${L.label}</div><div class="c">${L.pre}</div></div>`
    : `<div class="layer ${L.cls} slotL" data-s="${L.id}"><div class="t">${L.empty}</div><div class="c">？</div></div>`).join('');
  const fillSlot = (id, label, html) => { const d=$(`[data-s="${id}"]`); d.classList.remove('slotL','now'); d.classList.add('slidein');
    d.innerHTML=`<div class="t">${label}</div><div class="c">${html}</div>`; };
  const wrong = (el, text) => { mistakes++; flash(el,'shake'); flash($('#trash'),'pop'); say(text, false); bear('🐻','咦？這個料怪怪的……'); };

  function render(){
    if(step >= cfg.steps.length) return serve();
    const st = cfg.steps[step]; sel = null;
    $('#turn').textContent = '🔍 ' + st.who + '上場';
    document.querySelectorAll('.slotL').forEach(x=>x.classList.remove('now')); if(st.slot){ const z=$(`[data-s="${st.slot}"]`); if(z) z.classList.add('now'); }
    $('#banner').innerHTML = st.banner || '';
    $('#title').textContent = st.title;
    $('#slots').innerHTML = ''; $('#tray').innerHTML = ''; $('#msg').textContent = ''; $('#note').innerHTML = '';
    if(st.match) $('#slots').innerHTML = `<div class="pslots">${st.match.map(p=>`<div class="pslot" data-p="${p.n}"><div class="i">${p.i}</div><div class="n">${p.n}</div><div class="got"></div></div>`).join('')}</div>`;
    let left = st.match ? st.match.length : 1;
    shuffle(st.opts).forEach(o => {
      const c = document.createElement('div'); c.className='card'; c.textContent=o.t; $('#tray').appendChild(c);
      const choose = zone => {
        if(st.match){
          if(o.bad){ c.remove(); return wrong(c, '這是「放棄」的料，不能做漢堡！丟進垃圾桶。'); }
          if(!zone) return;
          if(zone.dataset.p===o.p){ $('.got',zone).textContent=o.t; zone.classList.add('fill'); c.remove(); flash(zone,'pop'); say('配對成功！', true); bear('😋','好香！'); if(--left===0) finish(st, o.t); }
          else wrong(c, '這張卡不是'+zone.dataset.p+'的方法，再看看課文！');
        } else {
          if(o.ok){ c.remove(); finish(st, o.t); }
          else if(o.bad){ c.remove(); wrong(c, '這是「放棄」的料，不能做漢堡！丟進垃圾桶。'); }
          else wrong(c, o.why || '這個答案在課文裡，但不是這一題喔！');
        }
      };
      c.addEventListener('pointerdown', e => {
        e.preventDefault(); const sx=e.clientX, sy=e.clientY; let g=null;
        const mv = ev => { if(!g && Math.hypot(ev.clientX-sx, ev.clientY-sy)>8){ g=c.cloneNode(true); g.classList.add('dragghost'); g.style.width=c.offsetWidth+'px'; document.body.appendChild(g); c.classList.add('drag'); }
          if(g){ g.style.left=(ev.clientX-30)+'px'; g.style.top=(ev.clientY-24)+'px'; } };
        const up = ev => { window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
          if(g){ g.remove(); c.classList.remove('drag'); const t=document.elementFromPoint(ev.clientX, ev.clientY); if(!t) return;
            if(st.match){ const z=t.closest('.pslot'); if(z||o.bad) choose(z); } else if(t.closest('.stackwrap')) choose(null); }
          else if(st.match && !o.bad){ document.querySelectorAll('.card.sel').forEach(x=>x.classList.remove('sel')); if(sel&&sel.c===c){ sel=null; return; } c.classList.add('sel'); sel={c,choose}; }
          else choose(null); };
        window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
      });
    });
    app.querySelectorAll('.pslot').forEach(z => z.onclick = () => { if(sel){ const s=sel; sel=null; s.c.classList.remove('sel'); s.choose(z); } });
  }
  function finish(st, text){
    if(st.layer){ const L = st.layer(text); fillSlot(st.slot, L.label, L.html); }
    $('#title').textContent = ''; $('#banner').innerHTML = '';
    say(st.okMsg || '答對了！', true); bear('😋', st.bear || '好香！');
    if(st.note) $('#note').innerHTML = `<div class="note">${st.note}</div>`;
    $('#tray').innerHTML = '';
    step++;
    $('#ctl').innerHTML = `<button class="btn" id="nx">${step < cfg.steps.length ? '下一步 →' : '出餐！🍔'}</button>`;
    $('#nx').onclick = () => { $('#ctl').innerHTML=''; render(); };
  }
  function serve(){
    if(timer){ clearInterval(timer); timer=null; }
    $('#turn').textContent='🎉 出餐成功！'; $('#banner').innerHTML=''; $('#title').textContent=cfg.doneTitle;
    $('#slots').innerHTML=''; $('#tray').innerHTML=''; $('#note').innerHTML=''; $('#trash').style.display='none';
    bear('🤩', cfg.doneBear); $('#stack').classList.add('wiggle'); confetti();
    say((timing ? '完成時間 '+fmt(sec)+'　' : '') + (mistakes ? '丟掉了 '+mistakes+' 個壞掉的料。' : '一個壞料都沒放錯，滿分出餐！'), true);
    $('#ctl').innerHTML = (cfg.next ? `<button class="btn" id="nx">${cfg.next.label}</button>` : '') + '<button class="btn ghost" id="rs">再做一次</button>';
    if(cfg.next) $('#nx').onclick = () => go(cfg.next.go);
    $('#rs').onclick = cfg.again;
  }
  render();
}
function confetti(){
  const box=document.createElement('div'); box.className='confetti'; const colors=['#E8A94F','#9CCB6B','#A8653B','#D9622B','#F4CF4A'];
  for(let i=0;i<40;i++){ const d=document.createElement('i'); d.style.left=Math.random()*100+'%'; d.style.background=colors[i%5]; d.style.animationDelay=(Math.random()*.6)+'s'; box.appendChild(d); }
  document.body.appendChild(box); setTimeout(()=>box.remove(), 2600);
}

/* ---------- 第2節：口訣變身秀 ---------- */
const CH = [
  {w:'接受挫折', act:'🤲', how:'雙手接住', hide:[2,3]},
  {w:'改變自己', act:'🔄', how:'原地轉一圈', hide:[0,1]},
  {w:'勇敢成長', act:'🙌', how:'雙手往上舉', hide:[2,3]},
];
const ROUNDS = [
  {name:'第1回：跟著做', tip:'老師按一下，亮起一句。大家邊念邊做動作！', mode:'full', times:2},
  {name:'第2回：消失挑戰', tip:'有字躲起來了！靠記憶念出來。', mode:'hole', times:2},
  {name:'第3回：全部消失', tip:'字全部不見了！只看動作，整句念出來。', mode:'none', times:2},
  {name:'第4回：換你當老師', tip:'請一位偵探上台按，帶大家念！', mode:'none', times:2},
];
let actx = null, sound = true, chantKey = null;
function tick(hi){
  if(!sound) return;
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value = hi ? 880 : 520;
    g.gain.setValueAtTime(.25, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+.18);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+.2);
  }catch(e){ sound=false; }
}
function chant(){
  const done = new Set(); let cur = 0, n = 0;
  app.innerHTML = `
    <div class="rounds" id="rounds">${ROUNDS.map((r,k)=>`<button class="rd" data-k="${k}">${r.name}</button>`).join('')}</div>
    <p class="lead center" id="tip"></p>
    <div class="stage" id="stage"></div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="go" style="font-size:28px;padding:16px 40px">亮下一句 ▶</button>
      <span class="lead" id="prog" style="margin:0"></span>
      <label class="clock"><input type="checkbox" id="snd" checked> 提示音</label>
    </div>
    <p class="center" style="color:var(--muted);font-size:17px;margin-top:10px">也可以直接點口訣卡片，或用簡報筆、方向鍵 →、空白鍵前進</p>
    <div class="center" id="end" style="margin-top:16px"></div>`;
  const total = () => CH.length * ROUNDS[cur].times;
  const draw = () => {
    const mode = ROUNDS[cur].mode;
    $('#stage').innerHTML = CH.map((c,i) => {
      const w = mode==='full' ? c.w : mode==='hole' ? [...c.w].map((ch,j)=>c.hide.includes(j)?`<span class="hole">${ch}</span>`:ch).join('') : '<span class="hole">　</span><span class="hole">　</span>';
      return `<div class="ph" data-i="${i}"><div class="act">${c.act}</div><div class="how">${c.how}</div><div class="w">${w}</div></div>`;
    }).join('');
    app.querySelectorAll('.ph').forEach(el => el.onclick = () => { if(n < total() && +el.dataset.i === n % CH.length) next(); });
  };
  const status = () => { $('#prog').textContent = n < total() ? `已念 ${n} / ${total()} 句` : '這一回合完成！'; };
  const pick = k => { cur = k; n = 0; $('#end').innerHTML = '';
    app.querySelectorAll('.rd').forEach(b=>b.classList.toggle('on', +b.dataset.k===k));
    $('#tip').textContent = ROUNDS[k].tip; draw(); status();
    $('#go').textContent = '亮下一句 ▶'; $('#go').onclick = next; };
  function next(){
    const phs = app.querySelectorAll('.ph');
    phs.forEach(p=>p.classList.remove('beat'));
    if(n >= total()) return;
    const i = n % CH.length; phs[i].classList.add('beat'); tick(i===0); n++; status();
    if(n === total()){
      done.add(cur); app.querySelector(`.rd[data-k="${cur}"]`).classList.add('done');
      if(done.size === ROUNDS.length){ $('#end').innerHTML = '<div class="stamp">結案</div><p class="lead" style="margin-top:18px">植物偵探任務完成！接受挫折、改變自己、勇敢成長！</p>'; confetti(); }
      if(cur < ROUNDS.length-1){ $('#go').textContent = '下一回合 →'; $('#go').onclick = () => pick(cur+1); }
      else { $('#go').textContent = '再玩一次'; $('#go').onclick = () => pick(cur); }
    }
  }
  app.querySelectorAll('.rd').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $('#snd').onchange = e => sound = e.target.checked;
  if(chantKey) document.removeEventListener('keydown', chantKey);
  chantKey = e => { if(!$('#stage')) { document.removeEventListener('keydown', chantKey); chantKey=null; return; }
    if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){ e.preventDefault(); $('#go').click(); } };
  document.addEventListener('keydown', chantKey);
  pick(0);
}

go('home');
</script>
