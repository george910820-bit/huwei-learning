<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漢堡偵探社（教學演示版）｜在挫折中成長</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6EC; --ink:#3B2A1A; --muted:#7A6652; --line:#E5D8C3;
    --bun:#E8A94F; --lettuce:#9CCB6B; --patty:#A8653B; --sauce:#F4CF4A;
    --ok:#2E8B57; --okbg:#E6F5EC; --soft:#FFF3D6; --accent:#D9622B; --bad:#B9442A; --marker:#FFF06A;
    --title:'Huninn','Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;
    --body:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  body{min-height:100vh;display:flex;flex-direction:column}
  button,input{font-family:inherit}
  [hidden]{display:none!important}
  header{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:2px solid var(--line);background:#FFF9EF;flex-wrap:wrap}
  header h1{font-family:var(--title);font-weight:400;font-size:30px;margin:0 10px 0 0;cursor:pointer}
  .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .grp .gl{font-size:15px;color:var(--muted);margin:0 2px 0 8px}
  .nb{font-family:var(--title);font-size:17px;padding:7px 14px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .nb.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .hright{margin-left:auto;display:flex;gap:10px;align-items:center}
  .coins{font-family:var(--title);font-size:24px;color:#9A6B00;background:#FFF3C4;border-radius:999px;padding:4px 14px}
  .coins.bump{animation:pop .5s}
  .gear{font-size:17px;padding:7px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
  main{flex:1;padding:16px 20px 26px;max-width:1360px;width:100%;margin:0 auto}
  .q{font-family:var(--title);font-size:32px;line-height:1.5;margin:0 0 14px}
  .lead{font-size:21px;color:var(--muted);margin:0 0 14px}
  .msg{min-height:36px;font-family:var(--title);font-size:26px;margin:6px 0}
  .msg.ok{color:var(--ok)} .msg.try{color:var(--bad)}
  .btn{font-family:var(--title);font-size:22px;padding:11px 24px;border-radius:14px;border:none;background:var(--accent);color:#fff;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
  .btn.hint{background:#FFF6CC;color:#6B4E00;border:2px solid #E2B34A}
  .btn:disabled{opacity:.55;cursor:default}
  .redbtn{font-family:var(--title);font-size:32px;padding:14px 46px;border-radius:999px;background:#C9481C;border:none;color:#fff;box-shadow:0 5px 0 #8E2F10;cursor:pointer;animation:nudge 1.4s ease-in-out infinite}
  .redbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #8E2F10}
  @keyframes nudge{50%{transform:scale(1.06)}}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .center{text-align:center}

  /* 朗讀鍵 */
  .spk{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:6px}
  .spk.on{background:#E8F1FB;border-color:#4A7BB0}
  body.notts .spk{opacity:.25;pointer-events:none}

  /* 店門口 */
  #door{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:6px}
  .store{width:min(100%,820px);height:auto;display:block}
  .store .dc{transition:opacity .3s}
  .store .pv{animation:blink 1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
  .store .notes text{animation:float 2.2s ease-in-out infinite}
  .store .notes text:nth-child(2){animation-delay:.7s}.store .notes text:nth-child(3){animation-delay:1.4s}
  @keyframes float{50%{transform:translateY(-8px)}}
  .store .glow{animation:glow 1.6s ease-in-out infinite}
  @keyframes glow{50%{opacity:.35}}

  /* 偵探名單 */
  .setup{max-width:900px;margin:0 auto;display:grid;gap:14px}
  .setup h2{font-family:var(--title);font-weight:400;font-size:34px;margin:0}
  .cnt{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .cnt button{font-family:var(--title);font-size:28px;width:68px;height:68px;border-radius:18px;border:3px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
  .cnt button.on{background:#8A5A33;border-color:#8A5A33;color:#fff}
  .prow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-left:10px solid var(--pc);border-radius:16px;padding:10px 14px}
  .pnum{width:44px;height:44px;border-radius:50%;background:var(--pc);color:#fff;font-family:var(--title);font-size:22px;display:grid;place-items:center}
  .prow input{font-size:24px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:#FFFBF3;min-width:0;width:100%}

  /* 首頁 */
  .homegrid{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:center}
  .doors{display:grid;gap:16px}
  .door{background:#fff;border:3px solid var(--line);border-radius:22px;padding:18px 22px;text-align:left;color:inherit;cursor:pointer;display:grid;grid-template-columns:60px 1fr;gap:4px 14px;align-items:center}
  .door:hover{border-color:var(--accent)}
  .door .e{font-size:46px;grid-row:span 3}
  .door .k{font-size:18px;color:var(--accent);font-weight:700}
  .door .t{font-family:var(--title);font-size:32px}
  .door .d{font-size:18px;color:var(--muted);line-height:1.6}
  .team{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:18px;color:var(--muted)}
  .team span{font-family:var(--title);font-size:19px;color:#fff;background:var(--pc);border-radius:999px;padding:3px 12px}

  /* 漢堡 */
  .layer{min-height:62px;padding:8px 14px;display:flex;align-items:center;gap:12px;border-radius:14px}
  .layer .t{font-family:var(--title);font-size:17px;width:112px;flex:none;text-align:center;line-height:1.3}
  .layer .c{font-family:var(--title);font-size:20px;line-height:1.4}
  .l-top{background:var(--bun);border-radius:80px 80px 14px 14px;min-height:80px}
  .l-bot{background:var(--bun);border-radius:14px 14px 44px 44px}
  .l-per{background:var(--lettuce)}
  .l-pla{background:var(--patty);color:#FFF3E6}
  .l-sauce{background:var(--sauce);border-radius:30px;min-height:50px;color:#5A4300}
  .l-dim{opacity:.55}
  .pulse{animation:pulse 1.1s ease-in-out infinite;outline:4px solid #fff;box-shadow:0 0 0 8px rgba(217,98,43,.45)}
  @keyframes pulse{50%{transform:scale(1.03)}}
  .slotL{background:transparent!important;color:#B9A88F!important;border:3px dashed #D8CBB5}
  .slotL.l-top{border-radius:80px 80px 14px 14px}.slotL.l-bot{border-radius:14px 14px 44px 44px}.slotL.l-sauce{border-radius:30px}
  .slotL.now{border-color:var(--accent);color:var(--accent)!important;animation:pulse 1.1s ease-in-out infinite}
  .slidein{animation:slidein .5s cubic-bezier(.3,1.4,.5,1)}
  @keyframes slidein{0%{transform:translateY(-90px);opacity:0}100%{transform:translateY(0);opacity:1}}
  .eat{animation:eat 1.4s forwards}
  @keyframes eat{30%{transform:scale(1.05)}100%{transform:scale(.2) translateX(-200px);opacity:0}}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .pop{animation:pop .5s}
  @keyframes pop{50%{transform:scale(1.12)}}

  /* 昨天的漢堡 */
  .yest{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
  .burger{display:flex;flex-direction:column;gap:6px}
  .say{font-family:var(--title);font-size:30px;line-height:1.6}

  /* 比一比 */
  .plants{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
  .pl{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center}
  .pl .i{font-size:46px} .pl .n{font-family:var(--title);font-size:28px}
  .pl .d{font-family:var(--title);font-size:20px;color:var(--muted);margin-top:4px;line-height:1.5}
  .task{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 20px;margin-bottom:14px}
  .task h2{font-family:var(--title);font-weight:400;font-size:24px;margin:0 0 10px;color:var(--accent);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .task h2 .who{font-size:18px;background:#FFF0E6;border-radius:999px;padding:2px 12px}
  .para{font-family:var(--title);font-size:27px;line-height:2.1}
  .seg{padding:4px 6px;border-radius:8px;cursor:pointer;border-bottom:3px dotted #CDBB9F}
  .seg:hover{background:#FFF0D9}
  .seg.right{background:var(--okbg);border-bottom-color:var(--ok);color:#1E5E3A}
  .seg.no{background:#F6E9D8;color:#A89780}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .big{font-family:var(--title);font-size:38px;padding:22px;border-radius:20px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .big.right{background:var(--okbg);border-color:var(--ok);color:#1E5E3A}
  .big.no{background:#F6E9D8;color:#A89780}
  .marker{background:linear-gradient(transparent 6%,var(--marker) 6%,var(--marker) 94%,transparent 94%)!important;box-shadow:0 0 0 4px #E2B34A}

  /* 出餐 */
  .shop{display:grid;grid-template-columns:minmax(300px,.85fr) minmax(0,2fr);gap:20px;align-items:start}
  .counter{background:#FFF9EF;border:2px solid var(--line);border-radius:20px;padding:12px 14px}
  .ticket{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .guest{font-size:54px;display:inline-block}
  .bubble{background:#fff;border:2px solid var(--line);border-radius:16px;padding:9px 14px;font-family:var(--title);font-size:20px;line-height:1.45;flex:1}
  .stack{display:flex;flex-direction:column;gap:5px;min-height:330px}
  .plate{text-align:center;font-size:19px;color:var(--muted);border-top:6px solid #D8CBB5;border-radius:0 0 40px 40px;padding:6px;margin-top:6px}
  .turn{font-family:var(--title);font-size:26px;color:var(--accent);display:flex;align-items:center;gap:8px}
  .turn .nm{background:var(--pc);color:#fff;border-radius:999px;padding:2px 16px}
  .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:16px;color:var(--muted)}
  .seg3{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
  .seg3 button{border:none;background:#fff;padding:5px 10px;font-size:16px;cursor:pointer;color:var(--ink)}
  .seg3 button.on{background:#5B6470;color:#fff}
  .clock{display:flex;align-items:center;gap:5px}
  .clock input{width:20px;height:20px}
  .banner{background:#F3E4D6;border-radius:14px;padding:8px 16px;font-family:var(--title);font-size:23px;margin:8px 0}
  .banner b{color:#8A3D12;font-weight:400}
  .q2{font-family:var(--title);font-size:28px;line-height:1.5;margin:6px 0 10px;display:flex;align-items:center;flex-wrap:wrap}
  .work{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(250px,1fr);gap:16px;align-items:start}
  .side{display:flex;flex-direction:column;gap:10px}

  /* 直立輸送帶 */
  .belt{position:relative;overflow:hidden;height:var(--bh,480px);border-radius:18px;padding:0 14px;
    background:repeating-linear-gradient(180deg,#6B7480 0 34px,#5B6470 34px 68px);border-left:10px solid #3E444C;border-right:10px solid #3E444C}
  .belt.down{background-position:0 var(--off,0)}
  .belt .card{position:absolute;left:14px;right:14px;top:0;will-change:transform}
  .belt.still{overflow:visible;display:flex;flex-direction:column;gap:12px;padding:14px;height:auto;min-height:160px}
  .belt.still .card{position:static}
  .beltcap{display:flex;justify-content:space-between;font-size:16px;color:var(--muted);margin:0 4px 4px}
  .card{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 10px 12px 16px;font-family:var(--title);font-size:24px;line-height:1.45;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .card .tx{flex:1}
  .card.no{border-color:var(--bad)}
  .bin{display:flex;align-items:center;gap:10px;background:#F1EAE0;border-radius:16px;padding:10px 14px;font-size:19px;color:var(--muted)}
  .bin .i{font-size:40px}
  .bin b{font-family:var(--title);font-size:26px;color:var(--ink)}
  .hintbox{background:#FFFBE6;border:2px dashed #E2B34A;border-radius:14px;padding:9px 16px;margin-top:10px;font-size:20px;line-height:1.7}
  .explain{background:var(--soft);border:2px solid #E2B34A;border-radius:14px;padding:10px 16px;margin-top:10px;font-size:20px;line-height:1.65}
  .floatc{position:fixed;font-family:var(--title);font-size:30px;color:#9A6B00;pointer-events:none;z-index:70;animation:floatc 1s ease-out forwards}
  @keyframes floatc{to{transform:translateY(-70px);opacity:0}}

  /* 布置店面 */
  .deco{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
  .upg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .ub{background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 4px;text-align:center;cursor:pointer;color:var(--ink)}
  .ub .i{font-size:32px}.ub .n{font-family:var(--title);font-size:18px}.ub .p{font-size:16px;color:#9A6B00}
  .ub.own{border-color:var(--ok);background:var(--okbg);cursor:default}
  .ub.pick{border-color:var(--accent);box-shadow:0 0 0 4px rgba(217,98,43,.25)}
  .ub.poor{opacity:.45}
  .buybar{min-height:56px;margin-top:10px;font-family:var(--title);font-size:21px}
  .stars{font-size:38px;letter-spacing:6px}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
  .confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 2s ease-in forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}

  /* 設定 */
  .modal{position:fixed;inset:0;background:rgba(40,25,10,.45);display:flex;align-items:center;justify-content:center;z-index:80}
  .sheet{background:#fff;border-radius:22px;padding:22px 26px;width:min(600px,92vw);max-height:90vh;overflow:auto}
  .sheet h2{font-family:var(--title);font-weight:400;font-size:28px;margin:0 0 12px}
  .sheet .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:19px}
  .sheet small{color:var(--muted);display:block;font-size:15px}

  /* 口訣變身秀 */
  .rounds{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
  .rd{font-family:var(--title);font-size:19px;padding:9px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
  .rd.on{border-color:var(--accent);background:#FFF0E6}
  .rd.done::after{content:" ✔";color:var(--ok)}
  .stage{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:22px 0}
  .ph{background:#fff;border:3px solid var(--line);border-radius:24px;padding:22px 10px;text-align:center;transition:transform .2s,border-color .2s,background .2s}
  .ph .act{font-size:76px;line-height:1}
  .ph .how{font-size:20px;color:var(--muted);margin:6px 0 10px}
  .ph .w{font-family:var(--title);font-size:52px;letter-spacing:4px;min-height:70px}
  .ph .w .hole{display:inline-block;min-width:1.9em;border-bottom:5px solid #CDBB9F;color:transparent}
  .ph.beat{border-color:var(--accent);background:#FFF0E6;transform:scale(1.06)}
  .ph.beat .w .hole{border-bottom-color:var(--accent)}
  .stamp{display:inline-block;font-family:var(--title);font-size:56px;color:#C0392B;border:7px solid #C0392B;border-radius:14px;padding:6px 26px;transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}
  @keyframes stamp{0%{transform:rotate(-8deg) scale(3);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.slidein,.slotL.now,.confetti i,.pulse,.stamp,.shake,.pop,.eat,.floatc,.redbtn,.store .pv,.store .notes text,.store .glow{animation:none}.ph{transition:none}}
  @media (max-width:1000px){.shop,.work,.deco,.homegrid{grid-template-columns:1fr}}
  @media (max-width:760px){.two,.plants,.yest,.stage{grid-template-columns:1fr}.upg{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body class="notts">
<header>
  <h1 data-go="home">🍔 漢堡偵探社</h1>
  <div class="grp"><span class="gl">第1節</span><button class="nb" data-go="l1">課文漢堡出餐</button></div>
  <div class="grp"><span class="gl">第2節</span>
    <button class="nb" data-go="yest">昨天的漢堡</button>
    <button class="nb" data-go="cmp">比一比</button>
    <button class="nb" data-go="l2">植物漢堡出餐</button>
    <button class="nb" data-go="chant">口訣變身秀</button>
  </div>
  <div class="hright"><span class="coins" id="coins">🪙 0</span><button class="gear" id="gear">⚙️ 老師設定</button></div>
</header>
<main id="app"></main>
<script>
/* 版本設定：PRESET 為 null 時，開店前要選人數、填名字；有值時直接使用預設名單（教學演示版） */
const PRESET = /*PRESET*/[{name:'吃炮',lv:'b'},{name:'林哲',lv:'a'}]/*END*/;
const VARIANT = PRESET ? 'demo' : 'general';
const $ = (s, el=document) => el.querySelector(s);
const app = $('#app');
let timer = null, beltStop = ()=>{};
function flash(el,c){ if(!el) return; el.classList.remove(c); void el.offsetWidth; el.classList.add(c); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const PCOL = ['#D9622B','#2F7FB5','#3E8E4A','#8E4FB0','#C2185B','#B07A00'];

/* ================= 設定與存檔（存在這台電腦的瀏覽器） ================= */
const KEY = 'burgerDetective.v3.' + VARIANT;
const DEF = {coins:0, own:[], players: PRESET ? PRESET.map(p=>({...p})) : [{name:'',lv:'b'},{name:'',lv:'a'}], speed:'slow', dir:'down', tts:true};
let S = JSON.parse(JSON.stringify(DEF));
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
if(PRESET){ S.players = PRESET.map((p,i)=>({name:p.name, lv:(S.players[i]||p).lv || p.lv})); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function showCoins(bump){ $('#coins').textContent = '🪙 ' + S.coins; if(bump) flash($('#coins'),'bump'); }
function award(n, fromEl){
  S.coins += n; save(); showCoins(true);
  if(fromEl){ const r = fromEl.getBoundingClientRect(); const f=document.createElement('div'); f.className='floatc'; f.textContent='+'+n+'🪙';
    f.style.left=(r.left+r.width/2-30)+'px'; f.style.top=(r.top)+'px'; document.body.appendChild(f); setTimeout(()=>f.remove(),1100); }
}
const pname = i => S.players[i] ? S.players[i].name : '偵探';
const pchip = i => `<span class="nm" style="--pc:${PCOL[i%6]}">${esc(pname(i))}</span>`;

/* ================= 朗讀 ================= */
let voice = null, speaking = false;
function initTTS(){
  if(!('speechSynthesis' in window)) return;
  const pick = () => { const vs = speechSynthesis.getVoices();
    voice = vs.find(v=>/zh[-_]TW/i.test(v.lang)) || vs.find(v=>/zh[-_](HK|Hant)/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null;
    document.body.classList.toggle('notts', !(voice && S.tts)); };
  pick(); speechSynthesis.onvoiceschanged = pick;
}
function speak(text, btn){
  if(!voice || !S.tts) return;
  speechSynthesis.cancel();
  const clean = String(text).replace(/<[^>]+>/g,'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}★→]/gu,'');
  const u = new SpeechSynthesisUtterance(clean); u.lang = voice.lang; u.voice = voice; u.rate = .85;

  const end = () => { speaking = false; if(btn) btn.classList.remove('on'); };

function makeFb(el, hints, mark){
  let lv = 0;
  return {
    wrong(){
      el.innerHTML = `<div class="msg try">再想想看</div><div class="row"><button class="btn hint" data-h>💡 提示（1/3）</button></div><div data-ha></div>`;
      const btn = $('[data-h]',el), area = $('[data-ha]',el);
      const draw = () => {
        const rows = hints.slice(0, Math.min(lv,2)).map(h=>`<div>${h}</div>`);
        area.innerHTML = rows.length ? `<div class="hintbox">${rows.join('')}</div>` : '';
        if(lv>=3){ btn.disabled=true; btn.textContent='💡 提示已全部給出'; mark(); }
        else btn.textContent = `💡 提示（${lv+1}/3）`;
      };
      btn.onclick = () => { lv++; draw(); };
      draw();
    },
    right(msg, ex, nextLabel, next){
      lv = 0;
      el.innerHTML = `<div class="msg ok">${msg}</div><div class="row">${ex?'<button class="btn ghost" data-x>💡 看解說</button>':''}${next?`<button class="btn" data-n>${nextLabel}</button>`:''}</div>${ex?`<div class="explain" data-xb hidden>${ex}</div>`:''}`;
      if(ex){ const b=$('[data-x]',el), x=$('[data-xb]',el); b.onclick=()=>{ x.hidden=!x.hidden; b.textContent=x.hidden?'💡 看解說':'收起解說'; }; }
      if(next) $('[data-n]',el).onclick = next;
    },
    clear(){ lv=0; el.innerHTML=''; }
  };
}

/* ================= 直立輸送帶 ================= */
// box：放卡片的容器；opts：[{t, ok, bad, why}]；onPick(opt, cardEl)
// 卡片會重複出現，讓輸送帶上一直有料；停下來時，每張卡只出現一次
function conveyor(box, opts, onPick){
  let items = opts.slice(), marked = false, raf = 0, alive = true, last = 0;
  const build = () => {
    cancelAnimationFrame(raf); box.innerHTML = '';
    const moving = S.speed !== 'stop';
    box.className = 'belt' + (moving ? '' : ' still');
    const mk = o => { const c = document.createElement('div'); c.className = 'card' + (marked && o.ok ? ' marker' : '');
      c.innerHTML = `<span class="tx">${esc(o.t)}</span>${spkBtn(o.t)}`; c.onclick = () => onPick(o, c); box.appendChild(c); return {o, el:c}; };
    if(!moving){ items.forEach(mk); return; }
    const H = box.clientHeight, gap = 18;
    // 先放一輪，量高度，再依需要重複，直到超過輸送帶高度
    let row = items.map(mk), total = row.reduce((s,r)=>s+r.el.offsetHeight+gap,0), k = 0;
    const order = items.length > 1 ? items : items.concat(items);
    while(total < H + 260 && k < 30){ const r = mk(order[k % order.length]); row.push(r); total += r.el.offsetHeight + gap; k++; }
    let y = 0; row.forEach(r => { r.y = y; y += r.el.offsetHeight + gap; });
    const loop = y, v = S.speed === 'mid' ? 80 : 40, down = S.dir !== 'up';
    if(down) row.forEach(r => r.y -= loop - H);   // 由上而下：一開始畫面就排滿
    last = performance.now();
    const step = now => {
      if(!alive || !box.isConnected) return;
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      if(!speaking) row.forEach(r => {
        r.y += (down ? 1 : -1) * v * dt;
        if(down && r.y > H) r.y -= loop;
        if(!down && r.y < -r.el.offsetHeight) r.y += loop;
      });
      row.forEach(r => r.el.style.transform = `translateY(${r.y}px)`);
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  };
  build();
  onBelt = build;
  beltStop = () => { alive = false; cancelAnimationFrame(raf); };
  return {
    remove(o){ items = items.filter(x => x !== o); build(); },
    mark(){ marked = true; box.querySelectorAll('.card').forEach(c => { if(items.find(o=>o.ok && c.querySelector('.tx').textContent===o.t)) c.classList.add('marker'); }); },
    stop(){ alive = false; cancelAnimationFrame(raf); onBelt = null; }
  };
}

/* ================= 誰上場 ================= */
// rr：依序輪流；l2：「怎麼做」「結果」輪流，兩人時仙人掌 1做2果、落葉樹 2做1果、椰子 1做2果
function assign(steps, mode){
  const N = Math.max(1, S.players.length);
  if(mode === 'rr'){ steps.forEach((st,i) => st.p = i % N); return; }
  let s = 0; const cnt = Array(N).fill(0);
  steps.forEach(st => { if(st.kind==='how' || st.kind==='res'){ st.p = (N%2===0 ? s + Math.floor(s/2) : s) % N; cnt[st.p]++; s++; } });
  steps.forEach((st,i) => { if(st.kind==='proof') st.p = steps[i-1].p;
    if(st.kind==='sauce'){ const m = Math.min(...cnt); st.p = cnt.indexOf(m); } });
}

/* ================= 第2節：植物漢堡出餐 ================= */
// 「怎麼做」「結果」輪流回答（兩人時：仙人掌 1做2果、落葉樹 2做1果、椰子 1做2果）
function l2(){
  const steps = [];
  PL3.forEach((p, k) => {
    const others = PL3.filter(q=>q!==p);
    const banner = `${p.i} <b>${p.n}</b> 遇到的困難：<b>${p.hard}</b>`;
    steps.push({kind:'how', slot:'p'+k, banner,
      b:{title:`${p.n}怎麼做？`, opts:[{t:p.howB, ok:true},{t:p.bad, bad:true}],
         hints:[`${p.n}遇到「${p.hard}」，它有放棄嗎？它做了什麼？`, `看白板上${p.n}的四格表，或課本第3段${p.c}螢光筆圈起來的地方。`], ex:`${p.n}的方法：${p.howS}。`},
      a:{title:`${p.n}怎麼做？`, opts:[{t:p.howA, ok:true},{t:others[k%2].howA, why:`這是${others[k%2].n}的方法，不是${p.n}的喔！`},{t:p.bad, bad:true}],
         hints:[`${p.n}為了面對「${p.hard}」，改變了自己的哪些地方？`, `看課本第3段講${p.n}的句子（${p.c}螢光筆）。`], ex:`${p.n}遇到「${p.hard}」，${p.howA}。這就是它調適改變自己的方法。`},
      okSay:'嗯，這個方法不錯！'});
    const resLayer = () => ({label:`${p.i} ${p.n}`, html:`${p.howS}<br>→ ${p.resS}`});
    const resHint2 = p.infer ? '看第3段最後的總結句。' : `看課本第3段講${p.n}那幾句的最後一句。`;
    steps.push({kind:'res', slot:'p'+k, banner,
      b:{title:`${p.n}的結果是什麼？`, opts:[{t:p.resB, ok:true},{t:others[(k+1)%2].resB, why:`這是${others[(k+1)%2].n}的結果，不是${p.n}的喔！`}],
         hints:[`${p.n}最後變得怎麼樣？這張是${p.n}的嗎？`, p.infer ? '看白板上仙人掌的四格表，虛線框那一格。' : `看白板上${p.n}的四格表。`], ex: p.infer ? INFER_EX : `${p.n}的結果：${p.resS}。`},
      a:{title:`${p.n}的結果是什麼？`, opts:[{t:p.resA, ok:true}, ...others.map(q=>({t:q.resA, why:`這是${q.n}的結果，不是${p.n}的喔！`}))],
         hints:[p.infer ? '課文有直接寫仙人掌的結果嗎？沒有的話，要往哪裡找？' : `${p.n}改變自己以後，最後怎麼樣了？`, resHint2], ex: p.infer ? '' : `${p.n}遇到困難、調適改變自己，結果：${p.resA}。`},
      layer:resLayer, okSay:['仙人掌這層好有嚼勁！','落葉樹這層香香的！','椰子這層好特別！'][k]});
    if(p.infer) steps.push({kind:'proof', slot:'p'+k, banner, onlyAdv:true,
      a:{title:'找證據：第三段哪一句，可以推論出仙人掌的結果？點點看！', segs:'proof',
         hints:['仙人掌的困難是「高溫又缺水」，哪一句也講到「熱」和「缺水」？','看這一段的最後一句。'], ex:INFER_EX},
      okSay:'偵探果然厲害，有證據！'});
  });
  steps.push({kind:'sauce', slot:'sauce',
    b:{title:'淋上醬汁！什麼醬汁能把三種植物黏在一起？', opts:[{t:'🔄 調適改變自己', ok:true},{t:'🗑️ 放棄不管', bad:true}],
       hints:['三種植物用的方法，有什麼一樣的地方？','想想「比一比」找到的那一句。'], ex:'三種植物都「接受環境給予的挫折，進而調適改變自己」，這就是把它們黏在一起的醬汁。'},
    a:{title:'淋上醬汁！什麼醬汁能把三種植物黏在一起？（它們的共同點）', opts:[{t:'調適改變自己', ok:true},{t:'🗑️ 放棄不管', bad:true},{t:'等別人來幫忙', why:'課文說植物是靠自己調適改變，不是等別人幫忙喔！'}],
       hints:['三種植物用的方法，有什麼一樣的地方？','想想「比一比」找到的那一句。'], ex:'三種植物都「接受環境給予的挫折，進而調適改變自己」，這就是把它們黏在一起的醬汁。'},
    layer:()=>({label:'醬汁', html:'🔄 調適改變自己'}), okSay:'這個醬汁最對味！'});
  shop({
    assign:'l2', guest:'🐰', order:'老闆，昨天的麵包烤好了！請從上往下，夾進三層植物料，再淋上醬汁！',
    slots:[
      {id:'top', cls:'l-top', label:'道理<br>（第1段）', pre:TOP},
      ...PL3.map((p,k)=>({id:'p'+k, cls:'l-pla', empty:`${p.i} ${p.n}`})),
      {id:'sauce', cls:'l-sauce', empty:'醬汁'},
      {id:'bot', cls:'l-bot', label:'再說一次道理<br>（第4段）', pre:BOT},
    ],
    steps,
    doneTitle:'三種植物都調適改變自己，證明了第1段的道理！',
    doneSay:'太好吃了！在挫折中勇往直前，才能磨練出堅強的意志！',
    next:{label:'下一步：口訣變身秀 →', go:'chant'},
    again:l2,
  });
}

/* ================= 第2節：口訣變身秀 ================= */
const CH = [
  {w:'接受挫折', act:'🤲', how:'雙手接住', hide:[2,3]},
  {w:'改變自己', act:'🔄', how:'原地轉一圈', hide:[0,1]},
  {w:'勇敢成長', act:'🙌', how:'雙手往上舉', hide:[2,3]},
];
const ROUNDS = [
  {name:'第1回：跟著做', tip:'老師按一下，亮起一句。大家邊念邊做動作！', mode:'full', times:2},
  {name:'第2回：消失挑戰', tip:'有字躲起來了！靠記憶念出來。', mode:'hole', times:2},
  {name:'第3回：全部消失', tip:'字全部不見了！只看動作，整句念出來。', mode:'none', times:2},
  {name:'第4回：換你當老師', tip:'請一位偵探上台按，帶大家念！', mode:'none', times:2},
];
let actx = null, sound = true, chantKey = null;
function tick(hi){
  if(!sound) return;
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value = hi ? 880 : 520;
    g.gain.setValueAtTime(.25, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+.18);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+.2);
  }catch(e){ sound=false; }
}
function chant(){
  const done = new Set(); let cur = 0, n = 0;
  app.innerHTML = `
    <div class="rounds" id="rounds">${ROUNDS.map((r,k)=>`<button class="rd" data-k="${k}">${r.name}</button>`).join('')}</div>
    <p class="lead center" id="tip"></p>
    <div class="stage" id="stage"></div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="go" style="font-size:28px;padding:16px 40px">亮下一句 ▶</button>
      <span class="lead" id="prog" style="margin:0"></span>
      <label class="clock" style="font-size:18px;color:var(--muted)"><input type="checkbox" id="snd" checked> 提示音</label>
    </div>
    <p class="center" style="color:var(--muted);font-size:17px;margin-top:10px">也可以直接點口訣卡片，或用簡報筆、方向鍵 →、空白鍵前進</p>
    <div class="center" id="end" style="margin-top:16px"></div>`;
  const total = () => CH.length * ROUNDS[cur].times;
  const draw = () => {
    const mode = ROUNDS[cur].mode;
    $('#stage').innerHTML = CH.map((c,i) => {
      const w = mode==='full' ? c.w : mode==='hole' ? [...c.w].map((ch,j)=>c.hide.includes(j)?`<span class="hole">${ch}</span>`:ch).join('') : '<span class="hole">　</span><span class="hole">　</span>';
      return `<div class="ph" data-i="${i}"><div class="act">${c.act}</div><div class="how">${c.how}</div><div class="w">${w}</div></div>`;
    }).join('');
    app.querySelectorAll('.ph').forEach(el => el.onclick = () => { if(n < total() && +el.dataset.i === n % CH.length) next(); });
  };
  const status = () => { $('#prog').textContent = n < total() ? `已念 ${n} / ${total()} 句` : '這一回合完成！'; };
  const pick = k => { cur = k; n = 0; $('#end').innerHTML = '';
    app.querySelectorAll('.rd').forEach(b=>b.classList.toggle('on', +b.dataset.k===k));
    $('#tip').textContent = ROUNDS[k].tip; draw(); status();
    $('#go').textContent = '亮下一句 ▶'; $('#go').onclick = next; };
  function next(){
    const phs = app.querySelectorAll('.ph');
    phs.forEach(p=>p.classList.remove('beat'));
    if(n >= total()) return;
    const i = n % CH.length; phs[i].classList.add('beat'); tick(i===0); n++; status();
    if(n === total()){
      done.add(cur); app.querySelector(`.rd[data-k="${cur}"]`).classList.add('done');
      if(done.size === ROUNDS.length){ $('#end').innerHTML = '<div class="stamp">結案</div><p class="lead" style="margin-top:18px">植物偵探任務完成！接受挫折、改變自己、勇敢成長！</p>'; confetti(); }
      if(cur < ROUNDS.length-1){ $('#go').textContent = '下一回合 →'; $('#go').onclick = () => pick(cur+1); }
      else { $('#go').textContent = '再玩一次'; $('#go').onclick = () => pick(cur); }
    }
  }
  app.querySelectorAll('.rd').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $('#snd').onchange = e => sound = e.target.checked;
  if(chantKey) document.removeEventListener('keydown', chantKey);
  chantKey = e => { if(!$('#stage')) { document.removeEventListener('keydown', chantKey); chantKey=null; return; }
    if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){ e.preventDefault(); $('#go').click(); } };
  document.addEventListener('keydown', chantKey);
  pick(0);
}

initTTS(); showCoins(); go('door');
