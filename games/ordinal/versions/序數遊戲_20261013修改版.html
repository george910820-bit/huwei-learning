<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>序數遊戲</title>
<!--
  序數遊戲（單檔可編輯版）
  ─ 一個檔案、不需要網路即可使用（有網路時會載入 Caprasimo / Figtree 字型）。
  ─ 程式分段：1 常數資料 → 2 狀態儲存 → 3 語音音效 → 4 出題 → 5 作答流程
              → 6 遊戲畫面 → 7 提示紀錄與帳號 → 8 獎勵（七巧板/拼圖/圖片） → 9 老師專區 → 10 事件與啟動
  ─ 學習紀錄存在瀏覽器（localStorage），學生、測試帳號分開存。
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{
  --color-bg:#f5ead8;--color-text:#201e1d;--color-accent:#c67139;
  --color-neutral-100:#f9f4ed;--color-neutral-200:#eee7db;--color-neutral-300:#dcd3c4;--color-neutral-400:#c0b6a5;--color-neutral-500:#a19786;--color-neutral-600:#82796a;--color-neutral-700:#645c50;--color-neutral-800:#474238;
  --color-accent-100:#fff2eb;--color-accent-200:#ffe1d0;--color-accent-300:#ffc6a5;--color-accent-400:#f6a06b;--color-accent-500:#d67f48;--color-accent-600:#b2622d;--color-accent-700:#8c491a;--color-accent-800:#643312;
  --color-accent-2-100:#f0fae1;--color-accent-2-200:#e1eecc;--color-accent-2-300:#ccdbb2;--color-accent-2-400:#aebf92;--color-accent-2-500:#8fa073;--color-accent-2-600:#728157;--color-accent-2-700:#56633f;--color-accent-2-800:#3d472b;--color-accent-2-900:#272e1b;
  --font-heading:"Caprasimo",system-ui,sans-serif;--font-body:"Figtree",system-ui,sans-serif;
  --shadow-sm:0 1px 2px rgba(46,43,37,.14);--shadow-md:0 3px 10px rgba(46,43,37,.16);--shadow-lg:0 12px 32px rgba(46,43,37,.22);
}
*{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-heading);font-weight:400;margin:0}
.hd{font-family:var(--font-heading)}
/* 遊戲舞台 */
.gameWrap{height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none}
.scaler{flex:none;width:1000px;height:780px;transform-origin:center center}
.stage{position:relative;width:1000px;height:780px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 24px 20px}
.topbar{width:100%;max-width:960px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.row{display:flex;align-items:center}
.dot{width:26px;height:26px;border-radius:50%;border:3px solid var(--color-accent-2-500)}
.roundBtn{border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md)}
.qbar{display:flex;align-items:center;gap:18px;padding:10px 28px;border-radius:44px;background:var(--color-neutral-100);border:4px solid var(--color-neutral-700);box-shadow:var(--shadow-md)}
.big{font-size:60px;font-weight:800;line-height:1}
.box{width:88px;height:88px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:64px;line-height:1}
.box img{width:70px;height:70px;object-fit:contain}
.label{padding:4px 12px;border-radius:999px;background:var(--color-neutral-200);font-size:18px;font-weight:700}
.tile{position:relative;border-radius:24px;border:4px solid;display:flex;align-items:center;justify-content:center;transition:opacity .3s,box-shadow .25s,border-color .2s}
.tile img,.floor img{object-fit:contain;pointer-events:none}
.tile.hover,.floor.hover{border-color:var(--color-accent)!important;box-shadow:0 0 0 8px var(--color-accent-200)!important}
.tag{width:46px;height:46px;border-radius:50%;background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-500);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:26px;line-height:1;color:var(--color-accent-2-800);transition:opacity .3s}
.floor{position:relative;display:flex;align-items:center;gap:10px;padding:0 8px;border-radius:14px;border:3px solid;transition:opacity .3s,box-shadow .25s,border-color .2s}
.mark{position:absolute;right:-12px;top:-12px;border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:1}
.floor .mark{top:50%;right:-14px;transform:translateY(-50%)}
.mark.num{width:32px;height:32px;background:var(--color-accent);color:var(--color-bg);font-family:var(--font-heading);font-size:19px;box-shadow:var(--shadow-sm)}
.mark.x{width:38px;height:38px;background:var(--color-neutral-800);color:#fff;font-size:21px;font-weight:700}
.mark.ok{width:40px;height:40px;background:var(--color-accent-2-600);color:#fff;box-shadow:var(--shadow-sm)}
.hand{position:absolute;color:oklch(0.58 0.21 27);filter:drop-shadow(0 3px 4px rgba(46,43,37,.25))}
.opt{position:relative;width:140px;height:128px;border-radius:32px;background:var(--color-neutral-100);border:5px solid;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:84px;line-height:1;transition:opacity .3s,box-shadow .25s}
.token{width:120px;height:120px;border-radius:50%;border:4px dashed var(--color-accent-400);background:var(--color-accent-100);display:flex;align-items:center;justify-content:center;font-size:72px;line-height:1;cursor:grab;touch-action:none}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%);font-size:80px;line-height:1;filter:drop-shadow(0 8px 10px rgba(46,43,37,.3))}
.bigX{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;align-items:center;justify-content:center;background:rgba(245,234,216,.35)}
.bigX div{position:absolute;left:50%;top:50%;width:66vmin;height:9vmin;border-radius:999px;background:var(--color-neutral-600);opacity:.85}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-12px)}30%{transform:translateX(12px)}45%{transform:translateX(-9px)}60%{transform:translateX(9px)}75%{transform:translateX(-5px)}90%{transform:translateX(5px)}}
@keyframes bigshake{0%,100%{transform:translateX(0)}12%{transform:translateX(-26px)}25%{transform:translateX(26px)}37%{transform:translateX(-20px)}50%{transform:translateX(20px)}62%{transform:translateX(-12px)}75%{transform:translateX(12px)}87%{transform:translateX(-6px)}}
.shake{animation:shake .5s}
.bigshake{animation:bigshake .5s}
/* 提示紀錄、帳號切換（右下角） */
.teach{position:fixed;right:10px;bottom:10px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ppCard{width:368px;padding:12px 14px 14px;border-radius:24px;background:var(--color-neutral-100);box-shadow:var(--shadow-lg);border:2px solid var(--color-neutral-300);display:flex;flex-direction:column;gap:10px;touch-action:manipulation}
.ppAmts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ppAmt{min-height:58px;border-radius:18px;border:2px solid var(--color-neutral-300);background:var(--color-bg);color:var(--color-text);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ppAmt b{font-family:var(--font-heading);font-weight:400;font-size:22px;line-height:1.1}
.ppAmt span{font-size:13px;font-weight:700}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--color-neutral-300);background:var(--color-bg);color:var(--color-text);font-size:14px;font-weight:600}
.on{background:var(--color-accent)!important;border-color:var(--color-accent-700)!important;color:#fff!important}
.whoBar{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:6px;border-radius:24px;background:var(--color-neutral-100);box-shadow:var(--shadow-sm);opacity:.95}
.whoBar .pill{min-height:38px;font-weight:700}
.testBadge{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:60;pointer-events:none;padding:6px 16px;border-radius:999px;background:var(--color-accent-2-200);color:var(--color-accent-2-900);font-size:14px;font-weight:700}
/* 獎勵 */
.reward{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px}
.pic{width:min(640px,90vw);height:min(440px,60vh);border-radius:48px;overflow:hidden;box-shadow:var(--shadow-lg);border:6px solid var(--color-accent-2-300);background:var(--color-neutral-100)}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
/* 老師專區 */
.teacher{min-height:100vh;padding:32px 24px;display:flex;justify-content:center}
.tWrap{width:100%;max-width:880px;display:flex;flex-direction:column;gap:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:20px}
.card{background:var(--color-neutral-100);border-radius:28px;padding:22px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-sm)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 18px;border-radius:999px;border:2px solid var(--color-neutral-300);background:transparent;color:var(--color-text);font-size:15px;font-weight:600}
.chip.on{border-color:var(--color-accent)!important;color:var(--color-bg)!important}
.gtitle{font-weight:600;font-size:16px;margin-bottom:8px}
.note{font-size:13px;color:var(--color-neutral-700);margin-top:8px;text-wrap:pretty}
.stepBtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--color-neutral-300);background:transparent;font-size:22px;color:var(--color-text)}
.track{flex:none;width:56px;height:32px;border-radius:999px;position:relative;transition:background .2s}
.knob{position:absolute;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:left .2s}
.upload{flex:none;white-space:nowrap;padding:10px 18px;border-radius:999px;background:var(--color-accent-2-600);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.del{position:absolute;right:-8px;top:-8px;width:32px;height:32px;border-radius:50%;border:0;background:var(--color-neutral-700);color:#fff;font-size:18px;line-height:1}
.stat{background:var(--color-bg);border-radius:20px;padding:14px 18px}
.table{min-width:760px;display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:1.1fr 1fr 1fr .6fr .7fr .9fr .8fr .8fr 1.4fr;gap:8px;padding:9px 4px;font-size:14px;border-bottom:1px solid var(--color-neutral-200)}
.tr.th{font-size:13px;font-weight:700;color:var(--color-neutral-700);border-bottom:2px solid var(--color-neutral-300);padding:8px 4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ═════════════ 1. 常數與資料 ═════════════ */
const CN = ['零','一','二','三','四','五','六','七','八','九','十'];
const K = '#2b2622';
const svgURI = inner => 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' + inner + '</svg>');
const eyes = y => `<circle cx="39" cy="${y}" r="5.5" fill="${K}"/><circle cx="61" cy="${y}" r="5.5" fill="${K}"/>`;
// 內建的簡單動物圖示（名字會用在語音）
const SIMPLE = [
  ['小貓', `<polygon points="16,46 22,8 48,30" fill="#E8954A"/><polygon points="84,46 78,8 52,30" fill="#E8954A"/><circle cx="50" cy="60" r="34" fill="#E8954A"/>${eyes(55)}<polygon points="45,66 55,66 50,72" fill="#9C4A22"/>`],
  ['小狗', `<circle cx="50" cy="56" r="34" fill="#C99A6B"/><ellipse cx="18" cy="56" rx="11" ry="25" fill="#7A5136"/><ellipse cx="82" cy="56" rx="11" ry="25" fill="#7A5136"/>${eyes(52)}<ellipse cx="50" cy="68" rx="8" ry="6" fill="${K}"/>`],
  ['兔子', `<ellipse cx="37" cy="24" rx="10" ry="24" fill="#C9BFBB"/><ellipse cx="63" cy="24" rx="10" ry="24" fill="#C9BFBB"/><ellipse cx="37" cy="26" rx="4.5" ry="15" fill="#F2AFC0"/><ellipse cx="63" cy="26" rx="4.5" ry="15" fill="#F2AFC0"/><circle cx="50" cy="64" r="30" fill="#C9BFBB"/>${eyes(60)}<circle cx="50" cy="70" r="4" fill="#E07F98"/>`],
  ['小熊', `<circle cx="24" cy="30" r="13" fill="#8A5A3B"/><circle cx="76" cy="30" r="13" fill="#8A5A3B"/><circle cx="50" cy="58" r="34" fill="#8A5A3B"/><ellipse cx="50" cy="70" rx="15" ry="11" fill="#D2A57C"/>${eyes(52)}<ellipse cx="50" cy="66" rx="5" ry="4" fill="${K}"/>`],
  ['小豬', `<polygon points="20,42 24,12 46,28" fill="#EC8FA6"/><polygon points="80,42 76,12 54,28" fill="#EC8FA6"/><circle cx="50" cy="58" r="34" fill="#F7B3C2"/>${eyes(50)}<ellipse cx="50" cy="68" rx="15" ry="10" fill="#E8879F"/><circle cx="45" cy="68" r="2.8" fill="#9E4A60"/><circle cx="55" cy="68" r="2.8" fill="#9E4A60"/>`],
  ['青蛙', `<circle cx="30" cy="36" r="15" fill="#5DB04B"/><circle cx="70" cy="36" r="15" fill="#5DB04B"/><ellipse cx="50" cy="62" rx="40" ry="28" fill="#5DB04B"/><circle cx="30" cy="36" r="9" fill="#fff"/><circle cx="70" cy="36" r="9" fill="#fff"/><circle cx="30" cy="37" r="5" fill="${K}"/><circle cx="70" cy="37" r="5" fill="${K}"/><path d="M30 66 Q50 80 70 66" stroke="#2F6B26" stroke-width="4" fill="none" stroke-linecap="round"/>`],
  ['老鼠', `<circle cx="22" cy="32" r="19" fill="#9AA0A6"/><circle cx="78" cy="32" r="19" fill="#9AA0A6"/><circle cx="22" cy="32" r="11" fill="#F2AFC0"/><circle cx="78" cy="32" r="11" fill="#F2AFC0"/><circle cx="50" cy="60" r="30" fill="#9AA0A6"/>${eyes(56)}<circle cx="50" cy="68" r="4.5" fill="#E07F98"/>`],
  ['小雞', `<circle cx="42" cy="22" r="7" fill="#E5533D"/><circle cx="50" cy="17" r="8" fill="#E5533D"/><circle cx="58" cy="22" r="7" fill="#E5533D"/><circle cx="50" cy="58" r="34" fill="#F6CF3D"/>${eyes(52)}<polygon points="42,62 58,62 50,74" fill="#EE8A2B"/>`],
  ['獅子', `<circle cx="50" cy="54" r="45" fill="#C9772C"/><circle cx="50" cy="56" r="30" fill="#F2B544"/>${eyes(52)}<polygon points="45,62 55,62 50,68" fill="#7A3E14"/>`],
  ['熊貓', `<circle cx="24" cy="30" r="13" fill="${K}"/><circle cx="76" cy="30" r="13" fill="${K}"/><circle cx="50" cy="58" r="33" fill="#fff" stroke="${K}" stroke-width="3"/><ellipse cx="38" cy="55" rx="9" ry="11" fill="${K}"/><ellipse cx="62" cy="55" rx="9" ry="11" fill="${K}"/><circle cx="39" cy="53" r="3" fill="#fff"/><circle cx="61" cy="53" r="3" fill="#fff"/><ellipse cx="50" cy="69" rx="5" ry="3.5" fill="${K}"/>`]
].map(([name, inner], i) => ({ id: 's' + i, name, src: svgURI(inner) }));

// 方向與情境：startLeft = 從畫面左邊（或下面、前面）開始數
const DIRS = {
  L: { word: '從左邊數', label: '排隊・從左邊數', scene: 'row', startLeft: true, rot: 0 },
  R: { word: '從右邊數', label: '排隊・從右邊數', scene: 'row', startLeft: false, rot: 180 },
  F: { word: '從前面數', label: '買冰淇淋・從前面數', scene: 'queue', startLeft: true, rot: 0 },
  B: { word: '從後面數', label: '買冰淇淋・從後面數', scene: 'queue', startLeft: false, rot: 180 },
  D: { word: '從下面數', label: '大樓・從下面數', scene: 'building', startLeft: true, rot: -90 },
  U: { word: '從上面數', label: '大樓・從上面數', scene: 'building', startLeft: false, rot: 90 }
};
const DKEYS = ['L', 'R', 'F', 'B', 'D', 'U'];
const TYPES = { find: '找第幾隻（點動物）', which: '是第幾隻（選數字）' };
const TSHORT = { find: '找第幾隻', which: '是第幾隻' };
const TAG_OP = [1, 0.28, 0];
const TAG_NAME = ['顯示', '淡淡的', '隱藏'];
const DEFAULTS = { animalSet: 'simple', len: 6, count: 6, types: { find: true, which: false }, dirs: { L: true, R: false, F: false, B: false, D: false, U: false }, order: 'group', mode: 'tap', tagLevel: 0, autoFade: true, countWord: 'plain', countBtn: true, autoSpeak: true, prompt: true, wrongFx: 'soft', wrongSound: 'soft', rewardMode: 'tangram', puzzleN: 6, puzzleHint: true, tanLevel: 'lines', tanCount: 5 };
const LS_S = 'xushu.settings.v1', LS_R = 'xushu.records.v1', LS_RW = 'fenhe.rewards.v1', LS_A = 'xushu.animals.v1';
const VOICE_RATE = 0.8;

// 老師提示紀錄：提示量（0–4）與提示方式（可複選）
const PP_AM = [['獨立', '自己完成'], ['輕度', '一句話提醒'], ['中度', '重複提醒＋指示'], ['高度', '不斷複誦＋指示'], ['全協助', '手把手帶做']];
const PP_ME = [['point', '手勢提示'], ['say', '口語提示'], ['visual', '視覺提示'], ['model', '示範'], ['hand', '肢體協助']];
const PP_MN = Object.fromEntries(PP_ME);
const ppText = r => r.pl == null ? '—' : PP_AM[r.pl][0] + (r.pm && r.pm.length ? '・' + r.pm.map(k => PP_MN[k]).join('、') : '');

// 圖示（Lucide）
const IC = {
  speaker: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`,
  hand: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v1"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>`,
  gear: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>`,
  check: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
  arrowR: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`,
  flag: `<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22V3"/><path d="M5 3h12l-3 4 3 4H5"/></svg>`,
  chev: r => `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${r}deg)"><path d="m9 6 6 6-6 6"/></svg>`,
  again: `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`
};

/* ═════════════ 2. 狀態與儲存 ═════════════ */
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
const sv = load(LS_S, {});
const S = {
  view: 'game',
  settings: { ...DEFAULTS, ...sv, types: { ...DEFAULTS.types, ...(sv.types || {}) }, dirs: { ...DEFAULTS.dirs, ...(sv.dirs || {}) } },
  testMode: localStorage.getItem(LS_R + '.who') === 'test',

const rewardPool = () => S.rw.custom.map(c => ({ ...c, off: S.rw.off.includes(c.id) }));

// 七巧板圖案：t = 片的種類（L 大三角、M 中三角、S 小三角、Q 正方形、P 平行四邊形），p = 頂點（單位格）
const TANGRAM_FIGURES = [
  { name: '房子', pieces: [
    { t: 'L', p: [[0, 2], [2, 0], [2, 2]] }, { t: 'L', p: [[2, 0], [4, 2], [2, 2]] },
    { t: 'Q', p: [[1, 2], [2, 2], [2, 3], [1, 3]] }, { t: 'M', p: [[3, 2], [3, 4], [2, 3]] },
    { t: 'S', p: [[2, 2], [3, 2], [2, 3]] }, { t: 'P', p: [[1, 3], [2, 3], [3, 4], [2, 4]] },
    { t: 'S', p: [[1, 3], [1, 4], [2, 4]] } ] },
  { name: '帆船', pieces: [
    { t: 'L', p: [[0, 2], [2, 0], [2, 2]] }, { t: 'L', p: [[0, 2], [2, 2], [2, 4]] },
    { t: 'M', p: [[2, 2], [2, 4], [3, 3]] },
    { t: 'S', p: [[0, 4], [1, 4], [1, 5]] }, { t: 'Q', p: [[1, 4], [2, 4], [2, 5], [1, 5]] },
    { t: 'S', p: [[2, 4], [3, 4], [2, 5]] }, { t: 'P', p: [[2, 5], [3, 4], [4, 4], [3, 5]] } ] },
  { name: '火箭', pieces: [
    { t: 'M', p: [[0, 1], [2, 1], [1, 0]] },
    { t: 'L', p: [[0, 1], [2, 1], [0, 3]] }, { t: 'L', p: [[2, 1], [2, 3], [0, 3]] },
    { t: 'S', p: [[0, 2], [0, 3], [-1, 3]] }, { t: 'S', p: [[2, 2], [2, 3], [3, 3]] },
    { t: 'Q', p: [[0.5, 3], [1.5, 3], [1.5, 4], [0.5, 4]] },
    { t: 'P', p: [[0.5, 4], [1.5, 5], [1.5, 6], [0.5, 5]] } ] },
  { name: '大方塊', pieces: [
    { t: 'L', p: [[2, 0], [4, 2], [2, 2]] }, { t: 'L', p: [[2, 0], [2, 2], [0, 2]] },
    { t: 'M', p: [[3, 3], [2, 4], [1, 3]] }, { t: 'S', p: [[4, 2], [3, 3], [3, 2]] },
    { t: 'Q', p: [[3, 2], [3, 3], [2, 3], [2, 2]] }, { t: 'S', p: [[2, 2], [2, 3], [1, 2]] },
    { t: 'P', p: [[0, 2], [1, 2], [2, 3], [1, 3]] } ] },
  { name: '箭頭', pieces: [
    { t: 'L', p: [[2, 0], [2, 2], [4, 2]] }, { t: 'L', p: [[2, 2], [4, 2], [2, 4]] },
    { t: 'Q', p: [[0, 1], [1, 1], [1, 2], [0, 2]] }, { t: 'M', p: [[2, 1], [2, 3], [1, 2]] },
    { t: 'S', p: [[1, 1], [2, 1], [1, 2]] }, { t: 'P', p: [[0, 2], [1, 2], [2, 3], [1, 3]] },
    { t: 'S', p: [[0, 2], [0, 3], [1, 3]] } ] }
];
// level：'lines' 有每片的線、'outline' 只有外框、'rotate' 外框＋自己轉；count：要拼幾片（其餘先放好）
function mountTangram(host, o) {
  const NS = 'http://www.w3.org/2000/svg', CW = 1000, CH = 700, U = 72;
  const BOARD = { x: 20, y: 16, w: 640, h: 380 }, TRAY = { x: 20, y: 412, w: 640, h: 272 }, MODEL = { x: 690, y: 16, w: 290, h: 668 };
  const COL = { L: 'var(--color-accent-500)', M: 'var(--color-accent-2-500)', S: 'var(--color-accent-300)', Q: 'var(--color-accent-2-700)', P: 'var(--color-accent-700)' };
  const AREA = { L: 4, M: 2, Q: 2, P: 2, S: 1 };
  const fig = TANGRAM_FIGURES[Math.abs(o.figure | 0) % TANGRAM_FIGURES.length];
  const level = ['lines', 'outline', 'rotate'].includes(o.level) ? o.level : 'lines', rotate = level === 'rotate';
  const count = [3, 5, 7].includes(o.count) ? o.count : 5;
  const cen = pts => [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];
  const rot = (rel, k) => { const a = k * Math.PI / 4, c = Math.cos(a), s = Math.sin(a); return rel.map(([x, y]) => [x * c - y * s, x * s + y * c]); };
  const same = (a, b) => a.length === b.length && a.every(p => b.some(q => Math.hypot(p[0] - q[0], p[1] - q[1]) < 4));
  const ptsStr = (rel, x, y) => rel.map(([a, b]) => (a + x).toFixed(1) + ',' + (b + y).toFixed(1)).join(' ');
  const layout = (scaleMax, box) => {
    const all = fig.pieces.flatMap(p => p.p), xs = all.map(p => p[0]), ys = all.map(p => p[1]);
    const mnx = Math.min(...xs), mny = Math.min(...ys), w = Math.max(...xs) - mnx, hh = Math.max(...ys) - mny;
    const s = Math.min(scaleMax, box.w * 0.9 / w, box.h * 0.88 / hh);
    const ox = box.x + (box.w - w * s) / 2 - mnx * s, oy = box.y + (box.h - hh * s) / 2 - mny * s;
    return fig.pieces.map(pc => { const abs = pc.p.map(([x, y]) => [ox + x * s, oy + y * s]), c = cen(abs); return { t: pc.t, c, rel: abs.map(([x, y]) => [x - c[0], y - c[1]]) }; });
  };
  const el = (tag, attrs, style, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); Object.assign(e.style, style || {}); if (text) e.textContent = text; return e; };

  const slots = layout(U, BOARD);
  const order = shuffle(slots.map((_, i) => i)).sort((a, b) => AREA[slots[b].t] - AREA[slots[a].t]);
  const free = new Set(order.slice(0, Math.min(count, slots.length)));
  const movers = shuffle([...free]), cols = Math.min(4, movers.length), rows = Math.ceil(movers.length / cols);
  const cw = TRAY.w / cols, chh = TRAY.h / rows;
  const pieces = slots.map((sl, i) => {
    if (!free.has(i)) return { id: i, t: sl.t, rel: sl.rel, x: sl.c[0], y: sl.c[1], locked: true, slot: i };
    const k = movers.indexOf(i);
    let rel = sl.rel;
    if (rotate) { let tries = 0; do { rel = rot(sl.rel, 1 + Math.floor(Math.random() * 7)); tries++; } while (slots.some(q => q.t === sl.t && same(rel, q.rel)) && tries < 20); }
    return { id: i, t: sl.t, rel, x: TRAY.x + cw * (k % cols + 0.5), y: TRAY.y + chh * (Math.floor(k / cols) + 0.5), locked: false, slot: -1 };
  });

  const svg = el('svg', { viewBox: `0 0 ${CW} ${CH}` }, { display: 'block', width: 'min(1000px, 94vw, calc((100vh - 190px) * 1.4286))', height: 'auto', touchAction: 'none', userSelect: 'none' });
  const board = el('rect', { x: BOARD.x, y: BOARD.y, width: BOARD.w, height: BOARD.h, rx: 32 }, { fill: 'var(--color-neutral-100)', stroke: 'none', strokeWidth: 12, transition: 'stroke .4s' });
  svg.append(board, el('rect', { x: TRAY.x + 2, y: TRAY.y + 2, width: TRAY.w - 4, height: TRAY.h - 4, rx: 32 }, { fill: 'none', stroke: 'var(--color-neutral-300)', strokeWidth: 3, strokeDasharray: '10 8' }));
  if (rotate) svg.append(el('text', { x: BOARD.x + 28, y: BOARD.y + 40 }, { fill: 'var(--color-neutral-700)', fontSize: '22px', fontFamily: 'var(--font-body)' }, '點一下可以轉'));
  svg.append(el('rect', { x: MODEL.x, y: MODEL.y, width: MODEL.w, height: MODEL.h, rx: 32 }, { fill: 'var(--color-neutral-100)' }));
  svg.append(el('text', { x: MODEL.x + MODEL.w / 2, y: MODEL.y + 46, 'text-anchor': 'middle' }, { fill: 'var(--color-text)', fontSize: '30px', fontFamily: 'var(--font-heading)' }, fig.name));
  layout(46, { x: MODEL.x + 10, y: MODEL.y + 70, w: MODEL.w - 20, h: MODEL.h - 90 }).forEach(m => svg.append(el('polygon', { points: ptsStr(m.rel, m.c[0], m.c[1]) }, { fill: COL[m.t], stroke: 'var(--color-neutral-100)', strokeWidth: 3, strokeLinejoin: 'round' })));
  slots.forEach(sl => svg.append(el('polygon', { points: ptsStr(sl.rel, sl.c[0], sl.c[1]) }, { fill: 'var(--color-neutral-300)', stroke: 'var(--color-neutral-300)', strokeWidth: 2 })));
  if (level === 'lines') slots.forEach(sl => svg.append(el('polygon', { points: ptsStr(sl.rel, sl.c[0], sl.c[1]) }, { fill: 'none', stroke: 'var(--color-neutral-600)', strokeWidth: 2.5, strokeDasharray: '8 6' })));
  const gLocked = el('g', {}), gFree = el('g', {}); svg.append(gLocked, gFree);

  const style = p => Object.assign(p.el.style, { fill: COL[p.t], stroke: p.locked ? 'var(--color-neutral-100)' : '#fff', strokeWidth: p.locked ? 3 : 4, strokeLinejoin: 'round', cursor: p.locked ? 'default' : 'grab', filter: p.locked ? 'none' : 'drop-shadow(0 6px 8px rgba(46,43,37,.25))' });
  const draw = p => p.el.setAttribute('points', ptsStr(p.rel, p.x, p.y));
  const local = e => { const r = svg.getBoundingClientRect(); return { x: (e.clientX - r.left) * CW / r.width, y: (e.clientY - r.top) * CH / r.height }; };
  let drag = null, finished = false;
  pieces.forEach(p => {
    p.el = el('polygon', {}); draw(p); style(p); (p.locked ? gLocked : gFree).append(p.el);
    p.el.addEventListener('pointerdown', e => {
      if (p.locked || finished) return;
      e.preventDefault(); try { p.el.setPointerCapture(e.pointerId); } catch (_) {}
      const q = local(e); gFree.append(p.el);   // 拿起來的片放最上層
      drag = { p, dx: q.x - p.x, dy: q.y - p.y, sx: q.x, sy: q.y, moved: false };
    });
    p.el.addEventListener('pointermove', e => {
      if (!drag || drag.p !== p) return;
      const q = local(e); if (Math.hypot(q.x - drag.sx, q.y - drag.sy) > 8) drag.moved = true;
      p.x = Math.max(10, Math.min(MODEL.x - 20, q.x - drag.dx)); p.y = Math.max(10, Math.min(CH - 10, q.y - drag.dy)); draw(p);
    });
    const up = () => {
      if (!drag || drag.p !== p) return;
      const moved = drag.moved; drag = null;
      if (!moved && rotate) p.rel = rot(p.rel, 1);   // 點一下＝轉 45 度
      const used = new Set(pieces.filter(x => x.locked).map(x => x.slot));
      const j = slots.findIndex((sl, i) => !used.has(i) && sl.t === p.t && Math.hypot(sl.c[0] - p.x, sl.c[1] - p.y) < 46 && same(p.rel, sl.rel));
      if (j >= 0) { Object.assign(p, { rel: slots[j].rel, x: slots[j].c[0], y: slots[j].c[1], locked: true, slot: j }); gLocked.append(p.el); style(p); }
      draw(p);
      if (!finished && pieces.every(x => x.locked)) { finished = true; board.style.stroke = 'var(--color-accent-2-300)'; setTimeout(() => o.onDone && o.onDone(), 500); }
    };
    p.el.addEventListener('pointerup', up); p.el.addEventListener('pointercancel', up);
  });
  host.append(svg);
}
// 拼圖：n = 4/6/8 片；hint = 顯示淡淡底圖
function mountJigsaw(host, o) {
  const GRID = { 4: [2, 2], 6: [3, 2], 8: [4, 2] }, CW = 1000, CH = 620, BW = 450, BH = 300, BX = 275, BY = 20, TY = 360;
  const n = GRID[o.n] ? o.n : 6, [cols, rows] = GRID[n], pw = BW / cols, ph = BH / rows;
  const div = (style, parent) => { const d = document.createElement('div'); Object.assign(d.style, style); if (parent) parent.append(d); return d; };
  const wrap = div({ position: 'relative', width: 'min(1000px, 94vw, calc((100vh - 190px) * 1.6129))', aspectRatio: '1000 / 620', touchAction: 'none', userSelect: 'none' });
  const inner = div({ position: 'absolute', left: 0, top: 0, width: CW + 'px', height: CH + 'px', transformOrigin: '0 0' }, wrap);
  div({ position: 'absolute', left: '20px', top: TY - 14 + 'px', width: CW - 40 + 'px', height: CH - TY + 4 + 'px', borderRadius: '36px', border: '3px dashed var(--color-neutral-300)' }, inner);
  const board = div({ position: 'absolute', left: BX - 14 + 'px', top: BY - 14 + 'px', width: BW + 28 + 'px', height: BH + 28 + 'px', borderRadius: '30px', background: 'var(--color-neutral-100)', boxShadow: 'var(--shadow-md)', transition: 'box-shadow .4s' }, inner);
  const hint = o.hint ? div({ position: 'absolute', left: BX + 'px', top: BY + 'px', width: BW + 'px', height: BH + 'px', opacity: 0.22 }, inner) : null;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) div({ position: 'absolute', left: BX + c * pw + 'px', top: BY + r * ph + 'px', width: pw + 'px', height: ph + 'px', border: '2px dashed var(--color-neutral-400)' }, inner);
  const ids = []; for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) ids.push({ id: r * cols + c, c, r });
  const gap = Math.max(8, (CW - 60 - n * pw) / Math.max(1, n - 1)), x0 = (CW - (n * pw + (n - 1) * gap)) / 2;
  let z = 3, finished = false, sc = 1;
  const pieces = shuffle(ids).map((p, k) => ({ ...p, x: x0 + k * (pw + gap), y: TY + (CH - TY - ph) / 2 + (Math.random() - 0.5) * 40, locked: false }));
  const pos = p => { p.el.style.left = p.x + 'px'; p.el.style.top = p.y + 'px'; };
  const local = e => { const r = wrap.getBoundingClientRect(); return { x: (e.clientX - r.left) / sc, y: (e.clientY - r.top) / sc }; };
  pieces.forEach(p => {
    p.el = div({ position: 'absolute', width: pw + 'px', height: ph + 'px', backgroundColor: '#e8dfd0', borderRadius: '14px', boxShadow: '0 0 0 3px #fff, 0 8px 18px rgba(46,43,37,.28)', zIndex: 2, cursor: 'grab', touchAction: 'none', transition: 'left .18s, top .18s, border-radius .25s' }, inner);
    pos(p);
    let d = null;
    p.el.addEventListener('pointerdown', e => { if (p.locked || finished) return; e.preventDefault(); try { p.el.setPointerCapture(e.pointerId); } catch (_) {} const q = local(e); d = { dx: q.x - p.x, dy: q.y - p.y }; p.el.style.zIndex = ++z; p.el.style.transition = 'none'; });
    p.el.addEventListener('pointermove', e => { if (!d) return; const q = local(e); p.x = Math.max(0, Math.min(CW - pw, q.x - d.dx)); p.y = Math.max(0, Math.min(CH - ph, q.y - d.dy)); pos(p); });
    const up = () => {
      if (!d) return; d = null; p.el.style.transition = 'left .18s, top .18s, border-radius .25s';
      const tx = BX + p.c * pw, ty = BY + p.r * ph;
      if (Math.hypot(p.x - tx, p.y - ty) < 55) { Object.assign(p, { x: tx, y: ty, locked: true }); Object.assign(p.el.style, { borderRadius: 0, boxShadow: 'none', zIndex: 1, cursor: 'default' }); }
      pos(p);
      if (!finished && pieces.every(x => x.locked)) { finished = true; board.style.boxShadow = '0 0 0 10px var(--color-accent-2-300), var(--shadow-lg)'; setTimeout(() => o.onDone && o.onDone(), 500); }
    };
    p.el.addEventListener('pointerup', up); p.el.addEventListener('pointercancel', up);
  });
  const im = new Image();
  im.onload = () => {
    const s = Math.max(BW / im.width, BH / im.height), w = im.width * s, hh = im.height * s, ox = (w - BW) / 2, oy = (hh - BH) / 2;
    const bg = { backgroundImage: `url("${o.src}")`, backgroundSize: `${w}px ${hh}px`, backgroundRepeat: 'no-repeat' };
    if (hint) Object.assign(hint.style, bg, { backgroundPosition: `${-ox}px ${-oy}px` });
    pieces.forEach(p => Object.assign(p.el.style, bg, { backgroundPosition: `${-(p.c * pw + ox)}px ${-(p.r * ph + oy)}px` }));
  };
  im.src = o.src;
  host.append(wrap);
  const fit = () => { sc = wrap.offsetWidth / CW; inner.style.transform = `scale(${sc})`; };
  fit(); window.addEventListener('resize', fit);
}

/* ═════════════ 10. 事件與啟動 ═════════════ */
const app = document.getElementById('app');
function render() {
  if (S.view === 'reward' && document.getElementById('rewardHost')) return;   // 獎勵進行中不重畫
  app.innerHTML = S.view === 'game' ? gameHTML() : S.view === 'reward' ? rewardHTML() : teacherHTML();
  if (S.view === 'reward') mountReward();
}
const parseV = v => v === 'true' ? true : v === 'false' ? false : /^-?\d+$/.test(v) ? +v : v;
const ACT = {
  tile: a => { const cur = S.cur, i = +a; if (cur.type === 'find' && cur.mode === 'tap') answer('tile', i); else if (cur.type === 'find' && cur.mode === 'drag' && !cur.done && !S.lock) nudgeToken(); },
  opt: a => answer('opt', +a),
  count: () => onCountBtn(),
  speakQ: () => { if (!S.ca) speak(S.cur.done ? okText(S.cur) : qText(S.cur)); },
  say: () => speak(okText(S.cur)),
  next: () => goNext(),
  again: () => { S.view = 'game'; app.innerHTML = ''; newRound(); },
  start: () => { S.view = 'game'; S.streak = 0; newRound(); },
  ppAmt: a => setPP({ pl: +a }),
  ppMeth: k => { const rec = S.records.find(r => r.t === S.ppT), pm = (rec && rec.pm) || []; setPP({ pm: pm.includes(k) ? pm.filter(x => x !== k) : [...pm, k] }); },
  ppSame: () => { const last = S.ppLast; if (last) setPP({ pl: last.pl, pm: last.pm || [] }); },
  ppClose: () => set({ ppT: null }),
  ppToggle: () => { ppOn = !ppOn; try { localStorage.setItem('tj.pp.on', ppOn ? '1' : '0'); } catch (e) {} set({ ppT: null }); },
  who: a => { const t = a === '1'; if (t !== S.testMode) { if (S.view === 'game') setUser(t); else { S.testMode = t; try { localStorage.setItem(LS_R + '.who', t ? 'test' : 'student'); } catch (e) {} set({ records: load(recKey(), []), confirmClear: false }); } } },
  set: (a, el) => setS({ [el.dataset.k]: parseV(el.dataset.v) }),
  step: (a, el) => { const k = el.dataset.k; setS({ [k]: Math.max(+el.dataset.lo, Math.min(+el.dataset.hi, S.settings[k] + +el.dataset.v)) }); },
  toggle: (a, el) => setS({ [el.dataset.k]: !S.settings[el.dataset.k] }),
  type: (a, el) => setS({ types: { ...S.settings.types, [el.dataset.k]: !S.settings.types[el.dataset.k] } }),
  dir: (a, el) => setS({ dirs: { ...S.settings.dirs, [el.dataset.k]: !S.settings.dirs[el.dataset.k] } }),
  testSound: () => { if (S.settings.wrongSound) playWrong(S.settings.wrongSound); },
  delAnimal: id => saveAnimals(S.animals.filter(x => x.id !== id)),
  toggleRw: id => saveRw({ ...S.rw, off: S.rw.off.includes(id) ? S.rw.off.filter(x => x !== id) : [...S.rw.off, id] }),
  delRw: id => saveRw({ custom: S.rw.custom.filter(c => c.id !== id), off: S.rw.off.filter(x => x !== id) }),
  clear: () => {
    if (!S.confirmClear) { set({ confirmClear: true }); setTimeout(() => set({ confirmClear: false }), 3000); return; }
    S.records = []; try { localStorage.removeItem(recKey()); } catch (e) {} set({ confirmClear: false });
  }
};
function saveAnimals(animals) { if (save(LS_A, animals)) set({ animals, animalNote: '' }); else set({ animalNote: '儲存空間已滿，請先刪除幾張圖片。' }); }
const CHANGE = {
  animalName: el => saveAnimals(S.animals.map(x => x.id === el.dataset.id ? { ...x, name: el.value } : x)),
  addAnimal: async el => {
    const files = [...(el.files || [])], added = [];
    for (const f of files) { try { added.push({ id: 'a' + Date.now() + Math.random().toString(36).slice(2, 6), name: f.name.replace(/\.[^.]+$/, '').slice(0, 6), src: await shrinkImage(f, 320, 'image/png') }); } catch (_) {} }
    if (added.length) { S.settings.animalSet = 'custom'; save(LS_S, S.settings); saveAnimals([...S.animals, ...added]); }
  },
  addReward: async el => {
    const files = [...(el.files || [])], added = [];
    for (const f of files) { try { added.push({ id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6), src: await shrinkImage(f) }); } catch (_) {} }
    if (added.length) saveRw({ ...S.rw, custom: [...S.rw.custom, ...added] });
  }
};
app.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el.dataset.arg, el, e); });
app.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el, e); });
let gearT = null;
app.addEventListener('pointerdown', e => {
  if (e.target.closest('[data-gear]')) gearT = setTimeout(() => { clearTimers(); S.view = 'teacher'; render(); window.scrollTo(0, 0); }, 1000);
  if (e.target.closest('[data-token]')) dragStart(e);
});
['pointerup', 'pointercancel'].forEach(t => window.addEventListener(t, () => clearTimeout(gearT)));
window.addEventListener('resize', () => { const sc = document.getElementById('scaler'); if (sc) sc.style.transform = `scale(${scale()})`; });
if (window.speechSynthesis) speechSynthesis.getVoices();
newRound();
</script>
